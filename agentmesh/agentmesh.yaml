# syntax=docker/sandbox-kit:3
# Docker Sandboxes kit for an Agent Mesh network.
# Usage, prerequisites and design notes: see README.md in this directory.
schemaVersion: "3"
kind: mixin
displayName: Agent Mesh node
description: Runs an agentmesh-node inside the sandbox and registers it as an MCP server with the agent.
sourceUrl: https://github.com/google/agentmesh
iconUrl: https://raw.githubusercontent.com/google/agentmesh/70c3bd23ade0aaf00a42213212f3b705f12bb2d8/site/static/favicons/android-192x192.png
licenses: [Apache-2.0]

version: "0.1.0"
provides: ["agentmesh"]
dockerfile: agentmesh.dockerfile

args:
  agentmeshVersion:
    default: "v0.1.0"
    buildArg: AGENTMESH_VERSION
    description: ghcr.io/google/agentmesh-node image tag the binary is copied from
  controlPlane:
    required: true
    env: AGENTMESH_CONTROL_PLANE
    pattern: "^[A-Za-z0-9.-]+$"
    description: Control plane host, reached over https (e.g. my-mesh.trycloudflare.com)
  # An arg, not a credential: the token travels in the enrollment request body,
  # where the proxy cannot inject it. It is single-use, spent on first boot.
  token:
    required: true
    env: AGENTMESH_BOOTSTRAP_TOKEN
    description: Single-use bootstrap token; pass it with --kit-args-file, never on the command line
  # Agent Mesh's own label format. The control plane accepts only the labels the
  # token's role permits in allowed_labels, and checks them at enrollment.
  labels:
    default: ""
    env: AGENTMESH_LABELS
    pattern: '^([A-Za-z0-9_.-]{1,63}=[^,=\s"]{1,255}(,[A-Za-z0-9_.-]{1,63}=[^,=\s"]{1,255})*)?$'
    description: Node labels as comma-separated key=value pairs, e.g. site=laptop,team=ml

capabilities:
  # The node reaches the rest of the mesh through the control plane host, over
  # WSS on 443, so this one host is the kit's whole network contract.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow: ["${{ kit.args.controlPlane }}"]

  # Startup, not install: agent workloads rewrite their config files in their own
  # install hooks, which would drop a registration made at install.
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: /usr/local/lib/agentmesh/startup.sh
          user: "1000"
          env: [AGENTMESH_CONTROL_PLANE, AGENTMESH_BOOTSTRAP_TOKEN, AGENTMESH_LABELS]
          description: Register the node's MCP with the agent CLIs present, enroll on first boot, run agentmesh-node

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./agentmesh-context.md

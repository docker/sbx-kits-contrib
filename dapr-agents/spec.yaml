schemaVersion: "2"
kind: sandbox
name: dapr-agents
version: "0.1.0"
displayName: Dapr Agents
description: Run a durable Python Dapr Agent with its local Dapr services in one Docker Sandbox.
sourceURL: https://github.com/docker/sbx-kits-contrib
licenses:
  - Apache-2.0

args:
  mode:
    default: "example"
    enum: ["example", "custom"]
    description: "Run the bundled example or a compatible project in the sandbox workspace."
  entrypoint:
    default: ""
    description: "Python script relative to the workspace; required when mode is custom."
  resources-dir:
    default: ""
    description: "Optional Dapr component directory relative to the workspace."
  app-id:
    default: "dapr-agent"
    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    description: "Stable Dapr application ID."
  model:
    default: "gpt-4o-mini"
    description: "OpenAI model identifier used by the bundled resources."

sandbox:
  # The v2 manifest is pinned to the multi-platform template index selected for
  # this implementation. Individual platform digests are in docs/verification.md.
  image: docker/sandbox-templates:shell-docker@sha256:5fc81bc7a127e59d81b244a06831ae3212a0310b2e5a0349c54e29249e45e919
  entrypoint: ["python3", "/home/agent/dapr-kit/launcher.py"]
  command:
    default: []
    interactive: []
  resources:
    memory: 4g

credentials:
  - service: openai
    description: "OpenAI API key supplied through Docker Sandboxes credential handling."
    required: false
    apiKey:
      name: OPENAI_API_KEY
      proxyManaged: true
      inject:
        - domain: api.openai.com
          scheme: bearer

environment:
  variables:
    DAPR_KIT_MODE: "${{ kit.args.mode }}"
    DAPR_KIT_ENTRYPOINT: "${{ kit.args.entrypoint }}"
    DAPR_KIT_RESOURCES_DIR: "${{ kit.args.resources-dir }}"
    DAPR_KIT_APP_ID: "${{ kit.args.app-id }}"
    SANDBOX_DAPR_AGENTS_MODEL: "${{ kit.args.model }}"

permissions:
  network:
    allow:
      # Template package sources (amd64 and arm64) plus Docker's template repo.
      - "archive.ubuntu.com:80"
      - "security.ubuntu.com:80"
      - "ports.ubuntu.com:80"
      - "download.docker.com:443"
      # Python package resolution and immutable Dapr binary downloads.
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      - "releases.astral.sh:443"
      - "github.com:443"
      - "objects.githubusercontent.com:443"
      - "release-assets.githubusercontent.com:443"
      # Private-engine image pulls and the proxy-routed model request.
      - "registry-1.docker.io:443"
      - "auth.docker.io:443"
      - "production.cloudflare.docker.com:443"
      - "production.cloudfront.docker.com:443"
      - "api.openai.com:443"

setup:
  install:
    - command: "bash /home/agent/dapr-kit/install.sh"
      user: "0"
      description: "Install pinned Python, uv, Dapr CLI, and daprd binaries."

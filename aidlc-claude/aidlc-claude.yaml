# syntax=docker/sandbox-kit:3
# Migration of this kit's v2 spec.yaml. Deltas are marked MIGRATION NOTE inline.
schemaVersion: "3"
kind: mixin

# The kit's own version, not the version of anything it installs: it is the
# tag this kit publishes under, and the fallback that versions an unversioned
# provide at publish. Bump it when this kit's declarations change.
version: "1.0.0"
displayName: AI-DLC Quick Start
description: Starter Kit for AWS AI-DLC — installs a pinned Bun, clones the latest aidlc-workflows main commit for a fresh project or the commit that project already recorded, and copies its Claude harness into the workspace, merging its settings.json keys and .gitignore rules into the files a project already has.

# This kit installs the *Claude* harness from dist/claude and its agent
# instructions describe Claude Code slash commands, so layering it onto a codex
# or copilot sandbox would produce a valid-but-nonsensical result. The
# requirement turns that into a composition error instead.
#
# MIGRATION NOTE: v2's `requires: {agent: claude-bedrock}`, carried over by name.
# Unlike the rest of this family, the provider is not a kit in this repository:
# `claude-bedrock` was a built-in sbx agent, which is also why this kit's TCK
# config marked its e2e as needing a host-side `bedrock` credential. v3
# resolution is a closed-set check, so this requires is satisfied only by a
# composition that actually carries a `claude-bedrock` provider — a kit for it, or
# the built-in once it is exposed as one. It is stated rather than softened to
# `claude`: the harness targets AWS Bedrock and pins Bedrock model ids, so the
# plain claude kit is not a substitute.
requires: ["claude-bedrock"]

capabilities:
  # MIGRATION NOTE: v2 had one flat list; v3 is phase-scoped and an absent phase
  # grants nothing. The split follows who reaches each host:
  #
  #   install  — bun.sh for the pinned Bun installer, and GitHub plus its two
  #              release-asset hosts for the aidlc-workflows clone. Both are
  #              install hooks, which is deliberate: they are the network-heavy
  #              half and install completes synchronously before Claude launches.
  #   runtime  — github.com again, because the startup hook can `git fetch origin
  #              <sha>` when a project's recorded pin is not already in the clone;
  #              plus the apt sources (see below).
  #
  # github.com is therefore in both phases, which is the union rule working as
  # intended rather than a duplicate: the install clone and the startup fetch are
  # two different reaches at two different times.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - bun.sh
          - github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
      runtime:
        allow:
          # The startup hook's `git fetch origin <pinned-sha>` fallback, for a
          # project pin the install-time clone does not already contain.
          - github.com
          # The composed claude base runs its own background `apt-get update` on
          # every sandbox — a STARTUP hook, so it runs in the runtime phase and
          # its hosts belong here. It refreshes metadata for every configured
          # source and fails wholesale on any one of them. Ubuntu hosts amd64
          # packages on archive/security and arm64 on ports.ubuntu.com.
          - archive.ubuntu.com
          - security.ubuntu.com
          - ports.ubuntu.com
          - download.docker.com

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # BUN_INSTALL is the whole fix: unset, the installer targets $HOME/.bun, and
        # since install hooks run as uid 0 that means /root/.bun — invisible to the
        # agent. /usr/local/bin is already on PATH for every user and shell type.
        #
        # Pinned to a tag rather than plain `| bash`: this kit is tested against one
        # Bun version, and an unpinned install silently picks up whatever upstream
        # ships on the day a sandbox is created. The installer's version argument is
        # a release tag (`bun-vX.Y.Z`, per its own usage error), not a bare version.
        #
        # MIGRATION NOTE: `env:` is new and required — a v3 hook sees only the
        # names it declares plus the platform baseline. The two proxy variables
        # are named even though the command line does not mention them: the
        # sandbox's egress is proxy-mediated and both curl and the installer read
        # them from the environment, which in v2 arrived for free with the
        # container env.
        - command: |
            set -euo pipefail
            export BUN_INSTALL=/usr/local
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.0"
            bun --version
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: Install Bun v1.4.0 into /usr/local/bin

        # Keep the network-heavy clone in install: install is synchronous and
        # completes before Claude launches. The project-specific pin cannot be read
        # here because the workspace is not guaranteed ready yet; the startup hook
        # handles only the fast SHA selection and harness copy below.
        - command: |
            set -eu
            AIDLC_REPO=/home/agent/aidlc-workflows
            if [ -d "$AIDLC_REPO/.git" ] && git -C "$AIDLC_REPO" rev-parse --git-dir >/dev/null 2>&1; then
              exit 0
            fi
            rm -rf "$AIDLC_REPO"
            git clone --branch main https://github.com/awslabs/aidlc-workflows.git "$AIDLC_REPO"
          user: "1000"
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: Clone the latest aidlc-workflows main branch into ~/aidlc-workflows before Claude launches

      startup:
        # $WORKSPACE_DIR is the real mount point, injected by the runtime at create
        # (it is not baked into the image, and is not the template's default
        # `WORKDIR /home/agent/workspace` whenever a workspace is actually mounted).
        # `set -u` is load-bearing here: unset, the variable would expand to empty
        # and this would write to /.claude, so it aborts instead — and under v3's
        # deny-by-default hook environment that guard also covers forgetting to
        # name the variable in `env:` below.
        #
        # The network-heavy clone has already completed synchronously in the
        # install hooks, before Claude launches. Startup only reads the now-ready
        # workspace pin, selects a commit already present in that clone, and copies
        # the harness. Keeping this post-start path short is important because
        # Claude discovers project slash commands when its session starts.
        #
        # Pinning: main is active enough (double-digit commits in a handful of days)
        # that an unpinned `--branch main` clone can hand two sandboxes created hours
        # apart different code under the same kit digest — and the two merge
        # scripts below depend on the internal shape of its shipped settings.json
        # and .gitignore, so an upstream restructure can break them outright. So
        # the project always ends up pinned to a specific commit:
        # `aidlc/.aidlc-workflows-version` records which one. If it exists, that
        # exact commit is checked out. If it does not, this is a fresh project: use
        # the main tip cloned during install, resolve HEAD to its full SHA, and
        # atomically record it, so every later sandbox for the same project
        # reproduces that commit even after main moves. Once written, the pin is an
        # automatically managed, immutable project lock; manual edits and deletion
        # are not a supported upgrade mechanism.
        #
        # settings.json is reconciled FIRST, and separately from the copy, for two
        # reasons. It is the one file --update=none must not skip — it wires the
        # aidlc-*.ts hooks that enforce the stage protocol, selects Bedrock, and pins
        # the model tiers, so a project that already owns a settings.json would
        # otherwise get every hook script on disk with nothing invoking them (an
        # install `/aidlc --doctor` rejects: "settings.json wires no aidlc-*.ts
        # hooks"). And going first means an unparseable project settings.json aborts
        # before settings or harness files are written. On a fresh project, the
        # immutable version-lock file may already have been created intentionally.
        # The merge is project-wins and idempotent; see the script's header.
        #
        # .gitignore is the third thing dist/claude ships, and --update=none would
        # skip it for exactly the projects that have one. It carries the workspace's
        # commit/ignore split: without it the per-user cursors, this clone's audit
        # shard id, runtime graphs, sensor caches, and a knowledge alias map holding
        # MACHINE-ABSOLUTE paths all become Git changes in the user's repo — which
        # for a bind-mounted workspace is their real project, and outlives `sbx rm`.
        # Reconciled before the copy so the rules are in place from the first boot.
        # A .gitignore validation failure leaves that file unchanged and prevents
        # the harness-tree copy, though settings reconciliation may already have
        # completed. Follows upstream's documented procedure:
        # the whole starter file when the project has none, otherwise only the
        # section from `# AI-DLC` to EOF, in a marked block; see the script's header.
        #
        # `src/.` rather than `src/`: copying the directory itself nests it as
        # .claude/.claude once the destination exists, and this runs on every boot.
        # --update=none leaves any file the project already owns alone — including
        # the settings.json the lines above just reconciled (.gitignore is a sibling
        # of the two copied trees, so the copy never reaches it either way).
        #
        # The two merge scripts are read from /home/agent/.local/lib, which this
        # kit's overlay ships (in v2 they came from its `files/home/` tree).
        - command:
            - sh
            - -c
            - |
              set -eu
              AIDLC_REPO=/home/agent/aidlc-workflows
              PIN_FILE="$WORKSPACE_DIR/aidlc/.aidlc-workflows-version"
              PINNED_SHA=

              if [ -f "$PIN_FILE" ]; then
                PINNED_SHA=$(cat "$PIN_FILE")
                case "$PINNED_SHA" in
                  *[!0-9a-fA-F]*)
                    echo "Invalid AI-DLC pin in $PIN_FILE: expected a full 40-character commit SHA" >&2
                    exit 1
                    ;;
                esac
                if [ "${#PINNED_SHA}" -ne 40 ]; then
                  echo "Invalid AI-DLC pin in $PIN_FILE: expected a full 40-character commit SHA" >&2
                  exit 1
                fi
              fi

              if [ ! -d "$AIDLC_REPO/.git" ] || ! git -C "$AIDLC_REPO" rev-parse --git-dir >/dev/null 2>&1; then
                echo "AI-DLC clone is missing or invalid at $AIDLC_REPO; the pre-launch install step did not complete" >&2
                exit 1
              fi

              if [ -n "$PINNED_SHA" ]; then
                if ! git -C "$AIDLC_REPO" cat-file -e "$PINNED_SHA^{commit}" 2>/dev/null; then
                  git -C "$AIDLC_REPO" fetch origin "$PINNED_SHA"
                fi
                git -C "$AIDLC_REPO" checkout --detach "$PINNED_SHA"
              else
                PINNED_SHA=$(git -C "$AIDLC_REPO" rev-parse HEAD)
                mkdir -p "$WORKSPACE_DIR/aidlc"
                PIN_TMP=$(mktemp "$WORKSPACE_DIR/aidlc/.aidlc-workflows-version.tmp.XXXXXX")
                printf '%s\n' "$PINNED_SHA" > "$PIN_TMP"
                mv "$PIN_TMP" "$PIN_FILE"
              fi

              SRC=$AIDLC_REPO/dist/claude
              bun /home/agent/.local/lib/aidlc-merge-settings.ts \
                "$SRC/.claude/settings.json" "$WORKSPACE_DIR/.claude/settings.json"
              bun /home/agent/.local/lib/aidlc-merge-gitignore.ts \
                "$SRC/.gitignore" "$WORKSPACE_DIR/.gitignore"
              cp -R --update=none "$SRC/.claude/." "$WORKSPACE_DIR/.claude/"
              cp -R --update=none "$SRC/aidlc/."   "$WORKSPACE_DIR/aidlc/"
          user: "1000"
          env: [WORKSPACE_DIR, HTTP_PROXY, HTTPS_PROXY]
          description: Check out aidlc/.aidlc-workflows-version if the project has recorded a pin, otherwise record the pre-launch main clone's SHA, then reconcile .claude/settings.json (merging the AI-DLC hooks, env, and models into any file the project already has) and .gitignore (merging the AI-DLC commit/ignore rules into any file the project already has), then copy the rest of the Claude harness into $WORKSPACE_DIR

  # `filename:` is workload-only — it names the profile, which belongs to the
  # base agent kit this one composes onto. A mixin contributes a body.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./aidlc-claude-context.md

# syntax=docker/sandbox-kit:3
# Migration of the v2 `crush` sandbox kit. v2's sandbox.image named the
# pre-baked docker.io/sbx/crush-image:latest, which the Dockerfile beside the
# spec built -- in v3 a workload's content *is* its image, so that recipe
# becomes this kit's companion (crush.dockerfile) and the published-image
# indirection disappears with it. Deltas are marked MIGRATION NOTE inline.
schemaVersion: "3"
displayName: Crush
description: >-
  Multi-provider AI coding agent from Charm, with proxy-mediated auth for 15
  model providers.

kind: workload

# MIGRATION NOTE: v2 declared no version, and the install floats by design --
# `apt-get install crush` resolves whatever Charm's apt repo currently serves,
# and the nightly rebuild is what keeps it current. There is no pin to declare
# as an arg and nothing for a versioned provide to reference, so the provide is
# unversioned and `version:` supplies the fallback publishing needs.
version: "1.0.0"

provides: ["crush"]

capabilities:
  # This workload is an agent sandbox: the host launches the agent rather than
  # running the image's entrypoint as PID 1, and honors the identity the image
  # config declares instead of assuming one.
  - type: com.docker.sandbox/sbx@1

  # MIGRATION NOTE: v2's one flat allow list becomes phase-scoped, and every
  # entry lands in `runtime`. There is no `install` phase, and its absence is
  # exactly what v2's own comment argued for: Crush is baked into the image
  # (see crush.dockerfile), so repo.charm.sh (the apt index and GPG key), the
  # Gemfury-fronted S3 bucket it redirects package downloads to, and the base
  # template's own apt sources are all image-build-time now -- which no
  # network-policy phase governs. This kit declares no lifecycle hooks at all,
  # so nothing runs in the install phase either.
  #
  # What remains below is exactly the provider hosts the credentials inject
  # into: a credential's inject domains are not allowed implicitly, and v3
  # validates that each one appears in the matching phase's allow list.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com
          - api.openai.com
          - '*.openai.azure.com'
          - generativelanguage.googleapis.com
          - api.mistral.ai
          - api.groq.com
          - groq.com
          - api.cerebras.ai
          - openrouter.ai
          - api-inference.huggingface.co
          - api.io.net
          - api.minimax.chat
          - api.synthetic.com
          - api.zai.com
          - v0.dev
          # Middle-position wildcards (bedrock.*.amazonaws.com) are not part of
          # the allow-entry grammar, so Bedrock regions are listed explicitly.
          # Using another region? Extend both this list and the aws inject list.
          - bedrock-runtime.us-east-1.amazonaws.com
          - bedrock.us-east-1.amazonaws.com
          - bedrock-runtime.us-east-2.amazonaws.com
          - bedrock.us-east-2.amazonaws.com
          - bedrock-runtime.us-west-2.amazonaws.com
          - bedrock.us-west-2.amazonaws.com
          - bedrock-runtime.eu-central-1.amazonaws.com
          - bedrock.eu-central-1.amazonaws.com

  # Fifteen provider services. MIGRATION NOTE (all of them): v2 credentials
  # default to not-required and the v3 default inverts, so every entry carries
  # `optional: true` to preserve the v2 behavior -- the user binds whichever
  # providers they actually use, and the other fourteen do not fail create.
  #
  # Service names are load-bearing beyond this file: each is the key a host
  # binds a secret under and the key the proxy routes on. Renaming one here
  # silently detaches it from the host binding.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Anthropic API access
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: "%s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: AWS Bedrock access
    config:
      service: aws
      phase: runtime
      apiKey:
        name: AWS_ACCESS_KEY_ID
        proxyManaged: true
        # Same explicit regions as the allow list above: an inject domain is
        # matched against the request host, so a middle wildcard never fires.
        inject:
          - {domain: bedrock-runtime.us-east-1.amazonaws.com, header: Authorization, format: "AWS4-HMAC-SHA256 Credential=%s/"}
          - {domain: bedrock.us-east-1.amazonaws.com, header: Authorization, format: "AWS4-HMAC-SHA256 Credential=%s/"}
          - {domain: bedrock-runtime.us-east-2.amazonaws.com, header: Authorization, format: "AWS4-HMAC-SHA256 Credential=%s/"}
          - {domain: bedrock.us-east-2.amazonaws.com, header: Authorization, format: "AWS4-HMAC-SHA256 Credential=%s/"}
          - {domain: bedrock-runtime.us-west-2.amazonaws.com, header: Authorization, format: "AWS4-HMAC-SHA256 Credential=%s/"}
          - {domain: bedrock.us-west-2.amazonaws.com, header: Authorization, format: "AWS4-HMAC-SHA256 Credential=%s/"}
          - {domain: bedrock-runtime.eu-central-1.amazonaws.com, header: Authorization, format: "AWS4-HMAC-SHA256 Credential=%s/"}
          - {domain: bedrock.eu-central-1.amazonaws.com, header: Authorization, format: "AWS4-HMAC-SHA256 Credential=%s/"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Azure OpenAI access
    config:
      service: azure-openai
      phase: runtime
      apiKey:
        name: AZURE_OPENAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: '*.openai.azure.com', header: api-key, format: "%s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Cerebras API access
    config:
      service: cerebras
      phase: runtime
      apiKey:
        name: CEREBRAS_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.cerebras.ai, header: Authorization, format: "Bearer %s"}
  # v1 also accepted GOOGLE_GENERATIVE_AI_API_KEY as a fallback host env var
  # name for this credential (credentials.sources.google.env listed both).
  # apiKey.name is a single string with no alias list in v2 or v3, so only one
  # host env var can be recognized here; GEMINI_API_KEY is Google's current
  # canonical name for this key, so it's the one kept. A host with only
  # GOOGLE_GENERATIVE_AI_API_KEY set will not be picked up.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Google AI API access
    config:
      service: google
      phase: runtime
      apiKey:
        name: GEMINI_API_KEY
        proxyManaged: true
        inject:
          - {domain: generativelanguage.googleapis.com, header: x-goog-api-key, format: "%s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Groq API access
    config:
      service: groq
      phase: runtime
      apiKey:
        name: GROQ_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.groq.com, header: Authorization, format: "Bearer %s"}
          - {domain: groq.com, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Hugging Face inference access
    config:
      service: huggingface
      phase: runtime
      apiKey:
        name: HF_TOKEN
        proxyManaged: true
        inject:
          - {domain: api-inference.huggingface.co, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: io.net API access
    config:
      service: ionet
      phase: runtime
      apiKey:
        name: IONET_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.io.net, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: MiniMax API access
    config:
      service: minimax
      phase: runtime
      apiKey:
        name: MINIMAX_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.minimax.chat, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Mistral API access
    config:
      service: mistral
      phase: runtime
      apiKey:
        name: MISTRAL_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.mistral.ai, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenAI API access
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.openai.com, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenRouter API access
    config:
      service: openrouter
      phase: runtime
      apiKey:
        name: OPENROUTER_API_KEY
        proxyManaged: true
        inject:
          - {domain: openrouter.ai, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Synthetic API access
    config:
      service: synthetic
      phase: runtime
      apiKey:
        name: SYNTHETIC_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.synthetic.com, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Vercel v0 API access
    config:
      service: vercel
      phase: runtime
      apiKey:
        name: VERCEL_API_KEY
        proxyManaged: true
        inject:
          - {domain: v0.dev, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Z.ai API access
    config:
      service: zai
      phase: runtime
      apiKey:
        name: ZAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.zai.com, header: Authorization, format: "Bearer %s"}

  # MIGRATION NOTE: the one kit in this group that earns agent-sessions@1. Its
  # testdata/tck.yaml recorded `promptArgs: ["run"]` -- an invocation the e2e
  # actually exercised -- so the prompt verb is a carry-over rather than a
  # guess. The tail appends to the image's Entrypoint + Cmd the way user args
  # do, making the headless argv `crush --yolo run <prompt>`. No resume,
  # continue or list verb: v2 recorded no working spelling for any of them, and
  # the capability exists precisely so a host surfaces "unsupported" instead of
  # improvising flags.
  - type: com.docker.sandbox/agent-sessions@1
    description: Run one Crush prompt non-interactively
    config:
      prompt: ["run", "{{.Prompt}}"]

  # v2's agentInstructions, body moved verbatim into the staged context file.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      contentFile: ./crush-context.md

  # MIGRATION NOTE: no lifecycle@1. v2 declared no setup hooks and no files
  # directory, and an entry holding no install, startup, files or interactive
  # tail is invalid -- so the correct migration is to declare nothing.

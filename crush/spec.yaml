schemaVersion: "2"
kind: sandbox
name: crush
displayName: Crush
description: Multi-provider AI coding agent from Charm, with proxy-mediated auth for 15 model providers.
sandbox:
  # Pre-baked image: Crush is installed from Charm's apt repository at image-
  # build time rather than sandbox-create time. Built and published by
  # build-and-publish-kits.yml, the shared kit-image pipeline (see
  # ../PUBLISHING.md) -- no bespoke workflow needed, same as
  # hermes-agent/pi/openclaw/kiro/copilot. Sandbox creation only pulls the
  # image; the pipeline's nightly rebuild keeps Crush current (rolling
  # updates, no deliberate version bump -- see the Dockerfile).
  image: docker.io/sbx/crush-image:latest
  entrypoint:
    - crush
  command:
    default:
      - --yolo
agentInstructions:
  filename: AGENTS.md
  content: |
    ## Crush

    Crush is a multi-provider AI coding agent from Charm. It is installed
    as `crush` on `PATH` and started with `--yolo` so it skips interactive
    permission prompts (the sandbox itself is the safety boundary).

    Set any of the provider API keys on your host (e.g. `ANTHROPIC_API_KEY`,
    `OPENAI_API_KEY`, `GROQ_API_KEY`) and the sandbox proxy will inject them
    on outbound requests to the matching provider. See
    <https://github.com/charmbracelet/crush> for usage.
permissions:
  network:
    allow:
      # Crush is baked into the image (see Dockerfile) rather than installed
      # at sandbox-create time, so repo.charm.sh (the apt index and GPG key),
      # the Gemfury-fronted S3 bucket it redirects package downloads to, and
      # the three apt sources the shell-docker template ships with are all
      # install-time-only now -- none of them is a credential inject domain,
      # so none belongs here. What remains below is exactly the provider
      # hosts the credentials block injects into: a credential's inject
      # domains are not allowed implicitly, and e2e runs every kit under
      # `deny-all` -- see README, "How auth works".
      - api.anthropic.com
      - api.openai.com
      - '*.openai.azure.com'
      - generativelanguage.googleapis.com
      - api.mistral.ai
      - api.groq.com
      - groq.com
      - api.cerebras.ai
      - openrouter.ai
      - api-inference.huggingface.co
      - api.io.net
      - api.minimax.chat
      - api.synthetic.com
      - api.zai.com
      - v0.dev
      # Middle-position wildcards (bedrock.*.amazonaws.com) are not part of
      # the allow-entry grammar, so Bedrock regions are listed explicitly.
      # Using another region? Extend both this list and the aws inject list.
      - bedrock-runtime.us-east-1.amazonaws.com
      - bedrock.us-east-1.amazonaws.com
      - bedrock-runtime.us-east-2.amazonaws.com
      - bedrock.us-east-2.amazonaws.com
      - bedrock-runtime.us-west-2.amazonaws.com
      - bedrock.us-west-2.amazonaws.com
      - bedrock-runtime.eu-central-1.amazonaws.com
      - bedrock.eu-central-1.amazonaws.com
credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: '%s'
  - service: aws
    apiKey:
      name: AWS_ACCESS_KEY_ID
      proxyManaged: true
      inject:
        # Same explicit regions as the allow list above: an inject domain is
        # matched against the request host, so a middle wildcard never fires.
        - domain: bedrock-runtime.us-east-1.amazonaws.com
          header: Authorization
          format: AWS4-HMAC-SHA256 Credential=%s/
        - domain: bedrock.us-east-1.amazonaws.com
          header: Authorization
          format: AWS4-HMAC-SHA256 Credential=%s/
        - domain: bedrock-runtime.us-east-2.amazonaws.com
          header: Authorization
          format: AWS4-HMAC-SHA256 Credential=%s/
        - domain: bedrock.us-east-2.amazonaws.com
          header: Authorization
          format: AWS4-HMAC-SHA256 Credential=%s/
        - domain: bedrock-runtime.us-west-2.amazonaws.com
          header: Authorization
          format: AWS4-HMAC-SHA256 Credential=%s/
        - domain: bedrock.us-west-2.amazonaws.com
          header: Authorization
          format: AWS4-HMAC-SHA256 Credential=%s/
        - domain: bedrock-runtime.eu-central-1.amazonaws.com
          header: Authorization
          format: AWS4-HMAC-SHA256 Credential=%s/
        - domain: bedrock.eu-central-1.amazonaws.com
          header: Authorization
          format: AWS4-HMAC-SHA256 Credential=%s/
  - service: azure-openai
    apiKey:
      name: AZURE_OPENAI_API_KEY
      proxyManaged: true
      inject:
        - domain: '*.openai.azure.com'
          header: api-key
          format: '%s'
  - service: cerebras
    apiKey:
      name: CEREBRAS_API_KEY
      proxyManaged: true
      inject:
        - domain: api.cerebras.ai
          header: Authorization
          format: Bearer %s
  # v1 also accepted GOOGLE_GENERATIVE_AI_API_KEY as a fallback host env var
  # name for this credential (credentials.sources.google.env listed both).
  # v2's apiKey.name is a single string with no alias list, so only one host
  # env var can be recognized here; GEMINI_API_KEY is Google's current
  # canonical name for this key, so it's the one kept. A host with only
  # GOOGLE_GENERATIVE_AI_API_KEY set will no longer be picked up.
  - service: google
    apiKey:
      name: GEMINI_API_KEY
      proxyManaged: true
      inject:
        - domain: generativelanguage.googleapis.com
          header: x-goog-api-key
          format: '%s'
  - service: groq
    apiKey:
      name: GROQ_API_KEY
      proxyManaged: true
      inject:
        - domain: api.groq.com
          header: Authorization
          format: Bearer %s
        - domain: groq.com
          header: Authorization
          format: Bearer %s
  - service: huggingface
    apiKey:
      name: HF_TOKEN
      proxyManaged: true
      inject:
        - domain: api-inference.huggingface.co
          header: Authorization
          format: Bearer %s
  - service: ionet
    apiKey:
      name: IONET_API_KEY
      proxyManaged: true
      inject:
        - domain: api.io.net
          header: Authorization
          format: Bearer %s
  - service: minimax
    apiKey:
      name: MINIMAX_API_KEY
      proxyManaged: true
      inject:
        - domain: api.minimax.chat
          header: Authorization
          format: Bearer %s
  - service: mistral
    apiKey:
      name: MISTRAL_API_KEY
      proxyManaged: true
      inject:
        - domain: api.mistral.ai
          header: Authorization
          format: Bearer %s
  - service: openai
    apiKey:
      name: OPENAI_API_KEY
      proxyManaged: true
      inject:
        - domain: api.openai.com
          header: Authorization
          format: Bearer %s
  - service: openrouter
    apiKey:
      name: OPENROUTER_API_KEY
      proxyManaged: true
      inject:
        - domain: openrouter.ai
          header: Authorization
          format: Bearer %s
  - service: synthetic
    apiKey:
      name: SYNTHETIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.synthetic.com
          header: Authorization
          format: Bearer %s
  - service: vercel
    apiKey:
      name: VERCEL_API_KEY
      proxyManaged: true
      inject:
        - domain: v0.dev
          header: Authorization
          format: Bearer %s
  - service: zai
    apiKey:
      name: ZAI_API_KEY
      proxyManaged: true
      inject:
        - domain: api.zai.com
          header: Authorization
          format: Bearer %s

# TCK configuration for the opencode kit.
#
# opencode is still a built-in agent in released sbx builds, and sbx refuses to
# load a kit whose name collides with a built-in ("built-in agents cannot be
# overridden by a kit"). This flag turns that one specific `sbx create` failure
# into a skip, so the kit can land and be reviewed here before the built-in is
# removed from sbx.
#
# Nothing needs re-enabling later: once a released sbx no longer registers the
# built-in, `sbx create` succeeds, the full e2e runs, and the test logs a notice
# that this line is obsolete and can be deleted.
extractedFromBuiltin: true
#
# `promptArgs` is deliberately omitted for now, which skips the e2e `prompt`
# subtest. Unlike kiro, this is not a permanent opt-out and the invocation is
# not in doubt — `opencode run <prompt>` is the documented non-interactive form,
# and the sibling opencode-model-runner kit uses exactly that. What is missing
# here is a model: that kit answers prompts against a local Docker Model Runner,
# while this one reaches a hosted provider, and no provider credential exists on
# the runner. Wiring `promptArgs: ["run"]` before one does would land a subtest
# that can only fail the moment the built-in is dropped and e2e starts running
# for real. Add the line together with the credential, not before it.
#
# The remaining subtests (env, files, tmpfs, agentContext) still run and are
# what actually gate this kit — for as long as the built-in exists they are
# skipped too, so read a green run here as "TCK passed", not "e2e passed".

# Shape of the MCP-gateway registration written by the startup hook in
# spec.yaml, checked by the TCK's mcp_registration subtest. The
# format-independent parts (no-op guard, env-var indirection, no literal token,
# non-root user) are asserted for every kit and need no configuration here.
#
# OpenCode keys a remote MCP server by `url`, alongside `type: "remote"`,
# `enabled: true` and a `headers` object — so `headers` is the correct spelling
# here and is not forbidden, unlike in the codex kit.
#
# The forbidden keys are the wrong answers nearest to hand when transliterating
# an MCP config from a neighbouring agent:
#
#   * `httpUrl` — Gemini's spelling of `url`.
#   * `http_headers` — Codex's spelling of `headers`, one kit directory away.
#   * `command` — the key OpenCode's *local* server shape uses. A registration
#     carrying it would be describing a process to spawn rather than the
#     gateway URL to call, which is a different server entirely.
mcp:
  configPath: $HOME/.config/opencode/opencode.json
  transportKey: url
  forbiddenKeys:
    - httpUrl
    - http_headers
    - command

schemaVersion: "2"
kind: sandbox
name: claude
# The KIT's version, not Claude Code's. It covers this spec, the network policy
# and the setup hooks — the binary inside the image floats (the image build
# resolves the current release), so a newer Claude Code does not bump this and
# this does not track its releases.
#
# Published as the vnd.docker.sandbox.kit.version OCI annotation at pack time,
# and `scripts/check-release-tag.sh` refuses a `claude/vX.Y.Z` tag that
# disagrees with it. Bump here first, then tag.
version: "1.0.0"
displayName: Claude Code
description: Anthropic's Claude Code, with API-key and subscription sign-in both resolved by the sandbox proxy.
sandbox:
  # Built from the Dockerfile beside this spec and published by
  # .github/workflows/build-and-publish-kits.yml. Carries a Docker engine and
  # requests Docker-in-Docker, matching the agent this kit replaces.
  #
  # This value is the source of truth for what CI builds and publishes: the
  # workflow reads it from here rather than deriving a name, because spec.yaml
  # is consumed literally (no env interpolation) and so cannot follow a
  # variable. scripts/check-image-ref.sh asserts it stays inside the namespace
  # CI can actually push to.
  #
  # The `-image` suffix distinguishes the base image from the kit artifact:
  # the kit itself is published as `docker.io/sbx/claude-kit`.
  image: "docker.io/sbx/claude-image:latest"
  # Claude Code's own permission prompts are redundant here — the container IS
  # the sandbox, and a prompt nobody can answer just deadlocks the session. The
  # settings.json written by setup.install says the same thing in config form
  # (permissions.defaultMode plus the two acceptance flags); both are kept so
  # neither surface has to be the only line of defence.
  entrypoint: [claude, "--dangerously-skip-permissions"]

credentials:
  # One service. Claude Code talks to exactly one vendor, and both ways of
  # authenticating to it — a console API key and a Claude subscription — are
  # the same `anthropic` service as far as the host binding and the proxy are
  # concerned. The two blocks below are alternatives the engine picks between
  # per sandbox, not two credentials.
  #
  # The service name is load-bearing beyond this file: it is the key a host
  # binds a secret under (`sbx secret set anthropic …`) and the key the proxy
  # routes on. Renaming it here silently detaches it from the host binding.
  #
  # Not marked `required`. An unbound sandbox is a perfectly ordinary starting
  # point — Claude Code's own `/login` works from inside it — so failing
  # `sbx create` would take away a working configuration rather than protect
  # one.
  - service: anthropic
    apiKey:
      # NOTE: deliberately NOT `proxyManaged: true`, unlike most apiKey-based
      # kits in this repo, and this is the single most load-bearing omission in
      # the file. With proxyManaged the engine would set ANTHROPIC_API_KEY to
      # the literal `proxy-managed` inside the container; without it the
      # variable is not populated at all and the name here only declares which
      # variable this credential corresponds to.
      #
      # Leaving it unset is what keeps the subscription path working. Claude
      # Code resolves auth in a fixed order and an ANTHROPIC_API_KEY in the
      # environment outranks the OAuth credentials file the block below writes
      # — so a sentinel parked in that variable would shadow a bound
      # subscription on every sandbox, and the session would authenticate as
      # a console API key that may not exist. The sentinel Claude Code is meant
      # to send arrives by a different route: `apiKeyHelper` in
      # ~/.claude/settings.json (seeded by setup.install below) echoes
      # `proxy-managed`, and the inject rules here swap the real value in at
      # request time.
      name: ANTHROPIC_API_KEY
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: "%s"
        - domain: console.anthropic.com
          header: x-api-key
          format: "%s"
        - domain: claude.ai
          header: x-api-key
          format: "%s"
        - domain: mcp-proxy.anthropic.com
          header: x-api-key
          format: "%s"
    # For a host whose stored anthropic credential is a Claude subscription
    # rather than a console API key. The block is entirely declarative: the
    # token endpoint, the sentinel values the proxy substitutes at request
    # time, and the file the engine renders into the container. Nothing in the
    # container implements any of it, and the container never holds a usable
    # token — it holds the two sentinels, and the proxy swaps them per request
    # and re-masks refresh responses with the same values.
    oauth:
      tokenEndpoint:
        host: platform.claude.com
        path: /v1/oauth/token
      sentinels:
        accessToken: sk-ant-oat01-proxy-managed
        refreshToken: sk-ant-ort01-proxy-managed
      credentialFile:
        path: "~/.claude/.credentials.json"
        # Written as a Go template rather than the `structure:` map that
        # spec-anatomy calls preferred, and that is a deliberate keep rather
        # than an unconverted leftover: `primaryApiKey` is emitted only when
        # the host also holds an API key minted from the subscription, and a
        # declarative map has no way to express a conditional key. Converting
        # this to `structure:` would either drop the field or emit it empty,
        # and an empty `primaryApiKey` is not the same thing as its absence.
        template: '{"claudeAiOauth":{"accessToken":"{{.AccessToken}}","refreshToken":"{{.RefreshToken}}","expiresAt":{{.ExpiresAt}},"scopes":{{.ScopesJSON}}}{{if .PrimaryApiKey}},"primaryApiKey":"{{.PrimaryApiKey}}"{{end}}}'
      # Carried over from the built-in spec for parity, but a no-op for a
      # schemaVersion "2" credential like this one: resolution here is
      # binding-driven, not host-env-driven, so a host env var alone (as
      # opposed to a bound credential) does not gate this. Kept rather than
      # dropped so a future diff against the built-in spec stays minimal.
      skipIfEnv:
        - ANTHROPIC_API_KEY

permissions:
  network:
    # Carried over from the built-in this kit replaces, which declared the
    # agent's own hosts, plus the two additions the extraction makes necessary:
    # the remaining credential inject domains (the all-domains-declared rule is
    # enforced here, not derived from the credential block) and the apt sources
    # the base image ships. This repo's e2e runs every kit under
    # `sbx policy init deny-all`, so the kit gets exactly the reachability
    # declared here and nothing more.
    #
    # Entries are written without a port, which is this repo's house style and
    # a change from the built-in spec's `host:443` form. A portless pattern
    # matches any port, which is what the apt hosts at the bottom need —
    # pinning them to :80 breaks the moment a mirror answers over https and
    # `apt-get update` then fails wholesale rather than skipping one source.
    # Mixing the two forms in one list would leave the difference looking
    # meaningful when it is not.
    allow:
      # Every domain the credential above injects into. Required here as well,
      # not just in the credential block: a domain absent from this list is
      # unreachable no matter what the credential declares.
      - api.anthropic.com
      - console.anthropic.com
      - claude.ai
      - mcp-proxy.anthropic.com
      # The OAuth token endpoint the subscription path refreshes against.
      - platform.claude.com
      # Release bucket for the native installer. Needed at run time, not only
      # at image-build time: `claude update` and `claude install` re-run the
      # same download from here.
      - downloads.claude.ai
      # Claude Code's own web properties. `claude.com` serves the account and
      # sign-in pages `/login` hands off to; `code.claude.com` serves the
      # documentation the CLI links to and the installer is fronted from.
      - claude.com
      - code.claude.com
      # /remote-control and /teleport relay: the agent keeps a WebSocket open
      # here so claude.ai and the mobile app can drive this session.
      - bridge.claudeusercontent.com
      # `apt-get update` (the startup hook below) refreshes metadata for every
      # configured apt source and returns exit 100 if any one of them fails.
      # The shell-docker base ships three sources, so all three must be
      # reachable. Ubuntu serves amd64 from archive/security and arm64 from
      # ports.ubuntu.com, so all three Ubuntu hosts are listed to keep the kit
      # working cross-arch.
      - archive.ubuntu.com        # Ubuntu archive (amd64 main)
      - security.ubuntu.com       # Ubuntu security updates (amd64)
      - ports.ubuntu.com          # Ubuntu archive/security (arm64)
      - download.docker.com       # Docker's apt repo, pre-added by shell-docker
      #
      # Deliberately absent, in both cases because adding a host on speculation
      # is how an allow-list stops describing anything:
      #
      #   * The Statsig and Sentry endpoints. environment.variables below turns
      #     usage reporting and crash reporting off at the source, so nothing
      #     should reach them; leaving them unlisted is the durable half of
      #     that, and it holds even if the variable names change.
      #   * registry.npmjs.org and the GitHub hosts. Claude Code reaches those
      #     only for things the user starts — an `npx`-launched MCP server, a
      #     plugin marketplace — and a kit that allowed them by default would
      #     widen every sandbox's egress for a path most sessions never take.
      #     Compose a mixin that declares them, or add them here in a fork.

# Volumes persist across container recreation. With deterministic volume
# naming, the same sandbox name reattaches to the same volumes on recreate —
# so Claude Code's session state survives `sbx kit add` and other
# recreate-shaped operations. Subdirectories are mounted rather than all of
# ~/.claude/, so kit-managed files like settings.json and .credentials.json
# keep coming from the image and the OAuth hook on every create.
#
# Every volume must set a size. Block volumes are sparse ext4 images, but the
# kernel zeroes ext4's inode tables shortly after first mount, so an unsized
# volume inheriting the block driver's 50 GiB default costs ~800 MiB of host
# space while empty.
#
# 512m is the floor worth using, not a generous rounding: mke2fs picks
# inode_ratio from the volume size, and below 512 MiB it switches to the
# "small" profile at one inode per 4 KiB instead of one per 16 KiB. A 512m
# volume therefore has the same 8 MiB of inode tables as a 128m one, and half
# that of a 256m one.
volumes:
  # Conversation history — the actual session content
  # (~/.claude/projects/<workspace-as-dashes>/<session-id>.jsonl). Grows
  # without bound across sessions, so it gets the headroom.
  - path: /home/agent/.claude/projects
    size: 2g
  # Per-session state JSON (e.g. ~/.claude/sessions/259.json). Load-bearing
  # for `claude -c` — without it the resume flag has no way to map "the
  # previous session" back to the matching transcript file in projects/.
  - path: /home/agent/.claude/sessions
    size: 512m
  # TodoWrite state.
  - path: /home/agent/.claude/todos
    size: 512m
  # Bash state across sessions — one snapshot per shell session.
  - path: /home/agent/.claude/shell-snapshots
    size: 512m
  # Local feature-flag cache. Kept even though the kit turns telemetry off:
  # the variable that does that suppresses event reporting, not the gate
  # lookups this directory caches.
  - path: /home/agent/.claude/statsig
    size: 512m

environment:
  variables:
    IS_SANDBOX: "1"
    # Opt out of usage reporting. The agent reports by default and the
    # built-in this kit is extracted from left it that way — this is a
    # deliberate deviation, taken because every other agent kit in this repo
    # that has a switch to throw throws it, and because the variable is
    # fail-closed: it can only turn reporting off, never on. Override it per
    # sandbox to get the default behaviour back.
    #
    # Verified against the shipped binary, whose consent ladder reads
    # CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC > DISABLE_TELEMETRY >
    # DO_NOT_TRACK. The first of those is NOT used here even though it is the
    # broadest: it puts the agent into an "essential traffic only" mode that
    # also takes away /feedback, Projects and DesignSync, which is a feature
    # cut rather than a telemetry decision. DO_NOT_TRACK is skipped for the
    # opposite reason — it is the cross-tool convention and would silence
    # every other tool in the sandbox as well, which is not this kit's call to
    # make on the user's behalf.
    DISABLE_TELEMETRY: "1"
    # Crash reporting, which the variable above does not cover — the binary
    # gates the two independently. Same reasoning, same fail-closed direction.
    DISABLE_ERROR_REPORTING: "1"

setup:
  install:
    # ~/.claude.json carries the bypass/onboarding/trust flags and is
    # credential-independent. It needs a command rather than setup.files for
    # two reasons: the content is conditional — the `projects` map gains a
    # second entry only when WORKSPACE_DIR is not "/", and the path has to be
    # JSON-escaped — which setup.files cannot express; and setup.files can
    # only create-or-skip, so an `onlyIfMissing` guard would silently leave
    # the flags unset against a file that already exists, and Claude Code
    # then prompts "Is this a project you trust?" at startup instead of
    # rendering its TUI. Writing as root + chown always overwrites whatever
    # is there, whoever owns it. Content is deterministic for a given
    # WORKSPACE_DIR, so the rewrite is idempotent.
    - command: |
        set -e
        ws="${WORKSPACE_DIR:-/}"
        esc=$(printf '%s' "$ws" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\t/\\t/g; s/\r/\\r/g')
        projects="\"/\": { \"hasTrustDialogAccepted\": true }"
        [ "$ws" = "/" ] || projects="$projects, \"$esc\": { \"hasTrustDialogAccepted\": true }"
        printf '%s\n' "{
          \"bypassPermissionsModeAccepted\": true,
          \"hasCompletedOnboarding\": true,
          \"projects\": { $projects }
        }" > /home/agent/.claude.json
        chown agent:agent /home/agent/.claude.json
      user: "0"
      description: Seed Claude bypass/trust flags (root; overwrites image-shipped file)
    # Seed ~/.claude/settings.json, branching on the auth mode surfaced via the
    # SBX_CRED_ANTHROPIC_MODE container env var (the engine derives it from the
    # host-side credential signal). apiKeyHelper="echo proxy-managed" is
    # included only when a credential resolved (mode != none); without it
    # Claude Code prompts for /login. settings.json is kit-managed and
    # rewritten unconditionally on every (re)create, so it always reflects the
    # current SBX_CRED_ANTHROPIC_MODE (a mode change on recreate is picked up).
    # Content is deterministic from the mode, so the rewrite is idempotent.
    # The bypass/trust flags live in ~/.claude.json (seeded by the root install
    # command above).
    #
    # defaultMode must sit under "permissions": Claude Code reads only
    # permissions.defaultMode and silently ignores the key elsewhere.
    # skipDangerousModePermissionPrompt is seeded rather than left to Claude
    # Code's deprecated ~/.claude.json migration, which otherwise writes it
    # here.
    - command: |
        set -e
        mkdir -p /home/agent/.claude
        HELPER=''
        if [ "${SBX_CRED_ANTHROPIC_MODE:-none}" != none ]; then
          HELPER='  "apiKeyHelper": "echo proxy-managed",
        '
        fi
        printf '%s' "{
          \"themeId\": 1,
          \"alwaysThinkingEnabled\": true,
        ${HELPER}  \"permissions\": { \"defaultMode\": \"bypassPermissions\" },
          \"bypassPermissionsModeAccepted\": true,
          \"skipDangerousModePermissionPrompt\": true
        }
        " > /home/agent/.claude/settings.json
      user: "agent"
      description: Seed Claude settings.json from SBX_CRED_ANTHROPIC_MODE
    # Gateway-first MCP registration, seeded at INSTALL time so it is race-free.
    # Install commands are synchronous container PostStart hooks that complete
    # during create, BEFORE the CLI attaches and launches the interactive
    # `claude` session. Registering here (rather than only in setup.startup)
    # closes a race: startup commands are delivered to /etc/durable-startup.d
    # and fired by a DETACHED dispatcher, so a startup-time `claude mcp add`
    # could land AFTER the session has already read the user config — leaving
    # the agent with no gateway ("no connection").
    #
    # MCP_GATEWAY_URL / MCP_SENTINEL_TOKEN_NAME are injected into the container
    # env at create time, so they are present here. The sentinel name is a
    # stable constant and the gateway URL is a portless alias, so the entry
    # stays valid across stop/start without re-running. The sentinel is not a
    # credential — the proxy substitutes the real token at request time, keyed
    # by this name.
    #
    # --scope user writes the entry to the user-level Claude config, so it is
    # visible from every workspace regardless of the session's cwd and does not
    # depend on any workspace directory existing at registration time.
    #
    # `claude mcp add` is NOT an idempotent rewrite: re-adding an existing name
    # always exits 1 ("already exists in user config"), so `|| true` here
    # matches the startup fallback below. This matters beyond simple restarts:
    # the swap-container recreate path behind `sbx kit add` and `--model`
    # commits and reuses the previous container's writable filesystem layer, so
    # install commands rerun against a filesystem that may already carry the
    # entry forward in ~/.claude/.config.json — a second, higher-priority
    # config file that shadows ~/.claude.json and is untouched by this kit's
    # own install commands (it is only written by hooks and mixins that run
    # after this one). Without `|| true` that collision fails the entire swap.
    #
    # PATH is exported explicitly rather than trusted: the image puts
    # ~/.local/bin on PATH, but ~/.claude/local is the older install layout a
    # re-pointed BASE_IMAGE might still use.
    - command: |
        set -e
        [ -n "$MCP_GATEWAY_URL" ] || exit 0
        export PATH="$HOME/.local/bin:$HOME/.claude/local:$PATH"
        claude mcp add mcp-gateway "$MCP_GATEWAY_URL" \
          --transport http \
          --scope user \
          --header "Authorization: Bearer $MCP_SENTINEL_TOKEN_NAME" || true
      user: "agent"
      description: Register the sandbox MCP gateway with claude (install-time, race-free)
  startup:
    # Re-own the kit-declared session-state volume mount roots to the agent
    # user. Block volumes (~/.claude/projects, sessions, todos,
    # shell-snapshots, statsig) mount with a root-owned root because they are
    # formatted as ext4 — the image's directory ownership is shadowed by the
    # mount, and the image's own USER is `agent`, so any chown it could run
    # would be a no-op. Running this as user:"0" here (after the volumes are
    # mounted, before any agent activity) is what makes ~/.claude writable for
    # the agent user, including in the swap container produced by
    # `sbx kit add`.
    #
    # Enumerated, not recursive over ~/.claude: the parent holds
    # runtime-managed content this kit does not own, and the five paths below
    # are exactly the ones it declares as volumes.
    - command: ["sh", "-c", "chown -R agent:agent /home/agent/.claude/projects /home/agent/.claude/sessions /home/agent/.claude/todos /home/agent/.claude/shell-snapshots /home/agent/.claude/statsig 2>/dev/null || true"]
      user: "0"
      description: Re-own claude session-state volume mount roots to agent (block-volume mkfs trap)
    # The redirects and </dev/null belong on the outer group, not inside a
    # subshell: a backgrounded job that inherits the exec's pipe write ends
    # keeps it from reaching EOF, and a slow apt-get then times out the exec.
    - command: ["sh", "-c", "{ command -v apt-get && apt-get update -qq -y || true; } >/dev/null 2>&1 </dev/null &"]
      user: "root"
      description: Update apt package cache in background
    # Gateway-first MCP registration FALLBACK. The gateway is normally seeded
    # at install time before the session starts, which is race-free; this
    # startup entry re-registers defensively in case the install-time seed
    # could not run.
    #
    # It must NOT remove-then-add: startup commands run via a detached
    # dispatcher that can fire concurrently with the live session, and a
    # `claude mcp remove` would briefly delete the entry out from under it.
    # `claude mcp add … || true` is non-destructive — when the gateway is
    # already registered (the common, install-seeded case) `add` exits 1
    # ("already exists in user config"; it is NOT an idempotent rewrite) and
    # `|| true` swallows that, so the existing entry is left alone rather than
    # taken away. No-op entirely when MCP is not enabled ($MCP_GATEWAY_URL
    # empty).
    - command:
        - sh
        - -c
        - |
          set -e
          [ -n "$MCP_GATEWAY_URL" ] || exit 0
          export PATH="$HOME/.local/bin:$HOME/.claude/local:$PATH"
          claude mcp add mcp-gateway "$MCP_GATEWAY_URL" \
            --transport http \
            --scope user \
            --header "Authorization: Bearer $MCP_SENTINEL_TOKEN_NAME" || true
      user: "agent"
      description: Register the sandbox MCP gateway with claude (startup fallback)

# Claude Code reads CLAUDE.md from the project root every session, so this is
# the filename composed kit context has to land in for the agent to pick it up.
agentInstructions:
  filename: CLAUDE.md
  content: |
    ## Claude Code: Environment Persistence

    The `CLAUDE_ENV_FILE` environment variable is set to `/etc/sandbox-persistent.sh`.

    According to [Claude Code Documentation](https://code.claude.com/docs/en/settings#bash-tool-behavior):

    > **CLAUDE_ENV_FILE**
    >
    > If set, this file will be sourced before each Bash command execution. This allows environment variables to persist across multiple Bash tool invocations.

    This means `/etc/sandbox-persistent.sh` is sourced before every Bash tool call you make. Any `export` statements you append to this file will be available in all subsequent commands without needing a login shell.

    ### Shell Completions Must NOT Be in CLAUDE_ENV_FILE

    **NEVER add shell completion scripts to `/etc/sandbox-persistent.sh`.**

    `CLAUDE_ENV_FILE` is sourced **before every single bash command execution**, not just during shell initialization. Completion scripts rely on special variables (`COMP_WORDS`, `COMP_CWORD`, `COMPREPLY`) that only exist during tab-completion contexts.

    #### WRONG - Will Break Bash

    ```bash
    # DO NOT ADD THESE TO /etc/sandbox-persistent.sh
    [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
    [[ -s "$SDKMAN_DIR/etc/bash_completion.sh" ]] && source "$SDKMAN_DIR/etc/bash_completion.sh"
    ```

    #### CORRECT - Only Load Core Functionality

    ```bash
    # ONLY add the main initialization scripts
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

    export SDKMAN_DIR="$HOME/.sdkman"
    [[ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]] && source "$SDKMAN_DIR/bin/sdkman-init.sh"
    ```

    #### Symptoms of Broken Shell

    When completion scripts are incorrectly added:
    - All bash commands return no output (silent failure)
    - `echo`, `pwd`, and other basic commands produce no results
    - The bash tool becomes completely unusable

    #### Solution

    If you accidentally added completion scripts and broke the shell:
    1. Remove the completion line(s) from `/etc/sandbox-persistent.sh`
    2. Exit and restart the Claude Code session
    3. Verify with `echo "test"` that bash works again

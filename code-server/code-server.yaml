# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: code-server (web VS Code) with Claude Code
description: Runs code-server on port 8080, opened on the sandbox workspace, with the Claude Code VS Code extension preinstalled. Pair with the built-in claude agent so the extension inherits the sandbox's Anthropic credentials.

kind: mixin

# Layered onto the claude base agent (the bundled VS Code extension is Claude
# Code). Declares base-agent affinity instead of extends: as a mixin it already
# runs in the base agent's container and inherits its credentials at compose time.
#
# MIGRATION NOTE: v2's `requires: {agent: claude}` becomes a plain capability
# name. v3 has no "agent" slot — a requirement is a name the resolved set must
# provide, and the claude workload provides `claude`, so the constraint resolves
# exactly as it did.
requires: ["claude"]

# The code-server release this kit's overlay carries, by reference to the
# `version` arg below — SPEC-v3 §4 admits a build-phase arg reference here and
# expands it at publish, so the version is stated in exactly one place and the
# publish tag and `org.opencontainers.image.version` name the editor rather than
# a kit release number of their own.
version: "${{ kit.args.version }}"

# The code-server release the recipe installs, declared once: validated here,
# handed to the upstream install script, and expanded into `provides` and
# `version:` — so the kit cannot claim a release its overlay does not carry. The
# recipe asserts the agreement at build time by asking the installed binary.
#
# HOW THE DEFAULT WAS DETERMINED, and how to bump it: install.sh with no
# `--version` calls its own echo_latest_version(), which follows
# `https://github.com/coder/code-server/releases/latest` and strips the tag's
# leading `v`. This default is what that resolved to at the moment of pinning —
# 4.138.0 — so it is exactly what the unpinned recipe installed that day, not a
# jump to another channel. To bump, read the same redirect:
#
#     curl -fsSLI -o /dev/null -w '%{url_effective}\n' \
#       https://github.com/coder/code-server/releases/latest
#
# WHY PINNED, and the objection this answers: what stood here said a pin nobody
# verifies is worse than an honest float, which is true and is the reason the
# recipe now verifies. It runs `code-server --version` against the staged install
# and fails the build unless what the editor reports is what this arg says, so
# the provide describes the layer rather than asserting over it. Left floating,
# the unversioned provide took this descriptor's `version:` as its version at
# resolution and published `code-server@1.0.0` — the kit's own release number
# wearing the editor's name.
#
# The script's `--edge` channel is deliberately out of reach: this arg admits
# only a version, and the recipe passes nothing else.
args:
  version:
    default: "4.138.0"
    # The script's own `--version X.X.X`, tightened to the shape coder publishes
    # (it would accept any string and 404 on the release asset). Every value this
    # accepts is a legal provide version under SPEC-v3 §5.2, and the `v` the
    # release tag carries is deliberately not part of it — §5.2 admits no `v`
    # prefix, and the script strips it too.
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: code-server release to install
    buildArg: CODE_SERVER_VERSION

# Names the editor this overlay carries, at the release it carries. The
# preinstalled `anthropic.claude-code` extension is deliberately not part of the
# claim: it is resolved from open-vsx at build time and has no version of its own
# here, and this entry is about the editor.
provides: ["code-server@${{ kit.args.version }}"]

capabilities:
  # MIGRATION NOTE: v2's `ports[]` entry, one capability per port. `protocol:`
  # is spelled `transport:` in v3; `name` and `container` are unchanged. The
  # host side is still the runtime's to allocate — a kit cannot pin it — which
  # is why the README tells you to look the published port up.
  - type: com.docker.sandbox/port@1
    config:
      name: code-server
      container: 8080
      transport: tcp

  - type: com.docker.sandbox/network-policy@1
    config:
      # MIGRATION NOTE: v2's single flat list was first split by phase, and then
      # the install phase was deleted outright, because both install hooks that
      # reached a host moved into the recipe. The whole download surface — the
      # `code-server.dev` install script and the raw.githubusercontent.com
      # redirect it is served from, GitHub's release-resolution and asset hosts,
      # and open-vsx's extension CDN — is now contacted by the builder, which
      # this policy does not govern. Nothing the sandbox does at create time
      # talks to a network any more: the one surviving install hook writes a
      # wrapper script. An absent phase grants nothing, so the grant is not
      # narrowed here, it is gone.
      #
      # What is left is the one host group that was never install-only: the
      # extension marketplace stays open in steady state, because a user
      # browsing the Extensions view and installing something is the point of a
      # web IDE, and v2's flat list permitted it.
      runtime:
        allow:
          - open-vsx.org
          - openvsx.eclipsecontent.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # MIGRATION NOTE: two install hooks used to stand here — the upstream
        # `code-server.dev/install.sh` run and the `--install-extension
        # anthropic.claude-code` run — and both are in code-server.dockerfile
        # now. Neither needed anything from sandbox-create time: the editor is a
        # self-contained deb payload and the extension is an unpacked .vsix, so
        # both are ordinary content, and a v2 mixin only installed them from
        # hooks because it had no way to carry content at all. Moving them takes
        # a ~100 MB download and a ~235 MB download out of every sandbox create,
        # empties this kit's install-phase network grant (see above), and turns a
        # broken install into a failed publish rather than a failed sandbox.
        #
        # What is left below is the one install hook that is not content: it
        # reads a value that does not exist until the sandbox is created.
        #
        # MIGRATION NOTE: this was a v2 `setup.files` entry whose content
        # interpolated the runtime `${WORKDIR}`. A v3 `files[].content` expands
        # `${{ kit.args.* }}` and nothing else, so that reference would have
        # reached the script as literal text and code-server would have opened a
        # folder named `${WORKDIR}`. The file therefore becomes this install
        # hook, which declares `env: [WORKSPACE_DIR]` — v3's spelling of v2's
        # WORKDIR — and bakes the resolved path in, which is precisely what the
        # v2 entry's description claimed it did. Two consequences, both benign:
        # the hook runs once at create rather than on every start, which is the
        # same file either way because a sandbox's workspace is fixed at create;
        # and the path is single-quoted into the script, so a workspace path
        # containing a space, a quote or a `$` survives verbatim instead of
        # being re-split when the wrapper runs. v2's content carried no shebang
        # and worked only through the calling shell's ENOEXEC fallback, so one
        # is written here.
        #
        # Runs as the agent user, matching the v2 `files:` entry — lifecycle
        # files belong to the agent, and writing into its own home needs no
        # root and no chown.
        - command: |
            set -eu
            ws="${WORKSPACE_DIR:-/}"
            esc=$(printf '%s' "$ws" | sed "s/'/'\\\\''/g")
            mkdir -p /home/agent/.local/bin
            printf '%s\n' '#!/bin/sh' \
              "exec code-server --bind-addr 0.0.0.0:8080 --auth none '$esc'" \
              > /home/agent/.local/bin/start-code-server.sh
            chmod 0755 /home/agent/.local/bin/start-code-server.sh
          user: "1000"
          env: [WORKSPACE_DIR]
          description: Startup wrapper with the workspace path baked in at sandbox create
      startup:
        # MIGRATION NOTE: v2 backgrounded this itself with `nohup … &` inside
        # `sh -c`; v3 declares `background: true` and the engine detaches, so
        # the shell trick goes. The log redirect stays — the README points at
        # /tmp/code-server.log when the page does not load. Re-running on a
        # later boot is safe: the wrapper execs a fresh code-server, and a
        # previous one died with its container.
        - command: [sh, -c, "exec /home/agent/.local/bin/start-code-server.sh > /tmp/code-server.log 2>&1"]
          user: "1000"
          background: true
          description: Start code-server in the background, opened on the primary workspace

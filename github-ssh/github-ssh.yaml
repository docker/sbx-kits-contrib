# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: GitHub SSH
description: Pre-populates GitHub host keys so SSH operations work without interactive host verification prompts.

kind: mixin

# The kit's own version, not the version of anything it installs: it is the
# tag this kit publishes under, and the fallback that versions an unversioned
# provide at publish. Bump it when this kit's declarations change.
version: "1.0.0"

# What this kit needs from whatever it composes onto. Both names are derived
# rather than authored: publishing a workload reads its dpkg database and
# states one entry per installed package (SPEC-v3 §9.6), so a Debian-family
# base provides these by construction and a mixin may require them.
#
#   deb/jq             the install hook pipes api.github.com/meta through jq.
#                      §12's floor is bash, sh, curl, git and a CA store, so
#                      this was an unstated assumption the v2 hook inherited
#                      from its base image; it is stated now rather than
#                      quietly changed.
#   deb/openssh-client ~/.ssh/known_hosts is OpenSSH's file, at OpenSSH's path.
#                      Writing it on a base with no ssh client leaves the kit
#                      silently inert — the host keys are pinned and nothing
#                      ever reads them — which is worse than refusing to
#                      compose.
#
# Both unversioned: the kit uses jq's oldest surface (`-r` with a field
# selector) and writes a known_hosts format that has not moved, so a floor
# would bound nothing.
requires: ["deb/jq", "deb/openssh-client"]

capabilities:
  # MIGRATION NOTE: v2 declared one flat allow list (github.com,
  # api.github.com) that applied to the whole sandbox life. v3 scopes egress
  # by phase and an absent phase grants nothing, so the list is split by who
  # reaches each host. The install hook below is the only caller of
  # api.github.com — the /meta endpoint that publishes the host keys — and
  # github.com is reached by the SSH operations this kit exists to make
  # work, which is the agent's steady state. The union of the two phases is
  # the v2 list, so nothing became unreachable.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow: [api.github.com]
      runtime:
        allow: [github.com]

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # No `env:` list: the hook reads nothing outside v3's platform
        # baseline (PATH, HOME, …), so deny-by-default costs it nothing.
        # The `jq` it assumes is declared in `requires:` above rather than
        # left to the base, which is the one thing v2 had no way to say.
        - command: |
            mkdir -p /home/agent/.ssh
            chmod 700 /home/agent/.ssh
            chown agent:agent /home/agent/.ssh
            curl -s https://api.github.com/meta \
              | jq -r '.ssh_keys[] | "github.com " + .' \
              >> /home/agent/.ssh/known_hosts
            chmod 644 /home/agent/.ssh/known_hosts
            chown agent:agent /home/agent/.ssh/known_hosts
          user: "0"
          description: Fetch and install GitHub host keys from api.github.com/meta

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./github-ssh-context.md

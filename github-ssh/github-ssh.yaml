# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: GitHub SSH
description: Pre-populates GitHub host keys so SSH operations work without interactive host verification prompts.

kind: mixin

capabilities:
  # MIGRATION NOTE: v2 declared one flat allow list (github.com,
  # api.github.com) that applied to the whole sandbox life. v3 scopes egress
  # by phase and an absent phase grants nothing, so the list is split by who
  # reaches each host. The install hook below is the only caller of
  # api.github.com — the /meta endpoint that publishes the host keys — and
  # github.com is reached by the SSH operations this kit exists to make
  # work, which is the agent's steady state. The union of the two phases is
  # the v2 list, so nothing became unreachable.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow: [api.github.com]
      runtime:
        allow: [github.com]

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # No `env:` list: the hook reads nothing outside v3's platform
        # baseline (PATH, HOME, …), so deny-by-default costs it nothing.
        # It does assume `jq`, which is NOT part of v3's platform floor
        # (§12 promises bash, sh, curl, git and a CA store) — the same
        # assumption the v2 hook made about its base image, carried over
        # rather than quietly changed.
        - command: |
            mkdir -p /home/agent/.ssh
            chmod 700 /home/agent/.ssh
            chown agent:agent /home/agent/.ssh
            curl -s https://api.github.com/meta \
              | jq -r '.ssh_keys[] | "github.com " + .' \
              >> /home/agent/.ssh/known_hosts
            chmod 644 /home/agent/.ssh/known_hosts
            chown agent:agent /home/agent/.ssh/known_hosts
          user: "0"
          description: Fetch and install GitHub host keys from api.github.com/meta

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./github-ssh-context.md

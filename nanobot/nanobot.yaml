# syntax=docker/sandbox-kit:3
# Migration of the v2 nanobot kit (nanobot/spec.yaml). Every v2 stanza lands
# somewhere deliberate; the deltas are marked MIGRATION NOTE inline.
#
# MIGRATION NOTE: v2 pointed `sandbox.image` at a pre-baked
# docker.io/sbx/nanobot-image:latest and shipped the recipe that built it. A v3
# workload's layers ARE the image, so that indirection collapses: the recipe
# beside this file is the kit's content, found by the filename stem.
schemaVersion: "3"
displayName: Nanobot
description: Lightweight personal AI assistant with multi-platform chat and multi-provider LLM support
sourceUrl: https://pypi.org/project/nanobot-ai/

kind: workload

# MIGRATION NOTE: v2 declared no `version:`. One is added here because a kit
# publishes under something (SPEC-v3 §9.2), and what it publishes under is the
# nanobot the image carries: SPEC-v3 §4 allows this field to be a build-phase
# arg reference expanded at publish, so it names the `version` arg below — the
# same one the provide reads. A literal here would be a second version of the
# kit's own, competing with the pin; there is only the pin.
version: "${{ kit.args.version }}"

# nanobot's own version, pinned.
#
# HOW THIS VALUE WAS ESTABLISHED, and how to bump it: the package is
# `nanobot-ai` on PyPI (sourceUrl above), so the authority is PyPI's own JSON
# API — the same endpoint the recipe used to read at build time to install
# whatever was newest:
#
#   curl -fsS https://pypi.org/pypi/nanobot-ai/json \
#     | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])'
#
# That floating read is what this pin replaces. It made every rebuild a
# different agent with no record of which one, and left the provide with
# nothing honest to claim.
#
# The pattern admits PEP 440 `.postN` suffixes because upstream uses them
# (0.1.5.post1, .post2, .post3). They stay legal SPEC-v3 §5.2 versions: the
# first segment is numeric and later segments may be alphanumeric, so
# `nanobot@0.1.5.post1` parses. A release carrying an epoch (`1!2.0`) or a
# local version (`+local`) would not, and would need this pattern revisited.
args:
  version:
    default: "0.3.5"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$'
    description: nanobot-ai release to install from PyPI
    buildArg: NANOBOT_VERSION

# Versioned, so a kit asking for `nanobot >= 0.3` resolves against the version
# the image actually carries. The recipe installs exactly this version and then
# re-reads it out of the installed entry point.
provides: ["nanobot@${{ kit.args.version }}"]

capabilities:
  # This workload is an agent sandbox: the host launches the agent rather than
  # running the image's entrypoint as PID 1, and honors the identity the image
  # config declares instead of assuming one.
  - type: com.docker.sandbox/sbx@1

  # MIGRATION NOTE: v2's single flat allow list is entirely runtime here. The
  # kit's own bootstrap install moved to build time (see nanobot.dockerfile)
  # and this kit declares no install hooks, so nothing reaches the network
  # during the install phase and an absent `install:` block grants nothing.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Every domain the anthropic credential below injects into --
          # required here too, not just below: this repo's e2e runs every kit
          # under `sbx policy init deny-all`, so a domain absent from this list
          # is unreachable regardless of what the credential block declares.
          # v3 additionally validates the inject-within-allow invariant at
          # build time (SPEC-v3 §11).
          - api.anthropic.com
          - claude.ai
          - console.anthropic.com
          # Runtime, not install-time: nanobot's built-in `cli_apps` tool
          # (agent/tools/cli_apps.py, enabled by default, not disabled by this
          # kit's config) pip-installs further packages at the agent's own
          # request, so these stay reachable while the agent runs.
          - pypi.org
          - files.pythonhosted.org
          - '*.telegram.org'
          - '*.discord.com'
          - gateway.discord.gg
          - '*.whatsapp.com'
          - '*.whatsapp.net'
          - '*.slack.com'
          - '*.feishu.cn'

  - type: com.docker.sandbox/credential@1
    # MIGRATION NOTE: `optional: true` preserves v2 behavior. v2 credentials
    # default to not-required; the v3 default inverts, so an entry that does
    # not opt out would fail `sbx create` on a host with no Anthropic binding
    # -- which nanobot tolerates today.
    optional: true
    description: Anthropic API access
    config:
      service: anthropic
      phase: runtime
      # API key only, no oauth block: nanobot's Anthropic provider
      # (nanobot/providers/anthropic_provider.py) passes the configured
      # api_key straight into the official SDK client, which sends it as
      # x-api-key with no shape detection -- so a subscription (OAuth) token,
      # which Anthropic only accepts as a Bearer, cannot be presented
      # correctly. Declaring oauth here would promise a path that 401s.
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: '%s'}
          - {domain: claude.ai, header: x-api-key, format: '%s'}
          - {domain: console.anthropic.com, header: x-api-key, format: '%s'}

  # Recorded working non-interactive invocation, carried over from the v2 TCK
  # harness (testdata/tck.yaml: `promptArgs: ["-m"]`). The entry is an argv
  # tail appended to the entrypoint's launch command, so a host drives
  # `nanobot agent --config … -m <prompt>`.
  - type: com.docker.sandbox/agent-sessions@1
    description: Run one nanobot prompt non-interactively
    config:
      prompt: ["-m", "{{.Prompt}}"]

  # MIGRATION NOTE: v2's agentInstructions declared a profile filename and no
  # body, so there is nothing to stage and no `contentFile:` here -- the
  # filename alone is the declaration, and it is what tells the host which
  # profile file this agent reads.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md

schemaVersion: "2"
kind: sandbox
name: nanobot
displayName: Nanobot
description: Lightweight personal AI assistant with multi-platform chat and multi-provider LLM support
sandbox:
  image: docker/sandbox-templates:shell-docker
  entrypoint:
    - nanobot
    - agent
    - --config
    - /home/agent/.nanobot/config.json
agentInstructions:
  filename: AGENTS.md
permissions:
  network:
    allow:
      # Every domain the anthropic credential below injects into -- required
      # here too, not just below: this repo's e2e runs every kit under
      # `sbx policy init deny-all`, so a domain absent from this list is
      # unreachable regardless of what the credential block declares.
      - api.anthropic.com
      - claude.ai
      - console.anthropic.com
      - pypi.org
      - files.pythonhosted.org
      - '*.telegram.org'
      - '*.discord.com'
      - gateway.discord.gg
      - '*.whatsapp.com'
      - '*.whatsapp.net'
      - '*.slack.com'
      - '*.feishu.cn'
credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: '%s'
        - domain: claude.ai
          header: x-api-key
          format: '%s'
        - domain: console.anthropic.com
          header: x-api-key
          format: '%s'
environment:
  variables:
    NANOBOT_AGENTS__DEFAULTS__WORKSPACE: /home/agent/nanobot
setup:
  install:
    - command: pip install --break-system-packages nanobot-ai
      user: "1000"
      description: Install nanobot

schemaVersion: "2"
kind: sandbox
name: nanobot
displayName: Nanobot
description: Lightweight personal AI assistant with multi-platform chat and multi-provider LLM support
sandbox:
  # Pre-baked image: nanobot-ai at the latest upstream PyPI release, on the
  # plain shell template -- nanobot-ai's dependency tree has no Docker
  # dependency (checked against upstream's pyproject.toml), so the
  # shell-docker variant this kit used to boot from was carrying an engine
  # it never used. Built and published by build-and-publish-kits.yml, the
  # shared kit-image pipeline (see ../PUBLISHING.md) -- no bespoke workflow
  # needed, same as hermes-agent/pi/openclaw/kiro/copilot. Sandbox creation
  # only pulls the image; the pipeline's nightly rebuild keeps nanobot
  # current (rolling updates, no deliberate version bump -- see the
  # Dockerfile).
  image: docker.io/sbx/nanobot-image:latest
  entrypoint:
    - nanobot
    - agent
    - --config
    - /home/agent/.nanobot/config.json
agentInstructions:
  filename: AGENTS.md
permissions:
  network:
    allow:
      # Every domain the anthropic credential below injects into -- required
      # here too, not just below: this repo's e2e runs every kit under
      # `sbx policy init deny-all`, so a domain absent from this list is
      # unreachable regardless of what the credential block declares.
      - api.anthropic.com
      - claude.ai
      - console.anthropic.com
      # Not install-time-only: the kit's own bootstrap install moved to build
      # time (see Dockerfile), but nanobot's built-in `cli_apps` tool
      # (agent/tools/cli_apps.py, enabled by default, not disabled by this
      # kit's config) pip-installs further packages at the agent's own
      # request, so these stay reachable at runtime.
      - pypi.org
      - files.pythonhosted.org
      - '*.telegram.org'
      - '*.discord.com'
      - gateway.discord.gg
      - '*.whatsapp.com'
      - '*.whatsapp.net'
      - '*.slack.com'
      - '*.feishu.cn'
credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: '%s'
        - domain: claude.ai
          header: x-api-key
          format: '%s'
        - domain: console.anthropic.com
          header: x-api-key
          format: '%s'
environment:
  variables:
    NANOBOT_AGENTS__DEFAULTS__WORKSPACE: /home/agent/nanobot

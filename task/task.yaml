# syntax=docker/sandbox-kit:3
# The Task CLI as a declaration-only MIXIN. The v2 kit shipped no Dockerfile —
# it curled a pinned release tarball in a setup hook — and v3 lets a mixin have
# no recipe at all, so the descriptor is the whole kit.
schemaVersion: "3"
displayName: Task
description: Installs the Task CLI so sandbox agents can run Taskfiles.

kind: mixin

# The install hook pins v3.50.0 and verifies the tarball against a per-arch
# SHA256, so this version is a fact about what the kit installs. To bump: edit
# the hook's version and both digests, this entry and the README together.
provides: ["task@3.50.0"]

capabilities:
  # MIGRATION NOTE: v2's one flat allow list becomes an install phase only —
  # these three hosts exist for the one-shot release download in the hook below.
  # An absent runtime phase grants nothing, which narrows what the agent can
  # reach: running a Taskfile needs no egress, and v2 declared no runtime intent
  # for these hosts. A Taskfile with remote `includes:` would need them added
  # back under `runtime`.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - github.com
          # Confirmed by hand: github.com's release-download redirect target.
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # MIGRATION NOTE: the body reads no variable — every name in it is set
        # by the script itself — but curl takes the proxy from the environment,
        # and v2's unrestricted hook environment handed it over. Under v3's
        # deny-by-default hook env it has to be declared or the download fails
        # behind the sandbox's forced proxy.
        - command: |
            set -euo pipefail
            TASK_VERSION=3.50.0
            ARCH=$(dpkg --print-architecture)
            case "$ARCH" in
              amd64)
                TARBALL="task_linux_amd64.tar.gz"
                SHA256="d449ba85ab85a0769989d78f8b9872938e4ba9347f7f4f925f73d98272a0a655"
                ;;
              arm64)
                TARBALL="task_linux_arm64.tar.gz"
                SHA256="ee67e7d999a4a70711bff1946c70bf76628012c91d9be55626ee90ba976897da"
                ;;
              *)
                echo "unsupported sandbox arch: $ARCH (expected amd64 or arm64)" >&2
                exit 1
                ;;
            esac
            URL="https://github.com/go-task/task/releases/download/v${TASK_VERSION}/${TARBALL}"
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/task.tgz "$URL"
            echo "${SHA256}  /tmp/task.tgz" | sha256sum -c -
            tar -C /usr/local/bin -xzf /tmp/task.tgz task
            rm /tmp/task.tgz
            task --version
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: Install Task CLI v3.50.0, version+digest pinned

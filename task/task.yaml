# syntax=docker/sandbox-kit:3
# The Task CLI as a MIXIN with an overlay.
#
# MIGRATION NOTE: the v2 kit shipped no Dockerfile because a v2 mixin had no
# content mechanism — a `setup.install` hook curling a pinned release tarball
# was the only way for one to install anything — and the first v3 cut carried
# that hook across as written. v3 lets a mixin carry an overlay, so the hook is
# now task.dockerfile's build: the same version, the same two digests, the same
# extraction, at build time instead of at every sandbox create.
schemaVersion: "3"
displayName: Task
description: Installs the Task CLI so sandbox agents can run Taskfiles.

kind: mixin

# The recipe pins v3.50.0, verifies the tarball against a per-arch SHA256 and
# then checks that the extracted binary reports that same version, so this
# number is a fact about the published layer rather than a request. To bump:
# edit TASK_VERSION and both digests in task.dockerfile, this entry and the
# README together.
provides: ["task@3.50.0"]

# MIGRATION NOTE: `requires: ["deb/dpkg"]` is gone, and the move is what
# removed it. It was there for one reason — the install hook chose its release
# tarball by `dpkg --print-architecture` under `set -euo pipefail`, so a base
# without dpkg failed sandbox creation at that line. The recipe asks buildx for
# TARGETARCH instead, which is answered at build by the builder, so the kit no
# longer needs anything of the composed base: task is one static Go binary.
# Leaving the requirement behind would have been the worse kind of stale —
# `requires` is a closed-set check, so it would refuse to compose on bases the
# kit now works on perfectly well.

# MIGRATION NOTE: no capabilities at all, and that is the whole point of the
# move rather than an omission.
#
# v2's flat allow list became an install phase holding github.com,
# objects.githubusercontent.com and release-assets.githubusercontent.com. Those
# three hosts existed only so the install hook could fetch the release tarball,
# and the builder fetches it now — a policy that governs sandboxes does not
# govern the builder. With the hook gone there is no installer left for an
# install phase to serve, so the grant is deleted rather than narrowed.
#
# There is no `runtime` phase either, and there never was: running a Taskfile
# needs no egress, and an absent phase grants nothing. A Taskfile with remote
# `includes:` would need those hosts added back under `runtime` — which is a
# different grant from the one just removed, for a different reason.
#
# Nothing had to stay a hook. There is no apt step here, nothing reads a
# create-time value, nothing needs the in-sandbox Docker daemon, nothing lands
# in a declared volume or an agent-skills path the host mounts over, and
# nothing merges into a file the composed base also writes — so unlike the
# partial moves elsewhere in this repo, this kit empties instead of narrowing,
# and declares no lifecycle capability.

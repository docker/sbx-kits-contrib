# syntax=docker/sandbox-kit:3
# Docker Sandboxes kit: install LangChain + LangGraph in an isolated Python
# venv, with proxy-mediated auth for the model providers LangChain itself
# supports first-class (its own `init_chat_model` provider list). Usage/design
# notes: see README.md.
#
# MIGRATION NOTE: migrated from the v2 `spec.yaml` grammar. `setup.install`
# stays a lifecycle install hook: the first step unconditionally calls
# `apt-get`, which needs the composed base's real dpkg database and keyring,
# not an overlay's. The two static `environment.variables` entries moved
# into `langchain.dockerfile`'s ENV (see that file's header); the third v2
# install step's `~/.bashrc` export lines for those same two vars are dropped
# as redundant now that ENV covers every process -- only the `langchain-python`
# alias (a human-interactive-shell convenience, not something the agent
# itself needs) is kept.
schemaVersion: "3"
kind: mixin
displayName: LangChain / LangGraph
description: "Installs LangChain and LangGraph in an isolated Python virtual environment, so an agent can build and run graph-based LLM workflows inside the sandbox. Proxy-mediated auth for the model providers LangChain's init_chat_model supports: set any of the provider API keys on the host and the sbx proxy injects them on outbound requests to the matching provider -- no key ever lives in the sandbox."
sourceUrl: https://github.com/langchain-ai/langchain
version: "1.0.0"
licenses:
  - Apache-2.0

# Both versions are pinned pip installs -- state them as provides and make
# the hook itself enforce the pins (below), rather than asserting versions
# the content may not have.
provides: ["langchain@0.3.27", "langgraph@0.6.8"]

# Unconditional `apt-get install python3-venv`, so the base must actually be
# Debian-derived; the platform floor (bash, sh, curl, git, a CA store, the
# agent user) does not guarantee apt on its own.
requires: ["deb/apt"]

dockerfile: ./langchain.dockerfile

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          # pip install path for langchain/langgraph and their dependencies.
          - "pypi.org:443"
          - "files.pythonhosted.org:443"
          # `apt-get update` refreshes every configured apt source from the base
          # template. Keep all template sources allowed for amd64 and arm64.
          # MIGRATION NOTE: portless, not the v2 kit's pinned `:80` -- a
          # package-mirror entry answering over HTTPS would otherwise break
          # apt wholesale (FIELD-MAPPING.md's network-policy@1 section).
          - archive.ubuntu.com
          - security.ubuntu.com
          - ports.ubuntu.com
          - "download.docker.com:443"
      runtime:
        allow:
          # Exactly the provider hosts the credentials block below injects into.
          # A credential's inject domain is not allowed implicitly -- see README,
          # "How auth works" -- and e2e runs every kit under deny-all.
          - "api.anthropic.com:443"
          - "api.openai.com:443"
          - "generativelanguage.googleapis.com:443"
          - "api.mistral.ai:443"
          - "api.groq.com:443"
          - "api.cohere.com:443"
          - "api.deepseek.com:443"
          - "api.fireworks.ai:443"
          - "openrouter.ai:443"

  # One entry per provider LangChain's init_chat_model names first-class.
  # Every apiKey below is a proxy-managed placeholder -- the sandbox never
  # sees the real key, only a sentinel the proxy swaps out on the wire for
  # the matching domain. All optional, since a user only sets the providers
  # they actually use -- same shape as the crush kit's credential list in
  # this repo. v2 never set `required: true` on any of these, so each opts
  # out of v3's default-required behavior.
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - domain: api.anthropic.com
            header: x-api-key
            format: "%s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - domain: api.openai.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: google
      phase: runtime
      apiKey:
        name: GOOGLE_API_KEY
        proxyManaged: true
        inject:
          - domain: generativelanguage.googleapis.com
            header: x-goog-api-key
            format: "%s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: mistral
      phase: runtime
      apiKey:
        name: MISTRAL_API_KEY
        proxyManaged: true
        inject:
          - domain: api.mistral.ai
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: groq
      phase: runtime
      apiKey:
        name: GROQ_API_KEY
        proxyManaged: true
        inject:
          - domain: api.groq.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: cohere
      phase: runtime
      apiKey:
        name: COHERE_API_KEY
        proxyManaged: true
        inject:
          - domain: api.cohere.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: deepseek
      phase: runtime
      apiKey:
        name: DEEPSEEK_API_KEY
        proxyManaged: true
        inject:
          - domain: api.deepseek.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: fireworks
      phase: runtime
      apiKey:
        name: FIREWORKS_API_KEY
        proxyManaged: true
        inject:
          - domain: api.fireworks.ai
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: openrouter
      phase: runtime
      apiKey:
        name: OPENROUTER_API_KEY
        proxyManaged: true
        inject:
          - domain: openrouter.ai
            header: Authorization
            format: "Bearer %s"

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: apt-get update && apt-get install -y --no-install-recommends ca-certificates python3 python3-venv python3-pip && rm -rf /var/lib/apt/lists/*
          user: "0"
          description: Install Python and venv prerequisites
        - command: |
            set -euo pipefail
            LANGCHAIN_VERSION=0.3.27
            LANGGRAPH_VERSION=0.6.8
            python3 -m venv /opt/langchain
            /opt/langchain/bin/python -m pip install --upgrade pip setuptools wheel
            /opt/langchain/bin/python -m pip install \
              "langchain==${LANGCHAIN_VERSION}" \
              "langgraph==${LANGGRAPH_VERSION}" \
              langchain-anthropic langchain-openai langchain-google-genai \
              langchain-mistralai langchain-groq langchain-cohere langchain-fireworks
            # importlib.metadata, not module.__version__: langgraph doesn't set
            # the latter on its top-level package, so a direct attribute read
            # fails even on a correct install. Fail loudly on drift from the pin
            # rather than asserting a version the content may not have.
            /opt/langchain/bin/python -c "
            from importlib.metadata import version
            installed = {'langchain': version('langchain'), 'langgraph': version('langgraph')}
            expected = {'langchain': '${LANGCHAIN_VERSION}', 'langgraph': '${LANGGRAPH_VERSION}'}
            for name, want in expected.items():
                got = installed[name]
                print(name, got)
                assert got == want, f'{name}: expected {want}, pip installed {got}'
            "
          user: "0"
          description: Install LangChain/LangGraph and provider integration packages in /opt/langchain, failing if the installed versions drift from the pins
        - command: |
            set -euo pipefail
            grep -qF 'langchain-python' ~/.bashrc 2>/dev/null || \
              printf '\n# langchain (added by sbx-kits-contrib/langchain)\nalias langchain-python=/opt/langchain/bin/python\n' >> ~/.bashrc
          user: "1000"
          description: Add the langchain-python interactive-shell alias (LANGCHAIN_PYTHON/LANGCHAIN_VENV already reach every process via the recipe's ENV)
      files:
        - path: /home/agent/runbooks/hello_graph.py
          mode: "0755"
          description: "Minimal two-node LangGraph app using init_chat_model, so a reviewer/user can smoke-test the kit end to end against whichever provider key they've set."
          content: |
            #!/usr/bin/env python3
            """Minimal two-node LangGraph app.

            Usage: hello_graph.py "your prompt" [provider:model]
            Defaults to anthropic:claude-3-5-haiku-latest.
            """
            import sys
            from typing import TypedDict

            from langchain.chat_models import init_chat_model
            from langgraph.graph import StateGraph, START, END


            class State(TypedDict):
                input: str
                output: str


            def main() -> int:
                if len(sys.argv) < 2:
                    print(__doc__)
                    return 1
                prompt = sys.argv[1]
                model_name = sys.argv[2] if len(sys.argv) > 2 else "anthropic:claude-3-5-haiku-latest"

                model = init_chat_model(model_name)

                def call_model(state: State) -> State:
                    response = model.invoke(state["input"])
                    return {"output": response.content}

                graph = StateGraph(State)
                graph.add_node("call_model", call_model)
                graph.add_edge(START, "call_model")
                graph.add_edge("call_model", END)
                app = graph.compile()

                result = app.invoke({"input": prompt, "output": ""})
                print(result["output"])
                return 0


            if __name__ == "__main__":
                raise SystemExit(main())

  # Accept one context version through runtime policy, or skip both.
  # Accepting both conflicts; optionality does not express alternatives.
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &agent-context
      content: |
        ## LangChain / LangGraph

        LangChain and LangGraph are installed in an isolated venv at
        `$LANGCHAIN_VENV` (`langchain`, `langgraph`, plus the `langchain-<provider>`
        integration package for every provider listed below). Run scripts with
        `$LANGCHAIN_PYTHON` or the `langchain-python` shell alias.

        Set any of these on the host and the sbx proxy injects it on outbound
        requests to the matching provider -- no key ever lives in the sandbox:
        `ANTHROPIC_API_KEY`, `OPENAI_API_KEY`, `GOOGLE_API_KEY`, `MISTRAL_API_KEY`,
        `GROQ_API_KEY`, `COHERE_API_KEY`, `DEEPSEEK_API_KEY`, `FIREWORKS_API_KEY`,
        `OPENROUTER_API_KEY`. These are exactly the providers LangChain's own
        `init_chat_model("<provider>:<model>")` helper resolves by name, so a
        script can switch providers with a one-line string change.

        `~/runbooks/hello_graph.py` is a minimal two-node LangGraph app
        (`langgraph`'s `StateGraph`) you can run or copy as a starting point:
        `python3 ~/runbooks/hello_graph.py "your prompt here"`.

  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *agent-context

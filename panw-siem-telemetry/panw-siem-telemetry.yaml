# syntax=docker/sandbox-kit:3
#
# Docker Sandboxes kit: PANW SIEM telemetry forwarder (v3).
# Usage, prerequisites and design notes: see README.md in this directory.
#
# This is a MIXIN: it carries no ENTRYPOINT and does not launch an agent. It
# layers onto any base agent workload and runs a background Fluent Bit forwarder
# that ships sandbox observability to a SIEM HTTP event collector. The Fluent
# Bit config (sandbox-telemetry.conf, parsers.conf, run-telemetry.sh) ships as
# overlay content in panw-siem-telemetry.dockerfile; the Fluent Bit install
# stays a create-time lifecycle hook (see the lifecycle capability for why).
schemaVersion: "3"
kind: mixin
displayName: PANW SIEM Telemetry Forwarder
description: >-
  Ships sandbox observability (process, network, file, and agent-activity logs)
  to a SIEM HTTP event collector for dashboards, correlation, and automated
  response. Closes the visibility gap for what runs inside the sandbox.
version: "0.1.0"
sourceUrl: https://github.com/docker/sbx-kits-contrib
licenses: [Apache-2.0]

# All three collector settings resolve at BUILD (buildArg), not create:
# siemCollectorHost is referenced in the network-policy capability below, which
# lives in the descriptor and must be resolved before the kit composes; and all
# three are rendered into the baked Fluent Bit config files at build (see the
# recipe). Overriding any with --kit-arg rebuilds the source kit with the new
# value. The sed render in the recipe replaces only the `${{ kit.args.* }}`
# placeholders, leaving runtime `${VAR}` shell/Fluent Bit vars untouched.
args:
  siemCollectorHost:
    default: "siem-collector.example.com"
    description: "SIEM HTTP event collector ingestion host (FQDN, no scheme). Defaults to a placeholder; set it to your collector or telemetry has nowhere to ship."
    pattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'
    buildArg: SIEM_COLLECTOR_HOST
  siemCollectorPath:
    default: "/logs/v1/event"
    description: "HTTP path on the collector to POST events to."
    pattern: '^/[A-Za-z0-9._~/-]*$'
    buildArg: SIEM_COLLECTOR_PATH
  siemCollectorAuthId:
    default: ""
    description: >-
      Cortex XSIAM HTTP Collector API key ID (numeric, non-secret), sent as the
      x-xdr-auth-id header alongside the Authorization token. XSIAM requires both;
      leave empty for collectors that authenticate with the Authorization header alone.
    pattern: '^[0-9]*$'
    buildArg: SIEM_COLLECTOR_AUTH_ID

# The collector token is supplied out-of-band with `sbx secret set-custom`
# (host = siemCollectorHost, env = SIEM_COLLECTOR_TOKEN). The sandbox sees only
# a placeholder; the proxy swaps it for the real token on requests to the
# collector, so no kit-declared credential@1 is needed. See README.md.

capabilities:
  # MIGRATION NOTE: v2 had one flat permissions.network.allow list. v3 is
  # phase-scoped. The split below loses no host from the v2 list:
  #   - install.allow: the package/build hosts reached by the install hook
  #     (install.sh + apt repo on the prebuilt path; the release tarball + apt
  #     build deps on the source path; apt mirror refresh on both).
  #   - runtime.allow: the collector host, reached continuously by the
  #     background forwarder (a startup hook runs in the runtime phase).
  # Entries are kept portless exactly as v2 wrote them: a portless pattern
  # matches any port, which the apt mirrors need and the rest tolerate.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          # Prebuilt-package path (4KB-page hosts): installer script + apt repo.
          - raw.githubusercontent.com
          - packages.fluentbit.io
          # Source-build path (16KB-page hosts): release tarball (github.com
          # redirects archive downloads to codeload.github.com).
          - github.com
          - codeload.github.com
          # apt (build deps on the source path; repo refresh on both). List all
          # three ubuntu mirrors so the kit works on amd64 CI and arm64 alike;
          # download.docker.com and cli.github.com are on the template's apt
          # sources and are refreshed by every apt-get update.
          - archive.ubuntu.com
          - security.ubuntu.com
          - ports.ubuntu.com
          - download.docker.com
          - cli.github.com
      runtime:
        allow:
          # Collector ingestion endpoint (token injected by the proxy).
          - "${{ kit.args.siemCollectorHost }}"

  # Fluent Bit install. This STAYS a create-time hook rather than becoming a
  # layer for two independent reasons, either of which is sufficient:
  #
  #   1. It branches on the RUNTIME memory page size (`getconf PAGESIZE`), which
  #      is a create-time value: the sandbox microVM on Apple Silicon runs
  #      16KB pages, where Fluent Bit's prebuilt jemalloc aborts with
  #      "Unsupported system page size". Baking at build would freeze in the
  #      builder's page size, not the microVM's - reintroducing the exact crash
  #      this kit works around.
  #   2. The source-build path runs apt-get IN A MIXIN, and an overlay cannot
  #      carry a package's shared-library closure or its dpkg state.
  #
  # Both install hosts therefore keep their install-phase network grant above.
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # The tail input reads /var/log/sandbox/*.log; create the directory (as
        # root, world-readable) so the forwarder - running as uid 1000 - can
        # scan it even when this template does not pre-create it. Without this,
        # Fluent Bit logs a "read error, check permissions" every refresh.
        - command: mkdir -p /var/log/sandbox && chmod 0755 /var/log/sandbox
          description: Ensure the host-side sandbox log directory exists for the forwarder to tail
        # Fluent Bit's prebuilt package bundles a jemalloc compiled for 4KB
        # memory pages; it aborts on 16KB-page hosts (the sandbox microVM on
        # Apple Silicon) with "Unsupported system page size". So install by page
        # size, not by arch:
        #   - 4096-byte pages (all amd64, and 4KB-page arm64): use the fast
        #     prebuilt package, then verify it actually runs - if not, fall
        #     through to source.
        #   - otherwise (16KB-page arm64): build from source with
        #     FLB_JEMALLOC=Off so the binary uses libc malloc and runs on both
        #     4KB and 16KB pages.
        # Both paths install to /opt/fluent-bit/bin (not on PATH), so the guard
        # and the startup command reference that absolute path too - otherwise
        # the install would re-run on every container start.
        #
        # MIGRATION NOTE: hook environments are deny-by-default in v3. This hook
        # shells out to curl, install.sh and apt-get, all of which fetch through
        # the sandbox's forced proxy, so HTTP_PROXY/HTTPS_PROXY must be declared
        # - v2's unrestricted hook environment handed these over silently.
        - command: >-
            if command -v fluent-bit >/dev/null 2>&1 || [ -x /opt/fluent-bit/bin/fluent-bit ]; then exit 0; fi;
            if [ "$(getconf PAGESIZE)" = "4096" ]; then
            curl -fsSL https://raw.githubusercontent.com/fluent/fluent-bit/master/install.sh | sh || true;
            /opt/fluent-bit/bin/fluent-bit --version >/dev/null 2>&1 && exit 0;
            fi;
            set -e;
            apt-get update -qq;
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential cmake flex bison libssl-dev libyaml-dev pkg-config ca-certificates curl;
            curl -fsSL https://github.com/fluent/fluent-bit/archive/refs/tags/v5.1.2.tar.gz -o /tmp/fluent-bit-src.tar.gz;
            mkdir -p /tmp/fluent-bit-src;
            tar xzf /tmp/fluent-bit-src.tar.gz -C /tmp/fluent-bit-src --strip-components=1;
            cmake -S /tmp/fluent-bit-src -B /tmp/fluent-bit-build -DFLB_JEMALLOC=Off -DFLB_RELEASE=On -DFLB_EXAMPLES=Off -DFLB_TESTS_INTERNAL=Off -DFLB_TESTS_RUNTIME=Off -DCMAKE_INSTALL_PREFIX=/opt/fluent-bit;
            cmake --build /tmp/fluent-bit-build -j"$(nproc)";
            cmake --install /tmp/fluent-bit-build;
            rm -rf /tmp/fluent-bit-src /tmp/fluent-bit-src.tar.gz /tmp/fluent-bit-build
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: Install Fluent Bit - prebuilt on 4KB-page hosts, source build (jemalloc off) on 16KB-page hosts
      startup:
        # run-telemetry.sh copies the base conf, appends the Authorization /
        # x-xdr-auth-id headers only when their values are non-empty (Fluent Bit
        # renders an empty header value as `Key: Key`), then execs fluent-bit.
        #
        # MIGRATION NOTE: env is deny-by-default. The forwarder reads
        # SIEM_COLLECTOR_TOKEN (the proxy-managed placeholder set by
        # `sbx secret set-custom`) and ships over HTTPS through the forced proxy,
        # which both injects the real token for the collector host and enforces
        # egress - so HTTP_PROXY/HTTPS_PROXY are declared too. v2's unrestricted
        # hook environment handed all three over silently. HOSTNAME, read by the
        # conf's record_modifier, is a platform baseline var and needs no entry.
        - command: ["sh", "/home/agent/.config/fluent-bit/run-telemetry.sh"]
          user: "1000"
          background: true
          env: [SIEM_COLLECTOR_TOKEN, HTTP_PROXY, HTTPS_PROXY]
          description: Forward sandbox telemetry to the SIEM collector

  # Agent instructions. A mixin carries contentFile only (no filename:/directory:
  # - those belong to the workload that owns the environment). The body
  # interpolates no args, so a staged contentFile is correct.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./panw-siem-telemetry-context.md

# syntax=docker/sandbox-kit:3
# Nanobot as a MIXIN: the same declarations as the standalone workload kit
# (../nanobot), minus what only the kit that owns the environment can carry --
# the entrypoint (the base workload's launch command stays; run `nanobot` from
# the shell), the context-file profile (`filename` is workload-only, so this
# kit contributes `contentFile` alone), agent-sessions (the verbs drive the
# workload's entrypoint, which here is the base's shell) and sbx@1 (a mixin's
# image config never becomes the composed image's).
schemaVersion: "3"
displayName: Nanobot (mixin)
description: >-
  nanobot as a mixin -- the agent's own uv tool installation in an overlay,
  with the proxy-managed Anthropic credential, the chat-platform egress and
  the preconfigured provider config. Layer it onto a shell base and run
  `nanobot`.
sourceUrl: https://pypi.org/project/nanobot-ai/

kind: mixin

# The nanobot release the overlay carries, by reference: SPEC-v3 §4 allows
# this field to be a build-phase arg reference expanded at publish, so it
# names the same `version` arg the provide reads. Holding this kit level with
# ../nanobot is still a manual job — there is just one value per file to keep
# level now, instead of one that tracks upstream and one that does not.
version: "${{ kit.args.version }}"

# nanobot's own version, pinned -- the same release the workload pins, because
# a workload and its mixin that installed different nanobots would be two kits
# wearing one name. Keep them in step when bumping; nothing enforces it across
# directories, since a kit's build context is its own.
#
# HOW THIS VALUE WAS ESTABLISHED, and how to bump it: the package is
# `nanobot-ai` on PyPI (sourceUrl above), and the authority is PyPI's JSON API
# — the same endpoint the recipe used to read at build time to install whatever
# was newest, which is the floating behavior this pin replaces:
#
#   curl -fsS https://pypi.org/pypi/nanobot-ai/json \
#     | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])'
#
# The pattern admits PEP 440 `.postN` suffixes because upstream uses them
# (0.1.5.post1); they remain legal SPEC-v3 §5.2 versions. See ../nanobot.
args:
  version:
    default: "0.3.5"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$'
    description: nanobot-ai release to install from PyPI
    buildArg: NANOBOT_VERSION

# Versioned, so a kit asking for `nanobot >= 0.3` resolves against the version
# the overlay actually carries. The recipe installs exactly this version and
# re-reads it out of the installed entry point before copying anything out.
provides: ["nanobot@${{ kit.args.version }}"]

capabilities:
  # The agent's own egress rides with the kit that ships the agent: the base
  # grants nothing for services it does not carry. Runtime-only for the same
  # reason as the workload -- the install happens at build, and this kit
  # declares no install hooks.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Every domain the anthropic credential below injects into; v3
          # validates that invariant at build time (SPEC-v3 §11).
          - api.anthropic.com
          - claude.ai
          - console.anthropic.com
          # nanobot's built-in `cli_apps` tool pip-installs further packages
          # at the agent's own request and is enabled by default, so PyPI is
          # a runtime need rather than an install-time one.
          - pypi.org
          - files.pythonhosted.org
          - '*.telegram.org'
          - '*.discord.com'
          - gateway.discord.gg
          - '*.whatsapp.com'
          - '*.whatsapp.net'
          - '*.slack.com'
          - '*.feishu.cn'

  - type: com.docker.sandbox/credential@1
    # Optional, matching the workload: nanobot is usable with nothing bound,
    # so a required entry would fail create on a working configuration.
    optional: true
    description: Anthropic API access
    config:
      service: anthropic
      phase: runtime
      # API key only, no oauth block: nanobot passes the configured api_key
      # straight into the official Anthropic SDK client, which sends it as
      # x-api-key with no shape detection, so a subscription (OAuth) token
      # cannot be presented correctly.
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: '%s'}
          - {domain: claude.ai, header: x-api-key, format: '%s'}
          - {domain: console.anthropic.com, header: x-api-key, format: '%s'}

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./nanobot-mixin-context.md

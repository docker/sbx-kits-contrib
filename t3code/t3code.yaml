# syntax=docker/sandbox-kit:3
# T3 Code's sandbox prerequisites as a declaration-only MIXIN. T3 Code installs
# its own server on first connection, so the kit carries no content: it
# installs the one shared library that server links against, allows the
# egress its download takes, and exposes the telemetry switch. A v3 mixin may
# have no recipe (SPEC-v3 §3.5); the published image is then the staged
# descriptor alone (§10).
schemaVersion: "3"
displayName: T3 Code
description: >-
  Prepares a sandbox for T3 Code's SSH integration, which downloads the exact
  t3 release matching the connecting app on first connection. Installs the
  shared library those binaries need and allows the egress the download takes.

kind: mixin

# The kit's own version, not the version of anything it installs: it is the
# tag this kit publishes under. Bump it when this kit's declarations change.
# 2.0.0 because the contract changed: earlier releases were tagged with the
# version of the `t3` npm package their overlay carried (last 0.0.45) and
# provided `t3@<version>`; this one carries no `t3` and provides nothing.
version: "2.0.0"

# No `provides`. T3 Code never looks for a `t3` on PATH, so there is no tool in
# this kit for another kit to require, and the server's version is chosen by
# whichever app connects rather than by this kit.

args:
  # The sandbox proxy does not allow the telemetry host by default, so leaving
  # telemetry on only produces retries. v3 has no static env grammar, so the
  # variable the t3 server reads at startup rides on this create-phase arg's
  # `env:` (SPEC-v3 §6), which exports it into the sandbox's environment.
  telemetry:
    default: "false"
    enum: ["true", "false"]
    description: "Whether the t3 server inside the sandbox sends anonymous usage telemetry. Off by default: the sandbox proxy blocks the telemetry host unless it is allowed, and a server that cannot reach it keeps retrying. Set to true to opt in, and allow us.i.posthog.com:443 in the sandbox's network policy."
    env: T3CODE_TELEMETRY_ENABLED

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          # libatomic1, on a base image that does not already have it. apt-get
          # update refreshes every configured source, so all of them must be
          # reachable: amd64 uses archive/security, arm64 uses
          # ports.ubuntu.com, and download.docker.com is pre-added on the
          # *-docker templates.
          - archive.ubuntu.com
          - security.ubuntu.com
          - ports.ubuntu.com
          - download.docker.com
      runtime:
        allow:
          # T3 Code's remote bootstrap fetches the release archive and its
          # checksums from GitHub releases when the app first connects, which
          # is the agent's steady state rather than the install phase. The
          # asset download redirects to objects.githubusercontent.com.
          - github.com
          - objects.githubusercontent.com

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # No `env:`: the body reads nothing from the environment.
        - command: |
            set -euo pipefail
            # T3 Code's remote bootstrap downloads, verifies and unpacks the t3
            # release with these. Every standard template ships them; fail here
            # with a clear message rather than at the first connection.
            command -v curl >/dev/null || command -v wget >/dev/null || { echo "curl or wget not found: T3 Code's remote bootstrap needs one of them to download the t3 release" >&2; exit 1; }
            command -v tar >/dev/null || { echo "tar not found: T3 Code's remote bootstrap needs it to unpack the t3 release" >&2; exit 1; }
            # t3's binaries link against libatomic1, which no sandbox template
            # ships. A hook rather than a recipe because apt cannot travel in
            # an overlay (a layer carries files, not dpkg state), and only
            # when the base image lacks it.
            if ! ldconfig -p 2>/dev/null | grep -q 'libatomic\.so\.1'; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends libatomic1
              rm -rf /var/lib/apt/lists/*
            fi
          user: "0"
          description: Install libatomic1 when the base image lacks it; t3's binaries link against it

  # No `filename:` — that is workload-only, and this mixin contributes a body
  # to whichever agent owns the profile.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./t3code-context.md

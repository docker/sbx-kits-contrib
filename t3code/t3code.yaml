# syntax=docker/sandbox-kit:3
# T3 Code's sandbox prerequisite as a MIXIN: the `t3` CLI, carried as an
# overlay built by t3code.dockerfile, plus one install hook for the shared
# library its prebuilt binaries link against. apt cannot travel in an overlay
# (a layer carries files, not dpkg state), so libatomic1 stays a hook.
schemaVersion: "3"
displayName: T3 Code
description: >-
  Installs the t3 npm package that T3 Code's SSH integration runs inside a
  sandbox, so the first connection starts a pre-installed server.

kind: mixin

# The `t3` release this kit's overlay carries, by reference to the `version` arg
# below — SPEC-v3 §4 admits a build-phase arg reference here and expands it at
# publish, so the version is stated in exactly one place and the publish tag and
# `org.opencontainers.image.version` name the package rather than a kit release
# number of their own.
version: "${{ kit.args.version }}"

# The `t3` release the recipe installs, declared once: validated here, handed to
# npm as an exact version, and expanded into `provides` and `version:` — so the
# kit cannot claim a release its overlay does not carry. The recipe asserts the
# agreement at build time by asking the installed binary.
#
# HOW THE DEFAULT WAS DETERMINED, and how to bump it: the `latest` dist-tag of
# the npm package the recipe installs, read from
# `https://registry.npmjs.org/t3/latest` — the same document `t3@latest` was
# resolving before the pin, so this default is what the unpinned build installed
# the day it was pinned. 0.0.45 then; re-read that URL to bump.
args:
  version:
    default: "0.0.45"
    # The shape `t3` publishes. Narrow on purpose: it refuses the dist-tags npm
    # would also accept in the install spec (`latest` is not a version and cannot
    # stand in a provide), and everything it accepts is a legal provide version
    # under SPEC-v3 §5.2. The value carries no leading `v` even though the CLI
    # prints one; see the recipe's comparison step.
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: t3 release to install
    buildArg: T3_VERSION

# MIGRATION NOTE: this provide was `t3code`, named after the kit, because the
# recipe asked npm for `t3@latest` and so the kit could not state what version of
# the tool it carried — the honest name for "a version I cannot vouch for" was
# not the tool's. Now that the install is pinned, the note left here for exactly
# this moment applies: the entry names the package the overlay installs and
# carries its version, which is what a kit writing `requires: ["t3 >= 0.0.42"]`
# can resolve against. Nothing in this repo required the old name.
provides: ["t3@${{ kit.args.version }}"]

capabilities:
  # MIGRATION NOTE: v2's one flat allow list becomes an install phase only.
  # The remaining hook is an install hook and the agent context is explicit
  # that the runtime path needs no registry — pre-installing `t3` is precisely
  # what keeps the first T3 Code connection off the network. An absent runtime
  # phase grants nothing, which is the intent stated in prose in v2.
  #
  # MIGRATION NOTE: registry.npmjs.org is gone from this list. It was here for
  # the `npm install -g t3@latest` hook, which t3code.dockerfile now performs
  # at image-build time — the tarball is the builder's traffic, not the
  # sandbox's. The apt hosts stay for the libatomic1 hook, so the install
  # phase narrows to the one hook that still runs rather than disappearing.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          # apt-get update refreshes every configured source, so all template
          # apt sources must be reachable even though we only install from
          # Ubuntu's main archive. amd64 uses archive/security, arm64 uses
          # ports.ubuntu.com. download.docker.com is pre-added to apt sources on
          # shell-docker / *-docker templates.
          - archive.ubuntu.com
          - security.ubuntu.com
          - ports.ubuntu.com
          - download.docker.com

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # t3's prebuilt binaries link against libatomic1, which no sandbox
        # template ships. Installed here, and only when the base lacks it,
        # because apt cannot travel in an overlay. No `env:`: the body reads
        # nothing from the environment.
        - command: |
            set -euo pipefail
            if ldconfig -p 2>/dev/null | grep -q 'libatomic\.so\.1'; then
              echo "libatomic1 already present on the base image"
              exit 0
            fi
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends libatomic1
            rm -rf /var/lib/apt/lists/*
          user: "0"
          description: Install libatomic1 when the base image lacks it; t3's prebuilt binaries link against it

        # MIGRATION NOTE: the second hook, "Install the t3 npm package
        # globally", is gone — t3code.dockerfile runs that install at image
        # build instead. Nothing in the hook body needed sandbox-create time:
        # the two proxy lines existed because a sandbox reaches the registry
        # through the sandbox's forced proxy (a builder does not, which is why
        # HTTP_PROXY and HTTPS_PROXY are no longer declared anywhere here),
        # the `command -v npm` guard turned a Node-less base into a legible
        # create-time error, and the `ln -sf` is now a symlink in the overlay.
        # What the kit exists for — `t3` already on PATH so T3 Code's first
        # connection does not go to the registry — is better served by a layer
        # than by a hook that has to do it again for every sandbox.

  # No `filename:` — that is workload-only, and this mixin contributes a body
  # to whichever agent owns the profile.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./t3code-context.md

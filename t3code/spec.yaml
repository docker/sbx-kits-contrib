schemaVersion: "2"
kind: mixin
name: t3code
displayName: T3 Code
description: Prepares a sandbox for T3 Code's SSH integration, which downloads the exact t3 release matching the connecting app on first connection. Installs the shared library those binaries need and allows the egress the download takes.

args:
  telemetry:
    default: "false"
    enum: ["true", "false"]
    description: "Whether the t3 server inside the sandbox sends anonymous usage telemetry. Off by default: the sandbox proxy blocks the telemetry host unless it is allowed, and a server that cannot reach it keeps retrying. Set to true to opt in, and allow us.i.posthog.com:443 in the sandbox's network policy."

agentInstructions:
  content: |
    ## T3 Code

    This sandbox is prepared for T3 Code's SSH integration.

    - On first connection, T3 Code downloads the exact `t3` release that
      matches the connecting app into `~/.t3/runtime/versions/<version>/`
      and runs it from there. Nothing is pre-installed, so the server
      always matches the app that connected.
    - Those binaries need `libatomic1`, which this kit installs when the base
      image lacks it.
    - The t3 server's anonymous usage telemetry is off in this sandbox unless
      the kit was installed with `telemetry=true`.
permissions:
  network:
    allow:
      # Runtime: T3 Code's remote bootstrap fetches the release archive and
      # its checksums from GitHub releases. The asset download redirects to
      # objects.githubusercontent.com.
      - github.com:443
      - objects.githubusercontent.com:443
      # libatomic1, on a base image that does not already have it. apt-get
      # update refreshes every configured source, so all of them must be
      # reachable: amd64 uses archive/security, arm64 uses ports.ubuntu.com,
      # and download.docker.com is pre-added on the *-docker templates.
      - archive.ubuntu.com:80
      - security.ubuntu.com:80
      - ports.ubuntu.com:80
      - download.docker.com:443
environment:
  variables:
    # Read by the t3 server at startup. The sandbox proxy does not allow the
    # telemetry host by default, so leaving this on only produces retries.
    T3CODE_TELEMETRY_ENABLED: "${{ kit.args.telemetry }}"
setup:
  install:
    - command: |
        set -euo pipefail
        # T3 Code's remote bootstrap downloads, verifies and unpacks the t3
        # release with these. Every standard template ships them; fail here
        # with a clear message rather than at the first connection.
        command -v curl >/dev/null || command -v wget >/dev/null || { echo "curl or wget not found: T3 Code's remote bootstrap needs one of them to download the t3 release" >&2; exit 1; }
        command -v tar >/dev/null || { echo "tar not found: T3 Code's remote bootstrap needs it to unpack the t3 release" >&2; exit 1; }
        # t3's binaries link against libatomic1. Install it when the base
        # image has not already, rather than inheriting it by accident from
        # some other package's dependencies.
        if ! ldconfig -p 2>/dev/null | grep -q 'libatomic\.so\.1'; then
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends libatomic1
          rm -rf /var/lib/apt/lists/*
        fi
      user: "0"
      description: Install libatomic1 when the base image lacks it; t3's binaries link against it

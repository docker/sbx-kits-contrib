# Docker Sandboxes kit: install the Google Cloud CLI (gcloud), authenticated
# through its own interactive device-flow login -- no API key, no proxy-
# managed credential. Usage/design notes: see README.md.
schemaVersion: "2"
kind: mixin
name: gcloud
version: "1.0.0"
displayName: Google Cloud CLI (gcloud)
description: "Installs the official Google Cloud CLI (gcloud, plus gsutil and bq), from Google's own apt repository. Like the kiro kit in this repo, gcloud has no API-key or env-var auth path for a human account -- it authenticates via gcloud auth login --no-launch-browser (device-flow: a URL and a verification code), which the agent or the user runs interactively inside the sandbox."
licenses:
  - Apache-2.0

permissions:
  network:
    allow:
      # Google's official apt repo: the signing key and the package index/pool.
      - packages.cloud.google.com
      # `apt-get update` refreshes every configured apt source from the base
      # template too. Keep all template sources allowed for amd64 and arm64.
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - download.docker.com
      # gcloud's own device-flow login and token refresh.
      - oauth2.googleapis.com
      - accounts.google.com
      - sts.googleapis.com
      # Most-common API surfaces a freshly-authenticated gcloud session
      # touches first (gcloud config set, gcloud projects list, IAM checks).
      # Project-specific API calls (GCS, Compute, etc.) reach their own
      # *.googleapis.com host, which this kit cannot enumerate in advance --
      # see the "What this kit does not do" note in README.md.
      - cloudresourcemanager.googleapis.com
      - iam.googleapis.com
      - storage.googleapis.com

environment:
  variables:
    CLOUDSDK_CORE_DISABLE_PROMPTS: "1"

agentInstructions:
  content: |
    ## Google Cloud CLI (gcloud)

    `gcloud` (plus `gsutil` and `bq`) is installed from Google's official apt
    repository. There is no API-key or environment-variable auth path for a
    human Google account -- the sandbox is not pre-authenticated. Run

        gcloud auth login --no-launch-browser

    which prints a URL and asks you to paste back a verification code: open
    the URL on your host, sign in, copy the code it shows into the sandbox
    shell. Auth state then lives in `~/.config/gcloud` and survives restarts
    of this sandbox (not recreation of it), same as any other `gcloud`
    install.

    Set a default project once signed in: `gcloud config set project <id>`.

    For fully unattended use with a service account key instead of a human
    login, see "Service accounts" in README.md.

setup:
  install:
    - command: |
        set -euo pipefail
        apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gnupg apt-transport-https
        mkdir -p /usr/share/keyrings
        curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" > /etc/apt/sources.list.d/google-cloud-sdk.list
        apt-get update
        GCLOUD_VERSION=590.0.0
        apt-get install -y --no-install-recommends "google-cloud-cli=${GCLOUD_VERSION}-0"
        gcloud --version
      user: "0"
      description: "Add Google's official apt repo and install google-cloud-cli v590.0.0 (gcloud, gsutil, bq)"

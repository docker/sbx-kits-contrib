# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Google Cloud CLI with host-managed authentication
description: Google Cloud CLI with credential injection at the sandbox boundary
sourceUrl: https://cloud.google.com/sdk
kind: mixin
version: "${{ kit.args.version }}"
args:
  version:
    default: "592.0.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Google Cloud CLI release to install
    buildArg: GCLOUD_VERSION
  run_region:
    default: us-central1
    pattern: '^[a-z]+(-[a-z]+)+[0-9]+$'
    description: Cloud Run region whose regional API receives proxy authentication
    env: CLOUDSDK_RUN_REGION
provides: ["gcloud@${{ kit.args.version }}"]
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - cloudresourcemanager.googleapis.com
          - compute.googleapis.com
          - run.googleapis.com
          - "${{ kit.args.run_region }}-run.googleapis.com"
          - storage.googleapis.com
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: gcloud
      phase: runtime
      # OAuth-derived bearer sourced and refreshed on the host. No login in-container.
      apiKey:
        name: CLOUDSDK_AUTH_ACCESS_TOKEN
        proxyManaged: true
        inject:
          - {domain: cloudresourcemanager.googleapis.com, header: Authorization, format: "Bearer %s"}
          - {domain: compute.googleapis.com, header: Authorization, format: "Bearer %s"}
          - {domain: run.googleapis.com, header: Authorization, format: "Bearer %s"}
          - {domain: "${{ kit.args.run_region }}-run.googleapis.com", header: Authorization, format: "Bearer %s"}
          - {domain: storage.googleapis.com, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./gcloud-context.md

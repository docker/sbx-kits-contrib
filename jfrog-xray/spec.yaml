schemaVersion: "2"
kind: mixin
name: jfrog-xray
displayName: JFrog Xray
description: >-
  Installs the JFrog CLI (jf), pre-wired to your JFrog Platform, so agents can run
  Xray security & license scans (jf audit / jf scan / jf docker scan) against
  dependencies, binaries, and container images. Xray is a core component of the
  JFrog Platform and shares package metadata with Artifactory, so a scan reports not
  just a CVE but its full impact path through your dependency graph.
licenses:
  - Apache-2.0

# The JFrog Platform host is per-user (SaaS instances are mycompany.jfrog.io), so
# it can't be hardcoded like gitlab.com. It's substituted into JF_URL, the
# credential inject domain, and the egress allowlist before decode. It defaults
# to a placeholder (so the kit still validates and installs); set it with:
#   --kit-arg jfrog-xray.jfrog_host=mycompany.jfrog.io
args:
  jfrog_host:
    default: "your-company.jfrog.io"
    description: "Your JFrog Platform host, e.g. mycompany.jfrog.io (SaaS) or artifactory.internal.example.com (self-hosted). Hostname only - no scheme, no path, no port. Defaults to a placeholder; set it or scans have no host to reach."
    pattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'

environment:
  variables:
    # jf reads JF_URL + JF_ACCESS_TOKEN directly, so no `jf config add` is needed.
    JF_URL: "https://${{ kit.args.jfrog_host }}"
    # JF_ACCESS_TOKEN is set to the proxy-managed sentinel by the credential below.
    # Keep jf non-interactive and quiet inside the sandbox.
    JFROG_CLI_OFFER_CONFIG: "false"
    JFROG_CLI_AVOID_NEW_VERSION_WARNING: "true"

credentials:
  - service: jfrog
    description: "JFrog Platform access token (needs Xray read + scan scopes). Stored on the host; the sandbox only ever sees a placeholder, and the proxy injects the real value on outbound requests to your JFrog host."
    required: true
    apiKey:
      # jf sends `Authorization: Bearer <JF_ACCESS_TOKEN>`. proxyManaged sets the
      # env var to the sentinel inside the container; the proxy swaps in the real
      # token on requests to the JFrog host. The container never sees the token.
      name: JF_ACCESS_TOKEN
      inject:
        - domain: "${{ kit.args.jfrog_host }}"
          scheme: bearer

permissions:
  network:
    allow:
      # jf CLI download, install time, one-shot. JFrog ships the binary from its
      # own Artifactory release host - same trust domain as the platform itself.
      # releases.jfrog.io 302-redirects the actual binary blob to releases-cdn.jfrog.io,
      # so BOTH must be allowed or the install curl fails with exit 22 under deny-all.
      - releases.jfrog.io
      - releases-cdn.jfrog.io
      # Xray + Artifactory REST API, runtime. This is the user's own instance.
      - "${{ kit.args.jfrog_host }}"

agentInstructions:
  content: |
    ## JFrog Xray

    The JFrog CLI `jf` is installed and pre-wired to your JFrog Platform:
    `JF_URL` points at your instance and `JF_ACCESS_TOKEN` is a **proxy-managed
    placeholder** - never the real token. The sandbox proxy injects the real
    value on outbound requests to your JFrog host, so there is no `jf config add`
    step and the token never lives inside the sandbox.

    Xray is the JFrog Platform's security & compliance engine. Because it shares
    package metadata with Artifactory, a scan reports not just a CVE but its full
    impact path through your dependency graph - enabling real risk assessment and
    remediation, not just a flat vulnerability list.

    Common scans:
    - `jf audit` - scan the current project's declared dependencies (npm, pip,
      Go, Maven, Gradle, NuGet, …) for vulnerabilities and license violations.
    - `jf audit --licenses` - also report license-compliance results.
    - `jf audit --format=json` - machine-readable output you can parse.
    - `jf scan <path>` - scan an arbitrary file, folder, or binary.
    - `jf docker scan <image>` - scan a local container image.
    - `jf build-scan <build-name> <build-number>` - scan a published build.

    Verify connectivity with `jf rt ping`; inspect config with `jf config show`.
    If a scan reports "Xray is not entitled", the token lacks Xray scopes or the
    platform doesn't have Xray enabled.

setup:
  install:
    # Install jf from a pinned, digest-verified JFrog release (same pattern as the
    # trivy and glab kits: no `curl | sh`, version AND SHA256 pinned in git). To
    # bump: change JF_VERSION plus the per-arch SHA256 below. The checksums are the
    # sha256 of the raw `jf` binary at
    # https://releases.jfrog.io/artifactory/jfrog-cli/v2-jf/<version>/jfrog-cli-linux-<arch>/jf
    - command: |
        set -euo pipefail
        JF_VERSION=2.121.0
        ARCH=$(dpkg --print-architecture)
        case "$ARCH" in
          amd64) SHA256="7d9fcfd1d21d779cf18e96a0ae97706c6d15808ff79a8fa1b91f046d0fd419ca" ;;
          arm64) SHA256="1858ad5e2acfcaecb5da5b5f623cd667b85cce33b59181d60384dc5f42908351" ;;
          *) echo "unsupported sandbox arch: $ARCH (expected amd64 or arm64)" >&2; exit 1 ;;
        esac
        URL="https://releases.jfrog.io/artifactory/jfrog-cli/v2-jf/${JF_VERSION}/jfrog-cli-linux-${ARCH}/jf"
        curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/jf "$URL"
        echo "${SHA256}  /tmp/jf" | sha256sum -c -
        install -m 0755 /tmp/jf /usr/local/bin/jf
        rm -f /tmp/jf
        jf --version
      user: "0"
      description: "Install JFrog CLI (jf) v2.121.0, version+digest pinned"

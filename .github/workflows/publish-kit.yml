name: Publish kit artifact

# Reusable: pushes ONE kit as an OCI artifact to <registry>/<namespace>/<kit>-kit.
#
# Callers:
#   * build-image.yml  — continuous, one call per changed allow-listed kit,
#                        tagged <sha>-<YYYYMMDD> and moving the rolling tag.
#   * release-kit.yml  — on a `<kit>/vX.Y.Z` tag, tagged with that version.
#
# The kit artifact is the spec plus files/, which is what `--kit oci://…`
# consumes without going through git. It is NOT the image the sandbox boots
# from; that is built by build-image.yml and published as `<kit>-image`.
#
# A released version describes THE KIT — its spec, files, network policy and
# hooks — not the agent inside the image it references. The image floats
# deliberately: the agent CLI moves on its own schedule, and encoding that in
# the kit's version would mean either stale agents or a version that churns for
# reasons the kit did not cause.

on:
  workflow_call:
    inputs:
      kit:
        description: Kit directory at the repo root, e.g. "kiro".
        required: true
        type: string
      tag:
        description: |
          The tag to publish. Immutable by convention — never reused for
          different content, so consumers can pin it.
        required: true
        type: string
      move-latest:
        description: |
          Also re-point the rolling tag at the manifest just pushed. Callers
          publishing a point-in-time build set this; a release does not, unless
          releases are what the rolling tag should track.
        type: boolean
        default: false

permissions:
  contents: read
  # Mints the GitHub OIDC token exchanged for a short-lived Hub token, and is
  # also the Sigstore identity `sbx kit push --sign` signs with.
  id-token: write

env:
  REGISTRY: ${{ vars.REGISTRY || 'docker.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || 'sbx' }}
  IMAGE_TAG_LATEST: ${{ vars.IMAGE_TAG_LATEST || 'latest' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve kit coordinates
        id: coords
        # The reference is COMPOSED here, never taken from a spec or an input.
        # `sbx kit push` uses whatever reference it is handed verbatim — it
        # derives nothing from the kit name and validates nothing against it —
        # so a wrong value would push a kit manifest over an unrelated tag in
        # this namespace, the image's included.
        run: |
          set -euo pipefail
          echo "ref=${REGISTRY}/${IMAGE_NAMESPACE}/${KIT}-kit" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "pull_request" ] \
             && [ "${{ github.repository }}" = "docker/sbx-kits-contrib" ] \
             && [ -n "${OIDC_CONNECTION_ID}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          KIT: ${{ inputs.kit }}
          OIDC_CONNECTION_ID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Install sbx
        run: |
          set -euo pipefail
          version=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/docker/sbx-releases/releases/latest | jq -r .tag_name)
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://github.com/docker/sbx-releases/releases/download/${version}/DockerSandboxes-linux.tar.gz" \
            -o /tmp/DockerSandboxes-linux.tar.gz
          tar xzf /tmp/DockerSandboxes-linux.tar.gz -C /tmp
          # Create ~/.docker unprivileged first: the installer runs under sudo,
          # so if the directory is absent it gets created root-owned — and the
          # later docker/login-action step could then not write config.json,
          # which is the only credential `sbx kit push` and `oras` read.
          mkdir -p "${HOME}/.docker"
          sudo PREFIX="${HOME}/.docker/sbx" /tmp/docker-sbx/install.sh
          echo "${HOME}/.docker/sbx/bin" >> "$GITHUB_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the kit
        # Runs on pull requests too — catch an unpushable kit on the PR rather
        # than at publish time. `sbx kit` is daemon-free (only `kit add` needs
        # sandboxd), so this needs no VM and no KVM.
        run: sbx kit validate "${{ inputs.kit }}"

      - name: Exchange GitHub OIDC token for Docker Hub access
        if: steps.coords.outputs.push == 'true'
        id: docker_oidc
        uses: docker/oidc-action@b048fb089ace3e15a5fbdd784f4784d284ce5e8d # v1.1.0
        with:
          connection-id: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          expires-in: 3600

      - name: Log in to Docker Hub
        if: steps.coords.outputs.push == 'true'
        # `sbx kit push` authenticates via the Docker credential store, so this
        # login is the whole auth story — no sbx-side credential, and none of
        # the Secret Service scaffolding `sbx login` needs.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: sbx
          password: ${{ steps.docker_oidc.outputs.token }}

      # Needed whenever anything is published, not only when the rolling tag
      # moves: the existence probe and the digest capture both use oras, and
      # neither is conditional on move-latest.
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        if: steps.coords.outputs.push == 'true'
        with:
          version: "1.3.3"

      - name: Check whether the tag already exists
        id: existing
        if: steps.coords.outputs.push == 'true'
        # Tags published here are immutable by convention; the registry does not
        # enforce that unless Hub tag-immutability is on. What happens on a
        # collision differs by caller, because the two mean different things:
        #
        #   release (move-latest false) — a version is being re-cut over an
        #     already-published one. Always an error; the fix is a new version.
        #   continuous (move-latest true) — the dated tag is <sha>-<date>, so a
        #     collision just means this commit was already published today, i.e.
        #     a re-run. Reuse the existing manifest instead of failing: a re-run
        #     is the ONLY way to recover when the push succeeded and a later
        #     step did not, and hard-failing here would strand the rolling tag
        #     pointing at the previous artifact with no path back through CI.
        #
        # Probed with oras rather than `docker manifest inspect`: the kit is an
        # OCI manifest with a custom artifactType and a non-image config, which
        # the image-oriented tooling may reject outright. A rejection would be
        # indistinguishable from "absent" and would wave an overwrite through —
        # the exact case this guard exists to catch.
        run: |
          set -euo pipefail
          if oras manifest fetch --descriptor "${REF}:${TAG}" >/tmp/existing.json 2>/tmp/existing.err; then
            digest=$(jq -r .digest </tmp/existing.json)
            if [ "${MOVE_LATEST}" = "true" ]; then
              echo "${REF}:${TAG} already exists (${digest}) — re-run, reusing it."
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::${REF}:${TAG} already exists (${digest}). Published versions are immutable — cut a new version rather than re-tagging this one."
              exit 1
            fi
          else
            # Distinguish "not there" from "could not tell". Treating an auth or
            # transport failure as absent is how an immutable tag gets
            # overwritten by accident.
            if grep -qiE 'not found|manifest unknown|name unknown|404' /tmp/existing.err; then
              echo "${REF}:${TAG} does not exist yet."
              echo "found=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::could not determine whether ${REF}:${TAG} exists:"
              cat /tmp/existing.err >&2
              exit 1
            fi
          fi
        env:
          REF: ${{ steps.coords.outputs.ref }}
          TAG: ${{ inputs.tag }}
          MOVE_LATEST: ${{ inputs.move-latest }}

      - name: Push the kit
        id: push
        if: steps.coords.outputs.push == 'true' && steps.existing.outputs.found != 'true'
        # --sign is keyless: the Sigstore identity is this job's ambient GitHub
        # OIDC token, which is why `id-token: write` is required above. Every
        # push also attaches a SLSA provenance referrer recording the kit's
        # content digests, its declared sandbox image, and this commit.
        run: |
          set -euo pipefail
          sbx kit push "${{ inputs.kit }}" "${REF}:${TAG}" --sign

          # The push does not echo the digest, and re-reading the tag later
          # would let a racing push swap the manifest we then advertise.
          digest=$(oras manifest fetch --descriptor "${REF}:${TAG}" | jq -r .digest)
          # Written as an `if`, not `[ -n "$d" ] && [ "$d" != null ]`: set -e
          # does not fire when the FIRST test of an && list fails, so that form
          # would fall through with an empty digest and blow up two steps later
          # on `oras tag "<ref>@"` with an unrelated-looking error.
          if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
            echo "::error::pushed ${REF}:${TAG} but could not read back its digest"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${REF}:${TAG} (${digest})"
        env:
          REF: ${{ steps.coords.outputs.ref }}
          TAG: ${{ inputs.tag }}

      - name: Re-point the rolling tag at that manifest
        if: steps.coords.outputs.push == 'true' && inputs.move-latest
        # Retag by digest rather than pushing a second time.
        #
        # A second push re-packs the kit, and `oras.PackManifest` stamps
        # org.opencontainers.image.created, so the second manifest almost always
        # digests differently — and each digest carries its OWN provenance and
        # signature, so the two tags would advertise different attestations for
        # the same source. "Almost always" is the problem: that annotation has
        # one-second resolution, so two pushes inside the same second produce
        # identical manifests and the divergence silently does not happen. A bug
        # that reproduces on a slow runner and not a fast one is worse than one
        # that always reproduces.
        #
        # `oras tag` re-points a tag at a manifest already in the registry, so
        # one digest, one signature, one provenance referrer, both tags.
        #
        # It needs PULL as well as push: the manifest is fetched before being
        # re-PUT under the new tag. If the registry credential is push-only this
        # step fails AFTER a successful push, leaving the pushed tag published
        # and the rolling tag stale — recoverable, but only by hand.
        #
        # `buildx imagetools create` would also work, but only with
        # `--prefer-index=false`, whose documented behaviour is that it
        # "attempts to preserve the source manifest format" — best-effort, and
        # unspecified for a custom artifactType. Its default wraps a single
        # manifest in an index, which would change the artifact's media type.
        run: oras tag "${REF}@${DIGEST}" "${IMAGE_TAG_LATEST}"
        env:
          REF: ${{ steps.coords.outputs.ref }}
          # Falls back to the digest the probe read: on a re-run the push is
          # skipped, so steps.push has no output and the rolling tag would
          # otherwise be pointed at an empty reference.
          DIGEST: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}

      - name: Summarise
        run: |
          {
            echo "## ${{ inputs.kit }} (kit artifact)"
            echo ""
            if [ "${{ steps.coords.outputs.push }}" = "true" ]; then
              echo "Published \`${{ steps.push.outputs.digest || steps.existing.outputs.digest }}\`:"
              echo ""
              echo '- `${{ steps.coords.outputs.ref }}:${{ inputs.tag }}`'
              if [ "${{ inputs.move-latest }}" = "true" ]; then
                echo '- `${{ steps.coords.outputs.ref }}:${{ env.IMAGE_TAG_LATEST }}` — rolling, re-pointed at the same digest'
              fi
              echo ""
              if [ "${{ steps.existing.outputs.found }}" = "true" ]; then
                echo ""
                echo "_Tag already existed — reused rather than re-pushed._"
              else
                echo ""
                echo "Signed keyless (Sigstore), with a SLSA provenance referrer."
              fi
            else
              echo "**Dry run — validated, nothing published.**"
              echo ""
              if [ "${{ github.event_name }}" = "pull_request" ]; then
                echo "Reason: pull request (push credentials are never exposed to PRs)."
              else
                echo "Reason: the \`DOCKERHUB_OIDC_CONNECTIONID\` secret is not set."
              fi
              echo ""
              echo 'Would have published `${{ steps.coords.outputs.ref }}:${{ inputs.tag }}`.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: Build and publish kits

# Publishes every kit that needs publishing, as ONE image each:
#
#   docker.io/docker/sbx-kit-<kit>:<version>   the kit's own version
#   docker.io/docker/sbx-kit-<kit>:latest      rolling
#
# WHAT THIS USED TO DO, AND WHY IT IS SMALLER NOW. Under v2 a kit was a YAML
# file that POINTED AT an image, so this workflow published two things per kit
# to two repositories: the base image (`<kit>-image`, from the kit's Dockerfile)
# and the kit artifact (`<kit>-kit`, packed and pushed with oras). Most of its
# machinery existed to manage that split — which kits ship a Dockerfile and so
# need the image job at all, an immutable <YYYYMMDD>-<sha> tag to give the
# rolling tag something stable to follow, a check that each spec's declared
# `sandbox.image` sat in a namespace CI could actually push to, and a rule that
# the nightly rebuild skipped the artifact because a kit's content was a pure
# function of the commit while its image was not.
#
# In v3 a kit IS an image: the descriptor rides in the published image's
# manifest annotation and the layers are its content. One thing to push, one
# build to push it, and every question above stops being asked — there is no
# Dockerfile to detect, no second repository to keep names apart in, no spec
# field naming where to publish (the reference is derived from the kit
# directory), and nothing that is a pure function of the commit, so the nightly
# now rebuilds and republishes everything.
#
# Kits are DISCOVERED, not listed: any directory holding `<dir>/<dir>.yaml` is
# picked up automatically, so adding a kit needs no change to this workflow.
# That mirrors tck.yml, and it is the reason there is no top-level `paths:`
# filter — all filtering happens in detect-changes, which also decides which
# kits a given event should rebuild.
#
# Conventions a discovered kit must follow:
#
#   * The descriptor is named after its directory (`<kit>/<kit>.yaml`), and its
#     first line is `# syntax=docker/sandbox-kit:3`. That line is what makes
#     the build a kit build; BuildKit pulls the frontend itself.
#   * The build context is the kit directory.
#   * The descriptor declares a version this pipeline can resolve — see
#     scripts/kit-version.sh for the four ways of doing that. The
#     `verify-versions` job below refuses to build anything until every kit in
#     the repo satisfies it.
#
# Nothing here asserts anything ABOUT the built image. v2 needed a whole
# verification pass — load a single-platform build, check its CMD is on PATH,
# check it does not run as root, check `com.docker.sandboxes.flavor` names the
# right kit — because a Dockerfile could declare anything and a spec's claims
# about it were unchecked prose. The v3 frontend validates the descriptor as
# part of the build and derives the image's configuration from it, so those
# assertions are either enforced at build time or no longer expressible. A
# malformed kit fails the build, not a separate step that could drift from what
# the frontend actually accepts. Conformance of the PUBLISHED artifact is
# tck.yml's job, not this one's.
#
# Shared coordinates (registry, namespace, rolling tag, platforms) come from
# repository/organisation variables with documented fallbacks, so retargeting is
# a settings change rather than a workflow edit.

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, because these images track moving upstreams rather than frozen
  # ones: agents are typically installed from a `latest` channel and bases are
  # floating tags, so a rebuild is the only way a new agent release or a patched
  # base reaches users of the kit — and it surfaces upstream breakage in CI
  # rather than in someone's sandbox.
  #
  # Under v2 the nightly republished only the IMAGE, because the kit artifact
  # was a pure function of the commit and re-pushing it would have minted a new
  # digest for identical bytes. In v3 there is only the image, so the nightly
  # publishes the whole kit — including re-pushing the SAME `<version>` tag it
  # pushed yesterday, over new content. That is deliberate, and it is the reason
  # `<version>` is not an immutable tag here: it names the agent the kit ships,
  # not the bytes it shipped on a particular day. Pin a digest if you need the
  # bytes to hold still.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # Required to mint the GitHub OIDC token that is exchanged for a short-lived
  # Docker Hub token. An explicit permissions block narrows the repo default, so
  # omitting this fails the exchange rather than falling back to it.
  id-token: write

env:
  REGISTRY: ${{ vars.REGISTRY || 'docker.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || 'docker' }}
  IMAGE_NAME_PREFIX: ${{ vars.IMAGE_NAME_PREFIX || 'sbx-kit-' }}
  IMAGE_TAG_LATEST: ${{ vars.IMAGE_TAG_LATEST || 'latest' }}
  PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Kits to rebuild for this event.
      kits: ${{ steps.collect.outputs.kits }}
      # Every discovered kit, regardless of what changed — the version gate
      # below checks all of them, not just the ones touched, because an
      # unresolvable version is a repo-wide problem and finding it only when
      # that kit happens to change is finding it late.
      all: ${{ steps.collect.outputs.all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Discover kits
        id: discover
        run: |
          set -euo pipefail
          kits=$(scripts/discover-kits.sh | tr '\n' ' ')
          kits="${kits% }"
          echo "Discovered kits:${kits:+ }${kits:-(none)}"
          echo "kits=${kits}" >> "$GITHUB_OUTPUT"

      - name: Generate filters
        id: filter-setup
        # One filter per discovered kit, matching the whole kit directory minus
        # docs that never affect what gets published. Written as exclusions
        # rather than an allowlist of sources on purpose: an allowlist silently
        # stops matching once a recipe starts COPYing a new file, leaving a
        # published image stale until the next nightly. Kit directories carry
        # `<kit>-context.md` files and `files/` trees that ARE build inputs and
        # look exactly like docs, which is precisely the trap an allowlist walks
        # into. The descriptor itself is obviously not excluded — it is the
        # build's entry point.
        #
        # Two separate filter documents, not one, because the two "Filter ...
        # changes" steps below need two DIFFERENT predicate-quantifier settings
        # (dorny/paths-filter applies one quantifier to every filter in a
        # single invocation, so kit-filters and shared-filters can't share a
        # step): kit-filters mixes a positive pattern with negations per kit
        # and needs "every" (see that step's comment for why); shared-filters
        # lists several alternative exact paths with no negations, meant as
        # "OR", and must stay at the default "some" — "every" would require a
        # single file to match all of them at once, which is impossible.
        run: |
          set -euo pipefail
          # Writes a $GITHUB_OUTPUT multiline value and echoes it to the log,
          # shared by both filter documents below so they can't drift apart.
          emit_output() {
            {
              echo "$1<<EOF"
              echo "$2"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "$2"
          }

          kit_filters=""
          for kit in ${{ steps.discover.outputs.kits }}; do
            kit_filters=$(printf '%s\n%s:\n  - "%s/**"\n  - "!%s/README.md"\n  - "!%s/README.image.md"\n  - "!%s/testdata/**"' \
              "$kit_filters" "$kit" "$kit" "$kit" "$kit" "$kit")
          done
          emit_output "kit-filters" "$kit_filters"

          # Shared inputs rebuild everything. The publish path is listed too:
          # without it, a change to publish-one-kit.yml or any of the scripts it
          # calls produces no builds, so the publish job does not run at all —
          # not even as a dry run — and the PR that changes the publishing
          # logic is the one PR that never exercises it.
          shared_filters=$(printf 'shared:\n%s\n%s\n%s\n%s\n%s\n%s' \
            '  - ".github/workflows/build-and-publish-kits.yml"' \
            '  - ".github/workflows/publish-one-kit.yml"' \
            '  - ".github/workflows/release-kit.yml"' \
            '  - "scripts/discover-kits.sh"' \
            '  - "scripts/kit-version.sh"' \
            '  - "scripts/publish-kit.sh"')
          emit_output "shared-filters" "$shared_filters"

      - name: Filter kit changes
        id: filter-kits
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: ${{ steps.filter-setup.outputs.kit-filters }}
          # Local git diff rather than the API, so fork PRs work with a
          # restricted GITHUB_TOKEN.
          token: ""
          # Every per-kit filter mixes a positive pattern with negations
          # (kit/**, !kit/README.md, ...). Under the default predicate-quantifier
          # ("some" — a file matches the filter if ANY listed pattern's own
          # per-pattern predicate returns true), a negated pattern's predicate
          # returns true for almost every file that ISN'T that exact excluded
          # path — so `.some()` over [positive, !a, !b, !c] is true for nearly
          # anything, not just the intended "under kit/, except a/b/c". That
          # silently made EVERY kit's filter true on EVERY run regardless of
          # what actually changed (a PR touching only one new kit's files
          # reported all ~28 kits as changed) — confirmed by inspecting a real
          # run's per-filter "Matching files" log, where e.g. the "pi" filter
          # matched files under an unrelated new copilot/ directory.
          # "every" instead requires ALL listed patterns' predicates to be true
          # for a given file — including the negated ones, whose own predicate
          # is already "does NOT match this path" — which is exactly "matches
          # kit/** AND is not README.md AND is not README.image.md AND is not
          # under testdata/", the behavior every filter here was written
          # assuming. (v4.0.2's newer "some-with-excludes" quantifier would be
          # the more legible name for this, but it isn't implemented at this
          # pinned commit — confirmed by reading src/filter.ts there directly.)
          #
          # Scoped to this step only — see "Generate filters" above for why
          # "shared" can't use the same quantifier.
          predicate-quantifier: every

      - name: Filter shared changes
        id: filter-shared
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: ${{ steps.filter-setup.outputs.shared-filters }}
          # Local git diff rather than the API, so fork PRs work with a
          # restricted GITHUB_TOKEN.
          token: ""

      - name: Collect kits to build
        id: collect
        run: |
          set -euo pipefail
          all=$(printf '%s\n' ${{ steps.discover.outputs.kits }} | jq -R . | jq -sc .)
          echo "all=${all}" >> "$GITHUB_OUTPUT"

          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              # Nothing "changed"; the point is to rebuild against moving
              # upstreams, so rebuild everything.
              kits="${all}"
              ;;
            *)
              if [ "${{ steps.filter-shared.outputs.shared }}" = "true" ]; then
                # This workflow or the publish path changed — rebuild everything.
                kits="${all}"
              else
                kits='${{ steps.filter-kits.outputs.changes }}'
              fi
              ;;
          esac

          echo "kits=${kits:-[]}" >> "$GITHUB_OUTPUT"
          echo "Building: ${kits}"

  # Gates the build. Resolves the publish version for EVERY kit in the repo, not
  # just the ones being rebuilt, and fails if any of them has none.
  #
  # This replaces v2's `verify-spec-refs`, which asserted that each kit's
  # declared `sandbox.image` sat in a namespace CI could push to. That check
  # existed because the spec NAMED its own image and the pipeline published
  # whatever it found there — it was the guard on trusting a value out of the
  # kit. v3 descriptors name nothing: the reference is composed from the kit
  # directory, so there is nothing to police. What the descriptor does still
  # own is the version, which is now the thing worth checking early — an
  # unresolvable version is a kit that cannot be tagged, and finding that out
  # 40 minutes into a matrix is finding it out late.
  #
  # One job over all kits rather than a per-kit step: "these four kits need a
  # version" is one fix, and four separately-failing matrix legs is the same
  # fix discovered four times.
  verify-versions:
    needs: detect-changes
    if: needs.detect-changes.outputs.all != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve every kit's publish version
        # Formatted with awk rather than `column -t`: this step gates the
        # entire matrix, and under `pipefail` a formatter that is missing from
        # some future runner image would fail the gate over whitespace.
        run: |
          set -euo pipefail
          ./scripts/kit-version.sh --all |
            awk -F'\t' '{ printf "%-32s %-24s %s\n", $1, $2, $3 }'

  # One invocation per kit, each its own job graph: publish → overview. A plain
  # matrix of two jobs would instead make every kit's overview wait for every
  # kit's build, and — because `needs` is evaluated per JOB, not per matrix leg
  # — one kit's build failure would skip the overview sync for all of them.
  kit:
    needs: [detect-changes, verify-versions]
    if: >-
      needs.detect-changes.outputs.kits != '[]' &&
      needs.detect-changes.outputs.kits != 'null' &&
      needs.detect-changes.outputs.kits != ''
    strategy:
      # One kit's failure must not stop the others: these builds pull from ~87
      # independent upstreams, and one vendor's bad release should cost one
      # stale kit, not a night's worth of rebuilds.
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.detect-changes.outputs.kits) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-one-kit.yml
    secrets: inherit
    with:
      kit: ${{ matrix.kit }}

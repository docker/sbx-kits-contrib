name: Publish one kit

# Everything one kit needs, end to end: its image, and its Hub page.
#
# Exists so kits are ISOLATED. Matrix legs of a job do not chain, so expressing
# this as a two-job matrix (publish → overview) in the caller would make every
# kit's overview wait for every kit's build — and because `needs` is evaluated
# per JOB rather than per leg, a single failing build would skip the overview
# sync for all 87. Called once per kit from build-and-publish-kits.yml, each
# invocation is its own job graph: kits run end to end in parallel and fail
# independently.
#
# WHAT IT NO LONGER DOES. Under v2 this file drove three jobs per kit — build
# and push the base image, pack and push the kit artifact, then sync Hub — plus
# a verification pass that loaded a single-platform build and asserted things
# about it (a CMD that resolves on PATH, a non-root user, a
# `com.docker.sandboxes.flavor` naming this kit, a `start-docker=true` claim
# backed by an actual engine). All of that was the cost of v2's split between a
# spec and the image it pointed at: two artifacts to publish and keep in step,
# and a Dockerfile free to contradict the spec describing it.
#
# A v3 kit is one image built from one descriptor, and the frontend named on
# that descriptor's first line validates it during the build and derives the
# image's configuration from it. So the three jobs collapse into one buildx
# invocation, and the assertions are gone because the thing they guarded
# against — a Dockerfile and a spec disagreeing — no longer has two sides.

on:
  workflow_call:
    inputs:
      kit:
        description: Kit directory at the repo root, e.g. "claude".
        required: true
        type: string
      move-latest:
        description: |
          Also tag the rolling tag. True for the continuous path; a release
          leaves it alone, because a `<kit>/vX.Y.Z` tag can sit on a commit
          that is not main's tip and publishing `latest` from one would move
          it backward. See scripts/publish-kit.sh.
        type: boolean
        default: true

permissions:
  contents: read
  # Mints the GitHub OIDC token exchanged for a short-lived Docker Hub token.
  id-token: write

env:
  # May this run write? ¬pull_request ∧ right repo ∧ OIDC secret present.
  #
  # It cannot be threaded in as an input — event_name and repository are
  # ambient and propagate into called workflows identically, so an input would
  # only let a caller misreport them.
  #
  # v2 had two more conditions here, on DOCKERPUBLICBOT_USERNAME and
  # DOCKERPUBLICBOT_WRITE_PAT. Those were the org bot's static credential,
  # needed solely because `sbx kit push --sign` authenticated as its own
  # session and rejected the OIDC-exchanged token that satisfied `docker
  # login`. v3 publishes with buildx, which signs nothing of its own and
  # attaches provenance and SBOM as native attestations, so that credential is
  # no longer part of the publish path at all — one fewer static secret in a
  # job that pushes.
  DRY_RUN: >-
    ${{ (github.event_name == 'pull_request'
      || github.repository != 'docker/sbx-kits-contrib'
      || secrets.DOCKERHUB_OIDC_CONNECTIONID == '') && '1' || '' }}
  REGISTRY: ${{ vars.REGISTRY || 'docker.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || 'docker' }}
  IMAGE_NAME_PREFIX: ${{ vars.IMAGE_NAME_PREFIX || 'sbx-kit-' }}
  IMAGE_TAG_LATEST: ${{ vars.IMAGE_TAG_LATEST || 'latest' }}
  PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # Generous because the nightly builds every layer from scratch (see the
    # `no-cache` note on the publish step) across two platforms, one of them
    # emulated. The slowest kit's first-ever build — cold cache, emulated arm64
    # leg included — took 19 minutes under v2. The failure mode if the cap is
    # hit is a kit that quietly stops being rebuilt, which is worth more
    # headroom than headroom costs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Docker Hub auth follows the same convention as the sandbox-templates
      # pipeline: exchange the GitHub OIDC token for a short-lived Hub token
      # rather than holding a long-lived PAT as a repository secret. The
      # connection is authorised Hub-side against this repository, so there is
      # no credential here to leak or rotate.
      - name: Exchange GitHub OIDC token for Docker Hub access
        if: env.DRY_RUN == ''
        id: docker_oidc
        uses: docker/oidc-action@96ba694c64860c7209bcd1ede7d698c71564ef78 # v1.2.0
        with:
          connection-id: ${{ env.OIDC_CONNECTION_ID }}
          expires-in: 3600
        env:
          # Via env, like every other credential here: one greppable block per
          # step that touches one.
          OIDC_CONNECTION_ID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Log in to Docker Hub
        if: env.DRY_RUN == ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          # An OIDC-exchanged token authenticates as the ORGANISATION that owns
          # the connection, and that organisation is the only namespace it can
          # push to — which is why the username is IMAGE_NAMESPACE rather than a
          # separate coordinate. The two are not independent: moving
          # IMAGE_NAMESPACE means the Hub OIDC connection has to be recreated
          # under the new org and DOCKERHUB_OIDC_CONNECTIONID updated to match.
          # Changing the variable alone produces a login that succeeds as the
          # old org and a push that 403s.
          #
          # v2 wrote the org out as the literal `sbx` and asserted
          # IMAGE_NAMESPACE equalled it. Deriving it says the same thing without
          # a second place to update, now that the namespace has actually moved.
          username: ${{ env.IMAGE_NAMESPACE }}
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Publish
        id: publish
        # The buildx invocation lives in scripts/publish-kit.sh so it can be run
        # — and dry-run — outside CI, which is how the command line gets tested
        # without pushing a branch and waiting:
        #
        #   DRY_RUN=1 scripts/publish-kit.sh claude
        #
        # This step is wiring: credentials above, cache policy below.
        #
        # On a pull request DRY_RUN makes the script build with
        # `--output type=cacheonly` instead of `--push`. It still BUILDS, and
        # that is the point of the PR run — the frontend validates the
        # descriptor during the build and the recipe has to actually work, so a
        # dry run that stopped at "resolved a tag" would let a kit that cannot
        # build report green and fail on merge.
        run: ./scripts/publish-kit.sh "${{ inputs.kit }}" >> "$GITHUB_OUTPUT"
        env:
          # The nightly bypasses the cache. These recipes install their agent
          # from a floating channel with a fixed `RUN … curl … | sh` line, so
          # with the cache on, the instruction text and the build context are
          # identical every night and the install layer is always a hit — under
          # v2, three consecutive nightly builds of one commit published
          # byte-identical rootfs diff IDs under three different manifest
          # digests. The only thing that ever busts that layer is the base image
          # moving, which happens on the BASE's cadence, not the agent's; until
          # then the nightly just republishes yesterday's bytes. That defeats
          # the reason the schedule exists (see build-and-publish-kits.yml's
          # `schedule:` comment).
          #
          # `workflow_dispatch` keeps its cache even though the caller lumps it
          # with `schedule` for deciding WHICH kits to build: a manual run is
          # also how a publish that failed on something unrelated gets retried,
          # and that should not cost an uncached multi-arch rebuild.
          NO_CACHE: ${{ github.event_name == 'schedule' && '1' || '' }}
          CACHE_FROM: type=gha,scope=${{ inputs.kit }}
          CACHE_TO: type=gha,mode=max,scope=${{ inputs.kit }}
          MOVE_LATEST: ${{ inputs.move-latest }}

      - name: Explain a dry run
        if: env.DRY_RUN != ''
        # The script's own summary says what WOULD have been published; this
        # says why it wasn't. Silence would read as "published".
        run: |
          {
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "_Pull request — push credentials are never exposed to PRs._"
            elif [ "${{ github.repository }}" != "docker/sbx-kits-contrib" ]; then
              echo "_Fork — only docker/sbx-kits-contrib publishes._"
            else
              echo "_The \`DOCKERHUB_OIDC_CONNECTIONID\` secret is not set._"
              echo "Configure the Docker Hub OIDC connection for this repository"
              echo "and set that secret to its connection ID."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Gives a repository that has just received its first push a Hub page without
  # waiting for the next docs edit. The docs trigger in hub-overview.yml remains
  # the primary one — the page tracks the default branch, not this run.
  overview:
    needs: publish
    # `!cancelled()` overrides GitHub's implicit `&& success()`, and the
    # explicit result check is what still refuses to sync a page for a kit whose
    # build just failed. `always()` would do the same override but would also
    # run this after the workflow run itself was cancelled; `!cancelled()`
    # doesn't.
    if: "!cancelled() && needs.publish.result == 'success'"
    permissions:
      contents: read
    uses: ./.github/workflows/hub-overview.yml
    secrets: inherit
    with:
      kit: ${{ inputs.kit }}

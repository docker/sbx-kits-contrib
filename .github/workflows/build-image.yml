name: Build kit base images

# Builds and publishes base images for kits that ship their own `Dockerfile`.
#
# Kits are DISCOVERED, not listed: any directory with both a `spec.yaml` and a
# `Dockerfile` is picked up automatically, so adding a kit that publishes its own
# image needs no change to this workflow. That mirrors tck.yml, and it is the
# reason there is no top-level `paths:` filter — all filtering happens in
# detect-changes, which also decides which kits a given event should rebuild.
#
# Conventions a discovered kit must follow:
#
#   * The build context is the kit directory, with `Dockerfile` at its root.
#   * `sandbox.image` in the kit's spec is the source of truth for what gets
#     published — the image name is NOT derived from the directory name, because
#     the two legitimately differ (the `kiro` kit publishes `kiro-image`, leaving
#     `kiro-kit` for the kit artifact). `verify-spec-refs` gates the build on that
#     image living in the namespace CI can push to.
#   * `com.docker.sandboxes.start-docker=true` may only be set on an image that
#     actually ships a Docker engine; the build asserts this.
#
# Shared coordinates (registry, namespace, rolling tag, platforms) come from
# repository/organisation variables with documented fallbacks, so retargeting is
# a settings change rather than a workflow edit. Anything per-kit — the base
# image in particular — belongs in that kit's Dockerfile, not here.
#
# A kit's `sandbox.image` cannot be parameterised — specs are consumed literally,
# with no env interpolation (see spec/types.go). Rather than duplicate the name
# here and risk drift, this workflow READS it from the spec and publishes exactly
# that. `verify-spec-refs` is the guard on that trust: it refuses to build a kit
# whose declared image sits outside the namespace CI authenticates to.

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, because these images track moving upstreams rather than pinned
  # versions: agents are typically installed from a `latest` channel and bases
  # are floating tags, so a rebuild is the only way a new agent release reaches
  # users of the kit — and it surfaces upstream breakage in CI rather than in
  # someone's sandbox.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # Required to mint the GitHub OIDC token that is exchanged for a short-lived
  # Docker Hub token. An explicit permissions block narrows the repo default, so
  # omitting this fails the exchange rather than falling back to it.
  id-token: write

env:
  REGISTRY: ${{ vars.REGISTRY || 'docker.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || 'sbx' }}
  IMAGE_TAG_LATEST: ${{ vars.IMAGE_TAG_LATEST || 'latest' }}
  PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
  # Kits published as OCI artifacts (`<kit>-kit`), space-separated. This is an
  # allow-list, not discovery: EVERY kit in the repo is pushable, so discovering
  # them would publish all of them. Widen it with a repository variable once the
  # distribution story is settled for the rest.
  #
  # Constraint worth knowing before widening it: entries are intersected with
  # the kits this workflow discovers, and it discovers by Dockerfile. A kit that
  # ships no Dockerfile therefore never appears here however it is spelled —
  # publishing a mixin's artifact needs the discovery above widened first.
  PUBLISH_KITS: ${{ vars.PUBLISH_KITS || 'kiro' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Kits to rebuild for this event.
      kits: ${{ steps.collect.outputs.kits }}
      # Every image-publishing kit, regardless of what changed — the drift check
      # validates all specs, not just the ones touched.
      all: ${{ steps.collect.outputs.all }}
      # Kits whose ARTIFACT is published this run: the intersection of what
      # changed with the PUBLISH_KITS allow-list.
      artifacts: ${{ steps.collect.outputs.artifacts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Discover image-publishing kits
        id: discover
        run: |
          set -euo pipefail
          kits=""
          for f in */Dockerfile; do
            [ -f "$f" ] || continue
            kit=$(dirname "$f")
            # A Dockerfile alone is not a kit; require a spec too.
            if [ ! -f "$kit/spec.yaml" ] && [ ! -f "$kit/spec.yml" ]; then
              continue
            fi
            kits="${kits} ${kit}"
          done
          echo "Discovered image-publishing kits:${kits:-" (none)"}"
          echo "kits=${kits# }" >> "$GITHUB_OUTPUT"

      - name: Generate filters
        id: filter-setup
        # One filter per discovered kit, matching the whole kit directory minus
        # what the image cannot depend on. Written as exclusions rather than an
        # allowlist of sources on purpose: an allowlist silently stops matching
        # once a Dockerfile starts COPYing a new file, leaving the published
        # image stale until the next nightly. spec.yaml is deliberately NOT
        # excluded — the drift check reads it.
        run: |
          set -euo pipefail
          filters=""
          for kit in ${{ steps.discover.outputs.kits }}; do
            filters=$(printf '%s\n%s:\n  - "%s/**"\n  - "!%s/README.md"\n  - "!%s/testdata/**"' \
              "$filters" "$kit" "$kit" "$kit" "$kit")
          done
          # Shared inputs rebuild everything.
          filters=$(printf '%s\nshared:\n  - ".github/workflows/build-image.yml"\n  - "scripts/check-image-ref.sh"' "$filters")

          echo "filters<<EOF" >> "$GITHUB_OUTPUT"
          echo "$filters" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "$filters"

      - name: Filter changes
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: ${{ steps.filter-setup.outputs.filters }}
          # Local git diff rather than the API, so fork PRs work with a
          # restricted GITHUB_TOKEN.
          token: ""

      - name: Collect kits to build
        id: collect
        run: |
          set -euo pipefail
          all=$(printf '%s\n' ${{ steps.discover.outputs.kits }} | jq -R . | jq -sc .)
          echo "all=${all}" >> "$GITHUB_OUTPUT"

          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              # Nothing "changed"; the point is to rebuild against moving
              # upstreams, so rebuild everything.
              kits="${all}"
              ;;
            *)
              changes='${{ steps.filter.outputs.changes }}'
              if echo "${changes}" | jq -e 'index("shared")' >/dev/null 2>&1; then
                # This workflow or the drift check changed — rebuild everything.
                kits="${all}"
              else
                kits=$(echo "${changes}" | jq -c '[.[] | select(. != "shared")]')
              fi
              ;;
          esac

          echo "kits=${kits:-[]}" >> "$GITHUB_OUTPUT"
          echo "Building: ${kits}"

          # Kit artifacts are published for the allow-listed kits only, and the
          # list is intersected with what is being built rather than used
          # directly — a kit named here but not rebuilt this run has nothing new
          # to publish. jq does the intersection so an entry that names a
          # non-existent kit simply drops out instead of minting an empty job.
          allow=$(printf '%s\n' ${PUBLISH_KITS} | jq -R . | jq -sc .)
          artifacts=$(jq -cn --argjson a "${kits:-[]}" --argjson b "${allow}" '$a - ($a - $b)')
          echo "artifacts=${artifacts}" >> "$GITHUB_OUTPUT"
          echo "Publishing kit artifacts for: ${artifacts}"

  # Gates the build. Checks every kit that ships a Dockerfile — not just the ones
  # being rebuilt — and asserts its declared image is one this pipeline may
  # publish. Kits are found by scanning for Dockerfiles rather than from a list,
  # so there is no per-kit entry to leave stale (a stale one would silently skip
  # the check rather than fail).
  verify-spec-refs:
    needs: detect-changes
    if: needs.detect-changes.outputs.all != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify kit specs reference published images
        run: |
          set -euo pipefail
          ./scripts/check-image-ref.sh "${REGISTRY}/${IMAGE_NAMESPACE}" "${IMAGE_TAG_LATEST}"

  build:
    needs: [detect-changes, verify-spec-refs]
    if: >-
      needs.detect-changes.outputs.kits != '[]' &&
      needs.detect-changes.outputs.kits != 'null' &&
      needs.detect-changes.outputs.kits != ''
    strategy:
      # One kit's breakage must not hide another's result.
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.detect-changes.outputs.kits) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image coordinates
        id: coords
        # Composed once and published via $GITHUB_OUTPUT so the build, the tag
        # re-point and the summary all consume the same string.
        #
        # PUSH is false for pull_request (a fork PR must never be able to
        # publish) and false until the Docker Hub OIDC connection is configured,
        # which gives a useful dry-run mode: CI still builds every platform and
        # publishes nothing.
        env:
          # Read through env rather than interpolated into the script body: a
          # secret spliced straight into `run:` becomes shell source, so a value
          # containing shell syntax would execute. Only its emptiness is tested
          # here; the value itself is never echoed.
          OIDC_CONNECTION_ID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
        run: |
          set -euo pipefail

          # The Hub org is fixed: the OIDC connection is owned by `sbx` and the
          # token it mints authenticates as that org, so a namespace pointing
          # anywhere else could never be pushed to with these credentials.
          # Failing here beats a login that succeeds and a push that 403s.
          if [ "${IMAGE_NAMESPACE}" != "sbx" ]; then
            echo "::error::IMAGE_NAMESPACE is '${IMAGE_NAMESPACE}', but the Docker Hub OIDC connection is owned by 'sbx'. Publishing elsewhere needs a new connection, not a variable change."
            exit 1
          fi

          # The kit's spec owns the image name; a spec cannot interpolate env, so
          # deriving a name here would just be a second source of truth to drift.
          # verify-spec-refs has already confirmed this lands in our namespace.
          spec="${{ matrix.kit }}/spec.yaml"
          [ -f "$spec" ] || spec="${{ matrix.kit }}/spec.yml"
          declared=$(awk '
            /^sandbox:/      { in_sandbox = 1; next }
            /^[^[:space:]#]/ { in_sandbox = 0 }
            in_sandbox && $1 == "image:" {
              gsub(/^[[:space:]]*image:[[:space:]]*/, "")
              gsub(/^["'"'"']|["'"'"']$/, "")
              print; exit
            }
          ' "$spec")
          if [ -z "$declared" ]; then
            echo "::error::${{ matrix.kit }}: spec declares no sandbox.image"
            exit 1
          fi
          # Strip tag/digest — this pipeline owns the tags it publishes.
          image=${declared%%@*}
          image=${image%:*}
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Declared in spec: ${declared}"

          # The immutable tag carries BOTH the build date and the commit, because
          # the image content is not a function of the commit alone: agents are
          # installed from `latest` channels and bases are floating tags, so a
          # nightly rebuild of an unchanged commit can produce different bits. A
          # bare :<sha> would therefore be overwritten with new content while
          # claiming to identify a source revision — exactly what someone pinning
          # a SHA is trying to avoid. So no bare :<sha> is published.
          build_date=$(date -u +%Y%m%d)
          echo "dated=${GITHUB_SHA}-${build_date}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "pull_request" ] \
             && [ "${{ github.repository }}" = "docker/sbx-kits-contrib" ] \
             && [ -n "${OIDC_CONNECTION_ID}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Resolved image: ${image}"
          echo "  immutable tag: ${image}:${GITHUB_SHA}-${build_date}"
          echo "  rolling tag:   ${image}:${IMAGE_TAG_LATEST}"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build for verification (single platform, loaded locally)
        # The multi-arch build below produces a manifest list, which cannot be
        # `docker run`. This extra single-platform build shares the same gha
        # cache, so it costs little, and gives a concrete image to assert
        # against. It runs on pull requests too — the point is to catch a broken
        # image before it is published, not after.
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.kit }}
          file: ${{ matrix.kit }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.coords.outputs.image }}:ci-verify
          cache-from: type=gha,scope=${{ matrix.kit }}
          cache-to: type=gha,mode=max,scope=${{ matrix.kit }}

      - name: Verify the built image
        # Kit-agnostic assertions, derived from the image itself rather than from
        # per-kit configuration:
        #
        #   1. The command the sandbox will run must exist on PATH. Taken from
        #      the image's own CMD, which the kit's Dockerfile sets to match its
        #      spec entrypoint.
        #   2. `start-docker=true` is a *request* to the runtime, not a
        #      description of the image. An image that asks for
        #      Docker-in-Docker without shipping an engine yields a sandbox
        #      started in Docker mode with nothing to run, so the claim is
        #      checked against reality.
        #   3. Sandboxes do not run as root.
        run: |
          set -euo pipefail
          img="${{ steps.coords.outputs.image }}:ci-verify"

          # `index` is guarded: on an image with no CMD (or no labels at all) an
          # unguarded template aborts with "map has no entry for key" — under
          # `set -e` that fails the step with a parser error instead of the
          # actionable message below. Guarded, the value is simply empty.
          cmd=$(docker inspect --format '{{ if .Config.Cmd }}{{ index .Config.Cmd 0 }}{{ end }}' "$img")
          user=$(docker inspect --format '{{ .Config.User }}' "$img")
          label=$(docker inspect --format \
            '{{ if .Config.Labels }}{{ index .Config.Labels "com.docker.sandboxes.start-docker" }}{{ end }}' "$img")
          echo "kit=${{ matrix.kit }} cmd=${cmd} user=${user} start-docker=${label}"

          if [ -z "$cmd" ]; then
            echo "::error::${{ matrix.kit }}: image sets no CMD, so the sandbox entrypoint cannot be verified"
            exit 1
          fi
          docker run --rm --entrypoint sh "$img" -c \
            'command -v "$1" >/dev/null || { echo "MISSING on PATH: $1"; exit 1; }' _ "$cmd"

          if [ "$label" = "true" ]; then
            docker run --rm --entrypoint sh "$img" -c '
              set -e
              for bin in dockerd docker containerd; do
                command -v "$bin" >/dev/null || { echo "MISSING: $bin"; exit 1; }
              done
            ' || {
              echo "::error::${{ matrix.kit }}: start-docker=true but the image ships no Docker engine — check the base image"
              exit 1
            }
          fi

          case "$user" in
            ""|root|0)
              echo "::error::${{ matrix.kit }}: image runs as '${user:-root}'; sandbox images must run as a non-root user"
              exit 1
              ;;
          esac

          echo "${{ matrix.kit }} verified."

      # Docker Hub auth follows the same convention as the sandbox-templates
      # pipeline: exchange the GitHub OIDC token for a short-lived Hub token
      # rather than holding a long-lived PAT as a repository secret. The
      # connection is authorised Hub-side against this repository, so there is
      # no credential here to leak or rotate.
      - name: Exchange GitHub OIDC token for Docker Hub access
        if: steps.coords.outputs.push == 'true'
        id: docker_oidc
        uses: docker/oidc-action@b048fb089ace3e15a5fbdd784f4784d284ce5e8d # v1.1.0
        with:
          connection-id: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          expires-in: 3600

      - name: Log in to Docker Hub
        if: steps.coords.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          # An OIDC-exchanged token authenticates as the ORGANISATION that owns
          # the connection, so the username is that org — not a user account and
          # not the literal "docker". It is the connection's identity rather than
          # a coordinate this pipeline gets to choose, which is why it is written
          # out here instead of derived from IMAGE_NAMESPACE; the coords step
          # asserts the two agree.
          username: sbx
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Build (and push the immutable tag)
        id: build
        # Only the immutable <sha>-<date> tag is built and pushed here; the
        # rolling tag is re-pointed at this manifest in the next step rather than
        # built again.
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.kit }}
          file: ${{ matrix.kit }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.coords.outputs.push == 'true' }}
          tags: ${{ steps.coords.outputs.image }}:${{ steps.coords.outputs.dated }}
          cache-from: type=gha,scope=${{ matrix.kit }}
          cache-to: type=gha,mode=max,scope=${{ matrix.kit }}

      - name: Re-point the rolling tag at that manifest
        if: steps.coords.outputs.push == 'true'
        # `imagetools create` copies an existing manifest list to a new tag
        # without rebuilding, so both tags are guaranteed to resolve to the SAME
        # digest. Rebuilding for the rolling tag could produce different bits —
        # bases float and installers fetch `latest` — which is exactly the
        # divergence this avoids.
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${IMAGE_TAG_LATEST}" \
            "${IMAGE}:${DATED}"
        env:
          IMAGE: ${{ steps.coords.outputs.image }}
          DATED: ${{ steps.coords.outputs.dated }}

      - name: Summarise
        run: |
          {
            echo "## ${{ matrix.kit }}"
            echo ""
            if [ "${{ steps.coords.outputs.push }}" = "true" ]; then
              echo "Published — both tags resolve to the same digest:"
              echo ""
              echo '- `${{ steps.coords.outputs.image }}:${{ steps.coords.outputs.dated }}` — immutable, one per build'
              echo '- `${{ steps.coords.outputs.image }}:${{ env.IMAGE_TAG_LATEST }}` — rolling'
            else
              echo "**Dry run — nothing published.**"
              echo ""
              if [ "${{ github.event_name }}" = "pull_request" ]; then
                echo "Reason: pull request (push credentials are never exposed to PRs)."
              else
                echo "Reason: the \`DOCKERHUB_OIDC_CONNECTIONID\` secret is not set."
                echo "Configure the Docker Hub OIDC connection for this"
                echo "repository and set that variable to its connection ID."
              fi
              echo ""
              echo 'Would have published `${{ steps.coords.outputs.image }}`.'
            fi
            echo ""
            echo "Platforms: \`${{ env.PLATFORMS }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the KIT ARTIFACT — the spec + files packaged as an OCI artifact —
  # at <registry>/<namespace>/<kit>-kit. Distinct from the job above, which
  # publishes the IMAGE the kit's sandbox boots from. The `-kit` / `-image`
  # split is why both can live in one namespace.
  #
  # Ordered after `build` so a kit is never published pointing at an image that
  # was not: the push records the declared sandbox image in its provenance.
  publish-kit:
    needs: [detect-changes, build]
    # No `schedule`: a kit's content is a pure function of the commit, unlike
    # the image it references, so a nightly re-push would mint a new manifest
    # digest for identical bytes. (`oras.PackManifest` stamps
    # org.opencontainers.image.created, so a kit push is never byte-identical
    # to the last one.)
    if: >-
      github.event_name != 'schedule' &&
      needs.detect-changes.outputs.artifacts != '[]' &&
      needs.detect-changes.outputs.artifacts != 'null' &&
      needs.detect-changes.outputs.artifacts != ''
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.detect-changes.outputs.artifacts) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve kit coordinates
        id: coords
        # The reference is COMPOSED here, never taken from a spec or an input.
        # `sbx kit push` uses whatever reference it is handed verbatim — it
        # derives nothing from the kit name and validates nothing against it —
        # so a typo would push a kit manifest over an unrelated tag in this
        # namespace, the image's included. Deriving it from the matrix kit name
        # leaves nothing to mistype.
        run: |
          set -euo pipefail
          kit_ref="${REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.kit }}-kit"
          echo "ref=${kit_ref}" >> "$GITHUB_OUTPUT"

          # Same scheme as the image: the commit alone does not identify the
          # bytes, because a re-push of an unchanged tree still produces a new
          # manifest digest. Date + SHA keeps every published artifact
          # addressable and never overwritten.
          echo "dated=${GITHUB_SHA}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "pull_request" ] \
             && [ "${{ github.repository }}" = "docker/sbx-kits-contrib" ] \
             && [ -n "${OIDC_CONNECTION_ID}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          OIDC_CONNECTION_ID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Install sbx
        run: |
          set -euo pipefail
          version=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/docker/sbx-releases/releases/latest | jq -r .tag_name)
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://github.com/docker/sbx-releases/releases/download/${version}/DockerSandboxes-linux.tar.gz" \
            -o /tmp/DockerSandboxes-linux.tar.gz
          tar xzf /tmp/DockerSandboxes-linux.tar.gz -C /tmp
          sudo PREFIX="${HOME}/.docker/sbx" /tmp/docker-sbx/install.sh
          echo "${HOME}/.docker/sbx/bin" >> "$GITHUB_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the kit
        # Runs on pull requests too — the point is to catch an unpushable kit on
        # the PR rather than at publish time. `sbx kit` is daemon-free (only
        # `kit add` needs sandboxd), so this needs no VM and no KVM.
        run: sbx kit validate "${{ matrix.kit }}"

      - name: Exchange GitHub OIDC token for Docker Hub access
        if: steps.coords.outputs.push == 'true'
        id: docker_oidc
        uses: docker/oidc-action@b048fb089ace3e15a5fbdd784f4784d284ce5e8d # v1.1.0
        with:
          connection-id: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          expires-in: 3600

      - name: Log in to Docker Hub
        if: steps.coords.outputs.push == 'true'
        # `sbx kit push` authenticates via the Docker credential store, so this
        # login is the whole auth story — there is no sbx-side credential to
        # set up, and none of the Secret Service scaffolding the e2e workflow
        # needs for `sbx login`.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: sbx
          password: ${{ steps.docker_oidc.outputs.token }}

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        if: steps.coords.outputs.push == 'true'
        with:
          version: "1.3.3"

      - name: Push the kit (immutable tag)
        id: push
        if: steps.coords.outputs.push == 'true'
        # --sign is keyless: the Sigstore identity comes from this job's ambient
        # GitHub OIDC token, which is why `id-token: write` is required above.
        # Every push also attaches a SLSA provenance referrer recording the
        # kit's content digests, its declared sandbox image, and this commit.
        run: |
          set -euo pipefail
          sbx kit push "${{ matrix.kit }}" "${REF}:${DATED}" --sign

          # Resolve what was actually pushed. The digest is not echoed by the
          # push, and re-reading the tag later would let a racing push swap the
          # manifest we then advertise as `latest`.
          digest=$(oras manifest fetch --descriptor "${REF}:${DATED}" | jq -r .digest)
          [ -n "${digest}" ] && [ "${digest}" != "null" ]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${REF}:${DATED} (${digest})"
        env:
          REF: ${{ steps.coords.outputs.ref }}
          DATED: ${{ steps.coords.outputs.dated }}

      - name: Re-point the rolling tag at that manifest
        if: steps.coords.outputs.push == 'true'
        # Retag by digest rather than pushing a second time. A second push would
        # re-pack the kit and land a DIFFERENT digest under `latest` — the tags
        # would describe the same source but not the same artifact — and would
        # attach a duplicate provenance referrer. `oras tag` adds a tag to the
        # manifest already in the registry, so both tags resolve to one digest
        # and share one signature.
        #
        # Not `buildx imagetools`: it wraps a single source in an index, which
        # would change the artifact's media type.
        run: |
          set -euo pipefail
          oras tag "${REF}@${DIGEST}" "${IMAGE_TAG_LATEST}"
        env:
          REF: ${{ steps.coords.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Summarise
        run: |
          {
            echo "## ${{ matrix.kit }} (kit artifact)"
            echo ""
            if [ "${{ steps.coords.outputs.push }}" = "true" ]; then
              echo "Published — both tags resolve to \`${{ steps.push.outputs.digest }}\`:"
              echo ""
              echo '- `${{ steps.coords.outputs.ref }}:${{ steps.coords.outputs.dated }}` — immutable, one per push'
              echo '- `${{ steps.coords.outputs.ref }}:${{ env.IMAGE_TAG_LATEST }}` — rolling'
              echo ""
              echo "Signed keyless (Sigstore), with a SLSA provenance referrer."
            else
              echo "**Dry run — validated, nothing published.**"
              echo ""
              if [ "${{ github.event_name }}" = "pull_request" ]; then
                echo "Reason: pull request (push credentials are never exposed to PRs)."
              else
                echo "Reason: the \`DOCKERHUB_OIDC_CONNECTIONID\` secret is not set."
              fi
              echo ""
              echo 'Would have published `${{ steps.coords.outputs.ref }}`.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

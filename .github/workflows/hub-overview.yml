name: Sync Docker Hub overviews

# Pushes each published kit's Hub repository page: the overview (from a README)
# and the short description (from spec.yaml).
#
# Triggered by DOCUMENTATION changes, not by publishing — and also called by
# build-and-publish-kits.yml after a publish, so a repository that has just received its
# first push gets a page without waiting for the next docs edit.
#
# Why the docs trigger is the primary one: the Hub page is the only user-facing
# documentation for these repositories, and a README edit is exactly the change
# build-and-publish-kits.yml filters OUT of a rebuild (README.md is not an input to the
# image). Syncing only on publish would leave the page stale by default and
# correct by accident, and would make fixing a typo require either an unrelated
# code change or an artifact re-push that mints a new digest for identical bytes.
#
# The page therefore tracks the default branch while `latest` tracks the last
# publish. Those are different statements — Hub has one overview per repository,
# not one per tag — and the relationship is the same as a GitHub README's to the
# last release.
#
# Each publishing kit owns two Hub repositories and they get DIFFERENT text:
#
#   <kit>-kit    ← <kit>/README.md         the kit: how to run it, what it does
#   <kit>-image  ← <kit>/README.image.md   the image the kit boots from
#
# Pointing both at the kit's README would leave someone on the image page being
# told to `sbx run --kit …`, which is not what they pulled.

on:
  push:
    branches: [main]
    paths:
      - "*/README.md"
      - "*/README.image.md"
      - "*/spec.yaml"
      - ".github/workflows/hub-overview.yml"
      - "scripts/hub-repo-ready.sh"
      - "scripts/kit-meta.sh"
  workflow_dispatch: {}
  workflow_call:
    inputs:
      kit:
        description: |
          Sync only this kit. Used by build-and-publish-kits.yml after publishing it; the
          docs trigger leaves it empty and syncs every discovered kit.
        type: string
        default: ""

permissions:
  contents: read

env:
  # A pull request validates and reports, but never writes: the Hub page is
  # production metadata for the default branch, and an unmerged branch has no
  # business overwriting it. Checked here rather than in each caller so every
  # entry point inherits it — build-and-publish-kits.yml calls this workflow on PRs too, where
  # the publish itself is already a dry run.
  DRY_RUN: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    if: github.repository == 'docker/sbx-kits-contrib'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kits: ${{ steps.kits.outputs.list }}
      # Whichever gate ran. Exactly one does: they are mutually exclusive on
      # DRY_RUN, and the pull-request one never touches a credential.
      ready: ${{ steps.gate.outputs.ready || steps.gate-pr.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the kits to sync
        id: kits
        # Same discovery as publishing: every directory with a spec.yaml is a
        # candidate. A kit with no Hub repository yet is not an error — the
        # "Is the kit artifact's repository published?" step below skips it
        # gracefully, the same way it skips one waiting on its first publish.
        run: |
          set -euo pipefail
          if [ -n "${ONE_KIT}" ]; then
            list=$(printf '%s' "${ONE_KIT}" | jq -R . | jq -sc .)
          else
            list=$(scripts/discover-kits.sh | jq -R . | jq -sc .)
          fi
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          echo "Syncing overviews for: ${list}"
        env:
          ONE_KIT: ${{ inputs.kit }}

      # Two gates, mutually exclusive, so the credential is NEVER referenced on
      # the pull-request path.
      #
      # Guarding only the write was not enough. `secrets.*` in a step's `env:`
      # is materialised into that step's environment when the step runs, and a
      # same-repository pull request both receives secrets and supplies the
      # workflow code — so a PR could edit this step to print the token, with
      # DRY_RUN faithfully skipping a write that was never the point. The fix is
      # not to reference the secret at all when DRY_RUN is set.
      #
      # Raised by @ilopezluna in review.
      - name: Validation only (pull request)
        id: gate-pr
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Pull request — overviews are validated, never written, and no Hub credential is read."

      - name: Check the credentials are available
        id: gate
        if: env.DRY_RUN != 'true'
        # A notice and a skip rather than a failure, so a repository without
        # these secrets is not red over optional infrastructure.
        run: |
          set -euo pipefail
          if [ -n "${TOKEN}" ] && [ -n "${USERNAME}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERPUBLICBOT_DELETE_PAT / DOCKERPUBLICBOT_USERNAME are not set — Hub overviews are not being synced."
          fi
        env:
          TOKEN: ${{ secrets.DOCKERPUBLICBOT_DELETE_PAT }}
          USERNAME: ${{ vars.DOCKERPUBLICBOT_USERNAME }}

  overview:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.resolve.outputs.kits) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Hub metadata
        id: meta
        run: ./scripts/kit-meta.sh "${{ matrix.kit }}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || 'sbx' }}

      # Hub renders an overview only for a repository that has something in it,
      # and PATCHing one that does not exist fails. Both are skips, not errors:
      # a kit can legitimately be waiting on its first publish. A transport
      # failure is NOT a skip — the script exits non-zero for that.
      - name: Is the kit artifact's repository published?
        id: kit-repo
        run: ./scripts/hub-repo-ready.sh "${{ steps.meta.outputs.kit-repository }}" >> "$GITHUB_OUTPUT"

      - name: Sync the kit artifact's overview
        if: steps.kit-repo.outputs.ready == 'true' && env.DRY_RUN != 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ env.HUB_USERNAME }}
          password: ${{ env.HUB_TOKEN }}
          repository: ${{ steps.meta.outputs.kit-repository }}
          readme-filepath: ./${{ matrix.kit }}/README.md
          short-description: ${{ steps.meta.outputs.short-description }}
          # Kit READMEs link to siblings with relative paths (../PUBLISHING.md),
          # which resolve to nothing on Hub.
          enable-url-completion: true
        env:
          # Secrets reach the step through env rather than inline in `with:`, so
          # every place a credential enters a step is one greppable block. The
          # `if:` above is what keeps it off the pull-request path; this is the
          # habit that keeps it correct if the step ever becomes a `run:`, where
          # inline interpolation would put the value into shell source.
          HUB_USERNAME: ${{ vars.DOCKERPUBLICBOT_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERPUBLICBOT_DELETE_PAT }}

      - name: Does this kit own the base image it references?
        id: image-owned
        # A kit owns (and therefore may describe) its base image repository
        # only if it builds that image itself AND has written docs for it —
        # computed once here, in outputs, rather than as inline hashFiles()
        # calls repeated at both the gate below and in "Report what happened",
        # so the two can never silently diverge if this ever changes.
        #
        # has-dockerfile guards a real, previously-latent bug: most kits boot
        # from a shared template (docker/sandbox-templates) or a third-party
        # image (nanoclaw's nanoco/nanoclaw) rather than one built and owned by
        # the kit itself — kit-meta.sh resolves image-repository from
        # sandbox.image regardless of who owns that repository. Without this
        # guard, every one of those kits' matrix legs would try to PATCH the
        # SAME shared (or someone else's) Hub repository with ITS OWN
        # kit-specific "Base image for the <kit> kit" text — a last-write-wins
        # race across unrelated kits, or an overwrite of a repository this
        # project doesn't own the narrative for. The same Dockerfile-presence
        # signal build-and-publish-kits.yml and publish-one-kit.yml gate the
        # actual image build/push on (`has-image`); today that's only `kiro`,
        # the one kit this workflow was built and tested against.
        #
        # has-readme guards a second failure mode: the sync step below hands
        # its path straight to peter-evans/dockerhub-description with no
        # existence check of its own, so a kit with a Dockerfile but no
        # README.image.md would otherwise reach that step and fail on a
        # missing file instead of skipping cleanly.
        #
        # hashFiles() sees these here because checkout already ran earlier in
        # this same job — a step-level `if:`/expression, unlike a job-level
        # one, evaluates after prior steps in the same job have run.
        run: |
          echo "has-dockerfile=${HAS_DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "has-readme=${HAS_README}" >> "$GITHUB_OUTPUT"
        env:
          HAS_DOCKERFILE: ${{ hashFiles(format('{0}/Dockerfile', matrix.kit)) != '' }}
          HAS_README: ${{ hashFiles(format('{0}/README.image.md', matrix.kit)) != '' }}

      - name: Is the base image's repository published?
        id: image-repo
        # Absent output means the kit builds no image — kit-meta.sh omits it
        # rather than emitting it empty, precisely so this can branch on it.
        if: >-
          steps.meta.outputs.image-repository != '' &&
          steps.image-owned.outputs.has-dockerfile == 'true' &&
          steps.image-owned.outputs.has-readme == 'true'
        run: ./scripts/hub-repo-ready.sh "${{ steps.meta.outputs.image-repository }}" >> "$GITHUB_OUTPUT"

      - name: Sync the base image's overview
        if: steps.image-repo.outputs.ready == 'true' && env.DRY_RUN != 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ env.HUB_USERNAME }}
          password: ${{ env.HUB_TOKEN }}
          repository: ${{ steps.meta.outputs.image-repository }}
          readme-filepath: ./${{ matrix.kit }}/README.image.md
          short-description: ${{ steps.meta.outputs.image-short-description }}
          enable-url-completion: true
        env:
          HUB_USERNAME: ${{ vars.DOCKERPUBLICBOT_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERPUBLICBOT_DELETE_PAT }}

      - name: Report what happened
        # Silence would read as "synced". A skipped page is a page still showing
        # whatever it showed before, which is worth saying out loud.
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Pull request — overviews validated, nothing written."
          fi
          [ "${{ steps.kit-repo.outputs.ready }}" = "true" ] ||
            echo "::notice::${{ steps.meta.outputs.kit-repository }} has nothing published — overview not synced."
          if [ -n "${{ steps.meta.outputs.image-repository }}" ]; then
            if [ "${{ steps.image-owned.outputs.has-dockerfile }}" != "true" ]; then
              echo "::notice::${{ matrix.kit }} does not build its own image — nothing to sync to ${{ steps.meta.outputs.image-repository }}, which it does not own."
            elif [ "${{ steps.image-owned.outputs.has-readme }}" != "true" ]; then
              echo "::notice::${{ matrix.kit }} has no README.image.md — nothing to sync to ${{ steps.meta.outputs.image-repository }}."
            elif [ "${{ steps.image-repo.outputs.ready }}" != "true" ]; then
              echo "::notice::${{ steps.meta.outputs.image-repository }} has nothing published — overview not synced."
            fi
          fi

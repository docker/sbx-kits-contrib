name: Kit e2e

# Reusable e2e runner. Installs a real `sbx` CLI for the requested `channel`,
# authenticates against Docker Hub non-interactively, and runs
# `./scripts/test-kit-e2e.sh <kit>` across the caller-supplied kit matrix.
#
# The whole point of parametrizing `channel` here — instead of hardcoding a
# version — is that tck.yml calls this twice:
#   * channel: rc       → the latest sbx-releases prerelease tagged "*-rcN"
#                         (gates the PR via the `e2e` job)
#   * channel: nightly  → the rolling nightly build (informational only)
# so kits are exercised both against the build closest to shipping and against
# what sbx will ship next, without nightly ever blocking a merge.
#
# `channel: release` is still accepted and still resolves, but tck.yml no longer
# calls it: the stable line predates kit v3 and cannot load these kits at all. See
# the comment on the e2e legs in tck.yml.
#
# WHAT V3 REMOVED FROM THIS WORKFLOW
#
# `sbx run ./<kit>` takes a kit in SOURCE form and builds it on demand, so the
# branch's own descriptor and recipe are what run, by construction. That deleted
# the entire side-loading dance the v2 version needed — build the kit's image with
# docker, `docker save` it, `sbx template load` it into the scoped daemon's store,
# create with `--pull=never` — which existed only to stop a stale published image
# from being tested instead of the branch. With it went this workflow's need for Go
# (the e2e harness was a `go test`) and for a builder: sbx does the building now.

on:
  workflow_call:
    inputs:
      kits:
        description: JSON array of kit directories to test.
        required: true
        type: string
      channel:
        description: sbx build channel to test against — "rc", "nightly", or "release".
        required: true
        type: string

permissions:
  contents: read

env:
  APP_NAME: sbx-kits-contrib-tck

jobs:
  prepare-sbx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Downloaded ONCE here and shared with the kit matrix as an artifact, rather
      # than having every matrix leg fetch the same release asset again.
      #
      # The channel → version lookup is scripts/install-sbx.sh's `--resolve`, so
      # there is exactly one definition of what "rc" means and a developer
      # installing sbx by hand gets the same build CI tested. This job cannot just
      # run install-sbx.sh outright: that installs, and what is wanted here is the
      # tarball itself, to hand to the matrix.
      - name: Download sbx (${{ inputs.channel }})
        env:
          CHANNEL: ${{ inputs.channel }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(./scripts/install-sbx.sh --resolve "$CHANNEL")
          if [ -z "$VERSION" ]; then
            echo "::error::No sbx version found for ${CHANNEL}"
            exit 1
          fi
          echo "Using sbx ${CHANNEL}: ${VERSION}"
          mkdir -p "${RUNNER_TEMP}/sbx-package"
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://github.com/docker/sbx-releases/releases/download/${VERSION}/DockerSandboxes-linux.tar.gz" \
            -o "${RUNNER_TEMP}/sbx-package/DockerSandboxes-linux.tar.gz"
          tar tzf "${RUNNER_TEMP}/sbx-package/DockerSandboxes-linux.tar.gz" > /dev/null
          printf '%s\n' "$VERSION" > "${RUNNER_TEMP}/sbx-package/version"

      - name: Share sbx with kit matrix
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbx-${{ inputs.channel }}-linux-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sbx-package/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  test-kit-e2e:
    needs: prepare-sbx
    # End-to-end test: install sbx for the requested channel, authenticate against
    # Docker Hub non-interactively, and compose the kit into a real sandbox. The
    # caller guards this against fork PRs (Docker Hub secrets are not exposed
    # there).
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJson(inputs.kits) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM access
        run: |
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Download prepared sbx
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-sbx.outputs.artifact-id }}
          path: ${{ runner.temp }}/sbx-package
          merge-multiple: true

      - name: Install sbx
        run: |
          set -euo pipefail
          tar xzf "${RUNNER_TEMP}/sbx-package/DockerSandboxes-linux.tar.gz" -C "${RUNNER_TEMP}/sbx-package"
          echo "SBX_VERSION=$(cat "${RUNNER_TEMP}/sbx-package/version")" >> "$GITHUB_ENV"
          # The installer runs under sudo, so create the parent unprivileged
          # first: if ~/.docker is absent it would be created root-owned, and
          # anything later wanting to write ~/.docker/config.json then cannot.
          # Same reasoning as scripts/install-sbx.sh, which does this for the same
          # reason on a developer machine.
          mkdir -p "${HOME}/.docker"
          sudo PREFIX="${HOME}/.docker/sbx" "${RUNNER_TEMP}/sbx-package/docker-sbx/install.sh"
          echo "${HOME}/.docker/sbx/bin" >> "$GITHUB_PATH"

      - name: Verify sbx installation
        run: sbx version

      - name: Sign in to Docker Hub via sbx
        env:
          USERNAME: ${{ vars.DOCKERPUBLICBOT_USERNAME }}
          TOKEN: ${{ secrets.DOCKERPUBLICBOT_WRITE_PAT }}
        run: |
          if [ -z "${USERNAME}" ] || [ -z "${TOKEN}" ]; then
            echo "DOCKERPUBLICBOT_USERNAME / DOCKERPUBLICBOT_WRITE_PAT not configured; cannot run e2e."
            exit 1
          fi
          # Defensive trim: GH preserves any whitespace pasted into the
          # secret editor, and sbx's readPasswordStdin only strips trailing
          # \r\n. Hub usernames and PATs are alphanumeric + hyphens, so
          # stripping all whitespace can't corrupt a legitimate value.
          USER_CLEAN=$(printf '%s' "$USERNAME" | tr -d '[:space:]')
          TOKEN_CLEAN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          printf '%s' "$TOKEN_CLEAN" | sbx --app-name "$APP_NAME" login --username "$USER_CLEAN" --password-stdin

      # matrix.kit comes from directory names in the PR's own checkout, so it is
      # passed via env rather than interpolated into the script text: a directory
      # name containing shell metacharacters must not be able to inject commands.
      - name: Run e2e for ${{ matrix.kit }}
        # The script handles `sbx --app-name $APP_NAME policy init deny-all`
        # internally, so CI and local runs converge on the same baseline: each kit
        # gets *exactly* the outbound reachability its network-policy@1 capability
        # declares and nothing more, which is what makes this a contract test
        # rather than an assumption. Kit allow-rules are scoped per sandbox and
        # punch through the default deny (see `ApplyKitNetworkPolicyScoped` in
        # docker/sandboxes:sandboxd/pkg/server/options_governance.go); kit
        # deny-rules win over allow-rules (deny-wins).
        #
        # It also reads the policy log on the way out and FAILS on a blocked
        # request even when everything else passed — a hook that pipes an
        # unchecked `curl` into a parser succeeds with empty input, so a kit can
        # end up silently inert with every other check green.
        env:
          KIT: ${{ matrix.kit }}
        run: ./scripts/test-kit-e2e.sh "$KIT"

      - name: Sign out of Docker Hub
        if: always()
        run: sbx logout --yes || true

# syntax=docker/sandbox-kit:3
# OpenCode as a MIXIN: the same declarations as the standalone workload kit
# (../opencode), minus what only the kit that owns the environment can carry --
# the entrypoint (the base workload's launch command stays; run `opencode` in
# the shell), the context-file profile (`filename` is workload-only, so this
# kit contributes `contentFile` alone), sbx@1 (a mixin's image config never
# becomes the composed image's), and the base's apt mirrors (a workload owns
# its base image; here that base is whatever you compose onto).
schemaVersion: "3"
displayName: OpenCode (mixin)
description: >-
  OpenCode as a mixin -- the native CLI in an overlay, with seven optional
  proxy-managed provider credentials, the MCP registration, the Copilot seed
  and the v2 credential import. Layer it onto a shell base and run `opencode`.
sourceUrl: https://github.com/anomalyco/opencode

kind: mixin

# The OpenCode release the overlay carries, by reference: SPEC-v3 §4 allows
# this field to be a build-phase arg reference expanded at publish, so it
# names the same `version` arg the provide reads. One version in the file,
# and it is the one the recipe installs.
version: "${{ kit.args.version }}"

# The OpenCode release the recipe installs, declared once: validated here,
# handed to the recipe as the installer version, and expanded into the provide
# -- so the kit cannot claim a release it does not ship.
#
# HOW THE DEFAULT WAS ESTABLISHED, and how to bump it: the `latest` dist-tag
# published for OpenCode, read from
# https://registry.npmjs.org/@opencode%2fcli/latest. 2.0.29 at the time of
# writing.
#
# WHY PINNED rather than left floating: an unversioned provide takes the
# descriptor's `version:` as its version at resolution, so `provides:
# ["opencode"]` published `opencode@1.0.0` -- this kit's release number wearing
# OpenCode's name, which nothing can usefully constrain. The pattern refuses
# the word `latest` and prerelease versions -- neither is a version a provide
# should claim.
#
# THIS MUST STAY EQUAL TO ../opencode's `version` default. The two kits install
# the same package the same way and provide the same name, so a composition
# that resolved one against the other's requires must see the same release.
# Nothing enforces it across kit directories -- bump both together.
args:
  version:
    default: "2.0.29"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: OpenCode release to install
    buildArg: OPENCODE_VERSION

provides: ["opencode@${{ kit.args.version }}"]

# What the Copilot seed and credential import hooks below borrow from the base rather than from this
# overlay. It takes a lock with `flock` and merges auth.json with jq, both
# under `set -e`, and a startup command that exits non-zero leaves the sandbox
# unable to start — so neither is a soft dependency. §12's floor covers bash,
# sh, curl, git and a CA store and stops there.
#
# These are derived names, not authored ones: publishing a workload reads its
# dpkg database and states one entry per installed package (SPEC-v3 §9.6), so
# a Debian-family base provides them by construction. `flock` is packaged in
# util-linux, which is why the name is not `deb/flock`.
#
# The workload beside this one needs neither entry: it owns its base image, so
# its own dpkg database states what it carries at publish.
requires: ["deb/jq", "deb/util-linux"]

capabilities:
  # The agent's own egress rides with the kit that ships the agent: the base
  # grants nothing for services it does not carry. Runtime-only, like the
  # workload -- the install happens at build, and the hooks below are startup
  # hooks, which run at boot in the runtime phase.
  #
  # Entries are portless: a portless pattern matches any port. The workload's
  # apt hosts are deliberately absent -- those belong to whatever base this
  # composes onto, and so does the `apt-get update` hook that needs them.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Every domain a credential below injects into; v3 validates that
          # invariant at build time (SPEC-v3 §11).
          - api.anthropic.com
          - claude.ai
          - console.anthropic.com
          - api.business.githubcopilot.com
          - api.enterprise.githubcopilot.com
          - api.github.com
          - api.githubcopilot.com
          - api.individual.githubcopilot.com
          - copilot.github.com
          - github.com
          - raw.githubusercontent.com
          - aiplatform.googleapis.com
          - generativelanguage.googleapis.com
          - oauth2.googleapis.com
          - vertexai.googleapis.com
          - api.groq.com
          - api.openai.com
          - openai.com
          - openrouter.ai
          - api.x.ai
          # The OpenAI OAuth token endpoint and the Codex backend host the
          # subscription bearer is accepted at. Neither is an apiKey inject
          # domain, so neither is covered by the block above.
          - auth.openai.com
          - chatgpt.com
          # OpenCode's language servers are downloaded on demand: GitHub
          # release assets 302 to a release-asset host under
          # githubusercontent.com, and gist content comes from
          # gist.githubusercontent.com -- the exact raw. entry above covers
          # neither. Repository archives and gist tarballs come from
          # codeload.github.com, outside that zone again. (v2 wrote `**.`;
          # the single-label `*.` form is the documented portable core and
          # every host named here is exactly one label deep.)
          - "*.githubusercontent.com"
          - codeload.github.com
          # Language servers, plugins and provider SDK packages, resolved from
          # npm on demand.
          - registry.npmjs.org
          # OpenCode's own domains: the sign-in and account-console endpoints
          # `/login` hands off to, the JSON schema its config points at, and
          # the model catalog at models.opencode.ai/api.json. Models.dev
          # publishes this data but is not contacted by this version of the
          # CLI, so it is deliberately absent.
          - opencode.ai
          - "*.opencode.ai"

  # Seven provider services, every one of them optional: OpenCode is usable
  # with a locally served model and nothing bound at all, so failing create on
  # a missing credential would take away a working configuration rather than
  # protect one. Service names are the keys a host binds secrets under and the
  # keys the proxy routes on -- renaming one detaches it from the binding.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Anthropic API access
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: "%s"}
          - {domain: claude.ai, header: x-api-key, format: "%s"}
          - {domain: console.anthropic.com, header: x-api-key, format: "%s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: GitHub and Copilot access
    config:
      service: github
      phase: runtime
      apiKey:
        # Empty on purpose, as in the workload: this credential is handled
        # entirely proxy-side, and v3 gives an inject-only credential no
        # environment presence at all (credential@1). A named sentinel would
        # collide with the ambient GH_TOKEN the Copilot seed hook below reads.
        name: ""
        # The proxy applies ONE auth format per service, taken from the first
        # inject entry, so this list stays uniform. Bearer is the required
        # choice -- the Copilot API rejects the "token" scheme, GitHub's REST
        # API accepts both, and git over HTTPS on github.com is re-encoded to
        # Basic by the proxy regardless of the format named here.
        inject:
          - {domain: api.business.githubcopilot.com, header: Authorization, format: Bearer %s}
          - {domain: api.enterprise.githubcopilot.com, header: Authorization, format: Bearer %s}
          - {domain: api.github.com, header: Authorization, format: Bearer %s}
          - {domain: api.githubcopilot.com, header: Authorization, format: Bearer %s}
          - {domain: api.individual.githubcopilot.com, header: Authorization, format: Bearer %s}
          - {domain: copilot.github.com, header: Authorization, format: Bearer %s}
          - {domain: github.com, header: Authorization, format: Bearer %s}
          - {domain: raw.githubusercontent.com, header: Authorization, format: Bearer %s}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Google AI API access
    config:
      service: google
      phase: runtime
      apiKey:
        # OpenCode's Google provider reads this name, not GOOGLE_API_KEY.
        name: GOOGLE_GENERATIVE_AI_API_KEY
        proxyManaged: true
        inject:
          - {domain: aiplatform.googleapis.com, header: x-goog-api-key, format: "%s"}
          - {domain: generativelanguage.googleapis.com, header: x-goog-api-key, format: "%s"}
          - {domain: oauth2.googleapis.com, header: x-goog-api-key, format: "%s"}
          - {domain: vertexai.googleapis.com, header: x-goog-api-key, format: "%s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Groq API access
    config:
      service: groq
      phase: runtime
      apiKey:
        name: GROQ_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.groq.com, header: Authorization, format: Bearer %s}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenAI API access (API key or ChatGPT OAuth)
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.openai.com, header: Authorization, format: Bearer %s}
          - {domain: openai.com, header: Authorization, format: Bearer %s}
      # A ChatGPT-subscription token is only accepted at the Codex backend
      # host. The startup bridge imports the rendered auth.json record into
      # OpenCode v2's credential store; its built-in Codex auth plugin then
      # rewrites /v1/responses to chatgpt.com/backend-api/codex and sends the
      # entry's access value as the bearer -- the sentinel below is
      # what reaches the proxy for substitution. `expires` carries the host
      # token's real expiry so OpenCode refreshes through the intercepted token
      # endpoint instead of pinning a token it cannot renew.
      #
      # MIGRATION NOTE: v2's `oauth.skipIfEnv: [OPENAI_API_KEY]` is dropped.
      # Mode resolution is binding-driven in v3, so declaring both `apiKey` and
      # `oauth` means "whichever the host has bound" and the descriptor no
      # longer probes its own container's environment to decide.
      oauth:
        tokenEndpoint: {host: auth.openai.com, path: /oauth/token}
        resourceHosts:
          - chatgpt.com
        sentinels:
          accessToken: oai-oat01-proxy-managed
          refreshToken: oai-ort01-proxy-managed
        credentialFile:
          path: "~/.local/share/opencode/auth.json"
          # A structure rather than a raw template, so the rendered file is
          # JSON by construction: a placeholder carrying a quote or a newline
          # cannot break the document.
          structure:
            openai:
              type: oauth
              access: "{{.AccessToken}}"
              refresh: "{{.RefreshToken}}"
              expires: "{{.ExpiresAt}}"

  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenRouter API access
    config:
      service: openrouter
      phase: runtime
      apiKey:
        name: OPENROUTER_API_KEY
        proxyManaged: true
        inject:
          - {domain: openrouter.ai, header: Authorization, format: Bearer %s}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: xAI API access
    config:
      service: xai
      phase: runtime
      apiKey:
        name: XAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.x.ai, header: Authorization, format: Bearer %s}

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        # The workload's `apt-get update` hook is deliberately absent: it
        # refreshes the base image's own package sources, which belong to the
        # base workload, and this kit does not declare that base's apt hosts.
        #
        # sandboxd injects MCP_GATEWAY_URL + MCP_SENTINEL_TOKEN_NAME into the
        # container env when a gateway has been reserved. The sentinel name is
        # not a credential -- the proxy substitutes the real token at request
        # time keyed by this name. No-op when MCP isn't enabled.
        #
        # OpenCode owns ~/.config/opencode/opencode.json outright (there are no
        # baseline keys to preserve), so the file is written fresh rather than
        # merged, as in the workload. The heredoc is unquoted so the two
        # environment variables expand, which is why `$schema` is
        # backslash-escaped: unescaped it would expand to the empty string and
        # the config would lose its schema reference.
        #
        # Hook environments are deny-by-default in v3, so the two MCP variables
        # are declared. $HOME is platform baseline.
        - command:
            - sh
            - -c
            - |
              set -e
              [ -n "$MCP_GATEWAY_URL" ] || exit 0
              mkdir -p "$HOME/.config/opencode"
              cat > "$HOME/.config/opencode/opencode.json" <<EOF
              {
                "\$schema": "https://opencode.ai/config.json",
                "mcp": {
                  "mcp-gateway": {
                    "type": "remote",
                    "url": "$MCP_GATEWAY_URL",
                    "enabled": true,
                    "headers": {
                      "Authorization": "Bearer $MCP_SENTINEL_TOKEN_NAME"
                    }
                  }
                }
              }
              EOF
          user: "agent"
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Register the sandbox MCP gateway in ~/.config/opencode/opencode.json

        # The startup bridge below imports auth.json's `refresh` value into
        # OpenCode v2's github-copilot credential, whose plugin sends it as the
        # Copilot Bearer, so the GH_TOKEN sentinel rides the github inject
        # rules declared above rather than a second credential entry. GH_TOKEN
        # is ambient -- the host supplies it -- and is deliberately NOT the
        # github credential's `apiKey.name`, which stays empty above.
        #
        # This hook needs `jq` and `flock` from the base workload rather than
        # from this overlay, which is what the `deb/` entries in `requires:`
        # above state. It exits without seeding rather than failing if the seed
        # cannot be built.
        - command:
            - sh
            - -c
            - |
              set -e
              umask 077
              # Local sandboxes always carry GH_TOKEN and say via the mode var whether a
              # credential backs it; cloud sets GH_TOKEN only when one does and no mode var.
              [ -n "${GH_TOKEN:-}" ] || exit 0
              [ "${SBX_CRED_GITHUB_MODE:-}" != none ] || exit 0
              auth="$HOME/.local/share/opencode/auth.json"
              mkdir -p "$(dirname "$auth")"
              # A canceled start can leave its seed running; retries must recheck auth.json after it finishes.
              exec 9>>"$(dirname "$auth")/.copilot-seed.lock"
              flock 9
              # mv would nest the seed inside a directory here and still exit 0.
              if [ -e "$auth" ] && [ ! -f "$auth" ]; then
                echo "auth.json is not a regular file; leaving the GitHub Copilot provider unseeded" >&2
                exit 0
              fi
              # Every start re-fires this seed. One pass keeps an entry that fits OpenCode's Oauth schema and still
              # carries the token as refresh (so an exchanged access survives), leaves a malformed file alone, and re-seeds the rest.
              if ! merged=$({ if [ -s "$auth" ]; then cat "$auth"; else echo '{}'; fi; } | jq -s --arg token "$GH_TOKEN" '
                  if length != 1 or (.[0] | type) != "object" then error("auth.json must hold exactly one JSON object")
                  elif (.[0]."github-copilot" | type == "object" and .type == "oauth" and .refresh == $token
                        and (.access | type) == "string" and (.expires | type == "number" and . >= 0 and . == floor)
                        and ((has("accountId") | not) or (.accountId | type) == "string")
                        and ((has("enterpriseUrl") | not) or (.enterpriseUrl | type) == "string")) then empty
                  else .[0] | ."github-copilot" = {type: "oauth", refresh: $token, access: $token, expires: 0} end'); then
                echo "auth.json is not a single JSON object; leaving the GitHub Copilot provider unseeded" >&2
                exit 0
              fi
              [ -n "$merged" ] || exit 0
              # The temp name is unpredictable, so a stale or crashed leftover is never installed. The
              # same uid owns this directory, so no write pattern here is a boundary against a co-resident process.
              tmp=$(mktemp "$(dirname "$auth")/auth.json.XXXXXX")
              trap 'rm -f "$tmp"' EXIT
              printf '%s\n' "$merged" > "$tmp"
              mv -f "$tmp" "$auth"
          user: "agent"
          env: [GH_TOKEN, SBX_CRED_GITHUB_MODE]
          description: Seed OpenCode's GitHub Copilot provider from the GH_TOKEN sentinel

        # OpenCode v2 keeps credentials in SQLite, while sandbox OAuth bindings
        # materialize sentinel-backed tokens in auth.json. Convert only those
        # two managed records to v2's documented import format on every start;
        # native OAuth accounts are left for OpenCode's own migration and
        # refresh logic.
        - command:
            - sh
            - -c
            - |
              set -e
              auth="$HOME/.local/share/opencode/auth.json"
              mkdir -p "$(dirname "$auth")"
              exec 9>>"$(dirname "$auth")/.credentials-sync.lock"
              flock 9
              if ! existing=$(opencode auth export --standalone); then
                echo "unable to read OpenCode v2 credentials; leaving them unchanged" >&2
                exit 0
              fi
              if [ -e "$auth" ] && [ ! -f "$auth" ]; then
                echo "auth.json is not a regular file; leaving v2 credentials unchanged" >&2
                exit 0
              fi
              if [ -f "$auth" ]; then
                if ! credentials=$(jq -c --arg github_token "${GH_TOKEN:-}" '
                def oauth($integration; $id; $method; $label; $access; $refresh):
                  .[$integration] as $credential |
                  if ($credential | type) == "object"
                    and ($credential.type == "oauth")
                    and ($access != "")
                    and ($credential.access == $access)
                    and ($credential.refresh == $refresh)
                    and (($credential.refresh | type) == "string")
                    and (($credential.access | type) == "string")
                    and ($credential.expires | type == "number" and . >= 0 and . == floor)
                  then {
                    id: $id, integrationID: $integration, label: $label, active: true,
                    value: ({type: "oauth", methodID: $method, refresh: $credential.refresh, access: $credential.access, expires: $credential.expires}
                      + (if (($credential.accountId | type) == "string") or (($credential.enterpriseUrl | type) == "string")
                         then {metadata: ({} + (if ($credential.accountId | type) == "string" then {accountID: $credential.accountId} else {} end)
                                               + (if ($credential.enterpriseUrl | type) == "string" then {enterpriseUrl: $credential.enterpriseUrl} else {} end))}
                          else {} end))
                  else empty end;
                [oauth("openai"; "sbx-openai"; "chatgpt-browser"; "Sandbox OpenAI"; "oai-oat01-proxy-managed"; "oai-ort01-proxy-managed"), oauth("github-copilot"; "sbx-github-copilot"; "device"; "Sandbox GitHub Copilot"; $github_token; $github_token)]' "$auth"); then
                  echo "auth.json is not valid OpenCode OAuth data; leaving v2 credentials unchanged" >&2
                  exit 0
                fi
              else
                credentials='[]'
              fi
              if ! sync=$(jq -cn --argjson existing "$existing" --argjson desired "$credentials" '
                def managed($wanted):
                  .id == $wanted.id
                  or ($wanted.desired != null and .label == "OAuth" and .integrationID == $wanted.integrationID and .value == $wanted.desired.value);
                ["openai", "github-copilot"] | map(
                  . as $integration |
                  {integrationID: $integration, id: ("sbx-" + $integration),
                   desired: ([$desired[] | select(.integrationID == $integration)][0])}
                  | . as $wanted
                   | ($existing | map(select(.integrationID == $wanted.integrationID))) as $records
                   | ($records | map(select(.active == true)) | .[0]) as $active
                   | {integrationID: $wanted.integrationID, id: $wanted.id, desired: $wanted.desired,
                      remove: [$records[] | select(managed($wanted)) | .id],
                     previousActiveID: (if $active != null and ($active | managed($wanted)) then $active.id else null end),
                     activate: ($wanted.desired != null and $active != null and ($active | managed($wanted)))}
                )'); then
                echo "unable to reconcile OpenCode v2 credentials; leaving them unchanged" >&2
                exit 0
              fi
              if ! removed=$(jq -cn --argjson existing "$existing" --argjson sync "$sync" '
                [$sync[] as $change | $existing[] |
                  select(.integrationID == $change.integrationID and (.id as $id | $change.remove | index($id)))]'); then
                echo "unable to save managed OpenCode credentials for rollback" >&2
                exit 0
              fi
              printf '%s\n' "$sync" | jq -r '.[] | .integrationID as $integration | .remove[]? | [$integration, .] | @tsv' |
                while IFS="$(printf '\t')" read -r integration id; do
                  opencode auth logout "$integration" "$id" --standalone >/dev/null 2>&1 || true
                done
              if [ "$credentials" != "[]" ] && ! printf '%s\n' "$credentials" | opencode auth import --standalone >/dev/null; then
                echo "unable to import sandbox OAuth credentials into OpenCode v2" >&2
                if [ "$removed" != "[]" ] && ! printf '%s\n' "$removed" | opencode auth import --standalone >/dev/null; then
                  echo "unable to restore managed OpenCode credentials after failed import" >&2
                  exit 1
                fi
                if ! printf '%s\n' "$sync" | jq -r '.[] | select(.previousActiveID != null) | [.integrationID, .previousActiveID] | @tsv' |
                  while IFS="$(printf '\t')" read -r integration id; do
                    opencode auth switch "$integration" "$id" --standalone >/dev/null
                  done; then
                  echo "unable to restore the managed OpenCode credential selection after failed import" >&2
                  exit 1
                fi
                echo "restored managed OpenCode credentials after failed import" >&2
                exit 0
              fi
              printf '%s\n' "$sync" | jq -r '.[] | select(.activate) | [.integrationID, .id] | @tsv' |
                while IFS="$(printf '\t')" read -r integration id; do
                  opencode auth switch "$integration" "$id" --standalone >/dev/null
                done
          user: "agent"
          env: [GH_TOKEN]
          description: Import sandbox OAuth credentials into OpenCode v2

  # No agent-sessions@1 and no agent-skills@1, the same calls the workload
  # makes: the v2 TCK data omitted `promptArgs` because no provider credential
  # exists on the runner to answer a prompt, and nothing in this kit ever named
  # a skills directory for opencode.

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./opencode-mixin-context.md

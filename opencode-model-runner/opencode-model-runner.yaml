# syntax=docker/sandbox-kit:3
# Migration of the v2 opencode-model-runner kit
# (opencode-model-runner/spec.yaml). The v2 kit shipped no recipe at all -- it
# pointed `sandbox.image` straight at a published template. A v3 workload MUST
# have content, so the companion recipe is the minimal one that says the same
# thing: that template as the base, plus the entrypoint v2 declared beside it.
schemaVersion: "3"
displayName: OpenCode (Docker Model Runner)
description: >-
  OpenCode wired to a local Docker Model Runner instance via its
  OpenAI-compatible API, with automatic model discovery.
sourceUrl: https://docs.docker.com/ai/model-runner/

kind: workload

# The OpenCode inside the content, by reference: SPEC-v3 §4 allows this field
# to be a build-phase arg reference expanded at publish, so it names the
# `version` arg below, the same one the provide reads.
#
# Read that arg's note before trusting this field, because this kit installs
# nothing: OpenCode arrives already built in the base template, so the value
# is ASSERTED rather than selected -- nothing here chooses which release the
# artifact gets. What makes the reference honest anyway is that the build
# verifies the assertion against the base and fails when it does not hold, so
# what this field publishes is a version the content was checked for.
#
# MIGRATION NOTE: v2 declared no `version:`. One is added because §9.3 derives
# `org.opencontainers.image.version` from it -- and pointed here it names the
# agent the artifact carries, which is the only version this kit has to state.
version: "${{ kit.args.version }}"

# The OpenCode release this kit ships, which it does NOT install: the content
# is `FROM docker/sandbox-templates:opencode-docker` and OpenCode arrives
# already built into that template. So this arg cannot select a release the way
# the sibling ../opencode kit's can, and declaring it as if it could would be a
# pin in name only.
#
# It is an ASSERTION instead. The recipe reads `opencode --version` out of the
# base and fails the build when it does not equal this value, so the version
# the provide publishes is verified against the content of every artifact
# rather than asserted over it. That is what makes putting a version here
# honest at all -- SPEC-v3 has no way for a provide to quote something read out
# of the content, so the only alternatives were to enforce a declared value or
# to state none.
#
# WHY ENFORCE rather than leave it unversioned: unversioned, the provide takes
# the `version:` above and publishes `opencode-model-runner@1.0.0`, which says
# nothing about the agent a consumer would be constraining. The cost is a
# tripwire -- `:opencode-docker` is a floating tag Docker rebuilds, so the day
# it carries a newer OpenCode this kit stops building until someone bumps the
# default below. For a kit whose entire content is someone else's moving tag
# that is a feature: it is the only channel that reports the content changed,
# and the build log names both versions.
#
# HOW THE DEFAULT WAS ESTABLISHED, and how to bump it: ask the base itself --
#   docker run --rm --entrypoint opencode \
#     docker/sandbox-templates:opencode-docker --version
# which printed 1.18.32 at the time of this bump. Do not read it from npm: this
# kit ships whatever the template froze.
args:
  version:
    default: "1.18.32"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: OpenCode release the base template is expected to carry
    buildArg: EXPECTED_OPENCODE_VERSION

# The kit's own name, not bare `opencode`. Both this kit and ../opencode ship
# an OpenCode, and a capability name has exactly one owner in a composition
# (SPEC-v3 §5.3) -- claiming `opencode` here would make the two unresolvable
# together for no gain, since nothing in this repo requires that name.
#
# The version on it is the OpenCode release inside, which is the only thing
# about this capability a consumer could usefully constrain: the provider
# config the kit adds on top has no version of its own.
provides: ["opencode-model-runner@${{ kit.args.version }}"]

capabilities:
  # This workload is an agent sandbox: the host launches the agent rather than
  # running the image's entrypoint as PID 1, and honors the identity the image
  # config declares instead of assuming one.
  - type: com.docker.sandbox/sbx@1

  # MIGRATION NOTE: both entries are runtime. The plugin install below happens
  # when OpenCode starts, not in an install hook -- this kit declares none --
  # so an absent `install:` block grants nothing, which is correct here.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # The provider baseURL every model request hits.
          #
          # MIGRATION NOTE: this one entry deliberately keeps its port, against
          # the contrib house style of portless entries. The house style reads
          # a portless pattern as "this service, any port", which is the right
          # default for a public API host; here the host is the user's own
          # machine through the sandbox's gateway alias, and the port is the
          # only thing that narrows the grant to Model Runner rather than to
          # everything else listening on that machine. Dropping it would widen
          # the policy, not tidy it.
          - host.docker.internal:12434
          # OpenCode installs the opencode-models-discovery plugin from npm at
          # startup; packument and tarball both come from this host.
          - registry.npmjs.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        # MIGRATION NOTE: v2's `setup.files` entry, unchanged. v2 declared no
        # `onlyIfMissing`, so `overwrite` keeps its v3 default of true and the
        # config is rewritten on every start -- the same behavior. The `$schema`
        # key is written literally: file content expands a kit-arg reference
        # and nothing else, so a `$schema` written plainly survives. The kit's
        # one arg is the asserted OpenCode version, which this file never
        # names.
        - path: /home/agent/.config/opencode/opencode.json
          content: |
            {
              "$schema": "https://opencode.ai/config.json",
              "plugin": [
                ["opencode-models-discovery", {
                  "smartModelName": false
                }]
              ],
              "provider": {
                "dmr": {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "Docker Model Runner",
                  "options": {
                    "baseURL": "http://host.docker.internal:12434/v1",
                    "modelsDiscovery": {
                      "enabled": true
                    }
                  }
                }
              }
            }
          mode: "0644"
          description: Configure OpenCode to use the local Docker Model Runner

  # Recorded working non-interactive invocation, carried over from the v2 TCK
  # harness (testdata/tck.yaml: `promptArgs: ["run"]`). Unlike the sibling
  # ../opencode kit, this one can actually answer: its model is the local
  # Docker Model Runner, so no hosted-provider credential has to be bound for
  # the verb to work.
  - type: com.docker.sandbox/agent-sessions@1
    description: Run one prompt against the local Docker Model Runner
    config:
      prompt: ["run", "{{.Prompt}}"]

  # No credential@1 entries, faithfully: v2 declared none, and there is nothing
  # to declare -- every model request goes to a local endpoint that takes no
  # credential.

  # MIGRATION NOTE: v2's agentInstructions declared a profile filename and no
  # body, so there is nothing to stage and no `contentFile:` here. OpenCode
  # reads AGENTS.md from the project root every session, so this is the
  # filename composed kit context has to land in for the agent to pick it up.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md

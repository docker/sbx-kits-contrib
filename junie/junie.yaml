# syntax=docker/sandbox-kit:3
# Migration of the v2 `junie` sandbox kit (spec.yaml, schemaVersion "2").
# v2's sandbox.image and sandbox.entrypoint have no v3 fields — a workload's
# content IS its image, and the image config owns launch config — so both
# moved into junie.dockerfile. Every other v2 stanza lands in a capability
# below; the deltas are marked MIGRATION NOTE inline.
schemaVersion: "3"
displayName: Junie
description: The AI coding agent by JetBrains.

kind: workload

# Junie's marketing release, by reference: SPEC-v3 §4 allows this field to be
# a build-phase arg reference expanded at publish, so it names the `version`
# arg below — the same one the provide reads — and this kit states a version
# in exactly one place. Bumping the pin bumps this with it, which is the
# point: the tag a release is cut under and the
# `org.opencontainers.image.version` annotation §9.3 derives from this field
# now name the Junie the artifact actually carries.
#
# `version` and not `build`: the build number is JetBrains' artifact key, not
# what the binary calls itself, so it is the wrong thing to publish under.
# Nothing is lost by leaving it out — the recipe's assertion on
# `junie --version` is what keeps the two from naming different releases.
#
# MIGRATION NOTE: v2 declared no `version:`. The migration added one and it
# read 1.0.0; this is that field pointed at the content instead.
version: "${{ kit.args.version }}"

# Junie is pinned by TWO values because JetBrains ships two, and the install
# and the provide need different ones.
#
#   `version` is the marketing release — what the binary calls itself, what
#       release notes name, and therefore the only honest thing to publish in
#       a provide. It is what `junie --version` answers with.
#   `build`   is the JetBrains build number — the vendor's artifact key, and
#       the only thing the installer's pin accepts.
#
# `junie --version` prints both, in one line:
#
#     Junie version: 26.9.21 (3294.5)
#
# and the recipe asserts that line contains both values, so the two cannot
# drift apart: a build number that turns out to carry some other marketing
# version fails the build rather than publishing a false provide.
#
# HOW THE DEFAULTS WERE ESTABLISHED, and how to bump them: the last entry for
# a `linux-*` platform in
# https://raw.githubusercontent.com/JetBrains/junie/main/update-info.jsonl,
# which is the feed install.sh itself resolves "the current stable build"
# from. Its `version` field is the build number and its `marketing` field is
# the release, so one line gives both:
#
#   curl -fsSL https://raw.githubusercontent.com/JetBrains/junie/main/update-info.jsonl \
#     | grep '"platform":"linux-aarch64"' | tail -1
#
# 3294.5 / 26.9.21 at the time of writing.
#
# HOW THE PIN REACHES THE INSTALL: install.sh documents the variable in its own
# header — `curl -fsSL https://junie.jetbrains.com/install.sh | JUNIE_VERSION=656.1
# bash` — and takes the branch `VERSION="$JUNIE_VERSION"` when it is set, which
# builds a download URL at that exact release and still looks the checksum up
# in the feed. So `build` goes straight to `JUNIE_VERSION` and the pin is the
# installer's own.
#
# WHY PINNED rather than left floating: an unversioned provide takes the
# descriptor's `version:` as its version at resolution, so `provides: ["junie"]`
# published `junie@1.0.0` — this kit's release number wearing Junie's name. A
# mixin asking for `junie >= 26.9` would refuse to resolve against it.
# Floating the install and stating a version are not both available; stating
# one the content may not have is the worse of the two, so the install is
# pinned to make the claim true.
#
# The patterns are the two shapes JetBrains publishes: three segments for the
# marketing release, two for the build number. Neither admits a channel name —
# `version` is expanded into `provides` below, and `junie@stable` is not a
# version.
args:
  version:
    default: "26.9.21"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Junie marketing release, the version the binary reports
    buildArg: JUNIE_MARKETING_VERSION
  build:
    default: "3294.5"
    pattern: '^[0-9]+\.[0-9]+$'
    description: JetBrains build number for that release, the installer's own pin
    buildArg: JUNIE_VERSION

provides: ["junie@${{ kit.args.version }}"]

capabilities:
  # This workload is an agent sandbox: the host launches the agent rather than
  # running the image's entrypoint as PID 1, and honors the identity the image
  # config declares instead of assuming one.
  - type: com.docker.sandbox/sbx@1

  # MIGRATION NOTE: v2's single flat allow list is phase-scoped in v3, and an
  # absent phase grants nothing. Every host is `runtime` and there is no
  # `install` phase: Junie is baked into the image at build time and this kit
  # declares no lifecycle hooks at all, so nothing runs during install. The
  # union of the two phases is v2's list, host for host.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Junie is baked into the image (see junie.dockerfile) rather than
          # installed at sandbox-create time, and the image also sets
          # JUNIE_SKIP_UPDATE_CHECK=1, so the installed binary never checks
          # for or stages a runtime update. That drops github.com,
          # raw.githubusercontent.com, and release-assets.githubusercontent.com
          # from this list entirely: all three were reachable only for the
          # vendor installer's own version-resolution feed and the
          # GitHub-hosted release zip it downloads, and neither is a
          # credential inject domain.
          # junie.jetbrains.com stays -- it doubles as the `junie`
          # credential's inject domain below, so it is still needed at runtime
          # independent of install.
          - junie.jetbrains.com
          - api.jetbrains.ai
          - api.anthropic.com
          - api.openai.com
          - generativelanguage.googleapis.com
          - api.x.ai
          - openrouter.ai

  # Every credential below is `optional: true`, faithfully: v2 credentials
  # default to not-required and the v3 default inverts (an entry is required
  # unless it opts out). Junie takes whichever model provider the host has
  # bound, and none of the six is individually necessary, so making any of
  # them required would refuse creates that v2 accepted.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Anthropic API access
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: "%s"}

  # v1 also accepted GOOGLE_GENERATIVE_AI_API_KEY as a fallback host env var
  # name for this credential (credentials.sources.google.env listed both).
  # v2's apiKey.name is a single string with no alias list, and v3's is too,
  # so only one host env var can be recognized here; GEMINI_API_KEY is
  # Google's current canonical name for this key, so it's the one kept. A host
  # with only GOOGLE_GENERATIVE_AI_API_KEY set will no longer be picked up.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Google Gemini API access
    config:
      service: google
      phase: runtime
      apiKey:
        name: GEMINI_API_KEY
        proxyManaged: true
        inject:
          - {domain: generativelanguage.googleapis.com, header: x-goog-api-key, format: "%s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: JetBrains AI / Junie service access
    config:
      service: junie
      phase: runtime
      apiKey:
        name: JUNIE_API_KEY
        proxyManaged: true
        inject:
          - {domain: junie.jetbrains.com, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenAI API access
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.openai.com, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenRouter API access
    config:
      service: openrouter
      phase: runtime
      apiKey:
        name: OPENROUTER_API_KEY
        proxyManaged: true
        inject:
          - {domain: openrouter.ai, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: xAI API access
    config:
      service: xai
      phase: runtime
      apiKey:
        name: XAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.x.ai, header: Authorization, format: "Bearer %s"}

  # The session control surface: how a harness drives junie without a human at
  # the terminal. Argv tails append to the entrypoint the way user args do.
  #
  # MIGRATION NOTE: this is v2's `promptArgs: ["--task"]` from
  # testdata/tck.yaml — a working non-interactive invocation the v2 TCK
  # already exercised, which is the only evidence that licenses this
  # capability. The other verbs (resume, continue, list) are omitted rather
  # than guessed: an absent verb means "operation unsupported", which is the
  # truthful answer here.
  - type: com.docker.sandbox/agent-sessions@1
    description: Drive junie tasks programmatically
    config:
      prompt: ["--task", "{{.Prompt}}"]

  # MIGRATION NOTE: v2 declared `agentInstructions.filename: AGENTS.md` with
  # no `content`, so there is no body to move into a junie-context.md and none
  # is invented here.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md

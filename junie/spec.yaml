schemaVersion: "2"
kind: sandbox
name: junie
displayName: Junie
description: The AI coding agent by JetBrains.
sandbox:
  # Pre-baked image: Junie is installed from its stable channel at image-
  # build time rather than sandbox-create time. Built and published by
  # build-and-publish-kits.yml, the shared kit-image pipeline (see
  # ../PUBLISHING.md) -- no bespoke workflow needed, same as
  # hermes-agent/pi/openclaw/kiro/copilot. Sandbox creation only pulls the
  # image; the pipeline's nightly rebuild keeps Junie current (rolling
  # updates, no deliberate version bump -- see the Dockerfile).
  image: docker.io/sbx/junie-image:latest
  entrypoint:
    - junie
agentInstructions:
  filename: AGENTS.md
permissions:
  network:
    allow:
      # Junie is baked into the image (see Dockerfile) rather than installed
      # at sandbox-create time, and the image also sets
      # JUNIE_SKIP_UPDATE_CHECK=1, so the installed binary never checks for
      # or stages a runtime update. That drops github.com,
      # raw.githubusercontent.com, and release-assets.githubusercontent.com
      # from this list entirely: all three were reachable only for the
      # vendor installer's own version-resolution feed and the GitHub-hosted
      # release zip it downloads, and neither is a credential inject domain.
      # junie.jetbrains.com stays -- it doubles as the `junie` credential's
      # inject domain below, so it is still needed at runtime independent of
      # install.
      - junie.jetbrains.com
      - api.jetbrains.ai
      - api.anthropic.com
      - api.openai.com
      - generativelanguage.googleapis.com
      - api.x.ai
      - openrouter.ai
credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: '%s'
  # v1 also accepted GOOGLE_GENERATIVE_AI_API_KEY as a fallback host env var
  # name for this credential (credentials.sources.google.env listed both).
  # v2's apiKey.name is a single string with no alias list, so only one host
  # env var can be recognized here; GEMINI_API_KEY is Google's current
  # canonical name for this key, so it's the one kept. A host with only
  # GOOGLE_GENERATIVE_AI_API_KEY set will no longer be picked up.
  - service: google
    apiKey:
      name: GEMINI_API_KEY
      proxyManaged: true
      inject:
        - domain: generativelanguage.googleapis.com
          header: x-goog-api-key
          format: '%s'
  - service: junie
    apiKey:
      name: JUNIE_API_KEY
      proxyManaged: true
      inject:
        - domain: junie.jetbrains.com
          header: Authorization
          format: Bearer %s
  - service: openai
    apiKey:
      name: OPENAI_API_KEY
      proxyManaged: true
      inject:
        - domain: api.openai.com
          header: Authorization
          format: Bearer %s
  - service: openrouter
    apiKey:
      name: OPENROUTER_API_KEY
      proxyManaged: true
      inject:
        - domain: openrouter.ai
          header: Authorization
          format: Bearer %s
  - service: xai
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
        - domain: api.x.ai
          header: Authorization
          format: Bearer %s

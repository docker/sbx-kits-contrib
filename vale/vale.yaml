# syntax=docker/sandbox-kit:3
# The Vale prose linter as a MIXIN with an overlay.
#
# MIGRATION NOTE: the v2 kit shipped no Dockerfile because a v2 mixin had no
# content mechanism — a `setup.install` hook curling a pinned release tarball
# was the only way for one to install anything — and the first v3 cut carried
# that hook across as written. v3 lets a mixin carry an overlay, so the hook is
# now vale.dockerfile's build: the same version, the same two digests, the same
# extraction, at build time instead of at every sandbox create. Nothing stayed
# a hook, so this kit declares no lifecycle capability at all.
schemaVersion: "3"
displayName: Vale
description: Installs the Vale prose linter from a pinned GitHub release.

kind: mixin

# The recipe pins 3.14.2, verifies the tarball against a per-arch SHA256 and
# then checks that the extracted binary reports that same version, so this
# number is a fact about the published layer rather than a request. To bump:
# edit VALE_VERSION and both digests in vale.dockerfile, this entry and the
# README together.
provides: ["vale@3.14.2"]

# MIGRATION NOTE: `requires: ["deb/dpkg"]` is gone, and the move is what
# removed it. It was there for one reason — the install hook chose its release
# tarball by `dpkg --print-architecture` under `set -euo pipefail`, so a base
# without dpkg failed sandbox creation at that line. The recipe asks buildx for
# TARGETARCH instead, which is answered at build by the builder, so the kit no
# longer needs anything of the composed base: vale is one static Go binary.
# Leaving the requirement behind would have been the worse kind of stale —
# `requires` is a closed-set check, so it would refuse to compose on bases the
# kit now works on perfectly well.

capabilities:
  # MIGRATION NOTE: the install phase is deleted, and the runtime phase is
  # untouched. Those two halves used to name the same three hosts, which is
  # exactly why the distinction is worth spelling out here.
  #
  # The install half existed for the one-shot release-tarball download. The
  # builder does that download now, and a policy that governs sandboxes does
  # not govern the builder, so the grant has no installer left to serve and is
  # removed rather than narrowed.
  #
  # The runtime half is a different grant that happens to name the same hosts,
  # and it stays: `vale sync` fetches the style packages a .vale.ini references
  # from GitHub releases, from the agent's steady state, over the same redirect
  # chain. An absent phase grants nothing, so dropping it along with the
  # install phase would have left every `vale sync` failing with a proxy error.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # `vale sync` downloads style packages from GitHub releases.
          # github.com 302-redirects to objects.githubusercontent.com for
          # binary downloads (confirmed by hand);
          # release-assets.githubusercontent.com is kept alongside it since
          # that isn't guaranteed to be the same host for every repo/asset.
          - github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com

  # No `filename:` — that is workload-only, and this mixin contributes a body
  # to whichever agent owns the profile.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./vale-context.md

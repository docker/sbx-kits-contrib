# syntax=docker/sandbox-kit:3
# The Vale prose linter as a declaration-only MIXIN. The v2 kit shipped no
# Dockerfile — it curled a pinned release tarball in a setup hook — and v3 lets
# a mixin have no recipe at all, so the descriptor is the whole kit.
schemaVersion: "3"
displayName: Vale
description: Installs the Vale prose linter from a pinned GitHub release.

kind: mixin

# The install hook pins 3.14.2 and verifies the tarball against a per-arch
# SHA256, so this version is a fact about what the kit installs. To bump: edit
# the hook's version and both digests, this entry and the README together.
provides: ["vale@3.14.2"]

capabilities:
  # MIGRATION NOTE: v2's one flat allow list, split by phase — and these three
  # hosts land in both. The v2 comment scoped them to the install-time tarball
  # download, but `vale sync` (which the README documents, and which fetches the
  # styles a .vale.ini references from GitHub releases) reaches the same hosts
  # from the agent's steady state. v2's flat list granted that implicitly;
  # install-only here would have broken it, since an absent phase grants nothing.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          # Release tarball download (install time, one-shot).
          # github.com 302-redirects to objects.githubusercontent.com for binary
          # downloads (confirmed by hand); release-assets.githubusercontent.com
          # kept alongside it since that isn't guaranteed to be the same host
          # for every repo/asset.
          - github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
      runtime:
        allow:
          # `vale sync` downloads style packages from GitHub releases, so the
          # same three hosts and the same redirect chain.
          - github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Install Vale from a pinned, SHA256-verified GitHub release. We deliberately
        # do NOT query api.github.com for `releases/latest`: unauthenticated API calls
        # from shared CI runner IPs hit the 60-req/hr rate limit and 403, making installs
        # flaky. Pinning by version + SHA256 (in the kit, in git) is also the safer supply
        # chain. To bump: change VALE_VERSION plus the per-arch SHA256 below (sourced from
        # the release's checksums.txt).
        #
        # MIGRATION NOTE: the body reads no variable — every name in it is set by
        # the script itself — but curl takes the proxy from the environment, and
        # v2's unrestricted hook environment handed it over. Under v3's
        # deny-by-default hook env it has to be declared or the download fails
        # behind the sandbox's forced proxy.
        - command: |
            set -euo pipefail
            VALE_VERSION=3.14.2
            ARCH=$(dpkg --print-architecture)
            case "$ARCH" in
              amd64)
                TARBALL="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
                SHA256="469cf88ec58a374dca14b2564c4391d2c9a1c632210aa0b642758b794082e05f"
                ;;
              arm64)
                TARBALL="vale_${VALE_VERSION}_Linux_arm64.tar.gz"
                SHA256="b11fa9955b93814f993442568b9b922604cc4b574643037b84900e9514860802"
                ;;
              *)
                echo "unsupported arch: $ARCH" >&2
                exit 1
                ;;
            esac
            curl --proto '=https' --tlsv1.2 -fsSL \
              -o /tmp/vale.tgz \
              "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/${TARBALL}"
            echo "${SHA256}  /tmp/vale.tgz" | sha256sum -c -
            tar -C /usr/local/bin -xzf /tmp/vale.tgz vale
            rm /tmp/vale.tgz
            vale --version
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: Install pinned Vale CLI

  # No `filename:` — that is workload-only, and this mixin contributes a body
  # to whichever agent owns the profile.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./vale-context.md

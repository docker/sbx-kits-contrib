# syntax=docker/sandbox-kit:3
# Grok Build as a MIXIN: the same declarations as the standalone workload kit
# (../grok), minus what only the kit that owns the environment can carry — the
# entrypoint (the base workload's launch command stays; you run `grok` from
# the shell), the context-file profile (`filename` is workload-only, so this
# kit contributes `contentFile` alone), `agent-sessions@1` (the verbs drive
# the workload's entrypoint, which here is the base's shell), and `sbx@1`.
schemaVersion: "3"
displayName: Grok Build (mixin)
description: >-
  xAI's terminal-based coding agent as a mixin — the CLI in an overlay, with
  the xAI credential and the egress policy Grok's login and inference need.
  Layer it onto a shell base and run `grok`.

kind: mixin

# The Grok release this kit's overlay carries, by reference to the `version`
# arg below — SPEC-v3 §4 admits a build-phase arg reference here and expands it
# at publish, so the version is stated in exactly one place and the publish tag
# names the agent rather than a kit release number of its own.
version: "${{ kit.args.version }}"

# The Grok release the recipe installs, declared once: validated here, handed to
# the installer as its version argument, and expanded into `provides` and
# `version:` — so the kit cannot claim a release its overlay does not carry. The
# recipe asserts the agreement at build time by asking the installed binary.
#
# HOW THE DEFAULT WAS DETERMINED, and how to bump it: with no target given the
# installer reads its channel pointer, `https://x.ai/cli/<channel>` with
# GROK_CHANNEL defaulting to `stable`, which serves the current release as a
# bare version string — 1.0.34 when this was pinned. Re-read
# `curl -fsSL https://x.ai/cli/stable` to bump.
#
# WHY PINNED, and a correction to what this kit used to say here: the claim was
# that the installer takes no pin. It does — a version is install.sh's first
# positional argument, documented in its own usage block as
# `curl -fsSL https://x.ai/cli/install.sh | bash -s 0.1.42`. The float was never
# forced, and it could not stay either: an unversioned provide takes this
# descriptor's `version:` as its version at resolution, so `provides: ["grok"]`
# published `grok@1.0.0` — this kit's release number wearing the agent's name,
# which a kit writing `requires: ["grok >= 1"]` would refuse to resolve against.
#
# THIS MUST STAY EQUAL TO ../grok's `version` default. The two kits run the same
# installer at the same pin and provide the same name, so a composition that
# resolved one against the other's requires must see the same release. Nothing
# enforces it across kit directories — bump both together.
args:
  version:
    default: "1.0.34"
    # The installer's own target grammar
    # (`^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._]+)?$`) minus the underscore: a
    # version segment admits `[0-9A-Za-z-]` under SPEC-v3 §5.2, so every value
    # this pattern accepts is also a legal provide version.
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
    description: Grok release to install
    buildArg: GROK_VERSION

# Same name the workload provides, so composing this mixin with ../grok is
# refused rather than installing the agent twice (SPEC-v3 §5.3).
provides: ["grok@${{ kit.args.version }}"]

capabilities:
  # The agent's own egress rides with the kit that ships the agent: the base
  # grants nothing for services it doesn't carry.
  #
  # MIGRATION NOTE: no `install:` phase, and `x.ai` is gone with it. In the
  # workload that host exists for one reason — the setup hook that fetches the
  # CLI at sandbox-create time. This kit carries the CLI in its overlay
  # instead, so the install runs at *image-build* time, outside any sandbox
  # phase and outside this policy entirely. Keeping the grant would open
  # egress for an install phase that now runs nothing. The runtime phase is
  # unchanged, host for host, and is the whole of what the agent reaches.
  #
  # MIGRATION NOTE: v2 wrote every entry with an explicit `:443`. Dropped for
  # the contrib house style of portless entries; port suffixes are ignored for
  # allow-list membership anyway.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # The xAI chat-completions API. Declaring it in the credential's
          # apiKey.inject (below) wires header injection but does NOT
          # implicitly allow the domain — it still needs an explicit entry
          # here, confirmed against a real deny-all sandbox (403 Forbidden
          # without this line).
          - api.x.ai
          # Grok login discovers its OAuth configuration from auth.x.ai, then
          # uses the Grok chat proxy for authenticated inference and settings.
          - auth.x.ai
          - cli-chat-proxy.grok.com

  # optional, faithfully: v2 credentials default to not-required and the v3
  # default inverts, so stating it preserves the observable behavior.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: xAI API access for Grok
    config:
      service: xai
      phase: runtime
      # No proxyManaged, faithfully: v2 did not set it, so XAI_API_KEY is
      # present only when the host really bound a key.
      apiKey:
        name: XAI_API_KEY
        inject:
          - {domain: api.x.ai, header: Authorization, format: "Bearer %s"}

  # MIGRATION NOTE: no lifecycle entry. The workload's only hook is the
  # installer, which this kit's overlay performs at build time — and a
  # lifecycle entry declaring no hooks, no files and no interactive tail is
  # invalid, so the entry is dropped rather than left empty.

  # No `filename:` — the profile belongs to the workload that owns the
  # environment, and declaring it on a mixin is a validation error.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./grok-mixin-context.md

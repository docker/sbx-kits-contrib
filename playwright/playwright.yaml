# syntax=docker/sandbox-kit:3
# Playwright as a MIXIN. The v2 kit shipped no Dockerfile and installed
# everything through setup hooks, because a v2 mixin had no content mechanism —
# a lifecycle install hook was the only way for one to install anything.
#
# MIGRATION NOTE: v3 lifts that, so most of those hooks encoded a v2 limitation
# rather than a v3 requirement, and they now build into playwright.dockerfile:
# the /etc/profile.d drop and the pinned npm install were pure content, and so
# is the browser tree, which is a version-pinned artifact download that needs
# nothing from sandbox-create time. What that buys is no per-create download, a
# smaller install-phase permission surface (see the network policy below), and
# content that is digest-pinned and scannable in the published kit.
#
# WHAT STAYED A HOOK, AND WHY: Chromium's system libraries. `playwright install
# --with-deps` apt-installs them, and apt packages are not copyable content —
# they need the composed base's own dpkg database, and an overlay cannot carry a
# package's shared-library closure. ../openclaw-mixin documents the same split
# for the same reason. So the two halves of v2's third hook separate: the
# browser tree travels in the overlay, and `playwright install-deps chromium`
# stays below as the one thing a sandbox create still pays for.
#
# What a composed sandbox gets in each case: the CLI, the test runner and the
# browser binaries arrive with the layer, at compose time, whatever the base;
# the libraries they link against arrive at create, from the base's own apt.
# Where that hook cannot run — a base that is not Debian-family, or the apt
# hosts blocked by policy — Chromium is present and does not launch. That floor
# has no grammar to state it: provides/requires name kit capabilities, and no
# base workload provides an entry for its shared libraries.
#
# MIGRATION NOTE: v2's `environment.variables` has no v3 field here — a mixin's
# image config is not the composed image's — so the overlay drops both exports
# into /etc/profile.d/playwright-env.sh, which the base's login shell sources.
# Both stayed fixed values rather than becoming args with `env:`: neither is a
# knob. The agent context tells the agent not to override
# PLAYWRIGHT_BROWSERS_PATH, and the build creates and chmods that exact path, so
# an installer-supplied value would point the runtime at a directory nothing
# made. NODE_PATH is likewise a fact about the base's npm prefix, not a choice.
schemaVersion: "3"
displayName: Playwright
description: >-
  Playwright browser-automation toolchain for sandbox agents — the playwright
  CLI and @playwright/test v1.61.1 with Chromium, installed to a shared system
  browsers path so the agent user can run headless browser automation and
  end-to-end tests entirely inside the sandbox.

kind: mixin

# The recipe pins 1.61.1 and npm verifies the tarballs against the registry
# metadata's sha512 integrity values, so this version is a fact about what the
# kit installs rather than a release number. To bump: edit PLAYWRIGHT_VERSION in
# playwright.dockerfile, this entry, the agent context and the README together.
provides: ["playwright@1.61.1"]

capabilities:
  # MIGRATION NOTE: v2's one flat allow list, split by the phase that reaches
  # each host — and then shortened again when the npm install and the browser
  # download moved into the recipe. Both now run on the builder, which this
  # policy does not govern, so registry.npmjs.org leaves the kit's surface
  # entirely and the three browser CDNs leave the install phase. They stay in
  # `runtime`, where the v2 comment already needed them.
  #
  # What is left in `install` is the apt hook's hosts, because the apt hook is
  # what is left. A partial move means a smaller install list, not an absent
  # one.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          # `playwright install-deps chromium` apt-installs Chromium's system
          # libraries. `apt-get update` refreshes every configured source, so
          # all template sources must be reachable: Ubuntu hosts amd64 packages
          # on archive/security and arm64 packages on ports.ubuntu.com, and the
          # *-docker templates pre-add Docker's apt repo. Install-only: nothing
          # the agent does reaches apt.
          - archive.ubuntu.com
          - security.ubuntu.com
          - ports.ubuntu.com
          - download.docker.com
      runtime:
        allow:
          # The three browser-download hosts, which the v2 comment called out as
          # needed in both phases and which are now runtime-only: a project
          # pinning a different Playwright version fetches its matching build
          # with `npx playwright install chromium` at runtime, and the overlay
          # ships /opt/ms-playwright world-writable for exactly that.
          #
          # cdn.playwright.dev is the primary CDN, the prss.microsoft.com host
          # is the documented fallback Playwright rotates to on CDN failure, and
          # storage.googleapis.com is Google's Chrome-for-Testing bucket that
          # cdn.playwright.dev 302s to for amd64 Chromium (arm64 builds come
          # from prss.microsoft.com instead, hence the split).
          - cdn.playwright.dev
          - playwright.download.prss.microsoft.com
          - storage.googleapis.com

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # All that is left of v2's three install hooks. The first two and the
        # download half of this one are in the overlay; this is the half that
        # cannot travel in one, so it still runs at create, against the composed
        # base's own apt.
        #
        # `install-deps` rather than `install --with-deps`: the browser is
        # already on disk from the layer, and this is the apt-only verb, so the
        # hook touches no CDN and the install phase needs no CDN grant.
        #
        # MIGRATION NOTE: this body reads no variable itself, but the apt-get
        # run behind it does — it takes the proxy from the environment, and v2's
        # unrestricted hook environment handed it over. Under v3's
        # deny-by-default hook env it has to be declared or the package fetch
        # fails behind the sandbox's forced proxy.
        - command: |
            set -euo pipefail
            playwright install-deps chromium
            rm -rf /var/lib/apt/lists/*
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: Install Chromium's system libraries via apt — the overlay carries the browser tree, apt packages cannot travel in one

  # No `filename:` — that is workload-only, and this mixin contributes a body
  # to whichever agent owns the profile.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./playwright-context.md

schemaVersion: "2"
kind: sandbox
name: zeroclaw
displayName: ZeroClaw
description: Fast, small, fully autonomous AI assistant infrastructure (Rust, single binary) — gateway with 30+ channels and ~20 providers. Installs in seconds from the pinned upstream release; no custom image needed.
sandbox:
  image: docker/sandbox-templates:shell
  entrypoint:
    # Invoked through `sh` because files under `files/home/` land 0644 -- the
    # artifact loader does not carry the source exec bit, so a direct exec
    # fails with EACCES.
    - sh
    - /home/agent/.local/bin/zeroclaw-start.sh
permissions:
  network:
    allow:
      # Every domain the anthropic credential injects into -- required here
      # too, not just below: this repo's e2e runs every kit under
      # `sbx policy init deny-all`, so a domain absent from this list is
      # unreachable regardless of what the credential block declares.
      - api.anthropic.com
      - claude.ai
      - console.anthropic.com
      # The anthropic credential's OAuth token endpoint, for the refresh the
      # proxy performs once the access token expires.
      - platform.claude.com:443
      - github.com:443
      - objects.githubusercontent.com:443
      - release-assets.githubusercontent.com:443
      - '*.telegram.org'
      - '*.discord.com'
      - gateway.discord.gg
      - '*.matrix.org'
      - '*.slack.com'
ports:
  - container: 42617
    name: gateway
credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: '%s'
        - domain: claude.ai
          header: x-api-key
          format: '%s'
        - domain: console.anthropic.com
          header: x-api-key
          format: '%s'
    # For a host whose stored anthropic credential is an OAuth login -- signed
    # in from a `claude` sandbox rather than an API key. Without this block
    # such a host gets no usable credential at all: the apiKey sentinel reaches
    # Anthropic unswapped and every model call 401s.
    #
    # ZeroClaw reads its credential from config.toml, not from this file, so
    # credentialFile serves two narrower purposes: it is what makes the OAuth
    # path detectable from inside the sandbox (SBX_CRED_ANTHROPIC_MODE reports
    # "none" even when this credential resolves, so it cannot discriminate
    # oauth from apikey), and it carries the sentinel that
    # zeroclaw-anthropic-key.sh templates into config.toml. The file holds
    # sentinels, not real tokens.
    oauth:
      tokenEndpoint:
        host: platform.claude.com
        path: /v1/oauth/token
      resourceHosts:
        - api.anthropic.com
      sentinels:
        accessToken: sk-ant-oat01-proxy-managed
        refreshToken: sk-ant-ort01-proxy-managed
      credentialFile:
        path: ~/.claude/.credentials.json
        structure:
          claudeAiOauth:
            accessToken: '{{.AccessToken}}'
            refreshToken: '{{.RefreshToken}}'
            expiresAt: '{{.ExpiresAt}}'
            scopes: '{{.Scopes}}'
environment:
  variables:
    ZEROCLAW_gateway__host: 0.0.0.0
setup:
  install:
    - command: set -e; v=v0.8.0; case "$(uname -m)" in x86_64) t=x86_64-unknown-linux-gnu;; aarch64|arm64) t=aarch64-unknown-linux-gnu;; *) echo "unsupported arch"; exit 1;; esac; curl -fsSL "https://github.com/zeroclaw-labs/zeroclaw/releases/download/$v/zeroclaw-$t.tar.gz" | tar -xz -C /usr/local/bin zeroclaw && chmod 0755 /usr/local/bin/zeroclaw
      user: "0"
      description: Install the pinned zeroclaw release binary
  startup:
    # Runs on every container start, ahead of any attach, so a sandbox nobody
    # attaches to (the gateway on the published port) is configured too. The
    # script is idempotent -- the placeholder it matches is gone after the
    # first substitution -- which is why the entrypoint can call it again.
    - command:
        - sh
        - /home/agent/.local/bin/zeroclaw-anthropic-key.sh
      user: "1000"
      description: Resolve the host's Anthropic credential into config.toml at sandbox start

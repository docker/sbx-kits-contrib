schemaVersion: "2"
kind: sandbox
name: openclaw
displayName: OpenClaw
description: Personal AI assistant with multi-platform chat, skills, and gateway support. Uses a pre-baked image so sandboxes start in seconds.
sandbox:
  # Pre-baked image: Node 22, openclaw @ pinned version, Chromium for the
  # browser tool, and a minimal gateway config. Built and published by
  # build-and-publish-kits.yml, the shared kit-image pipeline (see
  # ../PUBLISHING.md) -- no bespoke workflow needed, same as kiro/copilot.
  image: docker.io/sbx/openclaw-image:latest
  entrypoint:
    - /usr/local/bin/openclaw-start
agentInstructions:
  filename: AGENTS.md
permissions:
  network:
    allow:
      # Every domain the anthropic credential injects into -- required here
      # too, not just below: this repo's e2e runs every kit under
      # `sbx policy init deny-all`, so a domain absent from this list is
      # unreachable regardless of what the credential block declares.
      - api.anthropic.com
      - claude.ai
      - console.anthropic.com
      # OpenRouter is a supported alternate model provider (`/model
      # openrouter/...`). Confirmed necessary via a real e2e run under
      # deny-all.
      - openrouter.ai
      # runtime plugin installs (/plugins install, externalized channels)
      - registry.npmjs.org
      - '*.npmjs.org'
      - clawhub.ai:443
      # Confirmed necessary via a real e2e run under deny-all.
      - raw.githubusercontent.com
      # chat platforms
      - '*.telegram.org'
      - '*.discord.com'
      - gateway.discord.gg
      - '*.whatsapp.com'
      - '*.whatsapp.net'
      - '*.slack.com'
      # project domains (docs links, update notes)
      - openclaw.ai
      - docs.openclaw.ai
ports:
  - container: 18789
    name: gateway
credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: '%s'
        - domain: claude.ai
          header: x-api-key
          format: '%s'
        - domain: console.anthropic.com
          header: x-api-key
          format: '%s'
environment:
  variables:
    OPENCLAW_STATE_DIR: /home/agent/.openclaw
    PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright

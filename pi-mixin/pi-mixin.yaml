# syntax=docker/sandbox-kit:3
# pi as a MIXIN: the same declarations as the standalone workload kit
# (../pi), minus what only the kit that owns the environment can carry -- the
# entrypoint (the base workload's launch command stays; run `pi` from the
# shell), the context-file profile (`filename` is workload-only, so this kit
# contributes `contentFile` alone), agent-sessions (the verbs append to the
# workload's launch argv, which here is the base's shell) and sbx@1 (a
# mixin's image config never becomes the composed image's).
schemaVersion: "3"
displayName: Pi (mixin)
description: >-
  Pi as a mixin — the npm-installed coding agent and the `fd` binary its
  `find` tool probes for, in an overlay, with the Anthropic credential
  (API key or claude.ai OAuth). Layer it onto a shell base and run `pi`.
sourceUrl: https://www.npmjs.com/package/@earendil-works/pi-coding-agent

kind: mixin

# The install floats, as in the workload: the recipe tracks the `latest`
# dist-tag, so the provide carries no version of its own and `version:`
# answers for it.
version: "1.0.0"
provides: ["pi"]

capabilities:
  # The agent's own egress rides with the kit that ships the agent: the base
  # grants nothing for services it does not carry. Runtime-only, like the
  # workload: pi is installed at build, and the one hook here writes ~/.npmrc
  # and reaches nothing, so the install phase stays absent -- and an absent
  # phase grants nothing, which is exactly right. Entries are portless (the
  # contrib house style) where v2 wrote `host:443`.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Every domain the anthropic credential injects into; v3 validates
          # that invariant at build time (SPEC-v3 §11).
          - api.anthropic.com
          # pi's runtime package installs (extensions, skills, prompt
          # templates, themes) and the packages named in settings, fetched
          # on startup.
          - registry.npmjs.org
          # The oauth block's token-refresh endpoint.
          - platform.claude.com

  # Optional, as in the workload: pi runs unauthenticated (it prompts for a
  # key), so a required entry would fail resolution on a host that never
  # bound one.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Anthropic API access (API key or claude.ai OAuth)
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        # pi only sends x-api-key to api.anthropic.com; no other host needs
        # the key, so no other host gets it.
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: "%s"}
      # For a host whose stored anthropic credential is an OAuth login --
      # signed in from a `claude` sandbox. Without this block such a host has
      # no usable credential here: the apiKey sentinel reaches Anthropic
      # unswapped and every model call is a 401. An API key still wins when
      # the host has one.
      oauth:
        tokenEndpoint: {host: platform.claude.com, path: /v1/oauth/token}
        # Where the bearer is used, so the access-token sentinel is swapped on
        # inference calls and not only on refresh. pi sends a value containing
        # `sk-ant-oat` as `Authorization: Bearer`, so the sentinel below is
        # what selects that format.
        resourceHosts: [api.anthropic.com]
        sentinels:
          accessToken: sk-ant-oat01-proxy-managed
          refreshToken: sk-ant-ort01-proxy-managed
        credentialFile:
          # pi's native auth store, which pi prefers over the environment, so
          # nothing in the kit has to translate it.
          path: ~/.pi/agent/auth.json
          structure:
            anthropic:
              type: oauth
              access: "{{.AccessToken}}"
              refresh: "{{.RefreshToken}}"
              # A standalone {{.ExpiresAt}} materializes as a JSON number --
              # the type pi's store wants.
              expires: "{{.ExpiresAt}}"

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Config only -- pi itself is in the overlay, so nothing is installed
        # here and this hook needs no network grant. Idempotent, so
        # re-running it on recreate is fine.
        #
        # Guarded on HTTP_PROXY being non-empty: npm rejects an empty value
        # for a url-typed config key, so an unset or empty variable would fail
        # the step and take sandbox creation down with it. HTTPS_PROXY is
        # preferred for https-proxy when the runtime provides a dedicated one,
        # with HTTP_PROXY as the fallback.
        #
        # `env:` is what v3 adds: hook environments are deny-by-default, so
        # both proxy variables the command reads have to be named or the guard
        # would always see an empty HTTP_PROXY and the hook would silently
        # become a no-op on every proxied runtime.
        - command: 'if [ -n "${HTTP_PROXY:-}" ]; then npm config set proxy="$HTTP_PROXY" https-proxy="${HTTPS_PROXY:-$HTTP_PROXY}"; fi'
          user: "1000"
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: Point npm at the sandbox proxy in ~/.npmrc so pi's runtime npm use (`pi install npm:...`, `pi update`, startup package fetches) works in exec contexts that do not inherit the proxy environment variables

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./pi-mixin-context.md

# MIGRATION NOTE: no agent-skills@1, for the same reason as the workload.
# pi's "skills" are npm packages it installs at runtime
# (`pi install npm:@scope/pkg`), not a directory a host skills store could be
# mounted at -- neither the v2 spec.yaml nor the README names such a path, and
# inventing one would declare a mount the agent never reads.

# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: GitLab CLI (glab)
description: Installs the GitLab CLI (glab) with proxy-injected personal access token auth, so agents can work with GitLab projects the way gh works with GitHub. Targets gitlab.com by default and any self-managed instance via the host argument.

kind: mixin

# The `glab` release this kit's overlay carries, by reference to the `version`
# arg below — SPEC-v3 §4 admits a build-phase arg reference in this field and
# expands it at publish, so the release is stated in exactly one place and the
# publish tag and `org.opencontainers.image.version` name the CLI the kit
# ships.
#
# MIGRATION NOTE: this was a standalone "1.0.0", described here as "the kit's
# own version, not the version of anything it installs". That was the honest
# reading while `glab` came from an install hook — the kit had no content, so
# it had nothing of its own to version but its declarations. Now that the CLI
# ships in the kit's layers, the kit and the release it carries are the same
# artifact, and versioning them separately would mean maintaining a number
# that says nothing a consumer can act on.
version: "${{ kit.args.version }}"

# MIGRATION NOTE: `requires: ["deb/dpkg"]` is gone, and it went out with the
# hook that justified it. The glab install hook picked its release asset with
# `dpkg --print-architecture` under `set -euo pipefail`, so a base without dpkg
# died at that line and sandbox creation failed — that, and only that, is what
# the requirement recorded. gitlab.dockerfile makes the same choice at build
# from buildx's TARGETARCH, and the one hook left reads no distribution
# package at all. `requires` is a closed-set check (SPEC-v3 §5.3): a name kept
# past its reason refuses compositions in exchange for nothing.

args:
  host:
    default: "gitlab.com"
    description: "GitLab instance hostname, e.g. gitlab.example.com for a self-managed instance"
    # No scheme, path, port or shell metacharacters: the value is substituted
    # into a network rule, an inject domain, and an install-hook shell string.
    pattern: '^[A-Za-z0-9][A-Za-z0-9.-]*$'
    # MIGRATION NOTE: this is where v2's `environment.variables.GITLAB_HOST`
    # went. v3 has no static env grammar and a mixin's image config is not
    # the composed image's, so a `environment:` block has nowhere to land —
    # but the v2 value was `"${{ kit.args.host }}"`, i.e. this arg and
    # nothing else, and `env:` on an arg is exactly "put the resolved value
    # in the container under this name" (SPEC-v3 §6). The export therefore
    # needs no /etc/profile.d overlay and no recipe at all: this kit stays
    # declaration-only.
    #
    # It remains load-bearing for the same reason v2 set it: it pins glab
    # to the instance this sandbox holds a token for. Without it glab falls
    # back to "gitlab.com, or the authenticated host in the current Git
    # directory", which can target a host the proxy injects nothing for.
    env: GITLAB_HOST
  service:
    default: "gitlab"
    description: "Credential service name to bind with `sbx secret set`. Give a self-managed sandbox its own name (e.g. gitlab-acme) so it can hold a different PAT from a gitlab.com sandbox."
    # Same grammar the spec requires of credentials[].service: lowercase
    # kebab. The credential entry below is parameterized on this arg, so it
    # validates leniently here and strictly after expansion at create —
    # this pattern is what guarantees the expanded `service:` is still a
    # well-formed credential name whatever the installer supplies.
    pattern: '^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$'
  version:
    # The `glab` release gitlab.dockerfile downloads, declared once: validated
    # here, handed to the recipe as GLAB_VERSION, and expanded into `provides`
    # and into the top-level `version:` — so the kit cannot publish a release
    # its overlay does not carry. The recipe proves the agreement by running
    # the installed binary and comparing what it reports.
    #
    # `buildArg:`, not `env:` — the two are mutually exclusive and this value
    # resolves at build. Note the contrast with `host` above, which takes
    # `env:` for the opposite reason: the instance is the installer's choice
    # and must not be baked, while the release is the kit's choice and must be.
    #
    # An installer may override it, but not silently: the per-arch SHA256s in
    # the recipe are pinned to this release, so another version fails the
    # digest check rather than installing under a descriptor that goes on
    # claiming this number. Bumping glab is therefore a three-part edit — this
    # default and both digests in gitlab.dockerfile, together — with the
    # checksums from the release's checksums.txt.
    default: "1.118.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: glab release to install
    buildArg: GLAB_VERSION

# The CLI the overlay puts on PATH, carrying the version it actually landed.
# MIGRATION NOTE: this kit declared no provide at all while `glab` came from an
# install hook — there was no content to describe, and the honest name for "a
# binary some sandbox may or may not have downloaded" was none. The overlay
# changes that, so a kit writing `requires: ["glab >= 1.118"]` now has
# something to resolve against.
provides: ["glab@${{ kit.args.version }}"]

capabilities:
  # One host, one phase — and getting there took two steps.
  #
  # MIGRATION NOTE: v2 declared one flat allow list holding gitlab.com and the
  # target instance, and the v2 comments already sorted them. gitlab.com was
  # "install time only" — the pinned glab release tarball is served from
  # gitlab.com whatever instance the kit targets — while the target instance is
  # runtime, being glab's API traffic in the agent's steady state. So the first
  # v3 cut split the list by phase.
  #
  # MIGRATION NOTE: the install phase is now gone entirely. gitlab.com was in
  # it for the release tarball and nothing else, and gitlab.dockerfile fetches
  # that at image build — the builder's traffic, which this policy does not
  # govern. The one hook that remains writes a config file and needs no egress
  # at all, so the phase had no consumer left. An absent phase grants nothing,
  # which is the whole point of moving the download: the grant existed only to
  # let that hook reach the network.
  #
  # It also retires a hazard rather than merely a grant. The v2 list kept
  # gitlab.com reachable-but-never-injected-into, because a domain-wide inject
  # rule there would have attached a self-managed instance's PAT to the
  # download and 401'd it. With no download, a sandbox targeting a
  # self-managed instance cannot reach gitlab.com at all, and the awkward case
  # the README documented at length simply does not arise.
  #
  # Ports: v2 wrote its entries as `:443`. Dropped for the contrib house style
  # of portless entries; allow-list membership ignores a port suffix either
  # way, so this only widens the grant from 443 to any port on a host that
  # speaks nothing else.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - ${{ kit.args.host }}

  # Not `optional:`. v2 credentials defaulted to not-required and this one
  # said `required: true`; v3 inverts the default, so required is spelled
  # by saying nothing.
  - type: com.docker.sandbox/credential@1
    description: GitLab personal access token (api scope) for the target instance. Stored on the host; the sandbox only sees a placeholder and the proxy injects the real value on requests to that instance.
    config:
      # Parameterized on purpose: a self-managed sandbox binds its own
      # service name and so holds a different PAT from a gitlab.com one.
      # The arg's pattern above is the lowercase-kebab grammar this field
      # requires, so the expanded form is well-formed by construction.
      service: ${{ kit.args.service }}
      # runtime, not install: the token is for the agent's glab and API
      # traffic. There is no install-time traffic left to authenticate —
      # the release download moved into gitlab.dockerfile — so runtime is
      # now the only phase this credential could sensibly name.
      phase: runtime
      apiKey:
        # glab reads GITLAB_TOKEN and treats itself as logged in. proxyManaged
        # sets it to the sentinel inside the container; the proxy replaces the
        # Authorization header with the real token on outbound calls.
        #
        # A second inject rule with `scheme: basic` (for git-over-HTTPS) was
        # tried and confirmed NOT to work: the proxy does not disambiguate two
        # inject rules on the same domain by which auth scheme the client sent,
        # so the Basic-auth request is never rewritten and GitLab rejects the
        # literal sentinel. See README for the SSH-based workaround (gitlab-ssh)
        # and the upstream feature request this gap warrants.
        name: GITLAB_TOKEN
        proxyManaged: true
        inject:
          # Only the target instance, and now that is all it can be. While the
          # release tarball was downloaded in-sandbox, gitlab.com had to be
          # reachable-but-never-injected-into: a domain-wide rule here would
          # have attached a PAT minted on another instance to that download,
          # and GitLab rejects a bad token outright rather than falling back
          # to anonymous access, so the download 401'd and the kit failed to
          # apply. With the download gone, gitlab.com is not in the allow list
          # unless it *is* the target, and validation would reject an inject
          # domain that is not.
          #
          # This domain and the runtime allow entry are the same placeholder,
          # so the "inject domain must appear in the matching phase's allow
          # list" invariant holds after expansion, not just at authoring time.
          - domain: ${{ kit.args.host }}
            header: Authorization
            format: Bearer %s

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # MIGRATION NOTE: the first hook, "Install glab, version+digest
        # pinned", is gone — gitlab.dockerfile performs that download at image
        # build instead, with the same release and the same two SHA256s.
        # Nothing in the hook body needed sandbox-create time: it read no arg,
        # no credential and no create-time path, and its one
        # environment-shaped input was `dpkg --print-architecture`, which
        # buildx answers better as TARGETARCH because it can answer it once
        # per platform.
        #
        # What that bought, in order of how visible it is: gitlab.com left the
        # network policy above (no install phase remains), `deb/dpkg` left
        # `requires`, the tarball's digest is now fixed in a scannable
        # published layer rather than re-verified in every sandbox, a
        # withdrawn or re-rolled release fails the build at publish instead of
        # failing sandbox creation for a user, and every `sbx run` of this kit
        # saves the download.
        #
        # The one hook that remains is the one that could not move — see
        # below, and note that its first act is to look at what is already on
        # disk, which is the shape of decision no layer can make.

        # glab consults GITLAB_TOKEN for a host only if that host appears in its
        # config. gitlab.com is built in; any other host without an entry is
        # reported as "has not been authenticated with glab" even while every API
        # call succeeds on the env token. Seeding an entry — carrying no token —
        # makes `glab auth status` agree with reality. glab refuses to read a
        # config that is not 0600.
        #
        # No `env:` list: the host reaches this hook by arg expansion into
        # the heredoc, not through the environment. GITLAB_HOST exists in
        # the container (see args.host) but nothing here reads it.
        #
        # WHY THIS STAYS A HOOK, three times over: the config body is built
        # from the create-phase `host` arg, which is the installer's choice
        # and has no value at build; the `if [ ! -f "$CFG" ]` guard reads the
        # state of the sandbox it is running in, and a layer replaces a file
        # rather than looking at one, so baking this would clobber exactly
        # the edited config the guard exists to protect; and it writes under
        # /home/agent, which on the composed base may be a mounted volume
        # that covers whatever an overlay put there.
        - command: |
            set -euo pipefail
            CFG=/home/agent/.config/glab-cli/config.yml
            # install re-runs on recreate: never clobber a config the user has
            # since edited (or that `glab auth login` has written into).
            if [ ! -f "$CFG" ]; then
              install -d -m 0700 -o agent -g agent /home/agent/.config/glab-cli
              cat > "$CFG" <<'EOF'
            hosts:
              ${{ kit.args.host }}:
                api_host: ${{ kit.args.host }}
                api_protocol: https
                git_protocol: ssh
            EOF
              chmod 600 "$CFG"
              chown agent:agent "$CFG"
            fi
          user: "0"
          description: "Seed glab's host config so `glab auth status` recognizes the instance"

  # MIGRATION NOTE: inline `content:` rather than a `gitlab-context.md`
  # companion. A `contentFile:` body is read and staged into a layer at
  # PUBLISH, but `host` is a create-phase arg expanded into the descriptor
  # at create — a staged body would tell the agent it is authenticated
  # against a literal "${{ kit.args.host }}", and naming the instance is
  # most of what this text is for. Inline content is a descriptor string,
  # so it expands.
  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        ## GitLab CLI

        `glab` is installed and authenticated against ${{ kit.args.host }}
        through the sandbox proxy — `GITLAB_TOKEN` is a proxy-managed
        placeholder, never the real token. Use `glab api ...` for arbitrary
        GitLab REST calls and the usual `glab mr` / `glab issue` / `glab repo`
        subcommands. Verify auth with `glab auth status`.

        Only ${{ kit.args.host }} is authenticated. `GITLAB_TOKEN` holds a
        sentinel the proxy rewrites for that host alone, so a request to any
        other GitLab instance sends the literal sentinel and gets a 401 rather
        than falling back to anonymous access. Nothing secret is exposed by
        this; use a separate sandbox for a different instance.

        Git-over-HTTPS push/pull auth is NOT wired up by this kit (the sandbox
        proxy cannot rewrite git's Basic auth without breaking the Bearer auth
        `glab`/the API rely on — same domain, two schemes). For `git clone` /
        `git push` / `git pull`, use SSH remotes
        (`git@${{ kit.args.host }}:group/project.git`) — add the `gitlab-ssh`
        kit for passwordless host-key verification, and load your key with
        `ssh-add` on the host so it forwards into the sandbox.

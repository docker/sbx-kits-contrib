# syntax=docker/sandbox-kit:3
# Migration of the v2 `grok` sandbox kit (spec.yaml, schemaVersion "2").
# v2 shipped no Dockerfile — it pointed sandbox.image straight at a published
# template and installed the agent from a setup hook. A v3 workload's layers
# ARE its root filesystem, so grok.dockerfile now states that image as its
# `FROM`, carries v2's sandbox.entrypoint, and performs the install v2 left to
# create time. That last part is why this kit declares no lifecycle hook and
# no install-phase egress; see the MIGRATION NOTEs below.
schemaVersion: "3"
displayName: Grok Build
description: xAI's terminal-based coding agent, powered by Grok models.

kind: workload

# MIGRATION NOTE: v2 declared no `version:`. What stands here now is the Grok
# release this kit installs, by reference to the `version` arg below — SPEC-v3
# §4 admits a build-phase arg reference in this field and expands it at
# publish. So the kit states its version in exactly one place, and its publish
# tag and `org.opencontainers.image.version` name the agent the image carries
# rather than a kit release number of their own.
version: "${{ kit.args.version }}"

# The Grok release the recipe installs, declared once: validated here, handed
# to the installer as its version argument, and expanded into `provides` and
# `version:` — so the kit cannot claim a release it does not carry. The recipe
# asserts the agreement at build time by asking the installed binary.
#
# HOW THE DEFAULT WAS DETERMINED, and how to bump it: with no target given the
# installer reads its channel pointer, `https://x.ai/cli/<channel>` with
# GROK_CHANNEL defaulting to `stable`, which serves the current release as a
# bare version string — 1.0.34 when this was pinned. So this default is
# exactly what the unpinned recipe installed the day it was pinned, not a jump
# to a different channel. Re-read `curl -fsSL https://x.ai/cli/stable` to bump,
# and bump ../grok-mixin in the same change.
#
# WHY PINNED, and a correction to what this kit used to say here: the claim was
# that install.sh takes no pin. It does — a version is its first positional
# argument, which its own usage block documents as
# `curl -fsSL https://x.ai/cli/install.sh | bash -s 0.1.42`, and it refuses a
# target that is not X.Y.Z[-suffix]. So the float was never forced. It also
# could not stay: an unversioned provide takes this descriptor's `version:` as
# its version at resolution, so `provides: ["grok"]` published `grok@1.0.0` —
# the kit's own release number wearing the agent's name, which a mixin writing
# `requires: ["grok >= 1"]` would refuse to resolve against.
args:
  version:
    default: "1.0.34"
    # The installer's own target grammar
    # (`^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._]+)?$`) minus the underscore: a
    # version segment admits `[0-9A-Za-z-]` under SPEC-v3 §5.2, so every value
    # this pattern accepts is also a legal provide version.
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
    description: Grok release to install
    buildArg: GROK_VERSION

provides: ["grok@${{ kit.args.version }}"]

capabilities:
  # This workload is an agent sandbox: the host launches the agent rather than
  # running the image's entrypoint as PID 1, and honors the identity the image
  # config declares instead of assuming one.
  - type: com.docker.sandbox/sbx@1

  # MIGRATION NOTE: v2's single flat allow list is phase-scoped in v3, and an
  # absent phase grants nothing. There is no `install:` phase here, and v2's
  # `x.ai` is gone with it.
  #
  # That host existed for exactly one reason: the setup hook that fetched the
  # CLI at sandbox-create time. grok.dockerfile now runs that install at
  # image-build time — outside any sandbox phase, and so outside this policy
  # altogether — which is what ../grok-mixin's overlay has always done. An
  # install grant with no installer left to serve is egress this kit would be
  # asking for and never using, so it is dropped rather than left standing.
  # Nothing inside a sandbox built from this kit reaches x.ai: the entrypoint
  # passes --no-auto-update, so the CLI never fetches from it in steady state
  # either.
  #
  # The runtime phase is v2's list minus that one download host, and is the
  # whole of what the agent reaches.
  #
  # MIGRATION NOTE: v2 wrote every entry with an explicit `:443`. Dropped for
  # the contrib house style of portless entries — port suffixes are ignored
  # for allow-list membership anyway (network-policy@1, "Entry patterns"), so
  # no host changes reachability by the rewrite.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # The xAI chat-completions API. Declaring it in the credential's
          # apiKey.inject (below) wires header injection but does NOT
          # implicitly allow the domain through the network policy — it still
          # needs an explicit entry here, confirmed against a real deny-all
          # sandbox (403 Forbidden without this line). v3 additionally
          # validates the reverse direction, refusing an inject domain that
          # this list never admits.
          - api.x.ai
          # Grok login discovers its OAuth configuration from auth.x.ai, then
          # uses the Grok chat proxy for authenticated inference and settings.
          - auth.x.ai
          - cli-chat-proxy.grok.com

  # optional, faithfully: v2 credentials default to not-required and the v3
  # default inverts (an entry is required unless it opts out). v2 set no
  # `required:` here, so stating it preserves the observable behavior — a
  # sandbox with no xAI key bound still creates, and grok reports the missing
  # key itself.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: xAI API access for Grok
    config:
      service: xai
      phase: runtime
      # No proxyManaged, faithfully: v2 did not set it here. That flag plants
      # the env var as an in-container sentinel whether or not a host
      # credential is bound; without it, XAI_API_KEY is present only when the
      # host really bound one.
      apiKey:
        name: XAI_API_KEY
        inject:
          - {domain: api.x.ai, header: Authorization, format: "Bearer %s"}

  # MIGRATION NOTE: no lifecycle entry. v2's one hook installed the CLI at
  # sandbox create; grok.dockerfile now does that at build, with the same
  # command and the same ~/.local/bin pre-creation the hook needed — the
  # installer only symlinks `grok` onto an existing, writable PATH directory
  # and never creates one. Nothing is left for a hook to do at create time,
  # and a lifecycle entry declaring no hooks, no files and no interactive tail
  # is invalid, so the entry is dropped rather than left empty.

  # The session control surface: how a harness drives grok without a human at
  # the terminal. Argv tails append to the entrypoint the way user args do.
  #
  # MIGRATION NOTE: this is v2's `promptArgs: ["-p"]` from testdata/tck.yaml —
  # a working non-interactive invocation the v2 TCK already exercised, which
  # is the only evidence that licenses this capability. The other verbs
  # (resume, continue, list) are omitted rather than guessed: an absent verb
  # means "operation unsupported", which is the truthful answer here.
  - type: com.docker.sandbox/agent-sessions@1
    description: Drive grok prompts programmatically
    config:
      prompt: ["-p", "{{.Prompt}}"]

  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      contentFile: ./grok-context.md

# syntax=docker/sandbox-kit:3
# Kiro as a MIXIN: the same declarations as the standalone workload kit
# (../kiro), minus what only the kit that owns the environment can carry —
# the entrypoint (the base workload's launch command stays; you run `kiro`
# from the shell), the context-file profile (`filename` is workload-only, so
# this kit contributes `contentFile` alone), and `sbx@1`.
schemaVersion: "3"
displayName: Kiro (mixin)
description: >-
  AWS's Kiro CLI as a mixin — kiro-cli and its device-flow launcher in an
  overlay, with the egress policy Kiro's auth, chat and telemetry backends
  need and the hooks that set up its state directory and MCP gateway. Layer it
  onto a shell base and run `kiro`.

kind: mixin

# The KIT's version, not Kiro's, and the fallback version for the unversioned
# provide below: the installer takes no pin, so there is no kiro-cli release
# this kit could honestly name. Tracks ../kiro.
version: "1.0.0"

# Same name the workload provides, so composing this mixin with ../kiro is
# refused rather than installing the agent twice (SPEC-v3 §5.3).
provides: ["kiro"]

capabilities:
  # The agent's own egress rides with the kit that ships the agent: the base
  # grants nothing for services it doesn't carry.
  #
  # Kiro's own three hosts are listed in BOTH phases rather than moved to one:
  # the install hook below runs `kiro-cli setup --no-confirm` at
  # sandbox-create time and whether that command touches the network has not
  # been confirmed from a live run, while the v2 comment establishes that
  # kiro-cli reaches the same hosts in steady state for version checks and
  # self-update. Listing them twice reproduces v2's reachability in both
  # phases. Everything else is runtime-only: the apt hosts because startup
  # hooks run at boot inside the runtime phase, and the AWS endpoints because
  # the device flow happens when you run the launcher.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - cli.kiro.dev
          - prod.download.cli.kiro.dev
          - kiro.dev
      runtime:
        allow:
          # kiro-cli reaches these for version checks and self-update.
          # cli.kiro.dev serves the install/update script, which then fetches
          # the versioned binary from prod.download.cli.kiro.dev.
          - cli.kiro.dev
          - prod.download.cli.kiro.dev
          - kiro.dev
          # For the apt startup hook below, which refreshes metadata for every
          # configured source and returns exit 100 if any one of them fails.
          # All three Ubuntu hosts are listed because Ubuntu serves amd64 from
          # archive/security and arm64 from ports, and this kit does not know
          # which base it will land on.
          - archive.ubuntu.com        # Ubuntu archive (amd64 main)
          - security.ubuntu.com       # Ubuntu security updates (amd64)
          - ports.ubuntu.com          # Ubuntu archive/security (arm64)
          - download.docker.com       # Docker's apt repo, on the shell-docker family
          #
          # AWS-backed endpoints Kiro's device-flow auth and chat need,
          # reported in #185. Not publicly documented beyond that. Exact hosts
          # rather than a *.us-east-1.amazonaws.com wildcard — that would
          # reach every AWS service in the region, not just Kiro's own
          # backend.
          - client-telemetry.us-east-1.amazonaws.com
          - cognito-identity.us-east-1.amazonaws.com
          - desktop-release.q.us-east-1.amazonaws.com
          - management.us-east-1.kiro.dev
          - prod.us-east-1.auth.desktop.kiro.dev
          - prod.us-east-1.telemetry-v2.kiro.dev
          - runtime.us-east-1.kiro.dev
          - q.us-east-1.amazonaws.com  # Amazon Q backend — Kiro's chat API
          - view.awsapps.com           # AWS access portal / Identity Center device-flow auth

  # MIGRATION NOTE: no `credential@1` entry — v2 declared none. Kiro
  # authenticates only through an interactive device flow, so there is no
  # secret for the host's credential store to hold and nothing for the proxy
  # to inject. Run the launcher once in a terminal to sign in.

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Also run in the overlay's build stage; re-run here because the
        # data.sqlite3 it creates under ~/.local/share/kiro-cli may be
        # shadowed by a volume mounted at create, in which case the baked copy
        # is not the one the agent reads.
        - command: "kiro-cli setup --no-confirm"
          user: "agent"
          description: Run Kiro CLI setup
      startup:
        # Carried over from the workload. The `command -v apt-get` guard makes
        # it a no-op on a base with no apt, which is the case a mixin has to
        # tolerate and the workload did not.
        - command: ["sh", "-c", "command -v apt-get > /dev/null 2>&1 && (apt-get update -qq -y > /dev/null 2>&1 || true)"]
          user: "root"
          background: true
          description: Update apt package cache in background

        # Gateway-first MCP registration. sandboxd injects MCP_GATEWAY_URL +
        # MCP_SENTINEL_TOKEN_NAME into the container env when a gateway has
        # been reserved. The sentinel name is not a credential — the proxy
        # substitutes the real token at request time keyed by this name.
        # No-op when MCP isn't enabled.
        #
        # kiro-cli keys an HTTP MCP server by `url` plus a `headers` object —
        # there is no `type` field and no `httpUrl` (that spelling is
        # Gemini's, and is the wrong answer most easily reached for). See the
        # Authorization Example in https://kiro.dev/docs/cli/mcp/configuration/
        #
        # Hook environments are deny-by-default in v3, so the two variables
        # this body reads are enumerated in `env:`. $HOME is the platform
        # baseline and needs no entry.
        - command:
            - sh
            - -c
            - |
              set -e
              [ -n "$MCP_GATEWAY_URL" ] || exit 0
              mkdir -p "$HOME/.kiro/settings"
              cat > "$HOME/.kiro/settings/mcp.json" <<EOF
              {
                "mcpServers": {
                  "mcp-gateway": {
                    "url": "$MCP_GATEWAY_URL",
                    "headers": {
                      "Authorization": "Bearer $MCP_SENTINEL_TOKEN_NAME"
                    }
                  }
                }
              }
              EOF
          user: "agent"
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Register the sandbox MCP gateway in ~/.kiro/settings/mcp.json

  # No `filename:` — the profile belongs to the workload that owns the
  # environment, and declaring it on a mixin is a validation error. The
  # workload form owns KIRO.md; here the base decides.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./kiro-mixin-context.md

# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Shell credentials
# One line, not a folded block: scripts/kit-meta.sh reads this with awk rather
# than a YAML parser, so a block scalar makes it run on into whatever follows,
# and hub-overview.yml publishes what it read as the Docker Hub short
# description. Hub also cuts anything past 100 bytes.
description: Eight provider credentials for an agentless sandbox, resolved by the sandbox proxy.

# The KIT's version. It covers these declarations; there is no tool here to
# track.
version: "1.0.0"

# Declaration-only: no recipe, no content. Everything this kit does happens at
# the sandbox boundary, where the proxy holds the real values and the container
# never sees them.
#
# It owns eight (service, phase) pairs, and v3 gives each credential one owner
# across a composed set, so it refuses to resolve beside any kit declaring one
# of the same services at runtime. That is nearly every agent kit in this repo,
# and it is the expected outcome: an agent that owns its own credential does
# not need this one.
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        # Every domain a credential below injects into, which v3 requires to
        # be declared here as well: a domain absent from this list is
        # unreachable no matter what the credential says, and validation
        # enforces the pairing rather than leaving it to review.
        allow:
          - api.anthropic.com
          - claude.ai
          - console.anthropic.com
          - api.github.com
          - copilot.github.com
          - github.com
          - raw.githubusercontent.com
          - aiplatform.googleapis.com
          - generativelanguage.googleapis.com
          - oauth2.googleapis.com
          - vertexai.googleapis.com
          - api.mistral.ai
          - api.studio.nebius.com
          - api.tokenfactory.nebius.com
          - api.openai.com
          - openai.com
          - openrouter.ai
          - api.x.ai

  # None of the eight is required. Nothing here needs a provider key to start,
  # so failing resolution on a missing one would take away a working sandbox
  # rather than protect one. Bind the services you use and leave the rest.
  #
  # Service names are load-bearing beyond this file: they are the keys a host
  # binds secrets under (`sbx secret set <service>`) and the keys the proxy
  # routes on. Renaming one here detaches it from the host binding.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Anthropic API key
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: "%s"}
          - {domain: claude.ai, header: x-api-key, format: "%s"}
          - {domain: console.anthropic.com, header: x-api-key, format: "%s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: GitHub token for gh, git over HTTPS and the Copilot API
    config:
      service: github
      phase: runtime
      apiKey:
        # Named but NOT proxyManaged: the variable is declared without being
        # populated, so `gh` and `git` see it unset rather than holding a
        # sentinel that looks like a token. The credential is applied
        # proxy-side on the hosts below. GH_TOKEN rather than GITHUB_TOKEN
        # because it is the name `gh` consults first.
        name: GH_TOKEN
        inject:
          - {domain: api.github.com, header: Authorization, format: "Bearer %s"}
          - {domain: copilot.github.com, header: Authorization, format: "Bearer %s"}
          # git's smart-HTTP transport rejects Bearer. A username makes the
          # proxy send Basic with that user and the token as the password,
          # which is the form github.com accepts for a push over HTTPS.
          - {domain: github.com, header: Authorization, format: "%s", username: x-access-token}
          - {domain: raw.githubusercontent.com, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Google AI API key
    config:
      service: google
      phase: runtime
      apiKey:
        name: GOOGLE_API_KEY
        proxyManaged: true
        inject:
          - {domain: aiplatform.googleapis.com, header: x-goog-api-key, format: "%s"}
          - {domain: generativelanguage.googleapis.com, header: x-goog-api-key, format: "%s"}
          - {domain: oauth2.googleapis.com, header: x-goog-api-key, format: "%s"}
          - {domain: vertexai.googleapis.com, header: x-goog-api-key, format: "%s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Mistral API key
    config:
      service: mistral
      phase: runtime
      apiKey:
        name: MISTRAL_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.mistral.ai, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Nebius API key
    config:
      service: nebius
      phase: runtime
      apiKey:
        name: NEBIUS_API_KEY
        proxyManaged: true
        inject:
          # Two hosts because the vendor serves this key under two API base
          # URLs and which one a client uses is the client's choice.
          - {domain: api.studio.nebius.com, header: Authorization, format: "Bearer %s"}
          - {domain: api.tokenfactory.nebius.com, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenAI API key
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.openai.com, header: Authorization, format: "Bearer %s"}
          - {domain: openai.com, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenRouter API key
    config:
      service: openrouter
      phase: runtime
      apiKey:
        name: OPENROUTER_API_KEY
        proxyManaged: true
        inject:
          - {domain: openrouter.ai, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/credential@1
    optional: true
    description: xAI API key
    config:
      service: xai
      phase: runtime
      apiKey:
        name: XAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.x.ai, header: Authorization, format: "Bearer %s"}

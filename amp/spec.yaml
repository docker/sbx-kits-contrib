schemaVersion: "2"
kind: sandbox
name: amp
displayName: Amp
description: The frontier coding agent.
sandbox:
  image: docker/sandbox-templates:shell-docker
  entrypoint:
    - amp
    - --dangerously-allow-all
agentInstructions:
  filename: AGENTS.md
  content: |
    ## Sandbox environment

    You are running inside a Docker sandbox. The workspace is mounted at
    its absolute host path. `sudo` is passwordless; use it for package
    installs.
permissions:
  network:
    allow:
      - ampcode.com:443
      - '*.ampcode.com:443'
credentials:
  - service: amp
    apiKey:
      name: ""
      inject:
        - domain: ampcode.com
          header: Authorization
          format: Bearer %s
setup:
  install:
    - command: curl -fsSL https://ampcode.com/install.sh | bash
      user: "1000"
      description: Install Amp

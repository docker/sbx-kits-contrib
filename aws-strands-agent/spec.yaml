schemaVersion: "1"
kind: mixin
name: aws-strands-agent
displayName: Strands Agents (AWS)
description: "Installs the AWS Strands Agents SDK in an isolated Python virtual environment and allows egress to Amazon Bedrock in every commercial region. Works with any Bedrock model/inference profile (Anthropic Claude, Amazon Nova, and others); the caller picks the model and region."

network:
  allowedDomains:
    # pip install path for strands-agents and its Python dependencies
    - "pypi.org:443"
    - "files.pythonhosted.org:443"
    # Bedrock runtime (Converse/InvokeModel). boto3 only ever connects to the
    # region set via AWS_DEFAULT_REGION; cross-region/global inference profiles
    # are routed server-side by AWS, so only the caller's region is contacted.
    # Every commercial region is listed so the kit works wherever the user runs.
    # (GovCloud/China use different partitions/domains and are not included.)
    - "bedrock-runtime.af-south-1.amazonaws.com:443"
    - "bedrock-runtime.ap-east-1.amazonaws.com:443"
    - "bedrock-runtime.ap-east-2.amazonaws.com:443"
    - "bedrock-runtime.ap-northeast-1.amazonaws.com:443"
    - "bedrock-runtime.ap-northeast-2.amazonaws.com:443"
    - "bedrock-runtime.ap-northeast-3.amazonaws.com:443"
    - "bedrock-runtime.ap-south-1.amazonaws.com:443"
    - "bedrock-runtime.ap-south-2.amazonaws.com:443"
    - "bedrock-runtime.ap-southeast-1.amazonaws.com:443"
    - "bedrock-runtime.ap-southeast-2.amazonaws.com:443"
    - "bedrock-runtime.ap-southeast-3.amazonaws.com:443"
    - "bedrock-runtime.ap-southeast-4.amazonaws.com:443"
    - "bedrock-runtime.ap-southeast-5.amazonaws.com:443"
    - "bedrock-runtime.ap-southeast-7.amazonaws.com:443"
    - "bedrock-runtime.ca-central-1.amazonaws.com:443"
    - "bedrock-runtime.ca-west-1.amazonaws.com:443"
    - "bedrock-runtime.eu-central-1.amazonaws.com:443"
    - "bedrock-runtime.eu-central-2.amazonaws.com:443"
    - "bedrock-runtime.eu-north-1.amazonaws.com:443"
    - "bedrock-runtime.eu-south-1.amazonaws.com:443"
    - "bedrock-runtime.eu-south-2.amazonaws.com:443"
    - "bedrock-runtime.eu-west-1.amazonaws.com:443"
    - "bedrock-runtime.eu-west-2.amazonaws.com:443"
    - "bedrock-runtime.eu-west-3.amazonaws.com:443"
    - "bedrock-runtime.il-central-1.amazonaws.com:443"
    - "bedrock-runtime.me-central-1.amazonaws.com:443"
    - "bedrock-runtime.me-south-1.amazonaws.com:443"
    - "bedrock-runtime.mx-central-1.amazonaws.com:443"
    - "bedrock-runtime.sa-east-1.amazonaws.com:443"

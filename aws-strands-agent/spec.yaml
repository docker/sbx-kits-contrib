    - "bedrock-runtime.us-west-1.amazonaws.com:443"
    - "bedrock-runtime.us-west-2.amazonaws.com:443"
    # Bedrock control plane (ListInferenceProfiles, ListFoundationModels, etc.)
    - "bedrock.af-south-1.amazonaws.com:443"
    - "bedrock.ap-east-1.amazonaws.com:443"
    - "bedrock.ap-east-2.amazonaws.com:443"
    - "bedrock.ap-northeast-1.amazonaws.com:443"
    - "bedrock.ap-northeast-2.amazonaws.com:443"

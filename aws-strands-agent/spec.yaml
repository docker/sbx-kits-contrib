    - "bedrock.eu-central-2.amazonaws.com:443"
    - "bedrock.eu-north-1.amazonaws.com:443"
    - "bedrock.eu-south-1.amazonaws.com:443"
    - "bedrock.eu-south-2.amazonaws.com:443"
    - "bedrock.eu-west-1.amazonaws.com:443"
    - "bedrock.eu-west-2.amazonaws.com:443"

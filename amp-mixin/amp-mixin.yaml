# syntax=docker/sandbox-kit:3
# Amp as a MIXIN: the same declarations as the standalone workload kit
# (../amp), minus what only the kit that owns the environment can carry -- the
# entrypoint (the base workload's launch command stays; run `amp` in the
# shell), the context-file profile (filename is workload-only; this kit
# contributes contentFile alone) and sbx@1 (a mixin's image config never
# becomes the composed image's, so there is no identity for the host to honor).
#
# MIGRATION NOTE: this mixin WAS declaration-only, on the reasoning that a
# create-time install leaves nothing for an overlay to carry. That reasoning
# had the dependency backwards: the install was create-time because v2 mixins
# could carry no content at all, not because Amp needs anything a sandbox has.
# v3 lets a mixin carry an overlay, so amp-mixin.dockerfile now runs the same
# installer at build time -- relocated wholesale into /opt/amp, which
# install.sh's own AMP_HOME variable allows -- and the lifecycle hook and the
# install phase of the network policy are both gone with it. See the recipe's
# header for why the relocation works here and not in this repo's other agent
# mixins.
schemaVersion: "3"
displayName: Amp (mixin)
description: >-
  The frontier coding agent as a mixin -- Amp's own installer, the Amp
  credential, and its egress. Layer it onto a shell base and run `amp`.

kind: mixin

# The Amp release this kit's overlay carries, by reference to the `version` arg
# below -- SPEC-v3 §4 admits a build-phase arg reference here and expands it at
# publish, so the version is stated in exactly one place and the publish tag
# names the agent rather than a kit release number of its own.
version: "${{ kit.args.version }}"

# The Amp release the recipe installs, declared once: validated here, handed to
# install.sh, and expanded into `provides` and `version:` -- so the kit cannot
# claim a release its overlay does not carry. The recipe asserts the agreement at
# build time by asking the installed binary.
#
# HOW THE DEFAULT WAS DETERMINED, and how to bump it: with AMP_VERSION unset,
# install.sh fetches its own version pointer,
# `https://static.ampcode.com/cli/cli-version.txt`, and installs what that
# names. This default is what the pointer held at the moment of pinning. To bump:
#
#     curl -fsSL https://static.ampcode.com/cli/cli-version.txt
#
# WHAT THE SHAPE MEANS: Amp publishes continuously and versions its builds
# `0.0.<unix timestamp>-g<commit>`, so a newer one appears within the hour and
# this pin falls behind upstream almost immediately. Behind is not broken -- past
# versions stay on the CDN, so a stale default keeps building and keeps
# installing the release it names.
#
# WHY PINNED rather than left floating: an unversioned provide takes this
# descriptor's `version:` as its version at resolution, so `provides: ["amp"]`
# published `amp@1.0.0` -- this kit's release number wearing the agent's name,
# which a kit writing `requires: ["amp >= 0.0.17"]` would refuse to resolve
# against. install.sh reads AMP_VERSION from its environment and installs
# exactly that, so there was a pin to take.
#
# THIS MUST STAY EQUAL TO ../amp's `version` default. The two kits run the same
# installer at the same pin and provide the same name, so a composition that
# resolved one against the other's requires must see the same release. Nothing
# enforces it across kit directories -- bump both together.
args:
  version:
    default: "0.0.1789905635-g0f1dca"
    # Amp's published shape, with the commit suffix optional so a plain `X.Y.Z`
    # would still pass. Every value this accepts is also a legal provide
    # version: SPEC-v3 §5.2 admits `[0-9A-Za-z-]` within a dotted segment,
    # which is what carries the `-g<commit>` tail.
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+)?$'
    description: Amp release to install
    buildArg: AMP_VERSION

provides: ["amp@${{ kit.args.version }}"]

capabilities:
  # The agent's own egress rides with the kit that ships the agent: the base
  # grants nothing for services it does not carry.
  #
  # MIGRATION NOTE: runtime only. The install phase existed for the hook that
  # ran install.sh at sandbox create; the overlay runs it at image build
  # instead, where the download is the builder's traffic and not the sandbox's,
  # so the grant would open egress for an install phase with no installer in
  # it. Both entries earn the runtime phase on their own: ampcode.com is the
  # credential's inject domain (v3 validates that it appears in the matching
  # phase's allow list), and the wildcard covers the agent's own API traffic.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - ampcode.com
          - "*.ampcode.com"

  # Optional, matching the workload and v2: a sandbox with no Amp key bound
  # still creates, and Amp's own sign-in can complete inside it. No
  # proxyManaged, because v2 did not set it -- a sentinel in AMP_API_KEY on a
  # host with nothing bound would read as a real token to in-container tooling.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Amp API access
    config:
      service: amp
      phase: runtime
      apiKey:
        name: AMP_API_KEY
        inject:
          - {domain: ampcode.com, header: Authorization, format: "Bearer %s"}

  # MIGRATION NOTE: no lifecycle entry. The hook that stood here ran v2's
  # `curl -fsSL https://ampcode.com/install.sh | bash` at sandbox create;
  # amp-mixin.dockerfile runs it at build. Nothing else was in the entry, and
  # a lifecycle entry declaring no hooks, no files and no interactive tail is
  # invalid, so it is dropped rather than left empty.

  # contentFile alone: `filename` is workload-only, the profile belonging to
  # the kit that owns the environment.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./amp-mixin-context.md

schemaVersion: "2"
kind: sandbox
name: oh-my-openagent
version: "1.0.0"
displayName: oh-my-openagent
description: oh-my-openagent, the extension-first coding agent, with provider credentials routed by the Docker Sandboxes proxy.

sandbox:
  # Built from the Dockerfile beside this spec and published by
  # .github/workflows/build-and-publish-kits.yml (see ../PUBLISHING.md). The
  # omo binary is pre-baked into the image, so creating a sandbox pays no
  # install step.
  #
  # The value here is the source of truth for what CI builds and publishes.
  # scripts/check-image-ref.sh asserts it stays inside a namespace CI can push
  # to, and reads it literally with no interpolation.
  image: docker.io/sbx/oh-my-openagent-image:latest
  # Bare `omo`, no flags. omo reads its configuration from its own config
  # directory and from the environment, so nothing needs to be appended on the
  # command line. This makes `omo` the default entrypoint:
  # `sbx run --kit "docker.io/sbx/oh-my-openagent-kit:latest" omo` launches it
  # directly.
  entrypoint:
    - omo

credentials:
  # Provider credentials resolved by the Docker Sandboxes proxy. Service names
  # are load-bearing: they are the keys a host binds secrets under (`sbx secret
  # set <service> …`) and the keys the proxy routes on. None are `required:
  # true` — an unbound sandbox still boots and omo reports the
  # missing credential rather than failing `sbx create`, matching the sibling
  # kits in this repo (pi, kiro, shell, opencode).
  #
  # Trimmed to the services omo uses: anthropic for the model API,
  # github for extensions/Copilot tooling.
  - service: anthropic
    description: Anthropic API key, resolved by the Docker Sandboxes proxy
    required: false
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: "%s"
        # Anthropic OAuth token endpoint (platform.claude.com is declared in
        # permissions.network.allow as well).
        - domain: platform.claude.com
          header: x-api-key
          format: "%s"
  - service: github
    apiKey:
      name: GH_TOKEN
      inject:
        - domain: api.github.com
          header: Authorization
          format: Bearer %s
        - domain: github.com
          header: Authorization
          format: Bearer %s
        - domain: raw.githubusercontent.com
          header: Authorization
          format: Bearer %s

permissions:
  network:
    # Without this block omo has zero allowed domains under a
    # restrictive egress policy, and even the first prompt fails — nothing it
    # needs, not even the configured provider's own API, is reachable. This
    # repo's e2e runs every kit under `sbx policy init deny-all`, so the kit
    # gets exactly the reachability declared here and nothing more.
    #
    # Entries are written without a port: a portless pattern matches any port.
    allow:
      # Every domain a credential above injects into. Required here as well,
      # not just in the credential block: a domain absent from this list is
      # unreachable no matter what the credential declares.
      - api.anthropic.com
      - platform.claude.com:443   # Anthropic OAuth token endpoint
      - github.com                 # GitHub extensions / Copilot tooling
      - api.github.com             # GitHub API
      - raw.githubusercontent.com  # raw GitHub content
      # omo installs extensions and tools from npm at runtime, so
      # the registry must be reachable.
      - registry.npmjs.org

setup:
  startup:
    # The redirects and </dev/null belong on the outer group, not inside a
    # subshell: a backgrounded job that inherits the exec's pipe write ends
    # keeps it from reaching EOF, and a slow apt-get then times out the exec.
    - command: ["sh", "-c", "{ command -v apt-get && apt-get update -qq -y || true; } >/dev/null 2>&1 </dev/null &"]
      user: "root"
      description: Update apt package cache in background
    # sandboxd injects MCP_GATEWAY_URL + MCP_SENTINEL_TOKEN_NAME into the
    # container env when a gateway has been reserved. The sentinel name is not
    # a credential — the proxy substitutes the real token at request time keyed
    # by this name. No-op when MCP isn't enabled.
    #
    # omo keeps engine state at ~/.omo/agent (OMO/SENPI/PI_CODING_AGENT_DIR
    # override it, most specific first) and reads MCP servers from
    # <agentDir>/mcp.json under `mcpServers`. This step runs on every start and
    # merges the mcp-gateway entry into the existing file: the entry is
    # rewritten each time, every other key is kept.
    #
    # The entry uses `type: http` with `url` and `headers`. senpi's MCP schema
    # accepts only `stdio` and `http` — no `remote`/`transport`/`httpUrl`
    # spelling — and rejects the whole file when an unknown key appears.
    #
    # When the gateway cannot be registered (jq is missing, the two variables
    # do not fit in a JSON string, the path is a symlink to a missing or
    # non-regular file, or the content is not a single JSON object with an
    # object or null `mcpServers`), the config is left untouched, the reason
    # goes to stderr and the step exits 0. A non-zero exit stops the startup
    # dispatcher and fails the sandbox start, which would keep failing on
    # every later start while the file stays this way.
    - command:
        - sh
        - -c
        - |
          set -e
          [ -n "$MCP_GATEWAY_URL" ] || exit 0
          cfg="$HOME/.omo/agent/mcp.json"
          if [ -n "${OMO_CODING_AGENT_DIR:-}" ]; then cfg="$OMO_CODING_AGENT_DIR/mcp.json"; fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is not installed; MCP gateway not registered in mcp.json" >&2
            exit 0
          fi
          gateway=$(cat <<EOF
          {
            "type": "http",
            "url": "$MCP_GATEWAY_URL",
            "enabled": true,
            "headers": {
              "Authorization": "Bearer $MCP_SENTINEL_TOKEN_NAME"
            }
          }
          EOF
          )
          if ! jq -n --argjson gateway "$gateway" 'empty'; then
            echo "MCP_GATEWAY_URL or MCP_SENTINEL_TOKEN_NAME does not fit in a JSON string; MCP gateway not registered" >&2
            exit 0
          fi
          # A symlink is resolved so the merge writes its target and the link stays.
          # mv would nest the config inside a directory and still exit 0, so only a
          # regular file (or no file at all) is merged into.
          real=$cfg
          if [ -L "$cfg" ]; then
            real=$(readlink -f "$cfg") || real=
            if [ -z "$real" ] || [ ! -f "$real" ]; then
              echo "mcp.json is a symlink to a missing or non-regular file; MCP gateway not registered" >&2
              exit 0
            fi
          elif [ -e "$cfg" ] && [ ! -f "$cfg" ]; then
            echo "mcp.json is not a regular file; MCP gateway not registered" >&2
            exit 0
          fi
          # jq -s reads an empty or blank file as no values, which becomes {}; a
          # missing file is read from /dev/null for the same result. So the mv
          # below is the only write to the config path.
          src=$real
          [ -e "$real" ] || src=/dev/null
          if ! merged=$(jq -s --argjson gateway "$gateway" '
              (if length == 0 then {}
               elif length == 1 and (.[0] | type) == "object" then .[0]
               else error("not a single JSON object") end)
              | .mcpServers["mcp-gateway"] = $gateway' "$src"); then
            echo "mcp.json is not a single JSON object with an object or null mcpServers; MCP gateway not registered" >&2
            exit 0
          fi
          # The temp name is unpredictable, so a stale or crashed leftover is never installed.
          if ! mkdir -p "$(dirname "$real")" || ! tmp=$(mktemp "$real.XXXXXX"); then
            echo "cannot create a temp file beside mcp.json; MCP gateway not registered" >&2
            exit 0
          fi
          trap 'rm -f "$tmp"' EXIT
          if ! printf '%s\n' "$merged" > "$tmp" || ! mv -f "$tmp" "$real"; then
            echo "cannot write mcp.json; MCP gateway not registered" >&2
            exit 0
          fi
      user: "agent"
      description: Register the sandbox MCP gateway in ~/.omo/agent/mcp.json

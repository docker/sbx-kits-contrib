# syntax=docker/sandbox-kit:3
# Migration of this kit's v2 spec.yaml. Deltas are marked MIGRATION NOTE inline.
schemaVersion: "3"
kind: mixin
displayName: claude-mem (persistent memory)
description: 'Persistent context across Claude Code sessions: captures session activity into SQLite+FTS5, compresses with the Agent SDK, and injects relevant memory at session start. Tracks the latest claude-mem release.'

# MIGRATION NOTE: v2's `requires: {agent: claude}`. The name is the same, so the
# requirement keeps resolving against either shape of the claude kit — the
# `claude` workload or `claude-mixin`, both of which provide it.
requires: ["claude"]

capabilities:
  # MIGRATION NOTE: v2 had one flat list; v3 is phase-scoped and an absent phase
  # grants nothing. The split follows who reaches each host:
  #
  #   install  — everything the two install hooks download. `npx claude-mem
  #              install` pulls the package from npm, its marketplace deps from
  #              npm and GitHub, a bun runtime from bun.sh, and a Python side of
  #              the toolchain from astral.sh/pypi.org/files.pythonhosted.org.
  #   runtime  — the apt hosts (see below) and the embedding-model bucket.
  #
  # The embedding bucket is listed in BOTH phases deliberately: chroma fetches
  # all-MiniLM-L6-v2 lazily on first embed, which for this kit is whenever a live
  # session is captured, so an install-only grant would work until the first
  # sandbox that happens not to embed during create.
  #
  # If a runtime path in a future claude-mem release turns out to reach npm — a
  # lazily installed plugin dependency, say — the entry moves into `runtime` as
  # well rather than being taken out of `install`.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - registry.npmjs.org
          - '*.npmjs.org'
          - bun.sh
          - astral.sh
          - github.com
          - api.github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          - raw.githubusercontent.com
          - pypi.org
          - files.pythonhosted.org
          # Embedding model, also granted at runtime — see the note above.
          - chroma-onnx-models.s3.amazonaws.com
      runtime:
        allow:
          - chroma-onnx-models.s3.amazonaws.com
          # `requires: ["claude"]` composes this mixin onto a claude kit, which
          # runs its own background `apt-get update` on every sandbox
          # (best-effort, non-blocking) — a STARTUP hook, so it runs in the
          # runtime phase and its hosts belong here. Ubuntu hosts amd64 packages
          # on archive/security and arm64 on ports.ubuntu.com; all three are
          # listed so the kit works cross-arch (CI runs amd64).
          - archive.ubuntu.com
          - security.ubuntu.com
          - ports.ubuntu.com
          - download.docker.com

  # MIGRATION NOTE: v2's `ports[]`. v2 spelled the transport `protocol:`; v3
  # spells it `transport:` and defaults it to tcp, which is what this entry wants,
  # so it is left unstated.
  - type: com.docker.sandbox/port@1
    description: claude-mem worker — viewer UI and live activity stream
    config:
      name: memory-viewer
      container: 37700

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # MIGRATION NOTE: `env:` is new and required. A v3 hook's environment is
        # deny-by-default — it sees only the names it declares plus the platform
        # baseline (PATH, HOME, HOSTNAME, TERM, PWD, OLDPWD, SHLVL, _) — so the
        # two proxy variables this command reads have to be named.
        - command: npm config set proxy $HTTP_PROXY && npm config set https-proxy $HTTPS_PROXY || true
          user: "1000"
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: Point npm at the sandbox egress proxy
        # Without this, claude-mem's marketplace deps hit a real ERESOLVE peer-
        # dependency conflict (tree-sitter@0.21.1 vs 0.22.4, pulled in by two
        # dev deps of @derekstride/tree-sitter-sql and
        # @tree-sitter-grammars/tree-sitter-lua). The installer's own internal
        # "retry once with --legacy-peer-deps" fallback for that case hangs
        # indefinitely rather than actually retrying -- confirmed by hand: a
        # plain `npx claude-mem install` times out at that exact step, while
        # this env var avoids the conflict (and the buggy retry path) entirely
        # and installs cleanly. Scoped to this one command via the env var
        # (rather than `npm config set`, which would persist to ~/.npmrc for
        # the sandbox's whole lifetime) so it doesn't silently weaken conflict
        # detection for any later npm install the agent or user runs.
        # `--provider claude` is required, not cosmetic: since claude-mem v13.20.0
        # the installer aborts (exit 1) when stdin is not a TTY and no provider is
        # given, before doing any work. Provisioning runs with stdin detached, so
        # without the flag this step always fails. `claude` points memory at the
        # sandbox's own Anthropic credentials and skips the browser OAuth pairing
        # that the other providers require -- the only choice that can complete
        # unattended. Upstream README still documents the pre-13.20.0 behavior;
        # see https://github.com/thedotmack/claude-mem/issues/3893.
        #
        # The proxy variables are declared even though this command line does not
        # name them: the installer shells out to curl, bun and pip underneath,
        # all of which read HTTP_PROXY/HTTPS_PROXY from the environment. In v2
        # they arrived for free with the container env; under v3's
        # deny-by-default hook environment an undeclared name is simply absent,
        # which would leave those child downloads unproxied.
        - command: npm_config_legacy_peer_deps=true npx -y claude-mem@latest install --provider claude
          user: "1000"
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: Install latest claude-mem (plugin, marketplace registration, bun deps)
      startup:
        - command:
            - sh
            - -c
            - |
              set -e
              exec > /tmp/claude-mem-reconcile.log 2>&1
              # Runs on every exit, including early failures, so root never
              # leaves /home/agent/.claude or settings.json root-owned.
              # Enumerated, not recursive: ~/.claude holds runtime-managed
              # content this kit doesn't own, so a recursive chown would take
              # ownership of paths outside the kit's control. Paths are
              # existence-checked because under `set -e` a chown that fails on
              # a path this script never created would replace the script's
              # exit status from inside the trap, turning a tolerated early
              # failure into a failed install.
              S=/home/agent/.claude/settings.json
              trap 'for p in /home/agent/.claude "$S"; do if [ -e "$p" ]; then chown agent:agent "$p"; fi; done' EXIT
              mkdir -p /home/agent/.claude
              # Wait for the platform's own settings write to land first — at
              # create time the engine seeds this file late in the sequence and
              # overwrites whatever exists; merging before that loses our key.
              i=0
              found=0
              while [ $i -lt 60 ]; do
                if grep -q themeId "$S" 2>/dev/null; then found=1; break; fi
                sleep 1; i=$((i+1))
              done
              if [ "$found" = "1" ]; then
                echo "platform settings present after ${i}s"
              else
                echo "timed out after ${i}s waiting for platform settings; proceeding anyway"
              fi
              MODE="${SBX_CRED_ANTHROPIC_MODE:-none}" node -e '
                const fs = require("fs");
                const p = process.argv[1];
                let s = {};
                try { s = JSON.parse(fs.readFileSync(p, "utf8")); } catch {}
                const defaults = {
                  themeId: 1,
                  alwaysThinkingEnabled: true,
                  defaultMode: "bypassPermissions",
                  bypassPermissionsModeAccepted: true,
                };
                const SENTINEL = "echo proxy-managed";
                if (process.env.MODE !== "none") defaults.apiKeyHelper = SENTINEL;
                for (const k of Object.keys(defaults)) if (!(k in s)) s[k] = defaults[k];
                // Only clear our own sentinel, never a user-customized helper.
                if (process.env.MODE === "none" && s.apiKeyHelper === SENTINEL) delete s.apiKeyHelper;
                s.enabledPlugins = s.enabledPlugins || {};
                if (!("claude-mem@thedotmack" in s.enabledPlugins)) s.enabledPlugins["claude-mem@thedotmack"] = true;
                fs.writeFileSync(p, JSON.stringify(s, null, 2));
                console.log("reconciled");
              ' "$S"
          # root + chown-on-exit: /home/agent/.claude ownership isn't guaranteed
          # agent-owned on every base image.
          user: "0"
          env: [SBX_CRED_ANTHROPIC_MODE]
          description: Reconcile settings.json — ensure platform keys and claude-mem's enabledPlugins both present (ordering-immune, idempotent)

  # `filename:` is workload-only — it names the profile, which belongs to the
  # claude kit this one composes onto. A mixin contributes a body.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./claude-mem-context.md

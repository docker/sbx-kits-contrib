# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Shell
author: "Docker, Inc."
description: >-
  A plain shell sandbox on DHI's shell-docker template: bash, git, apt, a
  Docker engine with compose and buildx that sbx starts automatically, plus
  common CLI tooling (curl, gh, jq, make, gcc, Python, Node). The base workload
  agent mixins layer onto; it ships no agent and declares no credentials.
sourceUrl: https://github.com/docker/sandbox-kit-spec

kind: workload
version: "1.0.3"

# No explicit provides: APT-managed tools, including the trust-fix
# upgrades in the recipe, are inferred from dpkg as deb/<package>@<version>
# at publish (§9.6). Do not assign the kit's version to tool names.

capabilities:
  # This workload is an agent sandbox: the host launches the agent rather
  # than running the image's entrypoint as PID 1, and honors the identity
  # the image config declares instead of assuming one.
  - type: com.docker.sandbox/sbx@1

  # Apt sources on DHI's shell-docker template (Debian trixie / DHI):
  #   deb.debian.org/debian, deb.debian.org/debian-security, dhi.io/deb/...
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - deb.debian.org
          - dhi.io

  # This legacy profile is the fallback. An agent mixin can select its
  # discovery destination; every composed Kit contributes guidance there.
  #
  # TODO: restore `agent-context@2`, which is what the upstream kit this file
  # is copied from declares. No released `sbx` accepts @2 yet, and a kit that
  # declares it does not resolve at all:
  #
  #   error: resolve kits: capabilities[2]: required capability selection
  #   rejected; unsupported capability type com.docker.sandbox/agent-context@2
  #
  # @1 carries the same two fields this kit uses, `filename` and `content`, so
  # nothing is lost in the meantime. Flip it back once an rc or nightly build
  # resolves @2.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      content: |
        This is a plain shell sandbox on DHI's shell-docker template: bash, git,
        apt, a Docker engine (compose/buildx) that sbx starts for you,
        curl, gh, jq, make, gcc, Python 3, and Node/npm. Install more with
        apt; composed kits list their own capabilities below.

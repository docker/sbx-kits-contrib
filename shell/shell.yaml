# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Shell sandbox
description: >-
  An agentless sandbox on the Docker-in-Docker template: bash, git, apt, a
  Docker engine and the template's toolchain, with no agent installed. The
  base an agent mixin layers onto.

# The KIT's version, not a tool's. Nothing is installed here that could carry
# one: the content is the template image, and the packages it ships are read
# out of it at publish and stated as deb/<package>@<version> provides. Bump
# this when the declarations below change.
version: "1.0.0"

# The name a mixin asks for when it wants an agentless base rather than a
# particular agent. Unversioned, so it takes the version above: the kit
# installs nothing whose release it could name instead, and the packages it
# carries are read out of the image at publish and stated as deb/<package>
# provides.
provides: ["shell"]

capabilities:
  # This workload is an agent sandbox: the host launches the image's command
  # rather than running it as PID 1, and honors the identity the image config
  # declares instead of assuming one.
  - type: com.docker.sandbox/sbx@1

  # This repo's e2e runs every kit under `sbx policy init deny-all`, so the
  # sandbox reaches exactly what is declared here and nothing more.
  #
  # Only the apt sources the base ships. A provider API host is deliberately
  # absent: declaring one means declaring the credential that injects into it,
  # and v3 gives each credential one owner across a composed set, so an agent
  # mixin layered on top declaring the same service would fail to resolve.
  # That is the whole point of this kit, and `shell-credentials` beside it
  # carries those eight services for a sandbox that wants them with no agent.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        # `apt-get update` (the startup hook below) refreshes metadata for
        # every configured source and exits 100 if any one of them fails, so
        # all of them must be reachable. Ubuntu serves amd64 from archive and
        # security and arm64 from ports, so all three are listed to keep the
        # kit working on both architectures.
        #
        # Entries carry no port, which is this repo's house style: a portless
        # pattern matches any port, and pinning the apt hosts to :80 breaks the
        # moment a mirror answers over https.
        allow:
          - archive.ubuntu.com
          - security.ubuntu.com
          - ports.ubuntu.com
          - download.docker.com

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        # Detaching is the runtime's job (`background: true`), so there is no
        # trailing `&` and no subshell. The redirects discard the output and
        # `</dev/null` keeps the command from blocking on stdin whichever way
        # the runtime detaches it.
        - command: ["sh", "-c", "{ command -v apt-get && apt-get update -qq -y || true; } >/dev/null 2>&1 </dev/null"]
          user: "root"
          background: true
          description: Update apt package cache in background

  # The destination composed kits write their guidance to. A workload owns the
  # profile filename and a mixin contributes a body without naming one, so a
  # base that declares no profile drops every composed mixin's guidance: the
  # engine writes no profile file at all when the composition resolves no
  # filename.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      contentFile: ./shell-context.md

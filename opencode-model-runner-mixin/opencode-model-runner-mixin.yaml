# syntax=docker/sandbox-kit:3
# OpenCode-on-Docker-Model-Runner as a MIXIN: the same declarations as the
# standalone workload kit (../opencode-model-runner), minus what only the kit
# that owns the environment can carry -- the entrypoint (the base workload's
# launch command stays; run `opencode` in the shell), the context-file profile
# (`filename` is workload-only, so this kit contributes `contentFile` alone),
# agent-sessions (the verbs drive the workload's entrypoint, which here is the
# base's shell) and sbx@1 (a mixin's image config never becomes the composed
# image's).
#
# This overlay ships its own OpenCode, extracted from the same template the
# workload runs, so it is not meant to be layered onto the ../opencode kit --
# that composition would put two OpenCode installations in one sandbox, one of
# them shadowed. Layer it onto a shell base.
schemaVersion: "3"
displayName: OpenCode (Docker Model Runner) (mixin)
description: >-
  OpenCode wired to a local Docker Model Runner as a mixin -- the agent in an
  overlay with the provider config that points it at the host's
  OpenAI-compatible endpoint and discovers every pulled model. Layer it onto a
  shell base and run `opencode`.
sourceUrl: https://docs.docker.com/ai/model-runner/

kind: mixin

# The OpenCode inside the overlay, by reference: SPEC-v3 §4 allows this field
# to be a build-phase arg reference expanded at publish, so it names the same
# `version` arg the provide reads. That arg is an ASSERTED value rather than a
# selected one -- the recipe copies the agent out of the template and fails
# the build when `opencode --version` disagrees with it -- so what this field
# publishes is a version the build verified against the content. See the note
# on the args.
version: "${{ kit.args.version }}"

# The OpenCode release this overlay ships, which it does NOT install: the
# recipe copies the agent out of `docker/sandbox-templates:opencode-docker`,
# which arrives already built. So this arg cannot select a release, and
# declaring it as if it could would be a pin in name only.
#
# It is an ASSERTION instead. The recipe already ran `opencode --version`
# before copying, as the gate that the binary works; it now also compares that
# output with this value and fails the build when they differ, so the version
# the provide publishes is verified against the content of every artifact
# rather than asserted over it.
#
# WHY ENFORCE rather than leave it unversioned: unversioned, the provide takes
# the `version:` above and publishes `opencode-model-runner@1.0.0`, which says
# nothing about the agent a consumer would be constraining. The cost is a
# tripwire -- `:opencode-docker` is a floating tag Docker rebuilds, so the day
# it carries a newer OpenCode this kit stops building until someone bumps the
# default below. For a kit whose whole content is copied out of someone else's
# moving tag that is a feature: it is the only channel that reports the content
# changed, and the build log names both versions.
#
# HOW THE DEFAULT WAS ESTABLISHED, and how to bump it: ask the base itself --
#   docker run --rm --entrypoint opencode \
#     docker/sandbox-templates:opencode-docker --version
# which printed 1.18.32 at the time of this bump. This kit ships whatever the
# template froze, not npm's independently moving `latest`.
#
# THIS MUST STAY EQUAL TO ../opencode-model-runner's `version` default. Both
# read the same template and provide the same name -- bump them together.
args:
  version:
    default: "1.18.32"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: OpenCode release the base template is expected to carry
    buildArg: EXPECTED_OPENCODE_VERSION

# The kit's own name, as in the workload: both this kit and ../opencode-mixin
# ship an OpenCode, and a capability name has exactly one owner in a
# composition (SPEC-v3 §5.3). The version on it is the OpenCode release inside
# -- the only thing about this capability a consumer could usefully constrain,
# since the provider config the kit adds on top has no version of its own.
provides: ["opencode-model-runner@${{ kit.args.version }}"]

capabilities:
  # The agent's own egress rides with the kit that ships the agent: the base
  # grants nothing for services it does not carry. Runtime-only -- the plugin
  # install happens when OpenCode starts, and this kit declares no install
  # hooks.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # The provider baseURL every model request hits.
          #
          # This one entry deliberately keeps its port, against the contrib
          # house style of portless entries: the host here is the user's own
          # machine through the sandbox's gateway alias, and the port is the
          # only thing that narrows the grant to Model Runner rather than to
          # everything else listening on that machine.
          - host.docker.internal:12434
          # OpenCode installs the opencode-models-discovery plugin from npm at
          # startup; packument and tarball both come from this host.
          - registry.npmjs.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        # v2's `setup.files` entry, unchanged. v2 declared no `onlyIfMissing`,
        # so `overwrite` keeps its v3 default of true and the config is
        # rewritten on every start. The `$schema` key is written literally:
        # file content expands `${{ kit.args.* }}` only, and this kit declares
        # no args.
        - path: /home/agent/.config/opencode/opencode.json
          content: |
            {
              "$schema": "https://opencode.ai/config.json",
              "plugin": [
                ["opencode-models-discovery", {
                  "smartModelName": false
                }]
              ],
              "provider": {
                "dmr": {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "Docker Model Runner",
                  "options": {
                    "baseURL": "http://host.docker.internal:12434/v1",
                    "modelsDiscovery": {
                      "enabled": true
                    }
                  }
                }
              }
            }
          mode: "0644"
          description: Configure OpenCode to use the local Docker Model Runner

  # No credential@1 entries: every model request goes to a local endpoint that
  # takes no credential.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./opencode-model-runner-mixin-context.md

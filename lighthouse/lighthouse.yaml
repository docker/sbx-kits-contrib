# syntax=docker/sandbox-kit:3
# Lighthouse as a MIXIN. The v2 kit shipped no Dockerfile and installed
# everything through setup hooks, because a v2 mixin had no content mechanism —
# a lifecycle install hook was the only way for one to install anything.
#
# MIGRATION NOTE: v3 lifts that, so most of those hooks encoded a v2 limitation
# rather than a v3 requirement, and they now build into lighthouse.dockerfile:
# the /etc/profile.d drop and the pinned npm install with its CLI wrapper were
# pure content, and so is the browser tree, which is a version-pinned artifact
# download that needs nothing from sandbox-create time. What that buys is no
# per-create download, a much smaller install-phase permission surface (see the
# network policy below), and content that is digest-pinned and scannable in the
# published kit.
#
# WHAT STAYED A HOOK, AND WHY: Chromium's system libraries. `install
# --with-deps` apt-installs them, and apt packages are not copyable content —
# they need the composed base's own dpkg database, and an overlay cannot carry a
# package's shared-library closure. So the two halves of v2's third hook
# separate: the browser tree travels in the overlay and the apt call stays
# below, run from the playwright-core the overlay stages for it. ../playwright
# and ../openclaw-mixin split the same work the same way.
#
# What a composed sandbox gets in each case: the lighthouse CLI, its wrapper and
# the browser binaries arrive with the layer, at compose time, whatever the base;
# the libraries Chromium links against arrive at create, from the base's own apt.
# Where that hook cannot run — a base that is not Debian-family, or the apt hosts
# blocked by policy — Chromium is present and does not launch.
#
# MIGRATION NOTE: v2's three `environment.variables` have no v3 field here — a
# mixin's image config is not the composed image's — so the overlay drops them
# into /etc/profile.d/lighthouse-env.sh, which the base's login shell sources.
# The consequence worth knowing has not changed with the move to build time:
# profile.d is sourced by login shells, so a process started outside one does not
# inherit them, and the `lighthouse` wrapper therefore defaults all three itself.
# That is what keeps the promise lighthouse-context.md makes true however the CLI
# was invoked.
schemaVersion: "3"
displayName: Lighthouse
description: Google Lighthouse CLI for auditing performance, accessibility, SEO, and best practices — headless Chromium included so agents can score pages served inside the sandbox.

kind: mixin

# The recipe pins the release, so the provide states the version it lands rather
# than leaning on a `version:` fallback. To bump, LIGHTHOUSE_VERSION in
# lighthouse.dockerfile, this line, lighthouse-context.md, and the README all
# move together.
provides: ["lighthouse@12.6.1"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      # MIGRATION NOTE: every host in v2's flat list served an install hook, so
      # the whole list landed in the install phase. Moving those hooks into the
      # recipe empties most of it again: the npm tarballs and the Chromium
      # download are fetched by the builder, which this policy does not govern,
      # so registry.npmjs.org and all three browser CDNs leave the kit's
      # surface entirely. The one host group left is the one the surviving apt
      # hook needs — a partial move means a smaller install list, not an absent
      # one.
      #
      # The kit still declares no runtime phase, and that is still not a gap: an
      # absent phase grants nothing, and this kit's audits target servers on
      # localhost inside the sandbox, which needs no allow entry. External audit
      # targets were never reachable under v2 either and still are not; the agent
      # context says so. A user auditing an external site grants that host
      # through their own sandbox policy.
      #
      # MIGRATION NOTE: the v2 entries carried explicit ports (`:443`, `:80`).
      # They are dropped for the contrib house style of portless entries —
      # allow-list membership ignores a port suffix, so `host:443` and `host`
      # name the same host. The comments noting which sources are plain HTTP
      # are kept.
      install:
        allow:
          # `install-deps chromium` apt-installs Chromium's system libraries.
          # `apt-get update` refreshes every configured source, so all template
          # sources must be reachable: Ubuntu hosts amd64 on archive/security
          # and arm64 on ports.ubuntu.com, and the *-docker templates pre-add
          # Docker's apt repo.
          - archive.ubuntu.com      # HTTP
          - security.ubuntu.com     # HTTP
          - ports.ubuntu.com        # HTTP
          - download.docker.com

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # All that is left of v2's three install hooks. The first two and the
        # download half of this one are in the overlay; this is the half that
        # cannot travel in one, so it still runs at create, against the composed
        # base's own apt.
        #
        # `install-deps` rather than `install --with-deps`: the browser is
        # already on disk from the layer, and this is the apt-only verb, so the
        # hook touches no CDN and the install phase needs no CDN grant. It runs
        # from the playwright-core the overlay stages under /usr/local/lib rather
        # than from `npx -y playwright@...`, which is what keeps the npm registry
        # out of the install phase too.
        #
        # v2 also used this hook to skip the download when ../playwright had
        # already put a Chromium under /opt/ms-playwright. That was a create-time
        # look at the composed filesystem, which a build cannot make and no
        # longer needs to: neither kit downloads a browser at create any more,
        # and both pin the same Playwright release, so both overlays carry the
        # same revision at the same path.
        #
        # MIGRATION NOTE: HTTP_PROXY/HTTPS_PROXY are declared where v2's hook
        # declared only PLAYWRIGHT_BROWSERS_PATH. The body reads neither itself,
        # but the apt-get run behind it takes the proxy from the environment, and
        # under v3's deny-by-default hook env it has to be declared or the
        # package fetch fails behind the sandbox's forced proxy — the same
        # declaration ../playwright carries on the same call. PLAYWRIGHT_BROWSERS_PATH
        # is gone with the download it used to steer.
        - command: |
            set -euo pipefail
            node /usr/local/lib/lighthouse-kit/node_modules/playwright-core/cli.js install-deps chromium
            rm -rf /var/lib/apt/lists/*
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: Install Chromium's system libraries via apt — the overlay carries the browser tree, apt packages cannot travel in one

  # v2's agentInstructions body, staged from the file beside this descriptor.
  # No `filename:` — that is workload-only, and this mixin contributes a body
  # to whichever agent owns the profile.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./lighthouse-context.md

# syntax=docker/sandbox-kit:3
# Docker Sandboxes kit for a Gitea instance.
# Usage, prerequisites and design notes: see README.md in this directory.
schemaVersion: "3"

# The `tea` release this kit's overlay carries, by reference to the `version`
# arg below — SPEC-v3 §4 admits a build-phase arg reference in this field and
# expands it at publish, so the release is stated in exactly one place and the
# publish tag and `org.opencontainers.image.version` name the CLI the kit
# ships.
#
# MIGRATION NOTE: this was a standalone "0.1.0" while `tea` arrived from an
# install hook, because the kit had no content and so nothing to version. Now
# that the install is a layer, the kit can say what it carries.
version: "${{ kit.args.version }}"
displayName: Gitea
description: Wires a Gitea access token into the sandbox proxy so git-over-HTTPS and the Gitea API both authenticate against your instance, self-hosted or gitea.com. The token stays on the host.
licenses:
  - MIT

kind: mixin

# MIGRATION NOTE: `requires: ["deb/dpkg"]` is gone, and it went out with the
# hook that justified it. The tea install hook chose its release asset with
# `dpkg --print-architecture` under `set -euo pipefail`, so a base without dpkg
# died at that line and sandbox creation failed — that, and only that, is what
# the requirement recorded. gitea.dockerfile makes the same choice at build
# from buildx's TARGETARCH, and the one hook left reads no distribution
# package at all. `requires` is a closed-set check (SPEC-v3 §5.3): a name kept
# past its reason refuses compositions in exchange for nothing.

# Which Gitea instance this sandbox talks to. Overridable at install time:
#   sbx run --kit docker.io/sbx/gitea-kit:latest --kit-arg gitea.host=git.example.com claude
#
# No `env:` and no `buildArg:`. There is nothing in the container that
# reads a GITEA_HOST variable — `tea` learns the instance from the config
# file the kit's one install hook writes — and a build arg would bake one
# instance into the published kit, which is the opposite of what this arg
# is for. It stays a create-phase descriptor value: the runtime allow
# entry, the inject domain, the hook's shell string and the context body
# are all expanded from it (SPEC-v3 §6).
#
# Contrast the `version` arg below, which takes `buildArg:` for exactly the
# inverted reason: the release is the kit's choice and must be baked, while
# the instance is the installer's and must not be.
args:
  host:
    default: "gitea.com"
    description: >-
      Hostname of the Gitea instance, without a scheme or path (for example
      git.example.com). Defaults to gitea.com, Gitea's own hosted instance.
    # A bare hostname, optionally with a port for an instance that is not
    # behind a reverse proxy on 443 (the common `:3000` deployment).
    pattern: '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$'
  version:
    # The `tea` release gitea.dockerfile downloads, declared once: validated
    # here, handed to the recipe as TEA_VERSION, and expanded into `provides`
    # and into the top-level `version:` — so the kit cannot publish a release
    # its overlay does not carry. The recipe proves the agreement by running
    # the installed binary and comparing what it reports.
    #
    # `buildArg:`, not `env:` — the two are mutually exclusive and this value
    # resolves at build. Nothing in the container reads a TEA_VERSION.
    #
    # An installer may override it, but not silently: the per-arch SHA256s in
    # the recipe are pinned to this release, so another version fails the
    # digest check rather than installing under a descriptor that goes on
    # claiming this number. Bumping tea is therefore a three-part edit — this
    # default and both digests in gitea.dockerfile, together — with the
    # checksums from
    # https://dl.gitea.com/tea/<version>/tea-<version>-linux-<arch>.sha256
    default: "0.15.1"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: tea release to install
    buildArg: TEA_VERSION

# The CLI the overlay puts on PATH, carrying the version it actually landed.
# MIGRATION NOTE: this kit declared no provide at all while `tea` came from an
# install hook — there was no content to describe, and the honest name for "a
# binary some sandbox may or may not have downloaded" was none. The overlay
# changes that, so a kit writing `requires: ["tea >= 0.15"]` now has something
# to resolve against.
provides: ["tea@${{ kit.args.version }}"]

capabilities:
  # Every destination the kit needs, and there is now exactly one.
  #
  # MIGRATION NOTE: v2 declared one flat allow list; v3 scopes egress by phase,
  # and the v2 comments already said which entry belonged to which. The first
  # v3 cut therefore split it into an install phase holding dl.gitea.com and a
  # runtime phase holding the instance.
  #
  # MIGRATION NOTE: the install phase is gone entirely. dl.gitea.com was the
  # pinned `tea` binary and its checksum, and nothing else — gitea.dockerfile
  # fetches that at image build now, which is the builder's traffic and not
  # governed by this policy. The one hook that remains writes a config file
  # without calling the instance (deliberately — see its comment), so the
  # phase had no consumer left. An absent phase grants nothing, which is the
  # whole point of moving the download: the grant existed only to let that
  # hook reach the network.
  #
  # The instance itself stays runtime: git-over-HTTPS, the REST API and `tea`
  # are all steady-state traffic.
  #
  # The inject rule below targets ${{ kit.args.host }} in the runtime
  # phase, and validation requires an inject domain to appear in that same
  # phase's allow list. Both are the same placeholder, so they resolve to
  # the same literal whatever the installer supplies — the check holds
  # after expansion, not merely at authoring time.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - ${{ kit.args.host }}

  # One credential, one inject rule -- deliberately. The engine reads
  # ApiKey.Inject[0] and nothing else (sandboxlib/kit/agent.go,
  # GetServiceAuthConfig: "multi-header services should have one credential per
  # header"), so a second rule on the same domain would be silently ignored.
  # That, not auth-scheme sniffing, is why the sibling `gitlab` kit could not
  # cover git-over-HTTPS and the API at once. Gitea does not need two rules --
  # see README, "How auth works".
  #
  # Not `optional:`. v2 credentials defaulted to not-required and this one
  # opted in with `required: true`; v3 inverts the default, so required is
  # now spelled by saying nothing. The kit really does not work without a
  # token — the whole point is the injected header.
  - type: com.docker.sandbox/credential@1
    description: Gitea access token with the `write:repository` scope (add `write:issue` for issue/PR work). Stored on the host; the sandbox only sees a placeholder and the proxy injects the real value on requests to the instance.
    config:
      service: gitea
      # MIGRATION NOTE: v2 had no phases, so this token was present while
      # install hooks ran as well as afterwards. `runtime` is still the
      # right phase — the credential exists for the agent's git and API
      # traffic, not to let an install hook download something. Nothing is
      # downloaded in a sandbox at all now that the `tea` binary ships in the
      # overlay, so there is no longer even a hypothetical install-time
      # fetch for it to authenticate. The visible consequence is in the one
      # remaining install hook: under strict phase scoping GITEA_TOKEN may be
      # unset while it runs, which its existing guard already handles by
      # skipping the tea login and saying so.
      phase: runtime
      apiKey:
        # proxyManaged sets GITEA_TOKEN to the sentinel inside the container. The
        # proxy replaces the Authorization header with the real token on outbound
        # requests to the instance, and on no other host.
        name: GITEA_TOKEN
        proxyManaged: true
        inject:
          - domain: ${{ kit.args.host }}
            # `token %s` rather than the `scheme: bearer` sugar: this is Gitea's
            # own documented header form, and Gitea's OAuth2 auth method accepts
            # it on the API *and* on the git-over-HTTP routes.
            #
            # Do NOT reach for `scheme: basic` here. In v2 it was a decode-time
            # sugar with no runtime behind it: normalizeV2 expanded it to Format
            # "%s" and left Header empty, GetServiceAuthConfig copied that empty
            # header through, and the proxy's SetAuthHeaderFormat discarded a
            # config with an empty header name -- the request then went out
            # unauthenticated.
            header: Authorization
            format: "token %s"

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # MIGRATION NOTE: the first hook, "Install tea, version+digest pinned",
        # is gone — gitea.dockerfile performs that download at image build
        # instead, with the same release and the same two SHA256s. Nothing in
        # the hook body needed sandbox-create time: it read no arg, no
        # credential and no create-time path, and its one environment-shaped
        # input was `dpkg --print-architecture`, which buildx answers better as
        # TARGETARCH because it can answer it once per platform.
        #
        # What that bought, in order of how visible it is: dl.gitea.com left
        # the network policy above (no install phase remains), `deb/dpkg` left
        # `requires`, the binary's digest is now fixed in a scannable published
        # layer rather than re-verified in every sandbox, a withdrawn or
        # re-rolled release fails the build at publish instead of failing
        # sandbox creation for a user, and every `sbx run` of this kit saves
        # the download.
        #
        # The one hook that remains is the one that could not move.

        # WHY THIS ONE STAYS A HOOK, three times over: its body is built from
        # the create-phase `host` arg, which is the installer's choice and has
        # no value at build; it reads the proxy-managed GITEA_TOKEN sentinel
        # and SBX_CRED_GITEA_MODE, which exist only inside a running sandbox;
        # and it writes under /home/agent, which on the composed base may be a
        # mounted volume that would cover anything an overlay put there.
        #
        # Seed tea's login so it starts out authenticated. Written directly rather
        # than via `tea login add`, which calls the instance to validate the token
        # and would fail sandbox creation whenever no credential is bound (the e2e
        # case). Runs as the agent user so the file needs no chown afterwards, and
        # writes the literal home path because $HOME is not guaranteed here.
        #
        # The token written here is whatever GITEA_TOKEN holds -- the proxy-managed
        # sentinel -- so tea sends `Authorization: token <sentinel>` and the proxy
        # replaces it. Nothing secret is on disk.
        #
        # printf rather than a heredoc: this is a YAML block scalar, so a heredoc
        # body would have to stay indented and tea would read back a config that is
        # itself indented into nonsense.
        #
        # Both variables the body reads are declared: v3 hook environments
        # are deny-by-default, so GITEA_TOKEN and SBX_CRED_GITEA_MODE would
        # otherwise be unset regardless of what the host bound, and the
        # hook's own "skipping tea login" branch would fire unconditionally
        # with a misleading mode=none in the message.
        - command: |
            set -euo pipefail
            if [ -z "${GITEA_TOKEN:-}" ]; then
              echo "GITEA_TOKEN unset (mode=${SBX_CRED_GITEA_MODE:-none}); skipping tea login" >&2
              exit 0
            fi
            mkdir -p /home/agent/.config/tea
            cfg=/home/agent/.config/tea/config.yml
            : > "$cfg"
            chmod 0600 "$cfg"
            printf 'logins:\n' >> "$cfg"
            printf '  - name: sbx\n' >> "$cfg"
            printf '    url: https://%s\n' '${{ kit.args.host }}' >> "$cfg"
            printf '    token: %s\n' "$GITEA_TOKEN" >> "$cfg"
            printf '    default: true\n' >> "$cfg"
            printf '    ssh_host: ""\n' >> "$cfg"
            printf '    ssh_key: ""\n' >> "$cfg"
            printf '    insecure: false\n' >> "$cfg"
            printf '    ssh_agent: false\n' >> "$cfg"
            # No self-update check: unrelated egress, and the version is whatever
            # this kit pinned above.
            printf '    version_check: false\n' >> "$cfg"
            printf '    user: ""\n' >> "$cfg"
            printf '    created: 0\n' >> "$cfg"
          user: "1000"
          env: [GITEA_TOKEN, SBX_CRED_GITEA_MODE]
          description: "Point tea at the instance, authenticated with the proxy-managed sentinel"

  # MIGRATION NOTE: inline `content:` rather than a `gitea-context.md`
  # companion. A `contentFile:` body is read and staged into a layer at
  # PUBLISH, but `host` is a create-phase arg expanded into the descriptor
  # at create — a staged body would reach the agent with a literal
  # "${{ kit.args.host }}" in every clone URL and curl example below.
  # Inline content is a descriptor string, so it expands.
  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        ## Gitea

        This sandbox is wired to the Gitea instance at `${{ kit.args.host }}`.

        `GITEA_TOKEN` holds a sentinel value, not the real token: the sandbox proxy
        swaps it for the real one on requests to that host, and nowhere else. Do
        not read, print, or reconfigure it, and do not put it in a remote URL.

        **Git over HTTPS works directly.** Clone, pull, and push with plain HTTPS
        remotes -- no SSH key, no credential helper, no token in the URL:

            git clone https://${{ kit.args.host }}/<owner>/<repo>.git
            git push origin <branch>

        The proxy adds the `Authorization` header on the way out, including on
        git's first unauthenticated request, so private repositories work the same
        as public ones.

        **The REST API needs no auth header from you.** Send the request without
        one and the proxy fills it in:

            curl -s https://${{ kit.args.host }}/api/v1/user
            curl -s https://${{ kit.args.host }}/api/v1/repos/<owner>/<repo>/pulls

        Setting your own `Authorization` header is harmless -- the proxy replaces
        it -- but it is never necessary.

        **`tea`, Gitea's CLI, is installed and already logged in** against this
        host. Use it for the things it models well -- `tea pr`, `tea issue`,
        `tea repo`, `tea login ls` -- and `tea api` or `curl` for anything it does
        not cover. Its stored token is the same sentinel; do not try to "fix" it.

# syntax=docker/sandbox-kit:3
# Migration of the v2 `trivy` sandbox kit. This kit shipped no Dockerfile:
# `sandbox.image` named a published template directly and `setup.install`
# fetched the scanner at sandbox create. A v3 workload must carry content, so
# trivy.dockerfile states that template, carries v2's sandbox.entrypoint in
# the image config, and performs the pinned, digest-verified install itself —
# which is what lets this kit declare no install phase at all (see the
# network policy below). Deltas are marked MIGRATION NOTE inline.
schemaVersion: "3"
displayName: Trivy
description: >-
  Aqua's open source vulnerability scanner — sandboxed because security
  scanners shouldn't be able to compromise their hosts (TeamPCP, March 2026).
sourceUrl: https://github.com/aquasecurity/trivy

kind: workload

# MIGRATION NOTE: the version is stated literally rather than through an arg.
# The recipe pins by version *and* per-arch SHA256, so a version an arg
# supplied would fail the digest check rather than install that release.
# Bumping is therefore the three-place edit the README documents: the recipe's
# TRIVY_VERSION, both SHA256s, and this entry, together. (The pin moved from
# the install hook into the recipe with the install itself; the values are
# unchanged.)
provides: ["trivy@0.70.0"]

capabilities:
  # v2 `kind: sandbox`: the host launches the shell rather than running the
  # image's entrypoint as PID 1, and honors the identity the image config
  # declares.
  - type: com.docker.sandbox/sbx@1

  # MIGRATION NOTE: v2's single flat allow list is phase-scoped in v3, and
  # v2's three release hosts — github.com, objects.githubusercontent.com and
  # release-assets.githubusercontent.com — are gone from it entirely.
  #
  # The first v3 cut kept them in an `install:` phase, on the reasoning that a
  # create-time install is what gives the phase split something to do: the
  # download hosts open for the length of one hook and a conforming runtime
  # closes them before the shell starts. Moving the install into
  # trivy.dockerfile is better on that same axis rather than a retreat from
  # it. The tarball is fetched by the builder now, so those hosts are not in
  # this policy in any phase, and a sandbox created from this kit cannot reach
  # github.com even for the length of a hook. What the sandbox gets is what
  # remains below: the vulnerability-database pull, and nothing else.
  #
  # ../trivy-mixin already carried exactly this policy, for exactly this
  # reason.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Vulnerability DB pull at runtime. Trivy's default chain is
          # mirror.gcr.io (primary) with ghcr.io as a fallback for the
          # trivy-db OCI artifact; we declare both openly in the allowlist
          # rather than relying on env-var overrides to redirect the source.
          # The trust footprint is intentionally explicit at the policy layer.
          - mirror.gcr.io
          - ghcr.io
          - pkg-containers.githubusercontent.com

  # MIGRATION NOTE: no lifecycle entry. v2's one hook — "Install Trivy CLI
  # v0.70.0, version+digest pinned" — now runs in trivy.dockerfile, as a build
  # step with the same version, the same two SHA256s and the same verification
  # order. It reads nothing that exists only at sandbox-create time (the one
  # thing it did read from the environment, the architecture, is something the
  # build knows better: TARGETARCH names the platform being built rather than
  # the one sandbox a hook happened to run in). Nothing else was in the entry,
  # and a lifecycle entry declaring no hooks, no files and no interactive tail
  # is invalid, so the entry is dropped rather than left empty.

  # v2's agentInstructions declared a filename and no body, so this entry
  # carries the profile name alone and there is no trivy-context.md to
  # reference.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md

# MIGRATION NOTE: no agent-sessions@1. The capability states the argv shapes
# a harness uses to drive an agent's own session model, and it is declared
# only where the kit's testdata/tck.yaml recorded a working non-interactive
# invocation. This kit shipped no tck.yaml, and there is nothing to record:
# the entrypoint is a login shell, not a chat agent, and `trivy fs .` is a
# command a caller runs rather than a prompt verb the host substitutes into.

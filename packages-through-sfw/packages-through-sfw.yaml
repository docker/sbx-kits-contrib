# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Packages through SFW
description: Installs Socket Firewall Free and routes npm, pip, pip3, and python3 -m pip commands through sfw when resolved through PATH.

kind: mixin

# The recipe pins the release, so the provide states the version it lands. The
# name is the tool the kit puts on PATH; bumping sfw means editing SFW_VERSION
# in packages-through-sfw.dockerfile, the two digests beside it, and this line.
provides: ["sfw@1.10.0"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      # MIGRATION NOTE: v2's single flat list splits cleanly here, and for this
      # kit the split is the point rather than a formality. Everything the
      # *installation* needs closes before the agent starts. What stays open at
      # runtime is exactly the package-manager egress this kit exists to
      # mediate: the registries the shimmed npm/pip reach, plus Socket's own
      # API, which sfw consults on every install.
      #
      # MIGRATION NOTE: the install phase is shorter than the v2 list by the
      # three GitHub hosts, because the sfw download moved into the recipe. They
      # are the builder's business now, and this policy does not govern the
      # builder. apt's hosts stay, because the apt hook stays — a partial move
      # means a smaller install list, not an absent one.
      #
      # MIGRATION NOTE: the v2 entries carried explicit ports (`:443`, `:80`).
      # They are dropped for the contrib house style of portless entries —
      # allow-list membership ignores a port suffix, so `host:443` and `host`
      # name the same host. The comments that recorded which sources are plain
      # HTTP are kept.
      install:
        allow:
          # `apt-get update` — run by the one remaining install hook that
          # reaches a host at all — refreshes metadata for every configured apt
          # source. The shell-docker base template ships three sources, all of
          # which must succeed for the update to exit 0, regardless of which one
          # our install actually fetches from.
          # Ubuntu hosts amd64 packages on archive/security and arm64 packages
          # on ports.ubuntu.com, so all three Ubuntu hosts are listed for
          # cross-arch coverage.
          - archive.ubuntu.com        # Ubuntu archive (amd64 main, HTTP)
          - security.ubuntu.com       # Ubuntu security updates (amd64, HTTP)
          - ports.ubuntu.com          # Ubuntu archive/security (arm64, HTTP)
          - download.docker.com       # Docker's apt repo, pre-added by shell-docker
      runtime:
        allow:
          # Socket's API, which sfw consults to score a package before it is
          # installed. Without these the shims fail closed, which is the whole
          # kit refusing to work rather than quietly installing unchecked.
          - api.socket.dev
          - socket.dev
          # The registries the shimmed package managers fetch from. These are
          # runtime-only: nothing is installed from npm or PyPI at create time
          # (the prerequisites come from apt), and routing these installs is
          # what the kit is for.
          - registry.npmjs.org
          - pypi.org
          - files.pythonhosted.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      # MIGRATION NOTE: two of v2's four install hooks are in
      # packages-through-sfw.dockerfile now — the version+digest-pinned sfw
      # download and the shims with their profile.d snippet, a pinned artifact
      # and a set of static files, neither of which reads anything that exists
      # only at sandbox-create time. A v2 mixin installed them from hooks because
      # it had no way to carry content at all.
      #
      # The two that stay are the two ends of what an overlay cannot do:
      #
      #   * apt. Packages are not copyable content — they need the composed
      #     base's own dpkg database, and an overlay cannot carry a package's
      #     shared-library closure. The shims the overlay ships are wrappers
      #     around the node, npm and pip this hook installs, not substitutes.
      #   * the `~/.bashrc` append. An overlay's file entries replace the base's
      #     rather than merging with them, so shipping /home/agent/.bashrc would
      #     shadow whatever the composed workload put there instead of adding a
      #     line to it. Appending to a file this kit does not own is create-time
      #     work by nature — and /home/agent may be a mounted volume besides.
      #
      # Neither declares `env:`, and neither needs to: the apt hook reads no
      # variable at all, and the bashrc hook reads only `~`, which is HOME from
      # the platform baseline. v3 hook environments are deny-by-default, so this
      # is worth stating rather than assuming.
      install:
        - command: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl nodejs npm python3-pip && rm -rf /var/lib/apt/lists/*
          user: "0"
          description: Install package-manager prerequisites
        # The overlay ships /etc/profile.d/packages-through-sfw.sh; this is the
        # line that gets it read. Bash sources /etc/profile.d only for login
        # shells, and an interactive `sbx exec` shell is not one, so without this
        # the shell functions never load and only the PATH shims apply.
        - command: |
            set -euo pipefail
            grep -qF '/etc/profile.d/packages-through-sfw.sh' ~/.bashrc 2>/dev/null || \
              printf '\n# Packages through SFW wrappers (added by sbx-kits-contrib/packages-through-sfw)\n[ -f /etc/profile.d/packages-through-sfw.sh ] && . /etc/profile.d/packages-through-sfw.sh\n' >> ~/.bashrc
          user: "1000"
          description: Source sfw wrappers from ~/.bashrc for interactive Bash shells

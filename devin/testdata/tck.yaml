# TCK configuration for the devin kit.
#
# devin is still a built-in agent in released sbx builds, and sbx refuses to
# load a kit whose name collides with a built-in ("built-in agents cannot be
# overridden by a kit"). This flag turns that one specific `sbx create` failure
# into a skip, so the kit can land and be reviewed here before the built-in is
# removed from sbx.
#
# Nothing needs re-enabling later: once a released sbx no longer registers the
# built-in, `sbx create` succeeds, the full e2e runs, and the test logs a notice
# that this line is obsolete and can be deleted.
extractedFromBuiltin: true
#
# `promptArgs` is deliberately omitted, which skips the e2e `prompt` subtest.
# Two reasons, either of which is sufficient on its own:
#
#   * The entrypoint cannot answer a prompt from an unauthenticated sandbox.
#     `devin` is this kit's auth wrapper, and with no credential it execs
#     `devin-cli auth login --force-manual-token-flow`, which prints a URL and
#     blocks waiting for a human to paste a token back. Under `sbx exec` that
#     hangs rather than failing.
#   * Auth. No Devin credential exists on the runner, and obtaining one is
#     harder here than for the sibling kits: Devin's durable key only comes
#     into existence once an account has signed in interactively, so it cannot
#     simply be minted from a dashboard and stored.
#
# `binary: devin-cli` is the escape hatch, and is deliberately NOT set here.
# It would bypass the wrapper and reach the real CLI, which is the right move
# the day a Devin credential exists on the runner — but on its own it only
# swaps one unauthenticated failure for another, while giving up the wrapper's
# own coverage. Add it together with the credential and the matching
# promptArgs, not before.
#
# The remaining subtests (env, files, tmpfs, agentContext)
# still run and are what actually gate this kit — for as long as the built-in
# exists they are skipped too, so read a green run here as "TCK passed", not
# "e2e passed".

# Shape of the MCP-gateway registration written by the startup hook in
# spec.yaml, checked by the TCK's mcp_registration subtest. The
# format-independent parts (no-op guard, env-var indirection, no literal token,
# non-root user) are asserted for every kit and need no configuration here.
#
# Unlike the claude kit — which shells out to `claude mcp add` and so has no
# config shape in the spec to assert — this kit writes the file itself, so the
# key names below are pinned against the script that actually produces them.
#
# Devin keys an HTTP MCP server by `url`, alongside `transport: "http"` and a
# `headers` object, in a file of its own (mcp_config.json) separate from the
# config.json holding its general settings. `headers` is therefore the correct
# spelling here and is not forbidden, unlike in the codex kit.
#
# The forbidden keys are the wrong answers nearest to hand when transliterating
# an MCP config from a neighbouring agent:
#
#   * `type` — how Codex and opencode name the transport. Devin spells it
#     `transport`, and the two are one character of muscle memory apart.
#   * `httpUrl` — Gemini's spelling of `url`.
#   * `http_headers` — Codex's spelling of `headers`, one kit directory away.
#
# configFormat is left at its "json" default, which the .json extension on the
# path below cross-checks.
mcp:
  configPath: $HOME/.config/devin/mcp_config.json
  transportKey: url
  forbiddenKeys:
    - type
    - httpUrl
    - http_headers

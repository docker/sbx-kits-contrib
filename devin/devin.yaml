# syntax=docker/sandbox-kit:3
# Migration of the v2 `devin` sandbox kit. v2's sandbox.image named the
# pre-baked docker.io/sbx/devin-image:latest, which the Dockerfile beside the
# spec built -- in v3 a workload's content *is* its image, so that recipe
# becomes this kit's companion (devin.dockerfile) and the published-image
# indirection disappears with it. Deltas are marked MIGRATION NOTE inline.
schemaVersion: "3"
displayName: Devin
description: >-
  Devin CLI by Cognition, signed in from inside the sandbox and resolved by the
  sandbox proxy thereafter.
sourceUrl: https://devin.ai

kind: workload

# Devin CLI's version, by reference. SPEC-v3 §4 admits a build-phase arg
# reference here and expands it at publish, so this field resolves out of the
# `version` arg below -- the same release the recipe installs and the provide
# publishes under. This descriptor, the network policy, the lifecycle hooks and
# the entrypoint wrapper are released as the CLI they carry rather than under a
# number of their own.
#
# The literal that used to sit here was the losing half of the argument the arg
# below makes: an unversioned provide takes this field as its version (SPEC-v3
# §9.2), which is how `provides: ["devin"]` published `devin@1.0.0`. Pinning the
# provide fixed that; resolving this field from the same arg leaves nothing
# behind to disagree with it.
version: "${{ kit.args.version }}"

# The Devin CLI release the recipe installs, declared once: validated here,
# handed to the recipe as the version path of the setup script it fetches, and
# expanded into the provide -- so the kit cannot claim a release it does not
# ship.
#
# HOW THE DEFAULT WAS ESTABLISHED, and how to bump it: the `version` field of
# https://static.devin.ai/cli/current/manifest.json, which is the same document
# the unpinned installer reads to decide what "current" means. 3000.10.31 at
# the time of writing.
#
# HOW THE PIN REACHES THE INSTALL: Cognition's installer takes no version from
# its environment or its argv -- the top-level script carries a bare
# `PINNED_VERSION=""` literal. But its own comment on that line says the value
# is "Set by the build system for versioned setup scripts (e.g.
# cli/2026.3.5-1/setup.sh)", and those scripts are published:
# https://static.devin.ai/cli/<version>/setup.sh is byte-for-byte the top-level
# script with `PINNED_VERSION="<version>"` in place of the empty literal, which
# sends it at .../<version>/manifest.json instead of .../current/manifest.json.
# So the pin is expressed by fetching the versioned script rather than by
# passing the installer anything, which is the vendor's own supported way to do
# it. The recipe fetches `https://static.devin.ai/cli/${DEVIN_VERSION}/setup.sh`
# and asserts the installed binary reports this exact version.
#
# WHY PINNED rather than left floating: an unversioned provide takes the
# descriptor's `version:` as its version at resolution, so `provides: ["devin"]`
# published `devin@1.0.0` -- this kit's release number wearing Devin's name. A
# mixin asking for `devin >= 3000.10` would refuse to resolve against it.
# Floating the install and stating a version are not both available; stating
# one the content may not have is the worse of the two, so the install is
# pinned to make the claim true.
#
# The pattern admits the vendor's two release shapes and nothing else: the
# three-segment release this pin uses, and the `-N` respin suffix the
# installer's own comment documents (`2026.3.5-1`). `current` is deliberately
# not admitted -- the value is expanded into `provides` below, and
# `devin@current` is not a version.
args:
  version:
    default: "3000.10.31"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$'
    description: Devin CLI release to install
    buildArg: DEVIN_VERSION

provides: ["devin@${{ kit.args.version }}"]

capabilities:
  # This workload is an agent sandbox: the host launches the agent rather than
  # running the image's entrypoint as PID 1, and honors the identity the image
  # config declares instead of assuming one.
  - type: com.docker.sandbox/sbx@1

  # MIGRATION NOTE: v2's one flat allow list becomes phase-scoped, and every
  # entry lands in `runtime`. There is no `install` phase, and that is the
  # accurate statement: the Devin CLI is installed at image build (see
  # devin.dockerfile), which no network-policy phase governs, and the two
  # lifecycle hooks below are `startup` hooks -- they run at boot, which is the
  # runtime phase. The apt hosts are therefore runtime entries, not install
  # ones, because the hook that needs them runs at every boot.
  #
  # Entries are written without a port, which is this repo's house style. A
  # portless pattern matches any port, which is what the apt hosts at the
  # bottom need -- pinning them to :80 breaks the moment a mirror answers over
  # https and `apt-get update` then fails wholesale rather than skipping one
  # source.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Devin's own hosts, collapsed to the vendor's wildcard rather than
          # enumerated. api.devin.ai is the API the CLI talks to and the OAuth
          # token endpoint below; app.devin.ai serves the sign-in page the
          # entrypoint wrapper hands the user off to; cli.devin.ai serves
          # install.sh and static.devin.ai serves the manifest and versioned
          # bundle it reads (background self-update is off, see the config seed
          # below, so nothing reaches these two unless the user explicitly asks
          # for an update). `*.devin.ai` matches exactly one DNS label. Scope
          # stays the vendor's domain -- a new devin.ai subdomain (a renamed
          # API host, a new CDN label) doesn't strand the kit under deny-all
          # the way an enumerated list would. The bare apex is deliberately not
          # listed: nothing here requests it, and the wildcard would not cover
          # it anyway (it matches one label, never zero).
          - "*.devin.ai"
          # MIGRATION NOTE: api.devin.ai is now ALSO listed literally, which v2
          # did not need to do. v2's coverage check was wildcard-aware, so the
          # entry above satisfied it for the inject domain and the OAuth token
          # endpoint. v3 checks inject-within-allow by exact host match
          # (stripping ports) and deliberately does not expand narrower globs,
          # so that a published inject domain stays auditable against the list
          # without reimplementing the enforcement matcher. Adding the literal
          # grants nothing new -- the wildcard already covered it -- and keeps
          # the vendor-wildcard scoping v2 chose on purpose.
          - api.devin.ai
          # Alternate sign-in host. Which of app.devin.ai and windsurf.com an
          # account is sent to is decided server-side, so both are allowed
          # rather than betting on one and leaving half of all accounts unable
          # to log in.
          - windsurf.com
          # Devin CLI is built on the Windsurf/Codeium codebase, and the model
          # and seat backends still live on the Codeium host -- without this
          # the CLI authenticates and then cannot answer a prompt.
          # unleash.codeium.com is its feature-flag service, and it is not
          # inert: with that host blocked the CLI was observed handing out the
          # windsurf.com sign-in URL instead of the app.devin.ai one, so the
          # flags it serves reach the login path.
          - server.codeium.com
          - unleash.codeium.com
          # `apt-get update` (the startup hook below) refreshes metadata for
          # every configured apt source and returns exit 100 if any one of them
          # fails. The shell-docker base ships three sources, so all three must
          # be reachable. Ubuntu serves amd64 from archive/security and arm64
          # from ports.ubuntu.com, so all three Ubuntu hosts are listed to keep
          # the kit working cross-arch.
          - archive.ubuntu.com        # Ubuntu archive (amd64 main)
          - security.ubuntu.com       # Ubuntu security updates (amd64)
          - ports.ubuntu.com          # Ubuntu archive/security (arm64)
          - download.docker.com       # Docker's apt repo, pre-added by shell-docker
          #
          # Deliberately absent:
          #
          #   * The Sentry crash-reporting ingest host. Devin CLI reaches it on
          #     a crash; a sandbox has no business reporting to a third party
          #     on the user's behalf. Leaving the host unlisted holds even if
          #     the CLI grows an opt-out variable later, which is more than an
          #     environment variable could promise.
          #   * server-beta.codeium.com. It is not the default backend, and
          #     adding a host on speculation is how an allow list stops
          #     describing anything.
          #   * registry.npmjs.org and the GitHub hosts. Devin reaches those
          #     only for things the user starts -- an `npx`-launched MCP
          #     server, a clone -- and a kit that allowed them by default would
          #     widen every sandbox's egress for a path most sessions never
          #     take. Compose a mixin that declares them, or add them here in a
          #     fork.

  # One service, two halves of one contract. Devin's sign-in is a browser PKCE
  # flow, but the credential the CLI actually authenticates with afterwards is
  # not what that exchange returns -- the exchange yields a short-lived
  # intermediate that the CLI immediately spends to mint the account's durable
  # key. So `oauth` below describes the sign-in, `apiKey` describes what the
  # proxy injects on every request after it, and both belong to the one `devin`
  # service the host binds under.
  #
  # The service name is load-bearing beyond this file: it is the key a host
  # binds a secret under (`sbx secret set devin …`) and the key the proxy
  # routes on. Renaming it here silently detaches it from the host binding.
  #
  # MIGRATION NOTE: `optional: true` preserves v2 behavior. v2 credentials
  # default to not-required and the v3 default inverts. An unbound sandbox is
  # the normal starting point for this agent -- the entrypoint wrapper runs
  # Devin's own login flow -- so a required entry would take away the working
  # configuration rather than protect one.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Devin account credential captured during in-sandbox login
    config:
      service: devin
      phase: runtime
      # MIGRATION NOTE: v2 spelled this `name: ""` with a comment explaining
      # that the empty string was deliberate and the field most likely to be
      # "corrected" by mistake -- Devin CLI does not read its credential from
      # an environment variable at all, it reads credentials.toml, which the
      # oauth block below renders. v3 has a name for that shape: an inject-only
      # credential, written by omitting `name` entirely. It is now a declared
      # kind of entry rather than an empty field a linter warns about, and the
      # guarantee is stronger than v2's -- no variable is created for it, not
      # even a sentinel.
      apiKey:
        inject:
          # Both hosts carry the durable key as a bearer. server.codeium.com is
          # the model/seat backend (Devin CLI is built on the Windsurf/Codeium
          # codebase); api.devin.ai is Devin's own API.
          - {domain: server.codeium.com, header: Authorization, format: "Bearer %s"}
          - {domain: api.devin.ai, header: Authorization, format: "Bearer %s"}
      oauth:
        # PKCE code exchange. app.devin.ai serves the sign-in page;
        # api.devin.ai takes the exchange, which is why the token endpoint
        # names the latter.
        tokenEndpoint: {host: api.devin.ai, path: /auth/cli/token}
        # The hosts where the captured bearer is used, as distinct from where
        # it is refreshed. Both are also declared in the apiKey inject list
        # above and in the allow list -- three separate declarations of the
        # same two hosts, none of which implies the others.
        resourceHosts:
          - server.codeium.com
          - api.devin.ai
        # The exchange returns exactly one field, `token`. Both response fields
        # name it deliberately rather than by oversight: the engine reads an
        # access AND a refresh token and forwards the response unpersisted if
        # either is empty -- a guard against storing half a credential -- so
        # pointing both at the one field is what makes a single-token provider
        # capturable at all.
        responseFields:
          accessToken: token
          refreshToken: token
        # No `sentinels:`, which is legal only because passthrough is set, and
        # the two go together for one reason: the container must receive the
        # REAL intermediate token. The CLI immediately embeds it in a protobuf
        # request that mints the durable key, and header-level sentinel
        # substitution cannot reach inside a protobuf body -- so a masked token
        # would fail sign-in outright rather than degrade.
        #
        # This is a security downgrade, scoped as tightly as it can be: the
        # intermediate is spent within seconds, and the durable key that
        # follows it never reaches the container in usable form. The credential
        # file below is rendered with the proxy's placeholder, and the
        # entrypoint wrapper rewrites any local copy back to that placeholder
        # before the agent starts.
        passthrough: true
        credentialFile:
          path: "~/.local/share/devin/credentials.toml"
          # MIGRATION NOTE: v2 wrote this as a Go template, and its comment
          # said the declarative `structure:` map was not available because
          # structure encoded JSON and this file is TOML. v3 lifts exactly that
          # limitation: `format: toml` encodes the same declarative map as
          # TOML, so the template goes away without the file changing. The
          # three URL lines are the CLI's own defaults, restated because the
          # file is written whole rather than merged.
          format: toml
          structure:
            api_server_url: "https://server.codeium.com"
            devin_webapp_host: "app.devin.ai"
            devin_api_url: "https://api.devin.ai"
            windsurf_api_key: "{{.PrimaryApiKey}}"

  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        # Devin CLI updates itself in the background by default, which inside a
        # sandbox means an unannounced binary swap under a running session and
        # egress to cli.devin.ai/static.devin.ai that nobody asked for. Turning
        # it off leaves `devin update` available for a user who wants it.
        #
        # MIGRATION NOTE: v2's `onlyIfMissing: true` is spelled `overwrite:
        # false` in v3. Same behavior, stated as the default it departs from: a
        # user who edits this file -- it is Devin's general settings file, not
        # a kit-owned one -- keeps their edit across restarts. The engine
        # creates the parent directory before writing, so no image-side mkdir
        # is needed.
        - path: /home/agent/.config/devin/config.json
          content: '{"auto_update": false}'
          overwrite: false
          description: Disable Devin background updates
      startup:
        # MIGRATION NOTE: v2 backgrounded this by hand -- a trailing `&` inside
        # `sh -c`, wrapped in `>/dev/null 2>&1 </dev/null` on the outer group,
        # because a backgrounded job that inherited the exec's pipe write ends
        # kept it from reaching EOF and timed the exec out. v3 has
        # `background: true`, so the engine owns the detaching and the
        # redirection trick that existed only to make the hand-rolled version
        # safe goes with it. Output is still discarded, which is the part that
        # was about this command rather than about the backgrounding.
        - command: [sh, -c, "{ command -v apt-get && apt-get update -qq -y || true; } >/dev/null 2>&1"]
          user: "root"
          background: true
          description: Update apt package cache in background

        # Gateway-first MCP registration. MCP_GATEWAY_URL and
        # MCP_SENTINEL_TOKEN_NAME are injected into the container env when a
        # gateway has been reserved for the sandbox; the hook no-ops when there
        # is none. The sentinel is a NAME, not a credential -- the proxy
        # substitutes the real token per request, keyed by it.
        #
        # MIGRATION NOTE: hook environments are deny-by-default in v3, so the
        # two variables this reads are now declared. $HOME is in the platform
        # baseline and needs no declaration. Without the `env:` list the guard
        # on the first line would see an empty MCP_GATEWAY_URL and the hook
        # would silently no-op on every boot.
        #
        # The config is written directly rather than by shelling out to
        # `devin mcp add`, for the same reason the codex and opencode kits do:
        # it puts the exact key names in the descriptor where they can be
        # pinned, instead of behind a CLI whose output shape nothing here
        # asserts. The file is written whole rather than merged because Devin
        # keeps MCP servers in mcp_config.json alone -- its other settings live
        # in the sibling config.json, which the file entry above writes
        # separately and never mixes server entries into.
        #
        # Note `transport`, not `type` (Codex's and opencode's spelling), not
        # `httpUrl` (Gemini's), and not `http_headers` (Codex's spelling of
        # `headers`): all three are wrong answers nearest to hand when editing
        # this.
        #
        # Startup rather than install, and safe there: this is a whole-file
        # rewrite with deterministic content, so re-running it on every
        # container start converges rather than accumulating.
        - command: |
            set -e
            [ -n "$MCP_GATEWAY_URL" ] || exit 0
            mkdir -p "$HOME/.config/devin"
            cat > "$HOME/.config/devin/mcp_config.json" <<EOF
            {
              "mcpServers": {
                "mcp-gateway": {
                  "url": "$MCP_GATEWAY_URL",
                  "transport": "http",
                  "headers": {
                    "Authorization": "Bearer $MCP_SENTINEL_TOKEN_NAME"
                  }
                }
              }
            }
            EOF
          user: "agent"
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Register the sandbox MCP gateway

  # Devin reads AGENTS.md from the workspace root, so this is the filename
  # composed kit context has to land in for the agent to pick it up. It has no
  # product-specific profile file of its own -- its `rules` command covers
  # .windsurf/rules and .cursor/rules directories, which are a different
  # mechanism from the single profile file this field names.
  #
  # MIGRATION NOTE: v2 declared the filename with no `content:`, reasoning that
  # an AGENTS.md section saying little costs context on every session. v3's
  # agent-context is surfaced *progressively* -- the profile carries a per-kit
  # index and the agent reads a kit's body on demand -- so that cost no longer
  # applies, and the body below says the things about this sandbox that the
  # agent cannot otherwise discover.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      contentFile: ./devin-context.md

  # MIGRATION NOTE: no agent-sessions@1. testdata/tck.yaml omitted promptArgs
  # deliberately and said why at length: the entrypoint is this kit's auth
  # wrapper, and with no credential it execs `devin-cli auth login
  # --force-manual-token-flow`, which prints a URL and blocks on a human. There
  # is no recorded working non-interactive invocation, and this capability
  # exists so a host surfaces "unsupported" rather than improvising flags.
  #
  # MIGRATION NOTE: no agent-skills@1 either. The capability names the path an
  # agent reads shared skills from, and neither the v2 spec nor this kit's
  # README ever stated one for Devin. A path invented here would be a guess the
  # host would then mount a user's shared store into.

schemaVersion: "2"
kind: sandbox
name: picoclaw
displayName: PicoClaw
description: Tiny, fast personal AI assistant (Go, single static binary) — agent CLI plus a channel gateway, pre-baked at a pinned, SHA256-verified upstream release.
sandbox:
  # Pre-baked image: the pinned, SHA256-verified picoclaw release binary, on
  # the shell template (no Docker engine -- see the Dockerfile). Built and
  # published by build-and-publish-kits.yml, the shared kit-image pipeline
  # (see ../PUBLISHING.md) -- no bespoke workflow needed, same as
  # hermes-agent/pi/openclaw/kiro/copilot. Sandbox creation only pulls the
  # image; bumping the pinned version is a deliberate Dockerfile edit, not
  # something the nightly rebuild does on its own.
  image: docker.io/sbx/picoclaw-image:latest
  entrypoint:
    # Invoked through `sh` because files under `files/home/` land 0644 -- the
    # artifact loader does not carry the source exec bit, so a direct exec
    # fails with EACCES.
    - sh
    - /home/agent/.local/bin/picoclaw-start.sh
permissions:
  network:
    allow:
      # Every domain the anthropic credential injects into -- required here
      # too, not just below: this repo's e2e runs every kit under
      # `sbx policy init deny-all`, so a domain absent from this list is
      # unreachable regardless of what the credential block declares.
      - api.anthropic.com
      - claude.ai
      - console.anthropic.com
      # The anthropic credential's OAuth token endpoint, for the refresh the
      # proxy performs once the access token expires.
      - platform.claude.com:443
      # chat platforms (enabled via config; tokens supplied by the user)
      - '*.telegram.org'
      - '*.discord.com'
      - gateway.discord.gg
      - '*.whatsapp.com'
      - '*.whatsapp.net'
      - '*.slack.com'
ports:
  - container: 18790
    name: gateway
  - container: 18791
    name: webhook
credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: '%s'
        - domain: claude.ai
          header: x-api-key
          format: '%s'
        - domain: console.anthropic.com
          header: x-api-key
          format: '%s'
    # For a host whose stored anthropic credential is an OAuth login -- signed
    # in from a `claude` sandbox rather than an API key. Without this block
    # such a host gets no usable credential at all: the apiKey sentinel reaches
    # Anthropic unswapped and every model call 401s.
    #
    # credentialFile *is* PicoClaw's own auth store, the same file
    # `picoclaw auth login --provider anthropic` writes, so the `anthropic`
    # protocol's OAuth path reads it with no translation -- what
    # picoclaw-anthropic-auth.sh still has to do is switch the model entry to
    # that protocol, since the seeded default is anthropic-messages (API key
    # only). expires_at is deliberately absent: the field is an RFC3339 string
    # upstream, {{.ExpiresAt}} renders Unix ms, and leaving it unset also stops
    # PicoClaw attempting a refresh the proxy already owns. The file holds
    # sentinels, not real tokens.
    oauth:
      tokenEndpoint:
        host: platform.claude.com
        path: /v1/oauth/token
      resourceHosts:
        - api.anthropic.com
      sentinels:
        accessToken: sk-ant-oat01-proxy-managed
        refreshToken: sk-ant-ort01-proxy-managed
      credentialFile:
        path: ~/.picoclaw/auth.json
        structure:
          credentials:
            anthropic:
              access_token: '{{.AccessToken}}'
              refresh_token: '{{.RefreshToken}}'
              provider: anthropic
              auth_method: oauth
environment:
  variables:
    PICOCLAW_GATEWAY_HOST: 0.0.0.0
    PICOCLAW_HOME: /home/agent/.picoclaw
setup:
  startup:
    # Runs before the gateway command below, which reads the same config. The
    # script is idempotent -- the placeholder it matches is gone once the
    # credential is resolved -- which is why the entrypoint can call it again.
    - command:
        - sh
        - /home/agent/.local/bin/picoclaw-anthropic-auth.sh
      user: "1000"
      description: Resolve the host's Anthropic credential into config.json at sandbox start
    # Absolute paths (startup commands run with a minimal env, no $HOME);
    # health-endpoint guard (a pgrep -f guard would match its own shell's
    # command line and never start the gateway).
    - command:
        - sh
        - -c
        - curl -fsS -m 2 http://127.0.0.1:18790/health >/dev/null 2>&1 || { mkdir -p /home/agent/.picoclaw; HOME=/home/agent setsid sh -c '/usr/local/bin/picoclaw gateway > /home/agent/.picoclaw/gateway.log 2>&1' & }
      user: "1000"
      description: Start the picoclaw gateway in the background (health at :18790/health)

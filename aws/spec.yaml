schemaVersion: "2"
kind: mixin
name: aws
displayName: AWS
description: >-
  Configures AWS credentials by symlinking the host credential files from
  a read-only mount. Requires ~/.aws to be mounted read-only at create time:

    sbx create claude . kit/aws ~/.aws:ro

  sbx-toolkit adds this mount automatically when kit/aws is declared.

caps:
  network:
    allow:
      - "*.amazonaws.com:443"
      - "*.amazonaws.com:80"
      - archive.ubuntu.com:80
      - archive.ubuntu.com:443
      - security.ubuntu.com:80
      - security.ubuntu.com:443
      - ports.ubuntu.com:80
      - ports.ubuntu.com:443

commands:
  startup:
    - command:
        - sh
        - -c
        - |
            set -eu
            export PATH="$HOME/.local/bin:$HOME/.claude/local:$PATH"
            SENTINEL="$HOME/.sbx-aws-configured"

            # Locate host ~/.aws — mounted at its host absolute path.
            HOST_AWS=""
            for _d in /Users/*/.aws /home/*/.aws; do
              case "$_d" in *"*"*) continue ;; esac
              [ "$_d" = "$HOME/.aws" ] && continue
              [ -d "$_d" ] && HOST_AWS="$_d" && break
            done

            # Credential wiring — run once per sandbox.
            if [ -n "$HOST_AWS" ] && [ ! -f "$SENTINEL" ]; then
              mkdir -p "$HOME/.aws"
              _linked=0
              for f in credentials config; do
                [ -e "$HOST_AWS/$f" ] || continue
                ln -sf "$HOST_AWS/$f" "$HOME/.aws/$f"
                _linked=1
              done
              [ "$_linked" = "1" ] && touch "$SENTINEL" \
                || echo "aws: no credential files found in $HOST_AWS" >&2
            fi

            # CLI install — retried each startup until aws is available.
            if ! command -v aws > /dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              _installed=0
              _arch="$(uname -m)"
              for _try in 1 2 3 4 5; do
                [ "$_try" -gt 1 ] && { echo "AWS CLI install attempt $_try/5 — retrying in 15s..." >&2; sleep 15; }
                { command -v unzip > /dev/null 2>&1 \
                    || { sudo apt-get -o APT::Lock::Timeout=60 update -qq \
                      && sudo apt-get -o APT::Lock::Timeout=60 install -y -qq unzip; }; } \
                  && curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${_arch}.zip" \
                       -o /tmp/awscliv2.zip \
                  && unzip -q /tmp/awscliv2.zip -d /tmp/ \
                  && sudo /tmp/aws/install --update \
                  && rm -rf /tmp/awscliv2.zip /tmp/aws \
                  && { _installed=1; break; } \
                  || true
              done
              [ "$_installed" = "1" ] && echo "AWS CLI installed" \
                || echo "AWS CLI install failed — will retry on next startup" >&2
            fi
      user: "1000"
      description: "Configure AWS credentials and install CLI (run-once per sandbox)"

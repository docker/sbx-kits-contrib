# syntax=docker/sandbox-kit:3
# Docker Sandboxes kit for GitGuardian ggshield secret scanning.
# Usage, prerequisites and design notes: see README.md in this directory.
schemaVersion: "3"

# The ggshield release this kit's overlay carries, by reference to the
# `version` arg below — SPEC-v3 §4 admits a build-phase arg reference in this
# field and expands it at publish, so the release is stated in exactly one
# place and the publish tag and `org.opencontainers.image.version` name the
# scanner the kit ships.
#
# MIGRATION NOTE: this was a standalone "0.1.0" while ggshield arrived from an
# install hook, because the kit had no content and so nothing to version. Now
# that the scanner ships in the kit's layers, the kit and the release it
# carries are the same artifact.
version: "${{ kit.args.version }}"
displayName: GitGuardian (ggshield)
description: Installs the GitGuardian CLI (ggshield) with proxy-injected API-key auth for api.gitguardian.com and wires it as a Claude Code AI hook, so the agent's actions are scanned for hardcoded secrets automatically - the real key never enters the sandbox.

kind: mixin

# ggshield's AI hook is agent-specific: it writes Claude Code's own hook file
# (~/.claude/settings.json) and the agent instructions describe Claude Code, so
# layering this onto a codex or copilot sandbox would produce a
# valid-but-nonsensical result. Affinity turns that into a composition error
# instead. Codex/Copilot/Cursor variants are separate kits.
#
# MIGRATION NOTE: v2's `requires: {agent: claude}` becomes a plain
# capability name. v3 has no agent-shaped affinity field — `requires` is
# one flat list of names the resolved set must provide, and the claude kit
# provides `claude`. Unversioned on purpose: an unversioned require is
# satisfied by any version of the provide (SPEC-v3 §5.2), which is what the
# v2 affinity meant.
#
# MIGRATION NOTE: `deb/dpkg` was the other half of this list, and it went out
# with the hook that justified it. The ggshield install hook picked its release
# asset with `dpkg --print-architecture` under `set -euo pipefail`, so a base
# without dpkg died at that line and sandbox creation failed — that, and only
# that, is what the requirement recorded. gitguardian.dockerfile makes the same
# choice at build from buildx's TARGETARCH, and the one hook left reads no
# distribution package at all. `requires` is a closed-set check (SPEC-v3 §5.3):
# a name kept past its reason refuses compositions in exchange for nothing.
#
# What the overlay does still assume of a base — a glibc userland, since the
# pinned release is the `-unknown-linux-gnu` PyInstaller build — has no
# honest name here that is narrower than what `claude` already implies, and
# gitguardian.dockerfile states it where it can be acted on.
requires: ["claude"]

# The ggshield release gitguardian.dockerfile downloads, declared once:
# validated here, handed to the recipe as GGSHIELD_VERSION, and expanded into
# `provides` and into the top-level `version:` — so the kit cannot publish a
# release its overlay does not carry. The recipe proves the agreement by
# running the installed binary and comparing what it reports.
#
# `buildArg:`, not `env:` — the two are mutually exclusive and this value
# resolves at build. Nothing in the container reads a GGSHIELD_VERSION.
#
# An installer may override it, but not silently: the per-arch SHA256s in the
# recipe are pinned to this release, so another version fails the digest check
# rather than installing under a descriptor that goes on claiming this number.
# Bumping ggshield is therefore a three-part edit — this default and both
# digests in gitguardian.dockerfile, together — each digest being the
# sha256sum of the release tarball.
args:
  version:
    default: "1.53.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: ggshield release to install
    buildArg: GGSHIELD_VERSION

# The scanner the overlay puts on PATH, carrying the version it actually
# landed. MIGRATION NOTE: this kit declared no provide at all while ggshield
# came from an install hook — there was no content to describe, and the honest
# name for "a binary some sandbox may or may not have downloaded" was none.
provides: ["ggshield@${{ kit.args.version }}"]

capabilities:
  # One host, one phase.
  #
  # MIGRATION NOTE: v2 declared one flat allow list and its comments already
  # said which entry served which purpose, so the first v3 cut split it into an
  # install phase holding three GitHub hosts — the pinned release download and
  # nothing else — and a runtime phase holding GitGuardian's API.
  #
  # MIGRATION NOTE: the install phase is now gone entirely.
  # gitguardian.dockerfile fetches that tarball at image build, which is the
  # builder's traffic and not governed by this policy. The one hook that
  # remains registers ggshield with Claude Code by editing a local file and
  # makes no request — verified by running `ggshield machine setup` with
  # networking disabled on the composed overlay. An absent phase grants
  # nothing, which is the whole point of moving the download: the grant
  # existed only to let that hook reach the network.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Runtime: ggshield's scan/verify calls hit the GitGuardian public API.
          # EU workspace / self-hosted instances use a different host - add your
          # GITGUARDIAN_INSTANCE domain here and to the credential inject block.
          - api.gitguardian.com

  # Not `optional:`. v2 credentials defaulted to not-required and this one
  # said `required: true`; v3 inverts the default, so required is spelled
  # by saying nothing.
  - type: com.docker.sandbox/credential@1
    description: GitGuardian API key (from a Personal or Service Account, "scan" scope). Stored on the host; the sandbox only sees a placeholder and the proxy injects the real value on requests to api.gitguardian.com.
    config:
      service: gitguardian
      phase: runtime
      apiKey:
        # ggshield reads GITGUARDIAN_API_KEY. On the wire, the proxy rewrites the
        # Authorization header with the real key on outbound api.gitguardian.com
        # calls. GitGuardian's API auth scheme is "Authorization: Token <key>",
        # not Bearer.
        name: GITGUARDIAN_API_KEY
        # MIGRATION NOTE: this flag is where v2's
        # `environment.variables.GITGUARDIAN_API_KEY: "proxy-managed"` went,
        # and it is a declaration rather than a workaround. The v2 comment
        # explained itself: gitguardian is a custom (non-registry) service,
        # so sbx did NOT auto-export the apiKey sentinel and the kit had to
        # materialize one by hand. `proxyManaged: true` is v3's name for
        # exactly that — the named variable carries a sentinel in the
        # container while the real key stays on the host — so the static
        # env var is dropped in favor of the field that means it, rather
        # than re-created in an /etc/profile.d overlay that would then
        # fight the sentinel for the same variable.
        proxyManaged: true
        inject:
          - domain: api.gitguardian.com
            header: Authorization
            format: "Token %s"

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # MIGRATION NOTE: the first hook, "Install ggshield, version+digest
        # pinned", is gone — gitguardian.dockerfile performs that download at
        # image build instead, with the same release, the same per-arch slugs
        # and the same two SHA256s. Nothing in the hook body needed
        # sandbox-create time: it read no arg, no credential and no
        # create-time path, and its one environment-shaped input was
        # `dpkg --print-architecture`, which buildx answers better as
        # TARGETARCH because it can answer it once per platform.
        #
        # What that bought, in order of how visible it is: all three GitHub
        # hosts left the network policy above (no install phase remains),
        # `deb/dpkg` left `requires`, the tarball's digest is now fixed in a
        # scannable published layer rather than re-verified in every sandbox,
        # a withdrawn or re-rolled release fails the build at publish instead
        # of failing sandbox creation for a user, and every `sbx run` of this
        # kit saves the fetch of a ~100 MB bundle.
        #
        # The one hook that remains is the one that could not move.

        # Install ggshield as the Claude Code AI hook. Unlike a git pre-commit hook,
        # this fires inside the agent's own tool loop and scans the content the
        # agent produces - putting the secret scan directly on the agent's
        # authorized output path, which is exactly the surface this sandbox exists
        # to protect.
        #
        # WHY THIS STAYS A HOOK, and it is the clearest case of the rule: what
        # `machine setup` does is edit ~/.claude/settings.json, a file the
        # composed claude base owns and writes itself. An overlay's file
        # entries REPLACE the base's rather than merging with them, so
        # shipping a settings.json in a layer would discard whatever the agent
        # kit had put there — registering this scanner by throwing away the
        # agent's own configuration. Merging into somebody else's file is
        # create-time work by nature. That the file also lives under
        # /home/agent, which may be a mounted volume on the composed base, is
        # a second reason pointing the same way.
        #
        # `machine setup` is the current, non-deprecated entrypoint (`ggshield
        # install -t <agent>` still works but prints a deprecation warning). We
        # scope it to the AI hook only: --no-git-hooks (the kit deliberately does
        # not gate git) and --no-honeytokens (the scan-scoped token can't plant one,
        # and a honeytoken isn't this kit's job). It is idempotent - re-runs add
        # only what's missing. (ggshield's own agent id for Claude Code is
        # `claude-code`; the kit's agent affinity above is `claude`.)
        #
        # MUST run as the agent user (uid 1000), NOT root: setup.install defaults to
        # user "0", which would write the hook under root's HOME (/root/...) where
        # the agent (HOME=/home/agent) never reads it. Verified in-sandbox with
        # `ggshield machine doctor`.
        #
        # MIGRATION NOTE: the one added line. ggshield refuses to run when
        # GITGUARDIAN_API_KEY is unset, and in v2 the static
        # `environment.variables` entry guaranteed it was set everywhere,
        # install hooks included. Its v3 replacement — the credential's
        # proxyManaged sentinel — is phase-scoped to `runtime`, so it is
        # not guaranteed here. The default restores precisely the v2
        # guarantee (the literal `proxy-managed`, which is what v2 set) and
        # defers to the real sentinel wherever the runtime does surface it.
        # `env:` declares the name because v3 hook environments are
        # deny-by-default: without it the variable could not arrive even
        # when the runtime offers it.
        - command: |
            set -euo pipefail
            export GITGUARDIAN_API_KEY="${GITGUARDIAN_API_KEY:-proxy-managed}"
            ggshield machine setup --agent claude-code --no-git-hooks --no-honeytokens
            echo "ggshield AI hook installed (~/.claude/settings.json)"
          user: "1000"
          env: [GITGUARDIAN_API_KEY]
          description: "Install ggshield as a Claude Code AI hook (agent user)"

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./gitguardian-context.md

# syntax=docker/sandbox-kit:3
# Migration of this kit's v2 spec.yaml to the v3 kit descriptor grammar.
# Every v2 stanza lands somewhere deliberate and the v2 reasoning travels
# with it; the places where v3 changes the shape of a declaration — or
# cannot carry one at all — are marked MIGRATION NOTE inline.
#
# The two stanzas that leave this file entirely are sandbox.image and
# sandbox.entrypoint: a v3 workload's content *is* the image, so the v2
# Dockerfile becomes the companion recipe (codex.dockerfile, found by the
# filename stem) and v2's entrypoint and environment.variables land in the
# image config where OCI already owns them.
schemaVersion: "3"
displayName: Codex
description: OpenAI Codex CLI, OpenAI's agentic coding CLI.
# The Codex CLI's version, by reference. SPEC-v3 §4 admits a build-phase arg
# reference here and expands it at publish, so this field resolves out of the
# `version` arg below — the same release the recipe installs and the provide
# publishes under. This descriptor, the network policy and the hooks are
# released as the CLI they carry rather than under a number of their own.
#
# MIGRATION NOTE: in v2 this was the kit's own release, published as the
# vnd.docker.sandbox.kit.version annotation. In v3 it is also the version
# *fallback* for unversioned provides (SPEC-v3 §4) — which is how bare
# `provides: ["codex"]` came to publish `codex@1.0.0`, the kit's release number
# wearing the CLI's name. Pinning the provide took that job away; resolving this
# field from the same arg takes away the competing number as well, and makes the
# publish tag and org.opencontainers.image.version name the CLI the image ships.
#
# `scripts/check-release-tag.sh` reads this through `scripts/kit-version.sh` —
# the same resolver `publish-kit.sh` tags with, so a release tag and a published
# tag cannot disagree — and that resolver follows an arg reference to the arg's
# default, so a field written this way resolves for it rather than defeating it.
version: "${{ kit.args.version }}"

kind: workload

# The release of the Codex CLI this kit installs and publishes.
#
# HOW THE DEFAULT WAS DETERMINED, and how to bump it: the recipe installs from
# the vendor's standalone installer, whose release assets are the GitHub
# releases of openai/codex. The latest release there was tagged `rust-v0.155.1`
# when this was pinned:
#
#   curl -fsSL https://api.github.com/repos/openai/codex/releases/latest \
#     | jq -r .tag_name        # -> rust-v0.155.1
#
# The tag's `rust-v` prefix is stripped here rather than carried: SPEC-v3 §5.2
# admits no `v` prefix in a version, so `rust-v0.155.1` could not be referenced
# into the provide below. Nothing has to re-add it — the installer normalizes
# `rust-vX`, `vX` and bare `X` to the same release itself.
args:
  version:
    # RE2 transcription of the installer's own `validate_version()` regex, so a
    # value this arg accepts is a value the installer accepts, and the
    # descriptor rejects the rest before any content is built.
    default: "0.155.1"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-alpha(\.[0-9]+){0,2}|-beta(\.[0-9]+)?)?$'
    description: Codex CLI release to install
    buildArg: CODEX_VERSION

# MIGRATION NOTE: v2 had no provides — a v2 mixin asked for a base agent by
# `requires: {agent: codex}`, matched against the sandbox kit's `name`. v3
# has no implicit identity, so the name those mixins ask for has to be
# stated: codex-acp and codex-app-server both carry `requires: ["codex"]`
# and resolve against this entry.
#
# Versioned from the arg above, which is the same value the recipe hands the
# installer — so what is published here is what the image ships, not an
# assertion about content nobody checked. The recipe asserts the agreement at
# build time by asking the installed binary. Before the pin this was bare
# `codex` and fell back to the kit's own `version:`, which published
# `codex@1.0.0` — the kit's release number wearing the CLI's name, and a value
# no `codex >= 0.1` constraint could ever be satisfied by.
provides: ["codex@${{ kit.args.version }}"]

capabilities:
  # This workload is an agent sandbox: the host launches the agent rather
  # than running the image's entrypoint as PID 1, and honors the identity
  # the image config declares instead of assuming one. Implicit in v2's
  # `kind: sandbox`; stated explicitly in v3.
  - type: com.docker.sandbox/sbx@1

  # v2's permissions.network.allow, one flat list, becomes a phase-scoped
  # policy. The whole list lands in `runtime` and there is no `install`
  # phase: this kit's only install hook writes config files and opens no
  # socket, and both startup hooks (apt refresh, MCP registration) run at
  # boot, which is the runtime phase. An absent phase grants nothing, and
  # the union across phases is exactly the v2 list.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        # Built-in agents ship no egress policy of their own: they inherit
        # whatever the host policy is, which defaults to permissive. A
        # community kit cannot rely on that — this repo's e2e runs every kit
        # under `sbx policy init deny-all`, so the kit gets exactly the
        # reachability it declares here and nothing more.
        #
        # Hosts are listed without a port qualifier, matching the other kits
        # in this repo. Pinning `:80` on the apt mirrors in particular would
        # break `apt-get update` outright the day the base image's sources
        # switch to https, and which scheme those sources use is a base-image
        # detail this kit does not own.
        allow:
          # Every domain the credential injects into or authenticates
          # against — required here too, not just in the credential entry: a
          # domain absent from this list is unreachable regardless of what
          # the credential declares. v3 validates the direction as well: an
          # inject domain outside the matching phase's allow list is an
          # error rather than dead config.
          - api.openai.com
          - openai.com
          # The OAuth token endpoint.
          - auth.openai.com
          # Where the OAuth access token is spent in oauth mode — the model
          # provider the install hook configures, and the credential's
          # resourceHosts.
          - chatgpt.com
          # Hit during a session for attachments and uploads.
          - files.openai.com
          # ChatGPT-backed content and auth hosts Codex reaches at runtime,
          # surfaced by the kit owner's live testing. Wildcarded deliberately
          # — unlike the AWS case in kiro — because OpenAI shards both of
          # these across subdomains rather than a fixed, enumerable set:
          # chatgpt.com serves session/auth traffic from named subdomains,
          # and oaiusercontent.com is the CDN apex for per-upload content
          # hosts.
          - '*.chatgpt.com'
          - '*.oaiusercontent.com'
          # `codex plugin add` pulls from a marketplace snapshot.
          - registry.npmjs.org
          # `codex update` re-runs the same standalone installer the image
          # build uses (see codex.dockerfile): it curls chatgpt.com — already
          # allowed above — for the install script, and the script downloads
          # the release package itself from here. Required at runtime, not
          # just at build time.
          - releases.openai.com
          # Codex's native binary checks GitHub releases for updates and
          # pulls skills and plugins from repository archives. A distinct
          # concern from the plugin-marketplace and CLI-update paths above,
          # which is why all three are listed separately.
          - api.github.com
          - github.com
          - codeload.github.com
          # `apt-get update` (the startup hook below) refreshes metadata for
          # every configured apt source and returns exit 100 if any one of
          # them fails. The shell-docker base ships three sources, so all
          # three must be reachable. Ubuntu serves amd64 from
          # archive/security and arm64 from ports.ubuntu.com, so all three
          # Ubuntu hosts are listed to keep the kit working cross-arch.
          #
          # These sit in `runtime` rather than `install` because the hook
          # that needs them is a startup hook, and startup hooks run at boot
          # — in the runtime phase, after v3 closes the install grants.
          - archive.ubuntu.com        # Ubuntu archive (amd64 main)
          - security.ubuntu.com       # Ubuntu security updates (amd64)
          - ports.ubuntu.com          # Ubuntu archive/security (arm64)
          - download.docker.com       # Docker's apt repo, pre-added by shell-docker
          #
          # TODO(codex-extraction): the domains above are the ones the
          # built-in agent already declared; they have not been verified
          # end-to-end under deny-all from this repo, and Codex may reach
          # further hosts. The known suspect is the update flow: if it ever
          # fetches a compiled release asset rather than the repository
          # archive codeload.github.com serves, GitHub redirects asset
          # downloads to a *.githubusercontent.com host that is not declared
          # here. Deliberately not added on speculation — confirm or widen
          # from a live run:
          #
          #   sbx run --kit ./codex codex   # then attempt a prompt
          #   sbx policy log                # lists every blocked host + reason

  - type: com.docker.sandbox/credential@1
    # MIGRATION NOTE: v2 credentials default to not-required and the v3
    # default inverts (an entry is required unless it opts out), so
    # `optional: true` is what preserves v2's behavior. It is also correct on
    # its own terms: Codex runs with nothing bound — it prompts for login —
    # and an OAuth record is never a literal value the CLI could ship, so
    # `required` would fail exactly the healthy OAuth setup.
    optional: true
    description: OpenAI API access (API key or ChatGPT OAuth)
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        # NOTE: deliberately NOT `proxyManaged: true`, unlike most apiKey-based
        # kits in this repo. Codex does not read this variable for model calls
        # on the paths this kit configures — the install hook writes the literal
        # `proxy-managed` sentinel into ~/.codex/auth.json instead, and the
        # proxy swaps it on the domains below. Flipping this on would put a
        # sentinel in the env var too, which is arguably tidier, but it has NOT
        # been verified that Codex's own key-discovery order stays happy with
        # a sentinel in both places.
        inject:
          - {domain: api.openai.com, header: Authorization, format: "Bearer %s"}
          # TODO(codex-extraction): drop this entry once someone can rule out
          # the last request path. The apex serves OpenAI's website, not the
          # API: everything observed from a live 0.151.0 CLI goes to
          # api.openai.com, chatgpt.com, auth.openai.com or files.openai.com.
          # While it stands, any process in the sandbox that fetches
          # openai.com gets the user's real key attached by the proxy, which
          # is avoidable exposure. Carried over unchanged rather than narrowed
          # unilaterally, because a missing header is a silent 401 on whatever
          # path did need it and "no path needs it" is a negative this
          # migration cannot prove.
          - {domain: openai.com, header: Authorization, format: "Bearer %s"}
      # For a host whose stored openai credential is a ChatGPT login rather
      # than an API key. The block is entirely declarative: the token
      # endpoint, the hosts the bearer is actually spent on, and the sentinel
      # values the proxy substitutes at request time. Nothing in the container
      # implements any of it.
      #
      # MIGRATION NOTE: v2's `oauth.skipIfEnv: [OPENAI_API_KEY]` is dropped.
      # It was already documented there as a no-op for a schemaVersion "2"
      # credential — resolution is binding-driven, not host-env-driven — and
      # v3 has no such field at all: the mode decision belongs to the host's
      # binding, surfaced to the install hook below as SBX_CRED_OPENAI_MODE.
      oauth:
        tokenEndpoint: {host: auth.openai.com, path: /oauth/token}
        # In oauth mode the install hook points Codex at a ChatGPT-backed
        # model provider, so the sentinel bearer travels on inference calls to
        # chatgpt.com — not only on the token exchange. resourceHosts is what
        # tells the proxy to substitute the real token there too.
        resourceHosts:
          - chatgpt.com
        sentinels:
          accessToken: oai-oat01-proxy-managed
          refreshToken: oai-ort01-proxy-managed

  # v2's setup.install / setup.startup, verbatim, in the single lifecycle
  # entry v3 collects them into.
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Seed ~/.codex/config.toml + ~/.codex/auth.json, branching on the auth
        # mode the engine surfaces as SBX_CRED_OPENAI_MODE. Only three values
        # reach a kit — oauth, apikey, none (a host with both collapses to
        # oauth) — and the branches are:
        #
        #   oauth  -> config.toml WITH forced API-key login AND the ChatGPT-backed
        #             model_provider block; auth.json holds the proxy-managed
        #             placeholder.
        #   apikey -> config.toml WITH forced API-key login, WITHOUT the provider
        #             block; auth.json holds the proxy-managed placeholder.
        #   none   -> config.toml WITHOUT either; auth.json REMOVED, so Codex
        #             prompts for login on first use. Leaving a stale placeholder
        #             behind would send the literal string to OpenAI and 401.
        #
        # Both files are kit-managed and rewritten unconditionally on every
        # (re)create, so a mode change on recreate is picked up. The content is a
        # pure function of the mode, which is what makes the unconditional rewrite
        # idempotent — install hooks run again on every recreate.
        #
        # The MCP block is deliberately NOT written here. The runtime-gated
        # registration in startup below is the single writer of it, and its grep
        # guard supplies its own idempotency.
        #
        # Heredoc bodies sit at the outer indentation on purpose, including inside
        # the case arms: an unquoted terminator has to start at column 0.
        - command: |
            set -e
            # ~/.codex is CODEX_HOME; ~/.agents is where Codex looks for the
            # cross-agent skills tree (~/.agents/skills). Both are created up
            # front so nothing later has to create them as root.
            mkdir -p /home/agent/.codex /home/agent/.agents
            MODE="${SBX_CRED_OPENAI_MODE:-none}"
            cat > /home/agent/.codex/config.toml << 'EOF'
            # Codex configuration for a Docker sandbox.
            # The container is the sandbox, so Codex's own approval gate and
            # filesystem sandbox are turned off: there is nobody to answer a
            # prompt, and the isolation is already provided from the outside.

            approval_policy = "never"
            sandbox_mode = "danger-full-access"
            mcp_oauth_credentials_store = "file"
            EOF
            # In a managed mode the placeholder in auth.json is the whole auth
            # story, so a remote client must not be able to replace it with a
            # sandbox-local ChatGPT login. `none` mode deliberately permits that
            # login — it is the only way to authenticate at all there.
            case "$MODE" in
              oauth|apikey)
                cat >> /home/agent/.codex/config.toml << 'EOF'
            forced_login_method = "api"
            EOF
                ;;
            esac
            if [ "$MODE" = oauth ]; then
              cat >> /home/agent/.codex/config.toml << 'EOF'

            model_provider = "sandboxd"

            [model_providers.sandboxd]
            name = "Sandbox Proxy"
            base_url = "https://chatgpt.com/backend-api/codex"
            experimental_bearer_token = "oai-oat01-proxy-managed"
            requires_openai_auth = false
            EOF
            fi
            case "$MODE" in
              oauth|apikey)
                cat > /home/agent/.codex/auth.json << 'EOF'
            {
              "OPENAI_API_KEY": "proxy-managed"
            }
            EOF
                ;;
              *)
                rm -f /home/agent/.codex/auth.json
                ;;
            esac
          user: "agent"
          # v3 hook environments are deny-by-default: a hook sees only the
          # platform baseline plus what it names here. SBX_CRED_OPENAI_MODE is
          # the one variable this script reads, and without this line every
          # create would silently take the `none` branch.
          env: [SBX_CRED_OPENAI_MODE]
          description: Seed Codex config/auth from SBX_CRED_OPENAI_MODE
      startup:
        # CODEX_HOME (~/.codex) is created agent-owned by the dockerfile and
        # re-ensured by the install hook above, which runs pre-launch as the agent
        # user — so no root-owned mkdir/chown step is needed here.
        #
        # MIGRATION NOTE: v2 backgrounded this by ending the shell command in
        # `&`. v3 states it as `background: true`, so the engine detaches the
        # hook rather than the shell forking out from under it.
        - command: ["sh", "-c", "command -v apt-get > /dev/null 2>&1 && (apt-get update -qq -y > /dev/null 2>&1 || true)"]
          user: "root"
          background: true
          description: Update apt package cache in background
        # Gateway-first MCP registration. The runtime injects MCP_GATEWAY_URL and
        # MCP_SENTINEL_TOKEN_NAME into the container env when a gateway has been
        # reserved. The sentinel name is not a credential — the proxy substitutes
        # the real token at request time, keyed by that name. No-op when MCP is
        # not enabled, which is what the guard is for.
        #
        # config.toml is shared territory: the install hook writes the yolo-mode
        # and provider keys pre-launch, and Codex itself appends per-project and
        # TUI state during a session. Append a new table rather than rewriting the
        # file so none of that is clobbered, and grep first so re-running on every
        # container start (which startup hooks do) stays a no-op.
        #
        # The header table is `http_headers`, NOT `headers`. This is the one place
        # this kit diverges from the built-in spec for correctness rather than
        # policy: Codex spells the key `http_headers`, ignores unknown keys without
        # complaint, and so accepts a `headers` table while sending no
        # Authorization at all. That fails open — the gateway registers, looks
        # healthy in `codex mcp get`, and every tool call through it is
        # unauthenticated. Confirmed against 0.151.0: with `headers`,
        # `codex mcp get mcp-gateway` reports `http_headers: -`; with
        # `http_headers` it reports the header. The `headers` spelling is correct
        # for the JSON-configured agents (copilot, kiro) and does not transliterate
        # to Codex's TOML.
        - command:
            - sh
            - -c
            - |
              set -e
              [ -n "$MCP_GATEWAY_URL" ] || exit 0
              mkdir -p "$HOME/.codex"
              cfg="$HOME/.codex/config.toml"
              touch "$cfg"
              grep -q "^\[mcp_servers.mcp-gateway\]" "$cfg" && exit 0
              cat >> "$cfg" <<EOF

              [mcp_servers.mcp-gateway]
              type = "http"
              url = "$MCP_GATEWAY_URL"
              [mcp_servers.mcp-gateway.http_headers]
              Authorization = "Bearer $MCP_SENTINEL_TOKEN_NAME"
              EOF
          user: "agent"
          # $HOME is platform baseline; these two are not, and a hook that
          # cannot see MCP_GATEWAY_URL takes its no-op branch on every boot.
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Register the sandbox MCP gateway in ~/.codex/config.toml

  # No agent-sessions@1, deliberately. The capability states the argv a harness
  # uses to drive the agent headlessly, and the only evidence this kit has of a
  # working non-interactive invocation was its TCK's `promptArgs` — which it
  # deliberately omitted: Codex does have `codex exec <prompt>`, but every auth
  # path this kit configures needs a real OpenAI credential, none is wired up on
  # the runner, and the built-in agent's own e2e never exercised the path either,
  # so there is no known-working recipe to carry over. Declaring
  # `prompt: ["exec", "{{.Prompt}}"]` here would be inventing flags rather than
  # migrating them. Add it when someone verifies the invocation against a live
  # credential.

  # Where Codex reads the cross-agent skills tree, so the host's shared store
  # reaches it. Not a new claim: the install hook above already creates
  # ~/.agents for exactly this, and v3 is the first grammar with a field to
  # say so. Optional, so a host with no store (or the setting off) composes
  # the kit rather than refusing it.
  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config:
      path: /home/agent/.agents/skills

  # MIGRATION NOTE: v2's agentInstructions declared `filename: AGENTS.md` and
  # no `content`, so there is no body to stage and no <kit>-context.md file.
  # The declaration still carries its whole v2 meaning: this workload owns the
  # AGENTS.md profile, and the runtime seeds it with its own guidance plus the
  # per-kit index any composed mixin contributes to.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md

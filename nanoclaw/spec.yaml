schemaVersion: "1"
kind: sandbox
name: nanoclaw
displayName: NanoClaw
description: "NanoClaw host + nested per-session agent containers inside a Docker Sandbox micro-VM."

sandbox:
  image: "docker.io/nanoco/nanoclaw:sbx-claude-alpha"
  entrypoint:
    run: ["/usr/local/bin/nanoclaw-start"]

caps:
  network:
    allow:
    - "auth.docker.io:443"
    - "index.docker.io:443"
    - "production.cloudflare.docker.com:443"
    - "registry-1.docker.io:443"
    - "api.onecli.sh:443"
    - "onecli.sh:443"
    - "www.onecli.sh:443"
    - "api.anthropic.com:443"
    - "claude.ai:443"
    - "claude.com:443"
    - "console.anthropic.com:443"
    - "downloads.claude.ai:443"
    - "platform.claude.com:443"
    - "api.github.com:443"
    - "codeload.github.com:443"
    - "ghcr.io:443"
    - "github.com:443"
    - "objects.githubusercontent.com:443"
    - "raw.githubusercontent.com:443"
    - "release-assets.githubusercontent.com:443"
    - "bun.sh:443"
    - "checkpoint.prisma.io:443"
    - "deb.debian.org:443"
    - "registry.npmjs.org:443"
    - "security.debian.org:443"
    - "api.slack.com:443"
    - "api.telegram.org:443"
    - "discord.com:443"
    - "gateway.discord.gg:443"
    - "slack.com:443"
    - "t.me:443"
    - "web.whatsapp.com:443"

publishedPorts:
  - container: 3000
    name: webhook
  - container: 10254
    name: onecli-dashboard
  - container: 10255
    name: onecli-gateway

environment:
  variables:
    IS_SANDBOX: "1"
    NANOCLAW_NO_DIAGNOSTICS: "1"
    NANOCLAW_AGENT_PROVIDER: "claude"
    NODE_NO_WARNINGS: "1"
    ONECLI_BIND_HOST: "0.0.0.0"
    ONECLI_URL: "http://127.0.0.1:10254"
    TZ: "UTC"
    NO_PROXY: "127.0.0.1,localhost"
    no_proxy: "127.0.0.1,localhost"

commands:
  startup:
    # SYNCed with the docker mixin (../docker/spec.yaml): update both
    # together. Runtime mixin composition is not applied yet; when
    # `mixins:` goes live, replace this block with `mixins: [docker]`.
    # On local sbx the runtime starts dockerd anyway and this is a no-op.
    # On `sbx --cloud` this block is what starts the daemon the seed
    # script and nested agent containers need.
    - command:
        - sh
        - -c
        - |
          set -eu
          # Success is keyed on "the Docker socket answers", never on "this
          # script's dockerd survived". Local sbx's EnsureDockerd may already
          # have started the daemon, and re-runs must be no-ops.
          ping_docker() {
            curl -sf --unix-socket /var/run/docker.sock http://localhost/_ping >/dev/null 2>&1
          }
          if ping_docker; then
            echo "docker mixin: dockerd already running"
            exit 0
          fi
          if ! command -v dockerd >/dev/null 2>&1; then
            echo "docker mixin: dockerd not found in this image. Use a -docker template or an image that ships Docker Engine." >&2
            exit 1
          fi
          # Route inner registry pulls through the sandbox egress proxy.
          # Never touch an existing daemon.json.
          if [ -n "${HTTP_PROXY:-}" ] && [ ! -f /etc/docker/daemon.json ]; then
            mkdir -p /etc/docker
            printf '{\n  "proxies": {\n    "http-proxy": "%s",\n    "https-proxy": "%s",\n    "no-proxy": "%s"\n  }\n}\n' \
              "$HTTP_PROXY" "${HTTPS_PROXY:-$HTTP_PROXY}" "${NO_PROXY:-}" >/etc/docker/daemon.json
          fi
          : >/var/log/dockerd.log
          nohup dockerd >>/var/log/dockerd.log 2>&1 &
          i=0
          while [ "$i" -lt 60 ]; do
            if ping_docker; then
              echo "docker mixin: dockerd started"
              exit 0
            fi
            i=$((i + 1))
            sleep 0.5
          done
          echo "docker mixin: dockerd did not become ready within 30s. Log tail:" >&2
          tail -n 50 /var/log/dockerd.log >&2
          exit 1
      user: "0"
      description: Start dockerd when the image ships it and nothing answers on the Docker socket

agentContext: |
  ## Sandbox environment

  You are NanoClaw running inside a Docker Sandbox micro-VM. The host process
  spawns one nested agent container per session via the VM's own Docker daemon.
  Credentials go through OneCLI like a normal NanoClaw deployment. Never ask for
  or print raw keys. `sudo` is passwordless.

  ## Network policy errors

  If an HTTP/HTTPS request fails with `502 Bad Gateway`, the request may be
  blocked by Docker Sandbox network policy rather than by the target service.
  Network access is controlled by the sbx kit `spec.yaml`.

  Ask the user to inspect the sandbox policy from their host terminal:

  `sbx policy ls <sandbox-name>`
  `sbx policy ls <sandbox-name> --type network`

  For NanoClaw, the sandbox name is usually `nanoclaw` unless the user supplied
  a different `--name`.
